name: Idea
description: Suggest a feature or a change.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing an idea. Start with the problem: knowing what you're trying to do helps us find the right fix.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Tell us what you were doing and what got in the way.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What's your idea?
      description: Describe how you'd like it to work.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
    validations:
      required: false
