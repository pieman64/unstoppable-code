name: Bug report
description: Tell us about something that isn't working.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please describe the problem in words: we can't accept code or patches, so we build every fix ourselves.

        For a security problem, don't use this form. See SECURITY.md instead.
  - type: input
    id: version
    attributes:
      label: App version or source tag
      description: Find the version in the app's settings, or use the tag you built from.
      placeholder: 1.15.0 or source-desktop/v1.15.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows
        - iOS
        - Android
        - Built from source
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a project
        2. Start a chat
        3. ...
    validations:
      required: true
