name: mobile
description: 'Canopy mobile companion app.'
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  # file_picker 13 requires win32 6, shared by storage and package info.
  # Keep storage on v10 so existing Android encrypted preferences can migrate.
  flutter_secure_storage: ^10.3.4
  flutter_web_auth_2: ^5.0.3
  http: ^1.2.2
  provider: ^6.1.2
  crypto: ^3.0.7
  fl_chart: ^0.69.2
  shared_preferences: ^2.5.5
  sign_in_with_apple: ^6.1.0
  url_launcher: ^6.3.0
  package_info_plus: ^10.2.1
  firebase_core: ^4.2.0
  firebase_messaging: ^16.4.3
  # Pinned exactly, not caret-ranged. Every firebase_* plugin pins the
  # firebase-ios-sdk Swift package with `exact:`, so all of them must agree on
  # one version or Xcode fails SPM resolution outright. 5.2.6 pins 12.15.0,
  # matching firebase_messaging 16.4.3 above (5.2.7 moved to 12.17.0 and 5.3.0
  # to 12.18.0, neither of which builds here). Bump this only in lockstep with
  # firebase_core/firebase_messaging.
  firebase_crashlytics: 5.2.6
  flutter_svg: ^2.3.0
  icu_kit: 0.2.0
  # Vendored speech_to_text 7.4.0 with an Android result-handling patch; see
  # third_party/speech_to_text/README.md before upgrading.
  speech_to_text:
    path: third_party/speech_to_text
  # Chat attachments: camera + photo library, documents, and extension → MIME.
  image_picker: ^1.2.3
  file_picker: ^13.1.0
  mime: ^2.1.0
  path: ^1.9.1
  path_provider: ^2.1.6
  posthog_flutter: ^5.50.12
  in_app_review: ^2.0.12
  # Native share sheet for the desktop app download link (CAN-4424).
  share_plus: ^13.3.1
  cryptography: ^2.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Test APIs used to exercise Firebase-backed services without platform
  # channels or a configured native Firebase app.
  firebase_core_platform_interface: ^8.0.0
  firebase_crashlytics_platform_interface: ^3.8.26

  # Drives the real app end-to-end on-device/on-simulator for the promo
  # screenshot capture harness (integration_test/promo_screenshots_test.dart).
  integration_test:
    sdk: flutter

  # Deterministic virtual clock for unit-testing timer/watchdog behavior
  # (e.g. the Remote Control hydration watchdog) without real waits.
  fake_async: ^1.3.3

  # Already resolved transitively via shared_preferences; declared explicitly so
  # tests may substitute a store platform whose writes REPORT FAILURE. That is
  # the one failure `SharedPreferences.setMockInitialValues` cannot simulate
  # (its in-memory store always succeeds), and it is exactly the signal
  # `SharedPrefsFeedbackOutboxStore.write` must honor.
  shared_preferences_platform_interface: ^2.4.2

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  plugin_platform_interface: ^2.1.8
  speech_to_text_platform_interface: ^2.4.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/splash/splash_logo.png
    - assets/splash/splash_mark.png
    - assets/logos/google.svg
    - assets/logos/github.svg
    - assets/logos/unstoppable-domains.svg
    - assets/icons/canopy/
    - assets/icons/chat/
    - assets/fonts/inter/OFL.txt
    - assets/fonts/jetbrains-mono/OFL.txt

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/InterVariable.ttf
        - asset: assets/fonts/inter/InterVariable-Italic.ttf
          style: italic
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/jetbrains-mono/JetBrainsMonoVariable.ttf
        - asset: assets/fonts/jetbrains-mono/JetBrainsMonoVariable-Italic.ttf
          style: italic

flutter_launcher_icons:
  ios: true
  android: true
  remove_alpha_ios: true
  image_path: 'assets/icon/app_icon.png'
  adaptive_icon_background: '#2264FF'
  adaptive_icon_foreground: 'assets/icon/app_icon_foreground.png'
  adaptive_icon_foreground_inset: 16
  adaptive_icon_monochrome: 'assets/icon/app_icon_foreground.png'

# Regenerate all artwork from the root with:
# `node scripts/brand/generate-mobile-launcher-icons.mjs`.
#
# Both images use the app icon's white mark on a blue rounded tile, derived
# from assets/icon/app_icon.png at 4x density:
# - splash_mark.png: a 144dp tile (576px). iOS and pre-12 Android draw it
#   as-is, and the in-app launch view (lib/ui/core/launch_view.dart) draws the
#   same asset at the same size so the native-to-Flutter handoff is seamless.
# - android12_splash_icon.png: a 288dp icon canvas (1152px) with that same
#   144dp tile centered. Android 12+ masks this icon to a 192dp circle, so the
#   whole tile, corners included, must fit inside it; a full-canvas tile gets
#   upscaled and cropped into a disc.
# Colors match the brand `background` (Brand.light / Brand.dark) so the splash
# does not flash into a different shade when Flutter draws its first frame.
flutter_native_splash:
  color: '#F2F2F1'
  color_dark: '#0B0B0B'
  image: assets/splash/splash_mark.png
  image_dark: assets/splash/splash_mark.png
  android_12:
    color: '#F2F2F1'
    color_dark: '#0B0B0B'
    image: assets/splash/android12_splash_icon.png
    image_dark: assets/splash/android12_splash_icon.png
