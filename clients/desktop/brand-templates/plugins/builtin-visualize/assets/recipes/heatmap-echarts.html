<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      .chart {
        height: 300px;
      }
    </style>
  </head>
  <body>
    <div
      class="chart"
      id="chart"
      role="img"
      aria-label="Deploys by weekday and hour"
    ></div>
    <script
      src="https://cdn.jsdelivr.net/npm/echarts@6.1.0/dist/echarts.min.js"
      integrity="sha384-C2iskrW/uPW46KzOjrvJIQo4YkV8lkD+QS0CrDN18IIPIpT/g2USu8bTP3nvmIAD"
      crossorigin="anonymous"
    ></script>
    <script>
      // theme-kit:start (keep identical to assets/starter.html)
      /*
       * Theme kit for visuals. Paste this whole file into a <script> before your
       * chart code. It reads the theme variables the host injects, so nothing here
       * hardcodes a color.
       *
       *   viz.color('--fg-secondary')      a color string canvas libraries accept
       *   viz.color('--categorical-1', .2) the same hue at 20% opacity
       *   viz.palette(3)                   the first 3 chart series colors, resolved
       *   viz.ramp(5)                      5 steps from near the surface to the accent
       *   viz.textOn(fill)                 a theme text color that reads on a filled mark,
       *                                    or null when none reaches 4.5:1
       *   viz.dark()                       true when the app theme is dark
       *   viz.font()                       the theme's sans stack, for canvas text
       *   viz.onChange(render)             call render() again when the theme changes
       */
      const viz = (() => {
        const root = document.documentElement;
        const canvas = document.createElement('canvas');
        canvas.width = canvas.height = 1;
        const context = canvas.getContext('2d', { willReadFrequently: true });
        const probe = document.createElement('i');
        probe.style.display = 'none';

        /** Any CSS color, a variable name included, as [r, g, b, alpha]. */
        function rgba(value) {
          if (!probe.isConnected) (document.body || root).appendChild(probe);
          probe.style.color = value.startsWith('--') ? `var(${value})` : value;
          context.clearRect(0, 0, 1, 1);
          context.fillStyle = getComputedStyle(probe).color;
          context.fillRect(0, 0, 1, 1);
          const [r, g, b, a] = context.getImageData(0, 0, 1, 1).data;
          return [r, g, b, a / 255];
        }

        const hex = (rgb) =>
          '#' +
          rgb.map((n) => Math.round(n).toString(16).padStart(2, '0')).join('');

        /** '#rrggbb', or 'rgba(...)' when the color is translucent. */
        function color(value, alpha) {
          const [r, g, b, a] = rgba(value);
          const opacity = alpha ?? a;
          return opacity >= 1
            ? hex([r, g, b])
            : `rgba(${r}, ${g}, ${b}, ${Number(opacity.toFixed(3))})`;
        }

        const linear = (c) =>
          (c /= 255) <= 0.04045 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4;
        const oklab = ([r, g, b]) => {
          const l = Math.cbrt(
            0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b,
          );
          const m = Math.cbrt(
            0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b,
          );
          const s = Math.cbrt(
            0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b,
          );
          return [
            0.2104542553 * l + 0.793617785 * m - 0.0040720468 * s,
            1.9779984951 * l - 2.428592205 * m + 0.4505937099 * s,
            0.0259040371 * l + 0.7827717662 * m - 0.808675766 * s,
          ];
        };

        /**
         * The chart series colors, in their fixed order: blue, orange, pink, cyan,
         * green, purple. In CSS and SVG use var(--chart-categorical-1) to
         * var(--chart-categorical-6) directly; this is for canvas libraries.
         */
        function palette(count = 6) {
          return Array.from({ length: Math.min(count, 6) }, (_, i) =>
            color(`--chart-categorical-${i + 1}`),
          );
        }

        /** A one-hue scale for magnitude: low values sit near the surface. */
        function ramp(steps = 5, hue = '--categorical-1') {
          const from = oklab(rgba('--bg-base').slice(0, 3).map(linear));
          const to = oklab(rgba(hue).slice(0, 3).map(linear));
          const toSrgb = ([L, a, b]) => {
            const l = (L + 0.3963377774 * a + 0.2158037573 * b) ** 3;
            const m = (L - 0.1055613458 * a - 0.0638541728 * b) ** 3;
            const s = (L - 0.0894841775 * a - 1.291485548 * b) ** 3;
            return [
              4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s,
              -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s,
              -0.0041960863 * l - 0.7034186147 * m + 1.707614701 * s,
            ].map((c) => {
              const v = Math.min(1, Math.max(0, c));
              return (
                255 *
                (v <= 0.0031308 ? 12.92 * v : 1.055 * v ** (1 / 2.4) - 0.055)
              );
            });
          };
          return Array.from({ length: steps }, (_, i) => {
            const t = steps === 1 ? 1 : 0.18 + (0.82 * i) / (steps - 1);
            return hex(toSrgb(from.map((c, k) => c + (to[k] - c) * t)));
          });
        }

        /**
         * The theme text color that contrasts most with `fill`, from primary text,
         * the page color, and the emphasis ink, or null when none reaches
         * `minimum`. On null, put the label outside the mark or give it a halo in
         * the page color.
         */
        function textOn(fill, minimum = 4.5) {
          const luminance = (value) => {
            const [r, g, b] = rgba(value).slice(0, 3).map(linear);
            return 0.2126 * r + 0.7152 * g + 0.0722 * b;
          };
          const on = luminance(fill);
          let best = null;
          let bestRatio = 0;
          for (const ink of ['--fg-primary', '--bg-base', '--fg-emphasis']) {
            const text = luminance(ink);
            const ratio =
              (Math.max(on, text) + 0.05) / (Math.min(on, text) + 0.05);
            if (ratio > bestRatio) {
              best = ink;
              bestRatio = ratio;
            }
          }
          return bestRatio >= minimum ? color(best) : null;
        }

        /** The app theme, which can differ from the operating system's. */
        const dark = () => getComputedStyle(root).colorScheme === 'dark';

        const font = (name = '--font-sans') =>
          getComputedStyle(root).getPropertyValue(name).trim() || 'sans-serif';

        /** The host swaps theme variables on <html> without reloading the page. */
        const listeners = [];
        let queued = false;
        new MutationObserver(() => {
          if (queued) return;
          queued = true;
          requestAnimationFrame(() => {
            queued = false;
            for (const listener of listeners) listener();
          });
        }).observe(root, { attributes: true, attributeFilter: ['style'] });
        const onChange = (callback) => {
          listeners.push(callback);
        };

        return { rgba, color, palette, ramp, textOn, dark, font, onChange };
      })();
      // theme-kit:end
    </script>
    <script>
      const hours = ['9', '10', '11', '12', '13', '14', '15', '16', '17'];
      const days = ['Fri', 'Thu', 'Wed', 'Tue', 'Mon'];
      // [hour index, day index, count]
      const cells = days.flatMap((_, day) =>
        hours.map((_, hour) => [
          hour,
          day,
          Math.max(
            0,
            Math.round(
              9 -
                Math.abs(hour - 4) * 1.6 -
                Math.abs(day - 2) * 1.4 +
                ((hour * 7 + day * 3) % 4),
            ),
          ),
        ]),
      );
      const max = Math.max(...cells.map((cell) => cell[2]));

      // The SVG renderer stays sharp at any zoom and in the saved HTML file.
      const chart = echarts.init(document.getElementById('chart'), null, {
        renderer: 'svg',
      });

      function render() {
        const text = viz.color('--fg-secondary');
        // One hue for magnitude in five steps: low values sit near the surface.
        const ramp = viz.ramp(5);
        const step = (value) =>
          Math.min(
            ramp.length - 1,
            Math.round((value / max) * (ramp.length - 1)),
          );
        // Each step's label ink; where no theme ink reaches 4.5:1, the label
        // gets a halo in the page color instead.
        const inks = ramp.map((fill) => viz.textOn(fill));
        const halo = {
          color: viz.color('--fg-primary'),
          textBorderColor: viz.color('--bg-base'),
          textBorderWidth: 3,
        };
        const axis = {
          type: 'category',
          axisLine: { show: false },
          axisTick: { show: false },
          axisLabel: { color: text },
          splitArea: { show: false },
        };
        chart.setOption(
          {
            animation: false,
            textStyle: { fontFamily: viz.font() },
            grid: { left: 36, right: 0, top: 4, bottom: 52 },
            xAxis: {
              ...axis,
              data: hours,
              name: 'Hour (UTC)',
              nameLocation: 'middle',
              nameGap: 26,
              nameTextStyle: { color: text },
            },
            yAxis: { ...axis, data: days },
            // Discrete steps, so every cell is exactly one ramp color.
            visualMap: {
              type: 'piecewise',
              show: false,
              pieces: ramp.map((color, index) => ({
                gte: ((index - 0.5) * max) / (ramp.length - 1),
                lt: ((index + 0.5) * max) / (ramp.length - 1),
                color,
              })),
            },
            series: [
              {
                type: 'heatmap',
                data: cells.map((cell) => {
                  const ink = inks[step(cell[2])];
                  return { value: cell, label: ink ? { color: ink } : halo };
                }),
                // A surface-colored gap separates cells; no outlines.
                itemStyle: {
                  borderColor: viz.color('--bg-base'),
                  borderWidth: 2,
                  borderRadius: 3,
                },
                // Print the value in every cell.
                label: {
                  show: true,
                  fontSize: 11,
                  formatter: ({ value }) => value[2],
                },
                emphasis: { disabled: true },
              },
            ],
          },
          true,
        );
      }

      render();
      viz.onChange(render);
      new ResizeObserver(() => chart.resize()).observe(
        document.getElementById('chart'),
      );
    </script>
  </body>
</html>
