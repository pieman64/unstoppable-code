<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      /* D3 draws SVG, so the theme variables style it directly. */
      #flow {
        display: block;
        width: 100%;
        height: 280px;
      }
      #flow text {
        font: 12px var(--font-sans);
        fill: var(--fg-primary);
      }
      #flow .count {
        fill: var(--fg-secondary);
      }
      #flow .node {
        fill: var(--categorical-1);
      }
      #flow .link {
        fill: none;
        stroke: var(--categorical-1);
        stroke-opacity: 0.22;
      }
      /* The path the reply is about; every other link stays quiet. */
      #flow .link.focus {
        stroke-opacity: 0.6;
      }
    </style>
  </head>
  <body>
    <svg id="flow" role="img" aria-label="Where trial accounts go"></svg>
    <script
      src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"
      integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/d3-sankey@0.12.3/dist/d3-sankey.min.js"
      integrity="sha384-SM54CE5h+qdDI046d2Y5ym7wq1kq4uxcQ1cqGq5/+5jrE5tPLeDJSq711Q8sIska"
      crossorigin="anonymous"
    ></script>
    <script>
      const links = [
        { source: 'Trials', target: 'Activated', value: 620 },
        { source: 'Trials', target: 'Never set up', value: 380 },
        { source: 'Activated', target: 'Paid', value: 240, focus: true },
        { source: 'Activated', target: 'Lapsed', value: 380 },
      ];
      const names = [
        ...new Set(links.flatMap((link) => [link.source, link.target])),
      ];

      function render() {
        const width = document.body.clientWidth;
        const height = 280;
        const graph = d3
          .sankey()
          .nodeId((node) => node.id)
          .nodeWidth(10)
          .nodePadding(18)
          .extent([
            [0, 6],
            [width, height - 6],
          ])({
          nodes: names.map((id) => ({ id })),
          links: links.map((link) => ({ ...link })),
        });

        const svg = d3.select('#flow').attr('viewBox', [0, 0, width, height]);
        svg.selectAll('*').remove();
        svg
          .append('g')
          .selectAll('path')
          .data(graph.links)
          .join('path')
          .attr('class', (link) => (link.focus ? 'link focus' : 'link'))
          .attr('d', d3.sankeyLinkHorizontal())
          .attr('stroke-width', (link) => Math.max(1, link.width));
        svg
          .append('g')
          .selectAll('rect')
          .data(graph.nodes)
          .join('rect')
          .attr('class', 'node')
          .attr('x', (node) => node.x0)
          .attr('y', (node) => node.y0)
          .attr('width', (node) => node.x1 - node.x0)
          .attr('height', (node) => node.y1 - node.y0)
          .attr('rx', 2);
        // Every node carries its name and count, so nothing depends on hover.
        const label = svg
          .append('g')
          .selectAll('text')
          .data(graph.nodes)
          .join('text')
          .attr('x', (node) =>
            node.x0 < width / 2 ? node.x1 + 8 : node.x0 - 8,
          )
          .attr('y', (node) => (node.y0 + node.y1) / 2)
          .attr('dy', '0.35em')
          .attr('text-anchor', (node) =>
            node.x0 < width / 2 ? 'start' : 'end',
          );
        label.append('tspan').text((node) => node.id);
        label
          .append('tspan')
          .attr('class', 'count')
          .attr('dx', 6)
          .text((node) => d3.format(',')(node.value));
      }

      render();
      let width = document.body.clientWidth;
      new ResizeObserver(() => {
        if (document.body.clientWidth === width) return;
        width = document.body.clientWidth;
        render();
      }).observe(document.body);
    </script>
  </body>
</html>
