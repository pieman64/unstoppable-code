<!doctype html>
<html>
  <head>
    <title>Out-of-process frames</title>
    <style>
      iframe { border: 2px solid #555; }
      #visible-frame { width: 300px; height: 120px; }
      #tiny-frame { width: 5px; height: 5px; }
    </style>
  </head>
  <body>
    <button type="button" id="main-button">Main button</button>
    <iframe id="visible-frame" data-testid="visible-frame" src="__CHILD_ORIGIN__/oopif-child.html"></iframe>
    <iframe id="tiny-frame" data-testid="tiny-frame" src="__CHILD_ORIGIN__/oopif-child.html?tiny"></iframe>
    <div style="display: none"><iframe id="hidden-frame" data-testid="hidden-frame" src="__CHILD_ORIGIN__/oopif-child.html?hidden"></iframe></div>
  </body>
</html>
