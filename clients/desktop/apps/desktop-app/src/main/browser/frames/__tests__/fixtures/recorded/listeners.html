<!doctype html>
<html>
  <head>
    <title>Listeners</title>
  </head>
  <body>
    <button type="button" id="click-target">Click listener</button>
    <div id="pointer-target" tabindex="0">Pointer listener</div>
    <button type="button" id="inline-target" onclick="void 0">Inline listener</button>
    <span id="plain-span" tabindex="0">No listener</span>
    <button type="button" id="plain-button">No listener</button>
    <div id="keyboard-only" tabindex="0">Keydown only</div>
    <x-panel id="shadow-host"></x-panel>
    <iframe
      id="same-frame"
      style="width: 300px; height: 80px"
      srcdoc="<button id=frame-target>Frame listener</button><button id=frame-plain>Frame plain</button><script>document.getElementById('frame-target').addEventListener('mouseup', () => {})</script>"
    ></iframe>
    <iframe
      id="cross-frame"
      style="width: 300px; height: 80px"
      src="__CHILD_ORIGIN__/listeners-child.html"
    ></iframe>
    <script>
      document
        .getElementById('click-target')
        .addEventListener('click', () => {});
      document
        .getElementById('pointer-target')
        .addEventListener('pointerdown', () => {});
      // Not one of the probed events: never a hit.
      document
        .getElementById('keyboard-only')
        .addEventListener('keydown', () => {});
      const root = document
        .getElementById('shadow-host')
        .attachShadow({ mode: 'open' });
      root.innerHTML =
        '<button type="button" id="shadow-target">Shadow listener</button>' +
        '<button type="button" id="shadow-plain">Shadow plain</button>';
      root
        .getElementById('shadow-target')
        .addEventListener('mousedown', () => {});
    </script>
  </body>
</html>
