<!doctype html>
<html>
  <head>
    <title>Frames</title>
    <style>
      body { margin: 8px; }
      #framed { border: 5px solid #333; padding: 7px 3px; width: 320px; height: 160px; }
    </style>
  </head>
  <body>
    <button type="button" id="before">Before frame</button>
    <iframe
      id="framed"
      data-testid="framed"
      srcdoc="<body style='margin:4px'><label for=frame-name>Name</label><input id=frame-name><textarea id=frame-note>frame note</textarea><textarea id=frame-secret-note autocomplete=one-time-code></textarea><script>document.querySelector('#frame-name').value = 'SEED-FRAME-' + 3377; document.querySelector('#frame-secret-note').value = 'SEED-FRAME-OTP-' + 4242</script><button id=frame-button>Frame action</button><iframe id=nested data-testid=nested style='border:0;width:200px;height:60px' srcdoc=&quot;<button id=nested-button>Nested action</button>&quot;></iframe></body>"
    ></iframe>
    <button type="button" id="after">After frame</button>
  </body>
</html>
