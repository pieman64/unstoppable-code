<!doctype html>
<html>
  <head>
    <title>Transformed outer frame</title>
  </head>
  <body style="margin: 0">
    <button type="button" style="position: absolute; left: 8px; top: 6px; width: 90px; height: 24px">Outer action</button>
    <iframe style="position: absolute; left: 30px; top: 50px; width: 200px; height: 100px; border: 2px solid #666; padding: 4px"></iframe>
    <script>
      const id = new URLSearchParams(location.search).get('id');
      document.querySelector('button').id = 'button-' + id;
      const nested = document.querySelector('iframe');
      nested.id = 'nested-' + id;
      nested.src = 'transforms-child.html?id=nested-' + id;
    </script>
  </body>
</html>
