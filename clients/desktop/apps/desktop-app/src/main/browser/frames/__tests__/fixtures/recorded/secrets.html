<!doctype html>
<html>
  <head>
    <title>Secrets</title>
  </head>
  <body>
    <form id="sign-in" data-testid="sign-in">
      <label>Username <input id="username" autocomplete="username" value="ada"></label>
      <label>Password <input id="password" type="password" value="SEED-PW-4417"></label>
      <label for="revealed">Revealed password</label>
      <input id="revealed" type="password" value="SEED-REVEAL-8203">
      <label>Code <input id="otp" autocomplete="one-time-code" value="SEED-OTP-5521"></label>
      <span id="pay-label">Pay <input id="card" autocomplete="cc-number" value="SEED-CARD-4111"></span>
      <button type="button" id="pay" aria-labelledby="pay-label">Pay now</button>
      <label>Expiry
        <select id="expiry" autocomplete="cc-exp-month">
          <option value="SEED-SELECT-7765" label="SEED-SELECT-7765">SEED-SELECT-7765</option>
          <optgroup id="later" label="SEED-GROUP-9119"><option selected>SEED-OPTION-8228</option></optgroup>
        </select>
      </label>
      <label>One-time note <textarea id="otp-note" autocomplete="one-time-code">SEED-TEXTAREA-3390</textarea></label>
      <div id="mirror-label">Mirror <span><select id="mirror"><option>Visible option</option></select></span><input type="password" value="SEED-MIRROR-6655"></div>
      <label>Plain <span><select id="plain"><option>Opt</option></select></span><input type="password" value="SEED-PLAIN-1212"></label>
    </form>
    <script>
      (() => {
        // Seeds are concatenated so the script's own text never contains one.
        const seed = (name, number) => 'SEED-' + name + '-' + number;
        document.querySelector('#password').value = seed('PW-LIVE', 4418);
        document.querySelector('#revealed').value = seed('REVEAL-LIVE', 8204);
        document.querySelector('#revealed').type = 'text';
        document.querySelector('#otp').value = seed('OTP-LIVE', 5522);
        document.querySelector('#otp').setAttribute('value', seed('OTP-LIVE', 5522));
      })();
    </script>
  </body>
</html>
