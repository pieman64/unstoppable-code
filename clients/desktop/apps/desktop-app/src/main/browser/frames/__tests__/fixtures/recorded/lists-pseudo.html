<!doctype html>
<html>
  <head>
    <title>Lists and pseudo-elements</title>
    <style>
      body { font: 13.3px/1.37 sans-serif; margin: 5.6px; }
      .tag::before { content: '#'; color: gray; }
      .tag::after { content: ' →'; }
      li.done::marker { content: '✓ '; }
    </style>
  </head>
  <body>
    <ul>
      <li><a href="/one" class="tag">First</a></li>
      <li class="done"><a href="/two">Second</a> item</li>
      <li><button type="button" class="tag">Third</button></li>
    </ul>
    <ol start="3">
      <li><span role="option" aria-selected="true">Option C</span></li>
      <li><span role="treeitem">Tree item</span></li>
    </ol>
    <p class="tag">Not interactive</p>
  </body>
</html>
