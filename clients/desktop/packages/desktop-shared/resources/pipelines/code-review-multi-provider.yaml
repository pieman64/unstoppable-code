pipeline:
  name: 'Code Review (Multi-Provider)'
  version: '1.6'
  description: 'Run the multi-track reviewer workflow and publish the multi-agent style report and PR comments'
  icon: '🔎'
  readonly: true
  scope: [directory, worktree]
  on:
    dispatch:
      inputs:
        base_branch:
          description: Base branch used to compute the workspace merge-base.
          required: false
        include_uncommitted:
          description: Include staged, unstaged, and untracked changes in the review diff.
          required: false
          type: boolean
          default: true
        post_pr_comment:
          description: Post PR comment.
          required: false
          type: boolean
          default: true
        fail_on_existing_pending_review:
          description: Fail PR review posting without changing an existing pending review instead of escrowing and restoring it.
          required: false
          type: boolean
          default: false
        checkpoint_file:
          description: Optional pipeline-start workspace checkpoint used to distinguish pre-existing changes from changes under review.
          required: false
          hint-hide-ui-option: true
        plan_scope_file:
          description: Optional plan-scope JSON used to mark protected pre-existing changes as plan-authorized review changes.
          required: false
          hint-hide-ui-option: true
        plan_contract_file:
          description: Optional machine-readable plan completion contract that is authoritative for approved behavior.
          required: false
          hint-hide-ui-option: true
        enable_repo_compliance_review_claude:
          description: Run the Sonnet-based repo compliance review track.
          required: false
          type: boolean
          default: true
        enable_repo_compliance_review_codex:
          description: Run the GPT-based repo compliance review track.
          required: false
          type: boolean
          default: true
        enable_opus_methodical_reviewer:
          description: Run the Opus methodical reviewer track.
          required: false
          type: boolean
          default: true
        enable_gpt_methodical_reviewer:
          description: Run the GPT methodical reviewer track.
          required: false
          type: boolean
          default: true
        enable_codex_security_review:
          description: Run the Codex Security Review track.
          required: false
          type: boolean
          default: true
        enable_claude_security_review:
          description: Run the Claude Security Review track.
          required: false
          type: boolean
          default: true
        enable_custom_review_tracks:
          description: Run repository review tracks from `{{BRAND_PROJECT_CONFIG_DIR}}/review-tracks/*.md`.
          required: false
          type: boolean
          default: true
        qa_intent_summary_file:
          description: Optional QA intent summary that captures the approved implementation baseline.
          required: false
          hint-hide-ui-option: true
  env:
    REVIEW_ARTIFACT_SCOPE_RULES: |
      Scope guardrails:
      - Start with the artifact files explicitly listed in this prompt.
      - You may consult other repository files for context when they help interpret the changed code.
      - Only validate or comment on code in the provided diff, or behavior directly related to changes in that diff.
      - Treat the review diff as the primary review boundary; the full diff is fallback context only.
      - Do not turn context-gathering into a review of untouched parts of the repository.
      - If a claim depends only on a pre-existing problem outside the changed diff, reject it.
      - If the workspace summary includes baseline-aware classification, treat `pre_existing_unchanged` paths as protected context and do not report them as introduced changes.
      - Review protected paths only when they are classified as `pipeline_modified_pre_existing`, `pipeline_deleted_pre_existing`, or `pipeline_reverted_pre_existing`; otherwise focus on pipeline-owned changes.
      - Protected drift is not a source for normal bug or compliance findings; implementation QA handles unsupported protected drift separately.
    DIFF_ONLY_SCOPE_RULES: |
      Diff boundary:
      - Treat the provided diff artifacts as the set of changes under review.
      - Use the scoped review diff first. Read the full diff only if needed to understand a directly changed behavior in the review diff.
      - Report issues only when the root cause is in the diff or the issue is a direct consequence of the diff.
      - Evidence may come from unchanged code. Trace a changed value, field, signature, operation, or configuration through existing callers, consumers, schemas, serializers, persistence, and tests when that proves the impact.
      - Never reject a finding only because its supporting evidence is in unmodified code. Reject it when the same defect would exist without this diff.
    COMPLIANCE_SCOPE_RULES: |
      Compliance boundary:
      - For instruction compliance, only report violations in changed code or violations directly caused by the changed code.
      - When evaluating a changed file, only consider instruction files that share that file path or one of its parent directories.
      - You may consult other repository files for context, but reject any claim based solely on untouched code outside the diff.
    FINDINGS_ONLY_SCOPE_RULES: |
      Findings boundary:
      - Base your work on the findings artifacts explicitly listed in this prompt.
      - Do not invent new review findings.
    LIFECYCLE_CONTRACT_REVIEW_RULES: |
      Lifecycle and contract tracing:
      - When the diff adds or changes a value, field, operation, message, event, enum member, error shape, or state transition, trace it from its producer through validation, transport, and persistence to every consumer, including consumers the diff does not touch.
      - Confirm that every schema, serializer, router, and handler on that path accepts the new shape, and that inputs the code accepts, such as cursors, filters, options, and flags, are honored instead of silently ignored.
      - Then walk at least one failure path that applies to the change: an error, timeout, retry, cancellation, replay, or a context switch such as the owner, selection, or identity changing mid-operation. Confirm that acquired resources, subscriptions, and partial writes are released or rolled back, and that a stale result cannot overwrite newer state.
      - Report a gap only with the concrete sequence that breaks and the source lines on each side of it.
    TEST_EVIDENCE_REVIEW_RULES: |
      Test and evidence review:
      - For added or changed tests, confirm the fixture reaches the real code path under test, not a mock, stub, or early return that bypasses it, and that fixture data uses the format production code actually produces or persists.
      - Confirm each assertion would fail if the behavior it claims to cover were broken. Flag assertions that match nothing, can never fail, or only prove that a mock was called.
      - Report an incorrect or vacuous test when it gives false confidence about changed behavior. Do not report generic requests for more tests.
    REVIEW_COVERAGE_RULES: |
      Review coverage:
      - Set `coverage.complete` to `true` only when you examined every file in the review diff that this review track covers and could read every artifact this prompt lists.
      - Otherwise set it to `false`, list each changed path or artifact you could not review in `coverage.unreviewed`, and explain why in `coverage.notes`.
      - When the diff is large, review production source first, then tests, then documentation.
      - Coverage is shown to readers as an informational note and does not change the verdict or score. Report it honestly.
    FINDING_VALIDATION_RULES: |
      Premise checks:
      - Before keeping a finding, verify each technical premise it relies on, such as language or runtime semantics, library or framework behavior, types, and configuration defaults, against the repository's code, type definitions, installed dependency sources, or pinned versions. Reject a finding whose premise is wrong or cannot be verified.
      - Confirm the failing path is reachable from a real caller, input, or event. Reject a finding that only fails in a state the code cannot reach.
    HIGH_SIGNAL_REVIEW_RULES: |
      CRITICAL: We only want HIGH SIGNAL issues.
      - Objective bugs that will cause incorrect behavior at runtime
      - Clear, unambiguous CLAUDE.md or AGENTS.md violations where you can quote the exact rule being broken

      We do NOT want:
      - Subjective concerns or suggestions
      - Style preferences that are not explicitly required by CLAUDE.md or AGENTS.md
      - Potential issues that might be problems
      - Anything requiring interpretation, guesswork, or a judgment call

      Treat these as false positives and exclude them:
      - Pre-existing issues
      - Something that appears to be a bug but is actually correct
      - Pedantic nitpicks that a senior engineer would not flag
      - Issues that a linter will catch
      - General code quality concerns unless explicitly required in CLAUDE.md or AGENTS.md
      - Issues mentioned in CLAUDE.md or AGENTS.md but explicitly silenced in the code

      If you are not certain an issue is real, do not flag it.

      Structured output:
      - Every candidate and validated issue must include `instructionPath` and `instructionRule`.
      - For bug or plan-conflict findings, set both fields to empty strings.
      - For instruction-compliance findings, set `instructionPath` to the relevant `CLAUDE.md` or `AGENTS.md` path and `instructionRule` to the exact violated rule text.
    SCORING_RUBRIC: |
      Scoring rubric:
      - The `riskScore` field is a passing confidence/safety score, not a risk-severity score.
      - Use high numbers for high confidence and low risk.
      - 10 is a perfect passing score: no validated findings, high confidence, and low risk.
      - 0 is the lowest possible failing score.
      - Set `riskLevel` in the same direction as risk: `minimal` for the safest/highest-score reviews and `critical` for the riskiest/lowest-score reviews.
      - Score from 10 downward based on validated severity and confidence; lower the score only for real, in-scope findings or a blocked review. Partial coverage alone does not lower the score.
      - Use `verdict` `pass` with score 10 when there are no findings, `needs_changes` for actionable findings, and `blocked` only when the review could not be completed.
    RISK_LEVEL_DEFINITIONS: |
      Risk scoring criteria:
      - Calculate the score by evaluating these factors. Start at 10 and subtract points for each issue found.
      - Security (max -4 points):
        - No new public endpoints without auth (-2 if violated)
        - No secrets or credentials exposed (-4 if violated)
        - Input validation present (-1 if missing)
        - No injection or cross-site-scripting risks (-2 if present)
      - Reliability (max -3 points):
        - No race conditions (-2 if present)
        - Proper error handling (-1 if missing)
        - Resource cleanup such as connections and files (-1 if missing)
      - Testing (max -2 points):
        - New code has tests (-1 if missing)
        - Critical paths covered (-1 if missing)
      - Code quality (max -1 point):
        - Subtract 1 point if project coding standards are materially violated or linting errors are present

      Risk level definitions:
      - Score 0-2: `critical` (🔴) — human review REQUIRED. Security vulnerabilities, data loss risk, breaking changes.
      - Score 3-4: `high` (🟠) — human review REQUIRED. Missing tests, race conditions, external API changes.
      - Score 5-7: `medium` (🟡) — human review recommended. Code quality issues, minor security concerns.
      - Score 8-9: `low` (🟢) — human review optional. Style issues, minor optimizations.
      - Score 10: `minimal` (🟢) — human review not needed. Safe changes, well-tested, follows all standards.
    QA_INTENT_REVIEW_RULES: |
      Approved contract and intent boundary:
      - If a `plan_contract_file` input is provided, read it first and treat its requirements, acceptance checks, and cannot-ship checks as the authoritative approved behavior baseline for the reviewed diff.
      - If a `qa_intent_summary_file` input is provided, use it as secondary context when a plan contract is present, or as the approved baseline when no plan contract is provided.
      - If the QA intent summary and plan contract conflict, the plan contract wins.
      - Do not label behavior as a `bug` when it implements an explicit plan-contract acceptance check.
      - Do not label approved intended behavior as a `bug` just because you would have designed or planned it differently.
      - Use `plan_conflict` only when the approved intent itself appears materially unsafe, incomplete, or likely to cause a meaningful problem.
    CHANGE_SUMMARY_SCHEMA: >-
      {"type":"object","additionalProperties":false,"properties":{"summary":{"type":"string"},"majorAreas":{"type":"array","items":{"type":"string"}},"reviewHotspots":{"type":"array","items":{"type":"string"}}},"required":["summary","majorAreas","reviewHotspots"]}
    REVIEW_CANDIDATES_SCHEMA: >-
      {"type":"object","additionalProperties":false,"properties":{"issues":{"type":"array","items":{"type":"object","additionalProperties":false,"properties":{"title":{"type":"string"},"description":{"type":"string"},"reason":{"type":"string"},"filePath":{"type":"string"},"startLine":{"type":"integer"},"endLine":{"type":"integer"},"evidence":{"type":"string"},"instructionPath":{"type":"string"},"instructionRule":{"type":"string"}},"required":["title","description","reason","filePath","startLine","endLine","evidence","instructionPath","instructionRule"]}},"coverage":{"type":"object","additionalProperties":false,"properties":{"complete":{"type":"boolean"},"unreviewed":{"type":"array","items":{"type":"string"}},"notes":{"type":"string"}},"required":["complete","unreviewed","notes"]}},"required":["issues","coverage"]}
    VALIDATED_CANDIDATES_SCHEMA: >-
      {"type":"object","additionalProperties":false,"properties":{"issues":{"type":"array","items":{"type":"object","additionalProperties":false,"properties":{"title":{"type":"string"},"description":{"type":"string"},"reason":{"type":"string"},"filePath":{"type":"string"},"startLine":{"type":"integer"},"endLine":{"type":"integer"},"evidence":{"type":"string"},"instructionPath":{"type":"string"},"instructionRule":{"type":"string"},"validated":{"type":"boolean"},"validationNotes":{"type":"string"}},"required":["title","description","reason","filePath","startLine","endLine","evidence","instructionPath","instructionRule","validated","validationNotes"]}}},"required":["issues"]}
    PRIOR_FINDING_VERIFICATION_SCHEMA: >-
      {"type":"object","additionalProperties":false,"properties":{"priorFindings":{"type":"array","items":{"type":"object","additionalProperties":false,"properties":{"threadId":{"type":"string"},"commentId":{"type":"integer","minimum":0},"filePath":{"type":"string"},"title":{"type":"string"},"status":{"type":"string","enum":["confirmed","fixed","rejected","unverified"]},"humanDisposition":{"type":"string"},"evidence":{"type":"string"}},"required":["threadId","commentId","filePath","title","status","humanDisposition","evidence"]}}},"required":["priorFindings"]}
    REVIEW_OUTPUT_SCHEMA: >-
      {"type":"object","additionalProperties":false,"properties":{"reviewer":{"type":"string"},"model":{"type":"string"},"summary":{"type":"string"},"positiveFindings":{"type":"array","items":{"type":"string"}},"riskScore":{"type":"integer","minimum":0,"maximum":10},"riskLevel":{"type":"string","enum":["minimal","low","medium","high","critical"]},"verdict":{"type":"string","enum":["pass","needs_changes","blocked"]},"findings":{"type":"array","items":{"type":"object","additionalProperties":false,"properties":{"title":{"type":"string"},"severity":{"type":"string","enum":["critical","important","minor"]},"category":{"type":"string","enum":["correctness","security","reliability","performance","testing","maintainability","instructions"]},"filePath":{"type":"string"},"lineStart":{"type":"integer","minimum":0},"lineEnd":{"type":"integer","minimum":0},"problem":{"type":"string"},"impact":{"type":"string"},"recommendation":{"type":"string"},"confidence":{"type":"string","enum":["high","medium","low"]},"sourceEvidence":{"type":"string"}},"required":["title","severity","category","filePath","lineStart","lineEnd","problem","impact","recommendation","confidence","sourceEvidence"]}},"threadActions":{"type":"array","items":{"type":"object","additionalProperties":false,"properties":{"threadId":{"type":"string"},"commentId":{"type":"integer","minimum":0},"action":{"type":"string","enum":["resolve","comment-only"]},"body":{"type":"string"},"reason":{"type":"string"}},"required":["threadId","commentId","action","body","reason"]}}},"required":["reviewer","model","summary","positiveFindings","riskScore","riskLevel","verdict","findings","threadActions"]}
    UNIFIED_REVIEW_SCHEMA: >-
      {"type":"object","additionalProperties":false,"properties":{"summary":{"type":"string"},"sourceModels":{"type":"array","items":{"type":"string"}},"riskScore":{"type":"integer","minimum":0,"maximum":10},"riskLevel":{"type":"string","enum":["minimal","low","medium","high","critical"]},"verdict":{"type":"string","enum":["pass","needs_changes","blocked"]},"consensusNotes":{"type":"string"},"positiveFindings":{"type":"array","items":{"type":"string"}},"findings":{"type":"array","items":{"type":"object","additionalProperties":false,"properties":{"title":{"type":"string"},"severity":{"type":"string","enum":["critical","important","minor"]},"category":{"type":"string","enum":["correctness","security","reliability","performance","testing","maintainability","instructions"]},"filePath":{"type":"string"},"lineStart":{"type":"integer","minimum":0},"lineEnd":{"type":"integer","minimum":0},"problem":{"type":"string"},"impact":{"type":"string"},"recommendation":{"type":"string"},"confidence":{"type":"string","enum":["high","medium","low"]},"sourceEvidence":{"type":"string"},"reportedBy":{"type":"array","items":{"type":"string"}}},"required":["title","severity","category","filePath","lineStart","lineEnd","problem","impact","recommendation","confidence","sourceEvidence","reportedBy"]}},"threadActions":{"type":"array","items":{"type":"object","additionalProperties":false,"properties":{"threadId":{"type":"string"},"commentId":{"type":"integer","minimum":0},"action":{"type":"string","enum":["resolve","comment-only"]},"body":{"type":"string"},"reason":{"type":"string"},"reportedBy":{"type":"array","items":{"type":"string"}}},"required":["threadId","commentId","action","body","reason","reportedBy"]}}},"required":["summary","sourceModels","riskScore","riskLevel","verdict","consensusNotes","positiveFindings","findings","threadActions"]}

  plugin_collections:
    - id: codex_security_review
      name: Security Review
      description: Required bundled security diff-scan skill for the dedicated security reviewer.
      defaults:
        - type: plugin
          marketplace:
            type: builtin
            id: app
          plugin_name: builtin-security
          required: true

  jobs:
    workspace_details:
      name: Gather Initial Workspace Details
      outputs:
        repo_root: ${{ steps.gather.outputs.repo_root }}
        workspace_details_file: ${{ steps.gather.outputs.workspace_details_file }}
        workspace_summary_file: ${{ steps.gather.outputs.workspace_summary_file }}
        changed_files_file: ${{ steps.gather.outputs.changed_files_file }}
        instruction_scopes_file: ${{ steps.gather.outputs.instruction_scopes_file }}
        diff_file: ${{ steps.gather.outputs.diff_file }}
        review_diff_file: ${{ steps.gather.outputs.review_diff_file }}
        current_branch: ${{ steps.gather.outputs.current_branch }}
        base_branch: ${{ steps.gather.outputs.base_branch }}
        merge_base: ${{ steps.gather.outputs.merge_base }}
        baseline_classification_file: ${{ steps.gather.outputs.baseline_classification_file }}
        pipeline_changed_files_file: ${{ steps.gather.outputs.pipeline_changed_files_file }}
        review_changed_files_file: ${{ steps.gather.outputs.review_changed_files_file }}
        protected_drift_file: ${{ steps.gather.outputs.protected_drift_file }}
        protected_drift_summary_file: ${{ steps.gather.outputs.protected_drift_summary_file }}
      steps:
        - id: gather
          uses: builtin/git-workspace-details
          with:
            base_branch: ${{ inputs.base_branch }}
            include_uncommitted: ${{ inputs.include_uncommitted }}
            checkpoint_file: ${{ inputs.checkpoint_file }}
            plan_scope_file: ${{ inputs.plan_scope_file }}

    instruction_scope:
      name: Resolve Instruction Scope
      needs: review_workspace_details
      outputs:
        instruction_files_file: ${{ steps.find_instruction_files.outputs.instruction_files_file }}
      steps:
        - id: find_instruction_files
          shell: node
          run: |
            import { execFileSync, spawn } from 'node:child_process';
            import { createInterface } from 'node:readline';
            import fs from 'node:fs';
            import path from 'node:path';

            const repoRoot = execFileSync('git', ['rev-parse', '--show-toplevel'], {
              cwd: process.cwd(),
              encoding: 'utf8',
            }).trim();

            const includeUncommitted = process.env.INPUT_INCLUDE_UNCOMMITTED !== 'false';
            const instructionPathspecs = ['--', ':(glob)**/CLAUDE.md', ':(glob)**/AGENTS.md'];
            const trackedAndUntrackedFiles = includeUncommitted
              ? execFileSync(
                  'git',
                  ['ls-files', '--cached', '--others', '--exclude-standard', ...instructionPathspecs],
                  {
                    cwd: repoRoot,
                    encoding: 'utf8',
                    maxBuffer: 16 * 1024 * 1024,
                  },
                )
                  .split('\n')
                  .map((line) => line.trim())
                  .filter((line) => line.length > 0)
              : await new Promise((resolve, reject) => {
                  // HEAD is the committed snapshot; stream the tree so unrelated
                  // paths cannot exhaust a subprocess output buffer.
                  const files = [];
                  const child = spawn('git', ['ls-tree', '-r', '--name-only', 'HEAD'], {
                    cwd: repoRoot,
                  });
                  const lines = createInterface({ input: child.stdout });
                  lines.on('line', (filePath) => {
                    if (
                      filePath === 'CLAUDE.md' ||
                      filePath === 'AGENTS.md' ||
                      filePath.endsWith('/CLAUDE.md') ||
                      filePath.endsWith('/AGENTS.md')
                    ) {
                      files.push(filePath);
                    }
                  });
                  child.on('error', reject);
                  child.on('close', (code) => {
                    if (code === 0) resolve(files);
                    else reject(new Error(`git ls-tree failed with exit code ${code}`));
                  });
                });

            const instructionFiles = trackedAndUntrackedFiles
              .filter((filePath) => {
                const fileName = path.basename(filePath);
                return fileName === 'CLAUDE.md' || fileName === 'AGENTS.md';
              })
              .map((filePath) =>
                path.relative(process.cwd(), path.join(repoRoot, filePath)).split(path.sep).join('/'),
              )
              .sort((left, right) => left.localeCompare(right));

            const outputDir =
              process.env.{{BRAND_ENV_PREFIX}}_OUTPUT_DIR ??
              path.dirname(process.env.{{BRAND_ENV_PREFIX}}_OUTPUT ?? '');
            const outputPath = path.join(outputDir, 'instruction-files.json');

            fs.writeFileSync(
              outputPath,
              `${JSON.stringify({ instructionFiles }, null, 2)}\n`,
              'utf8',
            );
            fs.appendFileSync(
              process.env.{{BRAND_ENV_PREFIX}}_OUTPUT ?? '',
              `instruction_files_file=${outputPath}\n`,
              'utf8',
            );

    pr_context:
      name: Gather GitHub Branch PR
      needs: workspace_details
      outputs:
        pr_status: ${{ steps.lookup.outputs.status }}
        pr_json_file: ${{ steps.lookup.outputs.details_json_file }}
        pr_summary_file: ${{ steps.lookup.outputs.summary_file }}
        pr_title: ${{ steps.lookup.outputs.title }}
        pr_base_branch: ${{ steps.lookup.outputs.base_branch }}
        effective_base_branch: ${{ steps.resolve_base_branch.outputs.effective_base_branch }}
        effective_base_branch_source: ${{ steps.resolve_base_branch.outputs.effective_base_branch_source }}
      steps:
        - id: lookup
          uses: builtin/github-fetch-branch-pr
        - id: resolve_base_branch
          shell: node
          run: |
            import fs from 'node:fs';

            const pipelineInputs = ${{ toJson(inputs) }};
            const lookupOutputs = ${{ toJson(steps.lookup.outputs) }};
            const workspaceDetailsOutputs = ${{ toJson(needs.workspace_details.outputs) }};
            const requestedBaseBranch = String(pipelineInputs.base_branch ?? '').trim();
            const prBaseBranch = String(lookupOutputs.base_branch ?? '').trim();
            const gitBaseBranch = String(workspaceDetailsOutputs.base_branch ?? '').trim();

            let effectiveBaseBranch = 'main';
            let source = 'fallback';

            if (requestedBaseBranch) {
              effectiveBaseBranch = requestedBaseBranch;
              source = 'input';
            } else if (prBaseBranch) {
              effectiveBaseBranch = prBaseBranch;
              source = 'pull_request';
            } else if (gitBaseBranch) {
              effectiveBaseBranch = gitBaseBranch;
              source = 'git';
            }

            fs.appendFileSync(
              process.env.{{BRAND_ENV_PREFIX}}_OUTPUT ?? '',
              `effective_base_branch=${effectiveBaseBranch}\n`,
              'utf8',
            );
            fs.appendFileSync(
              process.env.{{BRAND_ENV_PREFIX}}_OUTPUT ?? '',
              `effective_base_branch_source=${source}\n`,
              'utf8',
            );

    github_review_context:
      name: Gather GitHub Review Context
      continue_on_error: true
      needs:
        - pr_context
      outputs:
        review_context_file: ${{ steps.gather.outputs.review_context_file }}
        review_context_summary_file: ${{ steps.gather.outputs.review_context_summary_file }}
        last_ai_review_file: ${{ steps.gather.outputs.last_ai_review_file }}
        review_threads_file: ${{ steps.gather.outputs.review_threads_file }}
        previous_review_node_ids_file: ${{ steps.gather.outputs.previous_review_node_ids_file }}
        attempt: ${{ steps.gather.outputs.attempt }}
        previous_review_id: ${{ steps.gather.outputs.previous_review_id }}
      steps:
        - id: gather
          shell: node
          run: |
            import { execFileSync } from 'node:child_process';
            import fs from 'node:fs';
            import path from 'node:path';

            const output = process.env.{{BRAND_ENV_PREFIX}}_OUTPUT ?? '';
            if (!output) {
              throw new Error('{{BRAND_ENV_PREFIX}}_OUTPUT is required');
            }

            const outputDir =
              process.env.{{BRAND_ENV_PREFIX}}_OUTPUT_DIR ?? path.dirname(output);
            const prPath = (process.env.PR_JSON_FILE ?? '').trim();
            const hasPr = process.env.PR_STATUS === 'found';
            const maxBuffer = 32 * 1024 * 1024;

            function writeJson(name, value) {
              const filePath = path.join(outputDir, name);
              fs.writeFileSync(filePath, `${JSON.stringify(value, null, 2)}\n`, 'utf8');
              return filePath;
            }

            function writeText(name, value) {
              const filePath = path.join(outputDir, name);
              fs.writeFileSync(filePath, value.endsWith('\n') ? value : `${value}\n`, 'utf8');
              return filePath;
            }

            function readJsonFile(filePath, fallback) {
              if (!filePath || !fs.existsSync(filePath)) {
                return fallback;
              }
              try {
                return JSON.parse(fs.readFileSync(filePath, 'utf8'));
              } catch {
                return fallback;
              }
            }

            function runGhJson(args, fallback) {
              const stdout = execFileSync('gh', ['api', ...args], {
                encoding: 'utf8',
                maxBuffer,
              }).trim();
              if (!stdout) {
                return fallback;
              }
              return JSON.parse(stdout);
            }

            function flattenPaginated(value) {
              if (!Array.isArray(value)) {
                return [];
              }
              return value.flatMap((entry) => (Array.isArray(entry) ? entry : [entry]));
            }

            function parseMetadata(body) {
              if (typeof body !== 'string') {
                return null;
              }
              const match = body.match(/<!-- AI_REVIEW_DATA:\s*(\{.*?\})\s*-->/s);
              if (!match) {
                return null;
              }
              try {
                return JSON.parse(match[1]);
              } catch {
                return null;
              }
            }

            function isAiReviewBody(body) {
              return (
                typeof body === 'string' &&
                (body.includes('[//]: # (ud-ai-review)') ||
                  body.includes('AI ud-code-reviewer') ||
                  body.includes('Review by AI pipeline'))
              );
            }

            const emptyLastAiReview = null;
            const emptyThreads = [];
            const emptyNodeIds = [];

            if (!hasPr) {
              const lastAiReviewFile = writeJson('last-ai-review.json', emptyLastAiReview);
              const reviewThreadsFile = writeJson('review-threads.json', emptyThreads);
              const previousReviewNodeIdsFile = writeJson(
                'previous-review-node-ids.json',
                emptyNodeIds,
              );
              const context = {
                mode: 'branch',
                hasPr: false,
                attempt: 1,
                previousReviewId: null,
                previousReviewNodeIds: [],
                lastAiReview: null,
                reviewThreads: [],
              };
              const reviewContextFile = writeJson('github-review-context.json', context);
              const summaryFile = writeText(
                'github-review-context.md',
                '# GitHub Review Context\n\nNo pull request was found for this branch.\n',
              );
              fs.appendFileSync(output, `review_context_file=${reviewContextFile}\n`, 'utf8');
              fs.appendFileSync(output, `review_context_summary_file=${summaryFile}\n`, 'utf8');
              fs.appendFileSync(output, `last_ai_review_file=${lastAiReviewFile}\n`, 'utf8');
              fs.appendFileSync(output, `review_threads_file=${reviewThreadsFile}\n`, 'utf8');
              fs.appendFileSync(output, `previous_review_node_ids_file=${previousReviewNodeIdsFile}\n`, 'utf8');
              fs.appendFileSync(output, 'attempt=1\n', 'utf8');
              fs.appendFileSync(output, 'previous_review_id=\n', 'utf8');
              process.exit(0);
            }

            const prLookup = readJsonFile(prPath, {});
            const pr = prLookup && typeof prLookup === 'object' ? prLookup.pr : null;
            if (!pr || typeof pr !== 'object') {
              throw new Error(`Missing PR details in ${prPath || '(empty)'}`);
            }

            const prUrl = typeof pr.url === 'string' ? pr.url : '';
            const match = prUrl.match(/^https?:\/\/github\.com\/([^/]+)\/([^/]+)\/pull\/(\d+)\/?$/);
            if (!match) {
              throw new Error(`Could not parse GitHub PR URL: ${prUrl || '(empty)'}`);
            }

            const owner = match[1];
            const repo = match[2];
            const pullNumber = Number.parseInt(match[3], 10);

            const reviews = flattenPaginated(
              runGhJson(
                [
                  `repos/${owner}/${repo}/pulls/${String(pullNumber)}/reviews?per_page=100`,
                  '--paginate',
                  '--slurp',
                ],
                [],
              ),
            );
            const aiReviews = reviews.filter((review) =>
              review && typeof review === 'object' && isAiReviewBody(review.body),
            );
            const previousReviewNodeIds = aiReviews
              .map((review) => (typeof review.node_id === 'string' ? review.node_id : ''))
              .filter((nodeId) => nodeId.length > 0);
            const latestReview = aiReviews.length > 0 ? aiReviews[aiReviews.length - 1] : null;
            const latestMetadata = latestReview ? parseMetadata(latestReview.body) : null;

            const issueComments = flattenPaginated(
              runGhJson(
                [
                  `repos/${owner}/${repo}/issues/${String(pullNumber)}/comments?per_page=100`,
                  '--paginate',
                  '--slurp',
                ],
                [],
              ),
            );
            const issueCommentReviewCount = issueComments.filter(
              (comment) =>
                comment &&
                typeof comment === 'object' &&
                typeof comment.body === 'string' &&
                comment.body.includes('AI Code Review'),
            ).length;

            const attempt =
              latestMetadata && typeof latestMetadata.attempt === 'number'
                ? latestMetadata.attempt + 1
                : aiReviews.length + issueCommentReviewCount + 1;

            const threadQuery = `
              query($owner: String!, $repo: String!, $pr: Int!, $cursor: String) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $pr) {
                    reviewThreads(first: 100, after: $cursor) {
                      pageInfo { hasNextPage endCursor }
                      nodes {
                        id
                        isResolved
                        comments(first: 100) {
                          nodes {
                            databaseId
                            body
                            author { login }
                            path
                            line
                            pullRequestReview {
                              databaseId
                              author { login }
                              state
                              body
                              submittedAt
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;

            const groupMap = new Map();
            const threadResolutionByCommentId = new Map();
            let cursor = '';
            let hasNextPage = true;
            while (hasNextPage) {
              const graphQlArgs = [
                'graphql',
                '-f',
                `query=${threadQuery}`,
                '-f',
                `owner=${owner}`,
                '-f',
                `repo=${repo}`,
                '-F',
                `pr=${String(pullNumber)}`,
              ];
              if (cursor) {
                graphQlArgs.push('-f', `cursor=${cursor}`);
              }
              const page = runGhJson(
                graphQlArgs,
                null,
              );
              const reviewThreads =
                page?.data?.repository?.pullRequest?.reviewThreads;
              if (
                !reviewThreads ||
                !Array.isArray(reviewThreads.nodes) ||
                !reviewThreads.pageInfo ||
                typeof reviewThreads.pageInfo.hasNextPage !== 'boolean' ||
                (reviewThreads.pageInfo.hasNextPage &&
                  (typeof reviewThreads.pageInfo.endCursor !== 'string' ||
                    !reviewThreads.pageInfo.endCursor.trim()))
              ) {
                throw new Error(
                  'Unexpected GitHub GraphQL reviewThreads response shape',
                );
              }
              for (const thread of reviewThreads.nodes ?? []) {
                const comments = thread?.comments?.nodes ?? [];
                const first = comments[0];
                if (!first) {
                  continue;
                }
                if (typeof first.databaseId === 'number') {
                  threadResolutionByCommentId.set(first.databaseId, Boolean(thread.isResolved));
                }
                const review = first.pullRequestReview;
                const groupKey = review?.databaseId
                  ? String(review.databaseId)
                  : `orphan-${thread.id}`;
                if (!groupMap.has(groupKey)) {
                  groupMap.set(groupKey, {
                    reviewId: review?.databaseId ?? null,
                    author: review?.author?.login ?? first.author?.login ?? 'unknown',
                    state: review?.state ?? null,
                    body: review?.body || null,
                    submittedAt: review?.submittedAt ?? null,
                    threads: [],
                  });
                }
                groupMap.get(groupKey).threads.push({
                  id: thread.id,
                  commentId: first.databaseId ?? null,
                  resolved: Boolean(thread.isResolved),
                  body: first.body ?? '',
                  author: first.author?.login ?? 'unknown',
                  path: first.path ?? null,
                  line: first.line ?? null,
                  replies: comments.slice(1).map((reply) => ({
                    body: reply.body ?? '',
                    author: reply.author?.login ?? 'unknown',
                  })),
                });
              }
              hasNextPage = Boolean(reviewThreads.pageInfo?.hasNextPage);
              cursor = reviewThreads.pageInfo?.endCursor ?? '';
            }
            const reviewThreads = Array.from(groupMap.values());

            let lastAiReview = null;
            if (latestReview) {
              const inlineComments = flattenPaginated(
                runGhJson(
                  [
                    `repos/${owner}/${repo}/pulls/${String(pullNumber)}/reviews/${String(latestReview.id)}/comments?per_page=100`,
                    '--paginate',
                    '--slurp',
                  ],
                  [],
                ),
              ).map((comment) => ({
                id: comment.id,
                path: comment.path,
                line: comment.line ?? null,
                start_line: comment.start_line ?? null,
                body: comment.body ?? '',
                created_at: comment.created_at ?? '',
                is_resolved: threadResolutionByCommentId.get(comment.id) ?? null,
              }));
              lastAiReview = {
                review_id: latestReview.id,
                attempt: attempt - 1,
                body: latestReview.body ?? '',
                state: latestReview.state ?? '',
                submitted_at: latestReview.submitted_at ?? '',
                commit_id: latestReview.commit_id ?? '',
                metadata: latestMetadata,
                inline_comments: inlineComments,
                previous_review_node_ids: previousReviewNodeIds,
              };
            }

            const lastAiReviewFile = writeJson('last-ai-review.json', lastAiReview);
            const reviewThreadsFile = writeJson('review-threads.json', reviewThreads);
            const previousReviewNodeIdsFile = writeJson(
              'previous-review-node-ids.json',
              previousReviewNodeIds,
            );
            const context = {
              mode: 'pr',
              hasPr: true,
              owner,
              repo,
              pullNumber,
              attempt,
              previousReviewId: latestReview?.id ?? null,
              previousReviewNodeIds,
              lastAiReview,
              reviewThreads,
            };
            const reviewContextFile = writeJson('github-review-context.json', context);
            const threadCount = reviewThreads.reduce(
              (count, group) => count + (Array.isArray(group.threads) ? group.threads.length : 0),
              0,
            );
            const unresolvedCount = reviewThreads.reduce(
              (count, group) =>
                count +
                (Array.isArray(group.threads)
                  ? group.threads.filter((thread) => !thread.resolved).length
                  : 0),
              0,
            );
            const summaryFile = writeText(
              'github-review-context.md',
              [
                '# GitHub Review Context',
                '',
                `- PR: ${prUrl}`,
                `- Attempt: ${String(attempt)}`,
                `- Previous AI review: ${latestReview?.id ? `#${String(latestReview.id)}` : '(none)'}`,
                `- Previous AI review node IDs: ${String(previousReviewNodeIds.length)}`,
                `- Review threads: ${String(threadCount)} (${String(unresolvedCount)} unresolved)`,
                '',
              ].join('\n'),
            );

            fs.appendFileSync(output, `review_context_file=${reviewContextFile}\n`, 'utf8');
            fs.appendFileSync(output, `review_context_summary_file=${summaryFile}\n`, 'utf8');
            fs.appendFileSync(output, `last_ai_review_file=${lastAiReviewFile}\n`, 'utf8');
            fs.appendFileSync(output, `review_threads_file=${reviewThreadsFile}\n`, 'utf8');
            fs.appendFileSync(output, `previous_review_node_ids_file=${previousReviewNodeIdsFile}\n`, 'utf8');
            fs.appendFileSync(output, `attempt=${String(attempt)}\n`, 'utf8');
            fs.appendFileSync(output, `previous_review_id=${latestReview?.id ? String(latestReview.id) : ''}\n`, 'utf8');
          env:
            PR_STATUS: ${{ needs.pr_context.outputs.pr_status }}
            PR_JSON_FILE: ${{ needs.pr_context.outputs.pr_json_file }}

    review_workspace_details:
      name: Gather Review Workspace Details
      needs:
        - workspace_details
        - pr_context
      outputs:
        workspace_details_file: ${{ steps.resolve.outputs.workspace_details_file }}
        workspace_summary_file: ${{ steps.resolve.outputs.workspace_summary_file }}
        changed_files_file: ${{ steps.resolve.outputs.changed_files_file }}
        instruction_scopes_file: ${{ steps.resolve.outputs.instruction_scopes_file }}
        diff_file: ${{ steps.resolve.outputs.diff_file }}
        review_diff_file: ${{ steps.resolve.outputs.review_diff_file }}
        current_branch: ${{ steps.resolve.outputs.current_branch }}
        base_branch: ${{ steps.resolve.outputs.base_branch }}
        merge_base: ${{ steps.resolve.outputs.merge_base }}
        baseline_classification_file: ${{ steps.resolve.outputs.baseline_classification_file }}
        pipeline_changed_files_file: ${{ steps.resolve.outputs.pipeline_changed_files_file }}
        review_changed_files_file: ${{ steps.resolve.outputs.review_changed_files_file }}
        protected_drift_file: ${{ steps.resolve.outputs.protected_drift_file }}
        protected_drift_summary_file: ${{ steps.resolve.outputs.protected_drift_summary_file }}
        reviewed_head: ${{ steps.identify_revision.outputs.reviewed_head }}
        reviewed_uncommitted: ${{ steps.identify_revision.outputs.reviewed_uncommitted }}
      steps:
        - id: determine_source
          shell: node
          run: |
            import fs from 'node:fs';

            const {{BRAND_OUTPUT_VARIABLE_NAME}} = process.env.{{BRAND_ENV_PREFIX}}_OUTPUT ?? '';
            if (!{{BRAND_OUTPUT_VARIABLE_NAME}}) {
              throw new Error('{{BRAND_ENV_PREFIX}}_OUTPUT is required');
            }

            const currentBaseBranch = (process.env.CURRENT_BASE_BRANCH ?? '').trim();
            const effectiveBaseBranch = (process.env.EFFECTIVE_BASE_BRANCH ?? '').trim();
            const reuseExisting =
              currentBaseBranch.length > 0 &&
              effectiveBaseBranch.length > 0 &&
              currentBaseBranch === effectiveBaseBranch;

            fs.appendFileSync(
              {{BRAND_OUTPUT_VARIABLE_NAME}},
              `reuse_existing=${reuseExisting ? 'true' : 'false'}\n`,
              'utf8',
            );
          env:
            CURRENT_BASE_BRANCH: ${{ needs.workspace_details.outputs.base_branch }}
            EFFECTIVE_BASE_BRANCH: ${{ needs.pr_context.outputs.effective_base_branch }}
        - id: gather
          if: steps.determine_source.outputs.reuse_existing != 'true'
          uses: builtin/git-workspace-details
          with:
            base_branch: ${{ needs.pr_context.outputs.effective_base_branch }}
            include_uncommitted: ${{ inputs.include_uncommitted }}
            checkpoint_file: ${{ inputs.checkpoint_file }}
            plan_scope_file: ${{ inputs.plan_scope_file }}
        - id: resolve
          shell: node
          run: |
            import fs from 'node:fs';

            const {{BRAND_OUTPUT_VARIABLE_NAME}} = process.env.{{BRAND_ENV_PREFIX}}_OUTPUT ?? '';
            if (!{{BRAND_OUTPUT_VARIABLE_NAME}}) {
              throw new Error('{{BRAND_ENV_PREFIX}}_OUTPUT is required');
            }

            const reuseExisting = process.env.REUSE_EXISTING === 'true';
            const selectedOutputs = reuseExisting
              ? {
                  workspace_details_file: process.env.EXISTING_WORKSPACE_DETAILS_FILE ?? '',
                  workspace_summary_file: process.env.EXISTING_WORKSPACE_SUMMARY_FILE ?? '',
                  changed_files_file: process.env.EXISTING_CHANGED_FILES_FILE ?? '',
                  instruction_scopes_file:
                    process.env.EXISTING_INSTRUCTION_SCOPES_FILE ?? '',
                  diff_file: process.env.EXISTING_DIFF_FILE ?? '',
                  review_diff_file: process.env.EXISTING_REVIEW_DIFF_FILE ?? '',
                  current_branch: process.env.EXISTING_CURRENT_BRANCH ?? '',
                  base_branch: process.env.EXISTING_BASE_BRANCH ?? '',
                  merge_base: process.env.EXISTING_MERGE_BASE ?? '',
                  baseline_classification_file:
                    process.env.EXISTING_BASELINE_CLASSIFICATION_FILE ?? '',
                  pipeline_changed_files_file:
                    process.env.EXISTING_PIPELINE_CHANGED_FILES_FILE ?? '',
                  review_changed_files_file:
                    process.env.EXISTING_REVIEW_CHANGED_FILES_FILE ?? '',
                  protected_drift_file:
                    process.env.EXISTING_PROTECTED_DRIFT_FILE ?? '',
                  protected_drift_summary_file:
                    process.env.EXISTING_PROTECTED_DRIFT_SUMMARY_FILE ?? '',
                }
              : {
                  workspace_details_file: process.env.GATHERED_WORKSPACE_DETAILS_FILE ?? '',
                  workspace_summary_file: process.env.GATHERED_WORKSPACE_SUMMARY_FILE ?? '',
                  changed_files_file: process.env.GATHERED_CHANGED_FILES_FILE ?? '',
                  instruction_scopes_file:
                    process.env.GATHERED_INSTRUCTION_SCOPES_FILE ?? '',
                  diff_file: process.env.GATHERED_DIFF_FILE ?? '',
                  review_diff_file: process.env.GATHERED_REVIEW_DIFF_FILE ?? '',
                  current_branch: process.env.GATHERED_CURRENT_BRANCH ?? '',
                  base_branch: process.env.GATHERED_BASE_BRANCH ?? '',
                  merge_base: process.env.GATHERED_MERGE_BASE ?? '',
                  baseline_classification_file:
                    process.env.GATHERED_BASELINE_CLASSIFICATION_FILE ?? '',
                  pipeline_changed_files_file:
                    process.env.GATHERED_PIPELINE_CHANGED_FILES_FILE ?? '',
                  review_changed_files_file:
                    process.env.GATHERED_REVIEW_CHANGED_FILES_FILE ?? '',
                  protected_drift_file:
                    process.env.GATHERED_PROTECTED_DRIFT_FILE ?? '',
                  protected_drift_summary_file:
                    process.env.GATHERED_PROTECTED_DRIFT_SUMMARY_FILE ?? '',
                };

            const optionalOutputKeys = new Set(['merge_base']);
            for (const [key, value] of Object.entries(selectedOutputs)) {
              const normalizedValue = typeof value === 'string' ? value.trim() : '';
              if (
                normalizedValue.length === 0 &&
                !optionalOutputKeys.has(key)
              ) {
                throw new Error(`Missing review workspace output: ${key}`);
              }
              fs.appendFileSync({{BRAND_OUTPUT_VARIABLE_NAME}}, `${key}=${normalizedValue}\n`, 'utf8');
            }
          env:
            REUSE_EXISTING: ${{ steps.determine_source.outputs.reuse_existing }}
            EXISTING_WORKSPACE_DETAILS_FILE: ${{ needs.workspace_details.outputs.workspace_details_file }}
            EXISTING_WORKSPACE_SUMMARY_FILE: ${{ needs.workspace_details.outputs.workspace_summary_file }}
            EXISTING_CHANGED_FILES_FILE: ${{ needs.workspace_details.outputs.changed_files_file }}
            EXISTING_INSTRUCTION_SCOPES_FILE: ${{ needs.workspace_details.outputs.instruction_scopes_file }}
            EXISTING_DIFF_FILE: ${{ needs.workspace_details.outputs.diff_file }}
            EXISTING_REVIEW_DIFF_FILE: ${{ needs.workspace_details.outputs.review_diff_file }}
            EXISTING_CURRENT_BRANCH: ${{ needs.workspace_details.outputs.current_branch }}
            EXISTING_BASE_BRANCH: ${{ needs.workspace_details.outputs.base_branch }}
            EXISTING_MERGE_BASE: ${{ needs.workspace_details.outputs.merge_base }}
            EXISTING_BASELINE_CLASSIFICATION_FILE: ${{ needs.workspace_details.outputs.baseline_classification_file }}
            EXISTING_PIPELINE_CHANGED_FILES_FILE: ${{ needs.workspace_details.outputs.pipeline_changed_files_file }}
            EXISTING_REVIEW_CHANGED_FILES_FILE: ${{ needs.workspace_details.outputs.review_changed_files_file }}
            EXISTING_PROTECTED_DRIFT_FILE: ${{ needs.workspace_details.outputs.protected_drift_file }}
            EXISTING_PROTECTED_DRIFT_SUMMARY_FILE: ${{ needs.workspace_details.outputs.protected_drift_summary_file }}
            GATHERED_WORKSPACE_DETAILS_FILE: ${{ steps.gather.outputs.workspace_details_file }}
            GATHERED_WORKSPACE_SUMMARY_FILE: ${{ steps.gather.outputs.workspace_summary_file }}
            GATHERED_CHANGED_FILES_FILE: ${{ steps.gather.outputs.changed_files_file }}
            GATHERED_INSTRUCTION_SCOPES_FILE: ${{ steps.gather.outputs.instruction_scopes_file }}
            GATHERED_DIFF_FILE: ${{ steps.gather.outputs.diff_file }}
            GATHERED_REVIEW_DIFF_FILE: ${{ steps.gather.outputs.review_diff_file }}
            GATHERED_CURRENT_BRANCH: ${{ steps.gather.outputs.current_branch }}
            GATHERED_BASE_BRANCH: ${{ steps.gather.outputs.base_branch }}
            GATHERED_MERGE_BASE: ${{ steps.gather.outputs.merge_base }}
            GATHERED_BASELINE_CLASSIFICATION_FILE: ${{ steps.gather.outputs.baseline_classification_file }}
            GATHERED_PIPELINE_CHANGED_FILES_FILE: ${{ steps.gather.outputs.pipeline_changed_files_file }}
            GATHERED_REVIEW_CHANGED_FILES_FILE: ${{ steps.gather.outputs.review_changed_files_file }}
            GATHERED_PROTECTED_DRIFT_FILE: ${{ steps.gather.outputs.protected_drift_file }}
            GATHERED_PROTECTED_DRIFT_SUMMARY_FILE: ${{ steps.gather.outputs.protected_drift_summary_file }}
        # Keep this inline implementation in sync across code review variants.
        - id: identify_revision
          shell: node
          run: |
            import fs from 'node:fs';

            const {{BRAND_OUTPUT_VARIABLE_NAME}} = process.env.{{BRAND_ENV_PREFIX}}_OUTPUT ?? '';
            if (!{{BRAND_OUTPUT_VARIABLE_NAME}}) {
              throw new Error('{{BRAND_ENV_PREFIX}}_OUTPUT is required');
            }

            const detailsPath = (process.env.WORKSPACE_DETAILS_FILE ?? '').trim();
            if (!detailsPath || !fs.existsSync(detailsPath)) {
              throw new Error(`Missing workspace details file: ${detailsPath || '(empty)'}`);
            }
            const details = JSON.parse(fs.readFileSync(detailsPath, 'utf8'));
            // The diff artifacts were taken from this commit; multi-repo workspaces have no single head.
            const head =
              typeof details?.head === 'string' && /^[0-9a-f]{40,64}$/i.test(details.head)
                ? details.head
                : '';
            const uncommitted =
              details?.includeUncommitted === true && details?.hasUncommittedChanges === true;
            fs.appendFileSync(
              {{BRAND_OUTPUT_VARIABLE_NAME}},
              `reviewed_head=${head}\nreviewed_uncommitted=${uncommitted ? 'true' : 'false'}\n`,
              'utf8',
            );
          env:
            WORKSPACE_DETAILS_FILE: ${{ steps.resolve.outputs.workspace_details_file }}

    linear_context:
      name: Gather Linear Context
      needs:
        - pr_context
        - review_workspace_details
      outputs:
        linear_context_file: ${{ steps.gather.outputs.linear_context_file }}
        linear_summary_file: ${{ steps.gather.outputs.linear_summary_file }}
        detected_ticket_ids_json: ${{ steps.gather.outputs.detected_ticket_ids_json }}
        ticket_count: ${{ steps.gather.outputs.ticket_count }}
      steps:
        - id: gather
          uses: builtin/gather-linear-context
          with:
            current_branch: ${{ needs.review_workspace_details.outputs.current_branch }}
            pr_json_file: ${{ needs.pr_context.outputs.pr_json_file }}
            max_tickets: '3'

    change_summary:
      name: Summarize Changes
      needs: review_workspace_details
      outputs:
        summary_file: ${{ steps.summarize.outputs.summary_file }}
      steps:
        - id: summarize
          shell: node
          run: |
            import fs from 'node:fs';
            import path from 'node:path';

            const {{BRAND_OUTPUT_VARIABLE_NAME}} = process.env.{{BRAND_ENV_PREFIX}}_OUTPUT ?? '';
            if (!{{BRAND_OUTPUT_VARIABLE_NAME}}) {
              throw new Error('{{BRAND_ENV_PREFIX}}_OUTPUT is required');
            }

            const changedFilesPath = (process.env.CHANGED_FILES_FILE ?? '').trim();
            if (!changedFilesPath || !fs.existsSync(changedFilesPath)) {
              throw new Error(
                `Missing changed files file: ${changedFilesPath || '(empty)'}`,
              );
            }

            const parsed = JSON.parse(fs.readFileSync(changedFilesPath, 'utf8'));
            const rawFiles =
              parsed &&
              typeof parsed === 'object' &&
              !Array.isArray(parsed) &&
              Array.isArray(parsed.files)
                ? parsed.files
                : Array.isArray(parsed)
                  ? parsed
                  : [];

            const files = rawFiles
              .map((entry) => {
                if (typeof entry === 'string') {
                  return {
                    path: entry,
                    status: 'modified',
                    insertions: 0,
                    deletions: 0,
                  };
                }
                if (!entry || typeof entry !== 'object' || Array.isArray(entry)) {
                  return null;
                }
                const filePath =
                  typeof entry.path === 'string'
                    ? entry.path
                    : typeof entry.filePath === 'string'
                      ? entry.filePath
                      : '';
                if (!filePath) {
                  return null;
                }
                return {
                  path: filePath.replace(/\\/g, '/').replace(/^\.\//, '').trim(),
                  status:
                    typeof entry.status === 'string' && entry.status.trim().length > 0
                      ? entry.status.trim()
                      : 'modified',
                  insertions:
                    typeof entry.insertions === 'number' ? entry.insertions : 0,
                  deletions:
                    typeof entry.deletions === 'number' ? entry.deletions : 0,
                };
              })
              .filter((entry) => entry && entry.path.length > 0);

            if (files.length === 0) {
              const result = {
                summary:
                  'No changed files were detected in the review diff.',
                majorAreas: [],
                reviewHotspots: [],
              };
              const outputDir =
                process.env.{{BRAND_ENV_PREFIX}}_OUTPUT_DIR ?? path.dirname({{BRAND_OUTPUT_VARIABLE_NAME}});
              const outputPath = path.join(outputDir, 'change-summary.json');
              fs.writeFileSync(
                outputPath,
                `${JSON.stringify(result, null, 2)}\n`,
                'utf8',
              );
              fs.appendFileSync(
                {{BRAND_OUTPUT_VARIABLE_NAME}},
                `summary_file=${outputPath}\n`,
                'utf8',
              );
              process.exit(0);
            }

            const packageGroups = new Map();
            const rootFiles = [];
            for (const file of files) {
              const parts = file.path.split('/');
              if (parts[0] === 'packages' && parts[1]) {
                const scope = `packages/${parts[1]}`;
                const existing = packageGroups.get(scope) ?? [];
                existing.push(file);
                packageGroups.set(scope, existing);
              } else {
                rootFiles.push(file);
              }
            }

            const touchedPackages = Array.from(packageGroups.keys()).sort((left, right) =>
              left.localeCompare(right),
            );
            const totalInsertions = files.reduce(
              (sum, file) => sum + file.insertions,
              0,
            );
            const totalDeletions = files.reduce(
              (sum, file) => sum + file.deletions,
              0,
            );
            const allAdded = files.every(
              (file) => file.status === 'added' || file.status === 'untracked',
            );

            function buildPackageArea(scope, entries) {
              const labels = [];
              if (entries.some((entry) => entry.path.endsWith('/package.json'))) {
                labels.push('package manifest');
              }
              if (entries.some((entry) => entry.path.endsWith('/tsconfig.json'))) {
                labels.push('TypeScript build config');
              }
              if (entries.some((entry) => entry.path.includes('/src/'))) {
                labels.push('source implementation');
              }
              const details = labels.length > 0 ? labels.join(', ') : 'implementation files';
              return `${scope} - ${entries.length} changed file(s) covering ${details}`;
            }

            const majorAreas = touchedPackages.map((scope) =>
              buildPackageArea(scope, packageGroups.get(scope) ?? []),
            );
            if (rootFiles.some((file) => file.path === 'package-lock.json')) {
              majorAreas.push(
                'package-lock.json - workspace dependency and install-state updates',
              );
            } else if (rootFiles.length > 0) {
              majorAreas.push(
                `repo root - ${rootFiles.length} changed file(s) outside package directories`,
              );
            }

            const summaryParts = [];
            if (touchedPackages.length === 1) {
              const scope = touchedPackages[0];
              const entries = packageGroups.get(scope) ?? [];
              const capabilities = [];
              if (entries.some((entry) => entry.path.endsWith('/src/index.ts'))) {
                capabilities.push('entrypoint');
              }
              if (entries.some((entry) => entry.path.endsWith('/src/parser.ts'))) {
                capabilities.push('parser');
              }
              if (entries.some((entry) => entry.path.endsWith('/src/validator.ts'))) {
                capabilities.push('validator');
              }
              if (entries.some((entry) => entry.path.endsWith('/src/types.ts'))) {
                capabilities.push('shared types');
              }

              const packageSummary =
                capabilities.length > 0
                  ? `${allAdded ? 'adds' : 'updates'} \`${scope}\` with ${capabilities.join(', ')} changes`
                  : `${allAdded ? 'adds' : 'updates'} \`${scope}\``;
              summaryParts.push(`This diff primarily ${packageSummary}.`);
            } else {
              summaryParts.push(
                `This diff touches ${files.length} file(s) across ${touchedPackages.length} package scope(s).`,
              );
            }

            if (rootFiles.some((file) => file.path === 'package-lock.json')) {
              summaryParts.push(
                'It also updates the root `package-lock.json` to reflect workspace dependency changes.',
              );
            }

            summaryParts.push(
              `Overall diff size: +${String(totalInsertions)} / -${String(totalDeletions)} across ${files.length} file(s).`,
            );

            function hotspotPriority(filePath) {
              if (filePath.endsWith('/src/index.ts')) return 600;
              if (filePath.endsWith('/src/parser.ts')) return 550;
              if (filePath.endsWith('/src/validator.ts')) return 500;
              if (filePath.endsWith('/src/types.ts')) return 450;
              if (filePath.endsWith('/package.json')) return 400;
              if (filePath.endsWith('/tsconfig.json')) return 350;
              if (filePath === 'package-lock.json') return 300;
              return 100;
            }

            function describeHotspot(filePath) {
              if (filePath.endsWith('/src/index.ts')) {
                return `${filePath} - entrypoint wiring, execution flow, and user-facing behavior`;
              }
              if (filePath.endsWith('/src/parser.ts')) {
                return `${filePath} - parsing edge cases and input normalization`;
              }
              if (filePath.endsWith('/src/validator.ts')) {
                return `${filePath} - comparison logic and validation categories`;
              }
              if (filePath.endsWith('/src/types.ts')) {
                return `${filePath} - shared data contract used across the package`;
              }
              if (filePath.endsWith('/package.json')) {
                return `${filePath} - package scripts, entrypoints, and dependency declarations`;
              }
              if (filePath.endsWith('/tsconfig.json')) {
                return `${filePath} - compiler settings and output expectations`;
              }
              if (filePath === 'package-lock.json') {
                return `${filePath} - install-time side effects and resolved dependency changes`;
              }
              return `${filePath} - changed behavior in this diff`;
            }

            const reviewHotspots = [...files]
              .sort((left, right) => {
                const priorityDelta =
                  hotspotPriority(right.path) - hotspotPriority(left.path);
                if (priorityDelta !== 0) {
                  return priorityDelta;
                }
                const insertionDelta = right.insertions - left.insertions;
                if (insertionDelta !== 0) {
                  return insertionDelta;
                }
                return left.path.localeCompare(right.path);
              })
              .slice(0, 5)
              .map((file) => describeHotspot(file.path));

            const result = {
              summary: summaryParts.join(' '),
              majorAreas,
              reviewHotspots,
            };

            const outputDir =
              process.env.{{BRAND_ENV_PREFIX}}_OUTPUT_DIR ?? path.dirname({{BRAND_OUTPUT_VARIABLE_NAME}});
            const outputPath = path.join(outputDir, 'change-summary.json');
            fs.writeFileSync(
              outputPath,
              `${JSON.stringify(result, null, 2)}\n`,
              'utf8',
            );
            fs.appendFileSync(
              {{BRAND_OUTPUT_VARIABLE_NAME}},
              `summary_file=${outputPath}\n`,
              'utf8',
            );
          env:
            CHANGED_FILES_FILE: ${{ needs.review_workspace_details.outputs.review_changed_files_file }}

    review_intent_context:
      name: Prepare Review Intent Context
      outputs:
        review_intent_context_file: ${{ steps.write_context.outputs.review_intent_context_file }}
        review_intent_prompt: ${{ steps.write_context.outputs.review_intent_prompt }}
      steps:
        # Keep this inline implementation in sync across code review variants.
        - id: write_context
          shell: node
          run: |
            import fs from 'node:fs';
            import path from 'node:path';

            const {{BRAND_OUTPUT_VARIABLE_NAME}} = process.env.{{BRAND_ENV_PREFIX}}_OUTPUT ?? '';
            if (!{{BRAND_OUTPUT_VARIABLE_NAME}}) {
              throw new Error('{{BRAND_ENV_PREFIX}}_OUTPUT is required');
            }

            const planContractFile = (process.env.PLAN_CONTRACT_FILE ?? '').trim();
            const qaIntentSummaryFile = (process.env.QA_INTENT_SUMMARY_FILE ?? '').trim();
            const hasPlanContract =
              planContractFile.length > 0 && fs.existsSync(planContractFile);
            const hasQaIntentSummary =
              qaIntentSummaryFile.length > 0 && fs.existsSync(qaIntentSummaryFile);
            const hasReviewIntentContext =
              planContractFile.length > 0 || qaIntentSummaryFile.length > 0;
            const lines = hasReviewIntentContext ? ['# Review Intent Context', ''] : [];

            if (hasPlanContract) {
              lines.push(
                `Plan contract file: \`${planContractFile}\`. Read it first and treat its requirements, acceptance checks, and cannot-ship checks as the authoritative approved implementation baseline for the reviewed diff.`,
              );
            } else if (planContractFile.length > 0) {
              lines.push(
                `A plan contract path was provided but the file was not found: \`${planContractFile}\`. Do not rely on a plan contract baseline.`,
              );
            } else if (hasQaIntentSummary) {
              lines.push('No plan contract file was provided.');
            }

            if (hasQaIntentSummary) {
              const qaRole = hasPlanContract
                ? 'Use it as secondary context; the plan contract wins if they conflict.'
                : 'Use it as the approved implementation baseline because no plan contract file is available.';
              lines.push(
                `QA intent summary file: \`${qaIntentSummaryFile}\`. ${qaRole}`,
              );
            } else if (qaIntentSummaryFile.length > 0) {
              lines.push(
                `A QA intent summary path was provided but the file was not found: \`${qaIntentSummaryFile}\`. Do not rely on a QA intent summary baseline.`,
              );
            }

            const outputDir =
              process.env.{{BRAND_ENV_PREFIX}}_OUTPUT_DIR ?? path.dirname({{BRAND_OUTPUT_VARIABLE_NAME}});
            const outputPath = path.join(outputDir, 'review-intent-context.md');
            fs.writeFileSync(outputPath, `${lines.join('\n')}\n`, 'utf8');
            const reviewIntentPrompt = hasReviewIntentContext
              ? `Read the review intent context at \`${outputPath}\`.`
              : '';
            fs.appendFileSync(
              {{BRAND_OUTPUT_VARIABLE_NAME}},
              `review_intent_context_file=${outputPath}\n`,
              'utf8',
            );
            fs.appendFileSync(
              {{BRAND_OUTPUT_VARIABLE_NAME}},
              `review_intent_prompt=${reviewIntentPrompt}\n`,
              'utf8',
            );
          env:
            PLAN_CONTRACT_FILE: ${{ inputs.plan_contract_file }}
            QA_INTENT_SUMMARY_FILE: ${{ inputs.qa_intent_summary_file }}

    repo_compliance_review_claude:
      name: Repo Compliance Review Claude
      needs:
        - review_workspace_details
        - instruction_scope
        - pr_context
        - linear_context
        - github_review_context
        - change_summary
      if: inputs.enable_repo_compliance_review_claude == true
      outputs:
        review_file: ${{ steps.select_review_output.outputs.review_file }}
      steps:
        - id: review
          uses: builtin/agent-prompt
          with:
            model: $cheap
            thinking_effort: high
            permission_preset: read_only
            setting_sources: '[]'
            structured_output_schema: ${{ env.REVIEW_CANDIDATES_SCHEMA }}
            prompt: |
              Review the review diff at `${{ needs.review_workspace_details.outputs.review_diff_file }}` for clear `CLAUDE.md` or `AGENTS.md` violations only.

              Read:
              - `${{ needs.review_workspace_details.outputs.workspace_summary_file }}`
              - `${{ needs.pr_context.outputs.pr_summary_file }}`
              - `${{ needs.linear_context.outputs.linear_summary_file }}`
              - `${{ needs.github_review_context.outputs.review_context_summary_file }}`
              - `${{ needs.change_summary.outputs.summary_file }}`
              - `${{ needs.instruction_scope.outputs.instruction_files_file }}`

              Then read every instruction file listed in `${{ needs.instruction_scope.outputs.instruction_files_file }}`.
              If both `CLAUDE.md` and `AGENTS.md` are in scope for a changed file, check compliance against both files.

              Scope rule:
              - When evaluating a changed file, only consider `CLAUDE.md` or `AGENTS.md` files that share that file path or one of its parent directories.

              You may consult other repository files for context, but only report violations in changed code or directly related changed behavior.

              Return zero or more candidate issues. Every issue must use source-file line numbers from the changed file, not line numbers from the diff artifact.
              The `reason` field should be `CLAUDE.md adherence` or `AGENTS.md adherence`.
              Include the exact violated rule text in `instructionRule` when applicable.

              Do not post comments yourself. Do not ask for user input.

              ${{ env.REVIEW_COVERAGE_RULES }}
              ${{ env.REVIEW_ARTIFACT_SCOPE_RULES }}
              ${{ env.DIFF_ONLY_SCOPE_RULES }}
              ${{ env.COMPLIANCE_SCOPE_RULES }}
              ${{ env.HIGH_SIGNAL_REVIEW_RULES }}
        - id: validate
          if: parseJson(steps.review.outputs.json_response).issues[0]
          uses: builtin/agent-prompt
          with:
            model: $cheap
            thinking_effort: high
            permission_preset: read_only
            setting_sources: '[]'
            structured_output_schema: ${{ env.VALIDATED_CANDIDATES_SCHEMA }}
            prompt: |
              Validate every candidate issue from `${{ steps.review.outputs.json_response_file }}` against the provided review artifacts.

              Re-read:
              - the review diff at `${{ needs.review_workspace_details.outputs.review_diff_file }}`
              - the relevant instruction files from `${{ needs.instruction_scope.outputs.instruction_files_file }}`

              For each candidate:
              - confirm the instruction file is actually in scope for the changed file
              - confirm the cited rule is explicit and actually violated in the changed code
              - reject anything speculative, pre-existing, or ambiguous
              - reject anything that is only a pre-existing issue outside the diff

              You may consult other repository files for context, but keep each validation decision tied to the diff and in-scope instructions.

              Keep the same issue fields and add:
              - `validated`: `true` only if the issue is high-confidence and in scope
              - `validationNotes`: a concise explanation of why it is valid or invalid

              Do not create new issues.

              ${{ env.FINDING_VALIDATION_RULES }}
              ${{ env.REVIEW_ARTIFACT_SCOPE_RULES }}
              ${{ env.DIFF_ONLY_SCOPE_RULES }}
              ${{ env.COMPLIANCE_SCOPE_RULES }}
              ${{ env.HIGH_SIGNAL_REVIEW_RULES }}
        - id: finalize
          if: parseJson(steps.review.outputs.json_response).issues[0]
          uses: builtin/agent-prompt
          with:
            model: $cheap
            thinking_effort: medium
            permission_preset: read_only
            setting_sources: '[]'
            structured_output_schema: ${{ env.REVIEW_OUTPUT_SCHEMA }}
            prompt: |
              Finalize the validated compliance issues from `${{ steps.validate.outputs.json_response_file }}`.

              Use only candidates where `validated` is `true` as final `findings`. Return a full structured review object with `reviewer`, `model`, `summary`, `positiveFindings`, `riskScore`, `riskLevel`, `verdict`, `findings`, and `threadActions`. Set `threadActions` to an empty array unless you are explicitly proposing a reply or resolution for an existing PR review thread.
              ${{ env.SCORING_RUBRIC }}
              ${{ env.RISK_LEVEL_DEFINITIONS }}
              Set `reviewer` to `Repo Compliance Review Claude` and `model` to `sonnet`.
              Do not create new issues and do not broaden beyond changed code or directly related changed behavior.
              You may consult related repository files for context, but keep every comment anchored to the diff.

              For each remaining issue:
              - set finding `category` to `instructions` and use `severity` `minor` unless the violation has a clear runtime impact
              - write `recommendation` as the inline-ready remediation comment text
              - `sourceEvidence` must cite the exact instruction path and quoted rule text
              - keep the comment concise and specific to the changed code
              - use source-file line numbers in `lineStart` and `lineEnd`
              - keep `lineStart`-`lineEnd` to the smallest contiguous range inside one diff hunk; do not span multiple hunks or whole functions

              Do not post comments yourself.

              ${{ env.REVIEW_ARTIFACT_SCOPE_RULES }}
              ${{ env.COMPLIANCE_SCOPE_RULES }}
              ${{ env.HIGH_SIGNAL_REVIEW_RULES }}
        - id: select_review_output
          name: Select Review Output
          if: always()
          shell: node
          run: |
            import fs from 'node:fs';
            import path from 'node:path';

            const {{BRAND_OUTPUT_VARIABLE_NAME}} = process.env.{{BRAND_ENV_PREFIX}}_OUTPUT ?? '';
            if (!{{BRAND_OUTPUT_VARIABLE_NAME}}) {
              throw new Error('{{BRAND_ENV_PREFIX}}_OUTPUT is required');
            }

            const candidatesPath = (process.env.REVIEW_CANDIDATES_FILE ?? '').trim();
            const finalReviewPath = (process.env.FINAL_REVIEW_FILE ?? '').trim();
            const reviewer = (process.env.REVIEWER_NAME ?? '').trim();
            const model = (process.env.REVIEWER_MODEL ?? '').trim();

            if (!candidatesPath || !fs.existsSync(candidatesPath)) {
              throw new Error(`Missing review candidates file: ${candidatesPath || '(empty)'}`);
            }

            const parsedCandidates = JSON.parse(fs.readFileSync(candidatesPath, 'utf8'));
            if (
              !parsedCandidates ||
              typeof parsedCandidates !== 'object' ||
              !Array.isArray(parsedCandidates.issues)
            ) {
              throw new Error('Review candidates output must contain an issues array');
            }

            const reportedCoverage =
              parsedCandidates.coverage &&
              typeof parsedCandidates.coverage === 'object' &&
              !Array.isArray(parsedCandidates.coverage)
                ? parsedCandidates.coverage
                : null;
            const coverage = {
              complete: reportedCoverage?.complete === true,
              unreviewed: Array.isArray(reportedCoverage?.unreviewed)
                ? reportedCoverage.unreviewed.filter(
                    (entry) => typeof entry === 'string' && entry.trim().length > 0,
                  )
                : [],
              notes:
                typeof reportedCoverage?.notes === 'string'
                  ? reportedCoverage.notes.trim()
                  : reportedCoverage
                    ? ''
                    : 'The reviewer did not report review coverage.',
            };

            const hasCandidates = parsedCandidates.issues.length > 0;
            if (hasCandidates && (!finalReviewPath || !fs.existsSync(finalReviewPath))) {
              throw new Error(`Missing finalized review file: ${finalReviewPath || '(empty)'}`);
            }
            if (!reviewer || !model) {
              throw new Error('REVIEWER_NAME and REVIEWER_MODEL are required');
            }

            const review = hasCandidates
              ? JSON.parse(fs.readFileSync(finalReviewPath, 'utf8'))
              : {
                  reviewer,
                  model,
                  summary: 'No candidate issues were reported by the initial review pass.',
                  positiveFindings: [],
                  riskScore: 10,
                  riskLevel: 'minimal',
                  verdict: 'pass',
                  findings: [],
                  threadActions: [],
                };
            if (!review || typeof review !== 'object' || Array.isArray(review)) {
              throw new Error('Finalized review output must be an object');
            }
            review.coverage = coverage;

            const serialized = JSON.stringify(review);
            const durableOutputDir =
              process.env.{{BRAND_ENV_PREFIX}}_OUTPUT_DIR ??
              path.dirname({{BRAND_OUTPUT_VARIABLE_NAME}});
            const outputPath = path.join(
              durableOutputDir,
              `${reviewer.toLowerCase().replace(/[^a-z0-9]+/g, '-')}-${hasCandidates ? 'final' : 'empty'}-review.json`,
            );
            fs.writeFileSync(outputPath, serialized + '\n', 'utf8');
            fs.appendFileSync(
              {{BRAND_OUTPUT_VARIABLE_NAME}},
              `review_file=${outputPath}\njson_response_file=${outputPath}\njson_response=${serialized}\n`,
              'utf8',
            );
          env:
            REVIEW_CANDIDATES_FILE: ${{ steps.review.outputs.json_response_file }}
            FINAL_REVIEW_FILE: ${{ steps.finalize.outputs.json_response_file }}
            REVIEWER_NAME: Repo Compliance Review Claude
            REVIEWER_MODEL: $cheap

