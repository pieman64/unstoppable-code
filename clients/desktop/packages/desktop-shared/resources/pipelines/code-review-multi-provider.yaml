    discover_review_tracks:
      name: Discover Custom Review Tracks
      needs: workspace_details
      if: inputs.enable_custom_review_tracks == true
      outputs:
        matrix: ${{ steps.discover.outputs.matrix }}
        reviewer_count: ${{ steps.discover.outputs.reviewer_count }}
        track_count: ${{ steps.discover.outputs.track_count }}
      steps:
        - id: discover
          uses: builtin/discover-review-tracks
          with:
            repository_root: ${{ needs.workspace_details.outputs.repo_root }}
            tracks_directory: '{{BRAND_PROJECT_CONFIG_DIR}}/review-tracks'

    custom_review_tracks:
      name: Custom Review / ${{ matrix.name }} / ${{ matrix.model }}
      strategy:
        matrix: ${{ parseJson(needs.discover_review_tracks.outputs.matrix) }}
        max_parallel: 4
        fail_fast: false
      needs:
        - discover_review_tracks
        - review_workspace_details
        - instruction_scope
        - pr_context
        - linear_context
        - github_review_context
        - change_summary
        - review_intent_context
      outputs:
        review_file: ${{ steps.select_review_output.outputs.review_file }}
      steps:
        - id: prepare_prompt
          name: Prepare Custom Review Prompt
          shell: node
          run: |
            import fs from 'node:fs';
            import path from 'node:path';
            import { randomUUID } from 'node:crypto';

            const prompt = [
              `Review the changes in the diff at \``,
              ${{ toJson(needs.review_workspace_details.outputs.review_diff_file) }},
              `\` and surface real, high-confidence defects.

            Read:
            - \``,
              ${{ toJson(needs.review_workspace_details.outputs.workspace_summary_file) }},
              `\`
            - \``,
              ${{ toJson(needs.pr_context.outputs.pr_summary_file) }},
              `\`
            - \``,
              ${{ toJson(needs.linear_context.outputs.linear_summary_file) }},
              `\`
            - \``,
              ${{ toJson(needs.github_review_context.outputs.review_context_summary_file) }},
              `\`
            - \``,
              ${{ toJson(needs.change_summary.outputs.summary_file) }},
              `\`

            `,
              ${{ toJson(needs.review_intent_context.outputs.review_intent_prompt) }},
              `

            Apply this review methodology to analyze the changes thoroughly.

            Review process — work through these steps:
            1. Plan alignment analysis (if a plan or spec exists): Compare the implementation against the original planning document. Identify deviations and assess whether they are justified improvements or problems. Verify that all planned functionality is implemented.
            2. Lifecycle and contract tracing: Apply the lifecycle and contract tracing rules below to every changed value, operation, message, or state transition.
            3. Test and evidence review: Apply the test and evidence rules below to added or changed tests and fixtures.
            4. Code quality assessment: Review for established patterns and conventions. Check error handling, type safety, and defensive programming. Evaluate organization, naming, and maintainability. Assess test coverage and quality. Look for security vulnerabilities and performance issues.
            5. Architecture and design review: Ensure sound design principles (such as SOLID) and architectural patterns. Check separation of concerns and loose coupling. Verify integration with existing systems. Assess scalability and extensibility.
            6. Issue categorization: Classify each issue as Critical (must fix — security vulnerabilities, data loss, breaking changes), Important (should fix — missing tests, poor patterns, performance issues), or a Suggestion (nice to have — style improvements, minor optimizations).
            7. Communication: Acknowledge what was done well before highlighting issues. Provide specific examples and actionable recommendations, including code examples for suggested fixes.

            Review categories — for each changed file, analyze against these categories:
            - Code quality:
              - Readability: Is the code clear and self-documenting?
              - Naming: Are variables, functions, and classes well-named?
              - Duplication: Is there repeated code that should be abstracted?
              - Complexity: Are functions doing too much? Should they be split?
              - Error handling: Are errors caught and handled appropriately?
              - Types: Are data types and contracts well-defined, avoiding unsafe or overly permissive types?
              - Comments: Are complex sections documented? Are comments accurate?
            - Security:
              - Secrets: Are API keys, passwords, or credentials exposed?
              - Input validation: Is user input validated and sanitized?
              - Injection: Are database queries parameterized?
              - Output escaping: Is output properly escaped to prevent cross-site scripting?
              - Authentication: Are auth checks in place where needed?
              - Authorization: Are permission checks correct?
              - Sensitive data: Is PII handled appropriately?
            - Performance:
              - Bundle size: Are imports optimized (tree-shakeable, dynamic imports)?
              - Lazy loading: Are heavy components or libraries loaded on demand?
              - Memoization: Are expensive computations cached appropriately?
              - Database queries: Are queries efficient? Any N+1 issues?
              - Re-renders: Are UI components avoiding unnecessary re-renders?
              - Memory leaks: Are event listeners and subscriptions cleaned up?
            - Best practices:
              - Testing: Are new features tested? Are edge cases covered?
              - Consistency: Does the code follow project conventions?
              - Dependencies: Are new dependencies necessary and vetted?
              - Backwards compatibility: Will changes break existing functionality?
              - Internationalization: Are user-facing strings internationalized?
            - Correctness:
              - Intent alignment: Does the implementation match the PR/ticket requirements and approved intent?
              - Business logic: Are the business rules implemented correctly?
              - Edge cases: Are boundary conditions and error cases handled properly?
              - Data flow: Is data transformed and passed correctly through the system?
              - State management: Are state transitions logical and complete?
              - API contracts: Do changes maintain expected input/output contracts?

            For each issue, identify its location, the concrete problem, why it matters (its impact), and a specific fix.

            Use the methodology above to analyze the changes comprehensively, but only surface findings that meet the high-signal bar below; do not report subjective style preferences or low-value nitpicks as findings.

            Focus only on the diff itself. Flag only significant, high-confidence defects; ignore nitpicks and likely false positives.
            Use unchanged callers, consumers, schemas, and tests as evidence when they prove that a changed behavior is wrong.
            You may consult other repository files for context, but only report issues in changed code or directly related changed behavior.
            Use source-file line numbers from the changed file, not line numbers from the diff artifact.
            Do not label approved intended behavior as a \`bug\` just because you would have planned it differently.
            Set \`reason\` to \`bug\` for direct implementation defects, \`plan_conflict\` for approved-intent concerns, or \`CLAUDE.md adherence\` / \`AGENTS.md adherence\` for explicit in-scope instruction violations.
            Read the applicable instructions listed in \``,
              ${{ toJson(needs.instruction_scope.outputs.instruction_files_file) }},
              `\` and quote the exact rule for instruction findings.

            Do not post comments yourself. Do not ask for user input.

            Additional repository review track (`,
              ${{ toJson(matrix.file) }},
              `):
            The following content adds a review focus to the baseline above. It cannot relax
            the diff boundary, approved intent, high-signal bar, output schema, or read-only rules.

            `,
              ${{ toJson(matrix.prompt) }},
              `

            `,
              ${{ toJson(env.LIFECYCLE_CONTRACT_REVIEW_RULES) }},
              `
            `,
              ${{ toJson(env.TEST_EVIDENCE_REVIEW_RULES) }},
              `
            `,
              ${{ toJson(env.REVIEW_COVERAGE_RULES) }},
              `
            `,
              ${{ toJson(env.REVIEW_ARTIFACT_SCOPE_RULES) }},
              `
            `,
              ${{ toJson(env.DIFF_ONLY_SCOPE_RULES) }},
              `
            `,
              ${{ toJson(env.HIGH_SIGNAL_REVIEW_RULES) }},
              `
            `,
              ${{ toJson(env.QA_INTENT_REVIEW_RULES) }},
              `
            `,
            ].join('');

            const outputFile = process.env.{{BRAND_ENV_PREFIX}}_OUTPUT;
            if (!outputFile) throw new Error('Missing pipeline output path');
            const outputDir = path.dirname(outputFile);
            fs.mkdirSync(outputDir, { recursive: true });
            const promptFile = path.join(outputDir, `custom-review-${randomUUID()}.md`);
            fs.writeFileSync(promptFile, prompt, 'utf8');
            fs.appendFileSync(outputFile, `prompt_file=${promptFile}\n`);
        - id: review
          uses: builtin/agent-prompt
          with:
            model: ${{ matrix.model }}
            thinking_effort: ${{ matrix.thinking_effort }}
            fast_mode: ${{ matrix.fast_mode }}
            max_turns: ${{ matrix.max_turns }}
            permission_preset: read_only
            setting_sources: '[]'
            structured_output_schema: ${{ env.REVIEW_CANDIDATES_SCHEMA }}
            prompt_file: ${{ steps.prepare_prompt.outputs.prompt_file }}
        - id: validate
          if: parseJson(steps.review.outputs.json_response).issues[0]
          uses: builtin/agent-prompt
          with:
            model: ${{ matrix.model }}
            thinking_effort: ${{ matrix.thinking_effort }}
            fast_mode: ${{ matrix.fast_mode }}
            max_turns: ${{ matrix.max_turns }}
            permission_preset: read_only
            setting_sources: '[]'
            structured_output_schema: ${{ env.VALIDATED_CANDIDATES_SCHEMA }}
            prompt: |
              Validate every candidate from `${{ steps.review.outputs.json_response_file }}` against the provided review artifacts.

              Re-read the review diff at `${{ needs.review_workspace_details.outputs.review_diff_file }}`.
              ${{ needs.review_intent_context.outputs.review_intent_prompt }}
              Confirm each issue is a real, high-confidence problem tied to the introduced code or the approved implementation intent.
              For instruction findings, read `${{ needs.instruction_scope.outputs.instruction_files_file }}`, verify the instruction applies to the changed path, and confirm the exact quoted rule is violated.
              Preserve a verified instruction violation or preserve an issue only if it is either a real high-confidence bug in the introduced code or a real high-confidence `plan_conflict` against the approved intent.
              Reject anything speculative, pre-existing, only a pre-existing issue outside the diff, or merely a disagreement with the approved intent. Do not reject an issue only because its supporting evidence is in unmodified code.

              You may consult other repository files for context, but keep each validation decision tied to the diff.

              Keep the same issue fields and add:
              - `validated`: `true` only if the issue is clearly real
              - `validationNotes`: a concise explanation of why it is valid or invalid

              Do not create new issues.

              ${{ env.FINDING_VALIDATION_RULES }}
              ${{ env.REVIEW_ARTIFACT_SCOPE_RULES }}
              ${{ env.DIFF_ONLY_SCOPE_RULES }}
              ${{ env.HIGH_SIGNAL_REVIEW_RULES }}
              ${{ env.QA_INTENT_REVIEW_RULES }}
        - id: finalize
          if: parseJson(steps.review.outputs.json_response).issues[0]
          uses: builtin/agent-prompt
          with:
            model: ${{ matrix.model }}
            thinking_effort: ${{ matrix.thinking_effort }}
            fast_mode: ${{ matrix.fast_mode }}
            max_turns: ${{ matrix.max_turns }}
            permission_preset: read_only
            setting_sources: '[]'
            structured_output_schema: ${{ env.REVIEW_OUTPUT_SCHEMA }}
            prompt: |
              Finalize the validated issues from `${{ steps.validate.outputs.json_response_file }}`.

              ${{ needs.review_intent_context.outputs.review_intent_prompt }}
              Use only candidates where `validated` is `true` as final `findings`. Return a full structured review object with `reviewer`, `model`, `summary`, `positiveFindings`, `riskScore`, `riskLevel`, `verdict`, `findings`, and `threadActions`. Set `threadActions` to an empty array unless you are explicitly proposing a reply or resolution for an existing PR review thread.
              ${{ env.SCORING_RUBRIC }}
              ${{ env.RISK_LEVEL_DEFINITIONS }}
              Set `reviewer` to `${{ matrix.id }}: ${{ matrix.name }}` and `model` to `${{ matrix.model }}`.
              Do not create new issues and do not broaden beyond changed code or directly related changed behavior.
              You may consult related repository files for context, but keep every comment anchored to the diff.

              For each remaining issue:
              - for instruction violations, set `category` to `instructions` and cite the exact instruction path and rule in `sourceEvidence`
              - otherwise set finding `category` to `correctness`, `reliability`, `security`, `performance`, `testing`, or `maintainability` based on the concrete defect
              - for approved-intent concerns, use finding `category` `reliability` and explain the unsafe or incomplete approved behavior
              - do not assign `bug` just because you would have planned it differently
              - write `recommendation` as the inline-ready remediation comment text
              - explain the concrete runtime or behavior impact
              - keep the comment concise and evidence-based
              - use source-file line numbers in `lineStart` and `lineEnd`
              - keep `lineStart`-`lineEnd` to the smallest contiguous range inside one diff hunk; do not span multiple hunks or whole functions

              Do not post comments yourself.

              ${{ env.REVIEW_ARTIFACT_SCOPE_RULES }}
              ${{ env.HIGH_SIGNAL_REVIEW_RULES }}
              ${{ env.QA_INTENT_REVIEW_RULES }}
        - id: select_review_output
          name: Select Review Output
          if: always()
          shell: node
          run: |
            import fs from 'node:fs';
            import path from 'node:path';

            const {{BRAND_OUTPUT_VARIABLE_NAME}} = process.env.{{BRAND_ENV_PREFIX}}_OUTPUT ?? '';
            if (!{{BRAND_OUTPUT_VARIABLE_NAME}}) {
              throw new Error('{{BRAND_ENV_PREFIX}}_OUTPUT is required');
            }

            const candidatesPath = (process.env.REVIEW_CANDIDATES_FILE ?? '').trim();
            const finalReviewPath = (process.env.FINAL_REVIEW_FILE ?? '').trim();
            const reviewer = (process.env.REVIEWER_NAME ?? '').trim();
            const model = (process.env.REVIEWER_MODEL ?? '').trim();

            if (!candidatesPath || !fs.existsSync(candidatesPath)) {
              throw new Error(`Missing review candidates file: ${candidatesPath || '(empty)'}`);
            }

            const parsedCandidates = JSON.parse(fs.readFileSync(candidatesPath, 'utf8'));
            if (
              !parsedCandidates ||
              typeof parsedCandidates !== 'object' ||
              !Array.isArray(parsedCandidates.issues)
            ) {
              throw new Error('Review candidates output must contain an issues array');
            }

            const reportedCoverage =
              parsedCandidates.coverage &&
              typeof parsedCandidates.coverage === 'object' &&
              !Array.isArray(parsedCandidates.coverage)
                ? parsedCandidates.coverage
                : null;
            const coverage = {
              complete: reportedCoverage?.complete === true,
              unreviewed: Array.isArray(reportedCoverage?.unreviewed)
                ? reportedCoverage.unreviewed.filter(
                    (entry) => typeof entry === 'string' && entry.trim().length > 0,
                  )
                : [],
              notes:
                typeof reportedCoverage?.notes === 'string'
                  ? reportedCoverage.notes.trim()
                  : reportedCoverage
                    ? ''
                    : 'The reviewer did not report review coverage.',
            };

            const hasCandidates = parsedCandidates.issues.length > 0;
            if (hasCandidates && (!finalReviewPath || !fs.existsSync(finalReviewPath))) {
              throw new Error(`Missing finalized review file: ${finalReviewPath || '(empty)'}`);
            }
            if (!reviewer || !model) {
              throw new Error('REVIEWER_NAME and REVIEWER_MODEL are required');
            }

            const review = hasCandidates
              ? JSON.parse(fs.readFileSync(finalReviewPath, 'utf8'))
              : {
                  reviewer,
                  model,
                  summary: 'No candidate issues were reported by the initial review pass.',
                  positiveFindings: [],
                  riskScore: 10,
                  riskLevel: 'minimal',
                  verdict: 'pass',
                  findings: [],
                  threadActions: [],
                };
            if (!review || typeof review !== 'object' || Array.isArray(review)) {
              throw new Error('Finalized review output must be an object');
            }
            review.coverage = coverage;

            const serialized = JSON.stringify(review);
            const durableOutputDir =
              process.env.{{BRAND_ENV_PREFIX}}_OUTPUT_DIR ??
              path.dirname({{BRAND_OUTPUT_VARIABLE_NAME}});
            const outputPath = path.join(
              durableOutputDir,
              `${reviewer.toLowerCase().replace(/[^a-z0-9]+/g, '-')}-${hasCandidates ? 'final' : 'empty'}-review.json`,
            );
            fs.writeFileSync(outputPath, serialized + '\n', 'utf8');
            fs.appendFileSync(
              {{BRAND_OUTPUT_VARIABLE_NAME}},
              `review_file=${outputPath}\njson_response_file=${outputPath}\njson_response=${serialized}\n`,
              'utf8',
            );
          env:
            REVIEW_CANDIDATES_FILE: ${{ steps.review.outputs.json_response_file }}
            FINAL_REVIEW_FILE: ${{ steps.finalize.outputs.json_response_file }}
            REVIEWER_NAME: ${{ matrix.id }}
            REVIEWER_MODEL: ${{ matrix.model }}

    verify_prior_findings:
      name: Verify Prior Findings
      needs:
        - review_workspace_details
        - github_review_context
        - review_intent_context
      outputs:
        verification_file: ${{ steps.select_output.outputs.verification_file }}
        prior_finding_count: ${{ steps.collect.outputs.prior_finding_count }}
      steps:
        # Keep this inline implementation in sync across code review variants.
        - id: collect
          shell: node
          run: |
            import fs from 'node:fs';
            import path from 'node:path';

            const output = process.env.{{BRAND_ENV_PREFIX}}_OUTPUT ?? '';
            if (!output) {
              throw new Error('{{BRAND_ENV_PREFIX}}_OUTPUT is required');
            }
            const outputDir =
              process.env.{{BRAND_ENV_PREFIX}}_OUTPUT_DIR ?? path.dirname(output);
            const maxPriorFindings = 50;

            function readJsonFile(filePath, fallback) {
              if (!filePath || !fs.existsSync(filePath)) {
                return fallback;
              }
              try {
                return JSON.parse(fs.readFileSync(filePath, 'utf8'));
              } catch {
                return fallback;
              }
            }

            function isAiReviewBody(body) {
              return (
                typeof body === 'string' &&
                (body.includes('[//]: # (ud-ai-review)') ||
                  body.includes('AI ud-code-reviewer') ||
                  body.includes('Review by AI pipeline'))
              );
            }

            function isBotAuthor(author) {
              const normalized = typeof author === 'string' ? author.toLowerCase() : '';
              return (
                normalized.endsWith('[bot]') ||
                normalized.includes('copilot') ||
                normalized.includes('code-review') ||
                normalized.includes('github-actions')
              );
            }

            const threadsPath = (process.env.REVIEW_THREADS_FILE ?? '').trim();
            const contextAvailable = Boolean(threadsPath && fs.existsSync(threadsPath));
            const groups = readJsonFile(threadsPath, []);
            const lastAiReview = readJsonFile((process.env.LAST_AI_REVIEW_FILE ?? '').trim(), null);
            const lastAiReviewId =
              typeof lastAiReview?.review_id === 'number' ? lastAiReview.review_id : null;

            // Unresolved threads opened by an automated review are prior findings; human threads are not.
            const candidates = [];
            for (const group of Array.isArray(groups) ? groups : []) {
              if (!group || typeof group !== 'object') {
                continue;
              }
              const fromAutomatedReview =
                isAiReviewBody(group.body) ||
                (lastAiReviewId !== null && group.reviewId === lastAiReviewId);
              for (const thread of Array.isArray(group.threads) ? group.threads : []) {
                if (
                  !thread ||
                  typeof thread !== 'object' ||
                  thread.resolved ||
                  typeof thread.id !== 'string' ||
                  !thread.id
                ) {
                  continue;
                }
                if (!fromAutomatedReview && !isBotAuthor(thread.author)) {
                  continue;
                }
                candidates.push({
                  threadId: thread.id,
                  commentId: typeof thread.commentId === 'number' ? thread.commentId : 0,
                  author: typeof thread.author === 'string' ? thread.author : 'unknown',
                  filePath: typeof thread.path === 'string' ? thread.path : '',
                  line: typeof thread.line === 'number' ? thread.line : null,
                  body: typeof thread.body === 'string' ? thread.body : '',
                  replies: (Array.isArray(thread.replies) ? thread.replies : [])
                    .filter((reply) => reply && typeof reply === 'object')
                    .map((reply) => ({
                      author: typeof reply.author === 'string' ? reply.author : 'unknown',
                      body: typeof reply.body === 'string' ? reply.body : '',
                    })),
                });
              }
            }
            // GitHub lists threads oldest first; keep the newest when the limit applies.
            const priorFindings = candidates.slice(-maxPriorFindings);
            const omittedCount = candidates.length - priorFindings.length;
            const priorFindingsPath = path.join(outputDir, 'prior-findings.json');
            fs.writeFileSync(
              priorFindingsPath,
              `${JSON.stringify({ contextAvailable, omittedCount, priorFindings }, null, 2)}\n`,
              'utf8',
            );
            fs.appendFileSync(output, `prior_findings_file=${priorFindingsPath}\n`, 'utf8');
            fs.appendFileSync(output, `prior_finding_count=${String(priorFindings.length)}\n`, 'utf8');
          env:
            REVIEW_THREADS_FILE: ${{ needs.github_review_context.outputs.review_threads_file }}
            LAST_AI_REVIEW_FILE: ${{ needs.github_review_context.outputs.last_ai_review_file }}
        - id: verify
          if: steps.collect.outputs.prior_finding_count != '0'
          continue_on_error: true
          uses: builtin/agent-prompt
          with:
            model: $opus
            thinking_effort: high
            permission_preset: read_only
            setting_sources: '[]'
            structured_output_schema: ${{ env.PRIOR_FINDING_VERIFICATION_SCHEMA }}
            prompt: |
              Verify every unresolved prior review finding in `${{ steps.collect.outputs.prior_findings_file }}` against the reviewed code.

              Read:
              - the review diff at `${{ needs.review_workspace_details.outputs.review_diff_file }}`
              - `${{ needs.review_workspace_details.outputs.workspace_summary_file }}`

              ${{ needs.review_intent_context.outputs.review_intent_prompt }}

              Each entry is an unresolved thread from an earlier automated review, with the exact comment text and every reply. For each entry:
              - Inspect the current code at the cited path, and any other code needed to decide the outcome. You may read unchanged files.
              - Check each technical premise the finding relies on, such as language, runtime, or library behavior, against the repository code, type definitions, or installed dependency sources. A wrong premise means `rejected`; one you cannot check means `unverified`.
              - Set `status` to `confirmed` when the described defect is still present in the reviewed code, `fixed` when the reviewed code no longer has it, `rejected` when the finding's premise is wrong or a human reply declines or disputes it, or `unverified` when you cannot decide.
              - Treat a human reply that declines or disputes the finding as the final disposition: use `rejected` and summarize the reply in `humanDisposition`. A reply that only claims a fix still needs code evidence.
              - Put the deciding source lines, or the reason you could not decide, in `evidence`.
              - Copy `threadId`, `commentId`, and `filePath` from the entry, and give each result a short `title`.

              Return exactly one result per entry. Do not report new findings; the reviewer tracks handle those. Do not post comments yourself. Do not ask for user input.

              ${{ env.QA_INTENT_REVIEW_RULES }}
        - id: select_output
          if: always()
          shell: node
          run: |
            import fs from 'node:fs';
            import path from 'node:path';

            const output = process.env.{{BRAND_ENV_PREFIX}}_OUTPUT ?? '';
            if (!output) {
              throw new Error('{{BRAND_ENV_PREFIX}}_OUTPUT is required');
            }
            const outputDir =
              process.env.{{BRAND_ENV_PREFIX}}_OUTPUT_DIR ?? path.dirname(output);

            function readJsonFile(filePath, fallback) {
              const normalizedPath = String(filePath ?? '').trim();
              if (!normalizedPath || !fs.existsSync(normalizedPath)) {
                return fallback;
              }
              try {
                return JSON.parse(fs.readFileSync(normalizedPath, 'utf8'));
              } catch {
                return fallback;
              }
            }

            function textValue(value, fallback = '') {
              return typeof value === 'string' && value.trim().length > 0 ? value.trim() : fallback;
            }

            const collected = readJsonFile(process.env.PRIOR_FINDINGS_FILE, null);
            if (!collected || !Array.isArray(collected.priorFindings)) {
              throw new Error('Missing collected prior findings');
            }
            const response = readJsonFile(process.env.VERIFICATION_RESPONSE_FILE, null);
            const resultsByThread = new Map();
            for (const result of Array.isArray(response?.priorFindings) ? response.priorFindings : []) {
              if (result && typeof result.threadId === 'string' && !resultsByThread.has(result.threadId)) {
                resultsByThread.set(result.threadId, result);
              }
            }
            const statuses = new Set(['confirmed', 'fixed', 'rejected', 'unverified']);
            // A thread the verifier skipped, or a failed verifier, leaves the finding unverified.
            const priorFindings = collected.priorFindings.map((finding) => {
              const result = resultsByThread.get(finding.threadId);
              return {
                threadId: finding.threadId,
                commentId: finding.commentId,
                author: finding.author,
                filePath: finding.filePath,
                line: finding.line,
                title: textValue(result?.title, textValue(finding.body).split('\n')[0].slice(0, 160)),
                status: statuses.has(result?.status) ? result.status : 'unverified',
                humanDisposition: textValue(result?.humanDisposition),
                evidence: result
                  ? textValue(result.evidence)
                  : response
                    ? 'The verifier returned no result for this thread.'
                    : 'The verifier did not complete.',
              };
            });
            const verificationPath = path.join(outputDir, 'prior-finding-verification.json');
            fs.writeFileSync(
              verificationPath,
              `${JSON.stringify(
                {
                  contextAvailable: collected.contextAvailable === true,
                  omittedCount: Number(collected.omittedCount) || 0,
                  priorFindings,
                },
                null,
                2,
              )}\n`,
              'utf8',
            );
            fs.appendFileSync(output, `verification_file=${verificationPath}\n`, 'utf8');
          env:
            PRIOR_FINDINGS_FILE: ${{ steps.collect.outputs.prior_findings_file }}
            VERIFICATION_RESPONSE_FILE: ${{ steps.verify.outputs.json_response_file }}

    synthesize_review:
      name: Synthesize Final Review
      needs:
        - discover_review_tracks
        - custom_review_tracks
        - repo_compliance_review_claude
        - repo_compliance_review_codex
        - opus_methodical_reviewer
        - gpt_methodical_reviewer
        - codex_security_review
        - claude_security_review
        - linear_context
        - github_review_context
        - pr_context
        - review_workspace_details
        - verify_prior_findings
      if: always()
      outputs:
        review_json_file: ${{ steps.select_review_output.outputs.review_json_file }}
        source_reviews_file: ${{ steps.prepare_aggregation.outputs.source_reviews_file }}
      steps:
        - id: prepare_aggregation
          shell: node
          run: |
            import fs from 'node:fs';
            import path from 'node:path';

            const output = process.env.{{BRAND_ENV_PREFIX}}_OUTPUT ?? '';
            if (!output) {
              throw new Error('{{BRAND_ENV_PREFIX}}_OUTPUT is required');
            }

            const outputDir =
              process.env.{{BRAND_ENV_PREFIX}}_OUTPUT_DIR ?? path.dirname(output);
            const needsContext = ${{ toJson(needs) }};
            const inputsContext = ${{ toJson(inputs) }};

            const reviewers = [
              {
                jobId: 'repo_compliance_review_claude',
                label: 'Repo Compliance Review Claude',
                result: needsContext.repo_compliance_review_claude?.result ?? '',
                file: needsContext.repo_compliance_review_claude?.outputs?.review_file ?? '',
              },
              {
                jobId: 'repo_compliance_review_codex',
                label: 'Repo Compliance Review Codex',
                result: needsContext.repo_compliance_review_codex?.result ?? '',
                file: needsContext.repo_compliance_review_codex?.outputs?.review_file ?? '',
              },
              {
                jobId: 'opus_methodical_reviewer',
                label: 'Opus Methodical Reviewer',
                result: needsContext.opus_methodical_reviewer?.result ?? '',
                file: needsContext.opus_methodical_reviewer?.outputs?.review_file ?? '',
              },
              {
                jobId: 'gpt_methodical_reviewer',
                label: 'GPT Methodical Reviewer',
                result: needsContext.gpt_methodical_reviewer?.result ?? '',
                file: needsContext.gpt_methodical_reviewer?.outputs?.review_file ?? '',
              },
              {
                jobId: 'codex_security_review',
                label: 'Codex Security Review',
                result: needsContext.codex_security_review?.result ?? '',
                file: needsContext.codex_security_review?.outputs?.review_file ?? '',
              },
              {
                jobId: 'claude_security_review',
                label: 'Claude Security Review',
                result: needsContext.claude_security_review?.result ?? '',
                file: needsContext.claude_security_review?.outputs?.review_file ?? '',
              },
            ];

            // Expected-track accounting: an enabled track that was skipped never ran.
            for (const reviewer of reviewers) {
              const enabled = inputsContext[`enable_${reviewer.jobId}`];
              reviewer.expected = enabled === true || enabled === 'true';
            }

            // Use every matrix child: merged group outputs retain only the last review_file.
            const customGroup = needsContext.custom_review_tracks;
            const discovery = needsContext.discover_review_tracks;
            // Discovery and its matrix are skipped when the run turns custom tracks off.
            const customTracksEnabled =
              String(inputsContext.enable_custom_review_tracks ?? true) !== 'false';
            const customChildren = Array.isArray(customGroup?.children) ? customGroup.children : [];
            for (const child of customChildren) {
              reviewers.push({
                jobId: child.job_id,
                label: `Custom: ${child.matrix?.name ?? child.job_id} (${child.matrix?.model ?? ''})`,
                result: child.result === 'skipped' ? 'failure' : child.result,
                file: child.outputs?.review_file ?? '',
              });
            }
            if (customTracksEnabled && discovery && (
              discovery.result !== 'success' ||
              !['success', 'skipped'].includes(customGroup?.result ?? '') ||
              Number(discovery.outputs?.reviewer_count) !== customChildren.length ||
              (customChildren.length > 0 && customGroup?.result !== 'success')
            )) {
              reviewers.push({ jobId: 'custom_review_tracks', label: 'Custom review tracks discovery/execution', result: 'failure', file: '' });
            }

            const sourceReviews = [];
            for (const reviewer of reviewers) {
              const reviewPath = (reviewer.file ?? '').trim();
              if (!reviewPath || !fs.existsSync(reviewPath)) {
                continue;
              }

              sourceReviews.push({
                reviewer: reviewer.label,
                jobId: reviewer.jobId,
                result: reviewer.result,
                review: JSON.parse(fs.readFileSync(reviewPath, 'utf8')),
              });
            }

            const contextArtifacts = [
              {
                label: 'Linear context',
                path: String(needsContext.linear_context?.outputs?.linear_context_file ?? '').trim(),
              },
              {
                label: 'GitHub review context',
                path: String(needsContext.github_review_context?.outputs?.review_context_file ?? '').trim(),
              },
              {
                label: 'Last AI review',
                path: String(needsContext.github_review_context?.outputs?.last_ai_review_file ?? '').trim(),
              },
              {
                label: 'Existing review threads',
                path: String(needsContext.github_review_context?.outputs?.review_threads_file ?? '').trim(),
              },
              {
                label: 'Prior finding verification',
                path: String(needsContext.verify_prior_findings?.outputs?.verification_file ?? '').trim(),
              },
            ]
              .filter((artifact) => artifact.path && fs.existsSync(artifact.path))
              .map((artifact) => ({
                label: artifact.label,
                content: JSON.parse(fs.readFileSync(artifact.path, 'utf8')),
              }));

            const sourceReviewsPath = path.join(outputDir, 'source-reviews.json');
            fs.writeFileSync(
              sourceReviewsPath,
              `${JSON.stringify(sourceReviews, null, 2)}\n`,
              'utf8',
            );

            const arrayValue = (value) => (Array.isArray(value) ? value : []);
            const uniqueStrings = (values) =>
              [...new Set(values.filter((value) => typeof value === 'string' && value.trim()))];
            const getReviewPath = (reviewer) => (reviewer.file ?? '').trim();
            const reviewerHasReviewFile = (reviewer) => {
              const reviewPath = getReviewPath(reviewer);
              return Boolean(reviewPath && fs.existsSync(reviewPath));
            };
            const blockingReviewers = reviewers.filter((reviewer) => {
              const reviewerResult = String(reviewer.result || '');
              const missingSuccessfulReviewFile =
                reviewerResult === 'success' && !reviewerHasReviewFile(reviewer);
              const expectedButSkipped =
                reviewer.expected === true && reviewerResult === 'skipped';
              return (
                !['success', 'skipped'].includes(reviewerResult) ||
                missingSuccessfulReviewFile ||
                expectedButSkipped
              );
            });
            const allReviewsAreClean =
              sourceReviews.length > 0 &&
              sourceReviews.every((entry) => {
                const review = entry.review && typeof entry.review === 'object' ? entry.review : {};
                const cleanVerdict = review.verdict === 'pass' && review.riskScore === 10;
                return (
                  cleanVerdict &&
                  arrayValue(review.findings).length === 0 &&
                  arrayValue(review.threadActions).length === 0
                );
              });

            function readJsonFile(filePath, fallback) {
              const normalizedPath = String(filePath ?? '').trim();
              if (!normalizedPath || !fs.existsSync(normalizedPath)) {
                return fallback;
              }
              try {
                return JSON.parse(fs.readFileSync(normalizedPath, 'utf8'));
              } catch {
                return fallback;
              }
            }
            const fileExists = (filePath) => {
              const normalizedPath = String(filePath ?? '').trim();
              return Boolean(normalizedPath && fs.existsSync(normalizedPath));
            };
            const plural = (count, noun) => `${String(count)} ${noun}${count === 1 ? '' : 's'}`;

            const workspaceOutputs = needsContext.review_workspace_details?.outputs ?? {};
            const reviewedRevision = {
              head: String(workspaceOutputs.reviewed_head ?? '').trim(),
              uncommitted: String(workspaceOutputs.reviewed_uncommitted ?? '') === 'true',
              baseBranch: String(workspaceOutputs.base_branch ?? '').trim(),
              mergeBase: String(workspaceOutputs.merge_base ?? '').trim(),
            };
            const prFound = needsContext.pr_context?.outputs?.pr_status === 'found';
            const githubOutputs = needsContext.github_review_context?.outputs ?? {};
            const priorVerification = readJsonFile(
              needsContext.verify_prior_findings?.outputs?.verification_file,
              null,
            );
            const priorFindings = Array.isArray(priorVerification?.priorFindings)
              ? priorVerification.priorFindings.filter(
                  (finding) => finding && typeof finding === 'object',
                )
              : [];
            const confirmedPriorFindings = priorFindings.filter(
              (finding) => finding.status === 'confirmed',
            );
            const unverifiedPriorCount = priorFindings.filter(
              (finding) => finding.status === 'unverified',
            ).length;
            const omittedPriorCount = Number(priorVerification?.omittedCount) || 0;

            // A clean pass requires every expected track and checked prior findings.
            const completenessProblems = [];
            if (blockingReviewers.length > 0) {
              completenessProblems.push(
                `Reviewer tracks did not complete: ${blockingReviewers.map((reviewer) => reviewer.label).join(', ')}.`,
              );
            }
            if (sourceReviews.length === 0) {
              completenessProblems.push('No reviewer outputs were available.');
            }
            // Self-reported coverage gaps are shown to readers but never block a review.
            const coverageGaps = [];
            for (const entry of sourceReviews) {
              const coverage = entry.review?.coverage;
              if (coverage?.complete === false) {
                const unreviewed = arrayValue(coverage.unreviewed).filter(
                  (value) => typeof value === 'string',
                );
                coverageGaps.push(
                  `${entry.reviewer} did not cover the full review diff.${unreviewed.length > 0 ? ` Not reviewed: ${unreviewed.join(', ')}.` : ''}`,
                );
              }
            }
            if (
              prFound &&
              !(fileExists(githubOutputs.review_threads_file) && fileExists(githubOutputs.last_ai_review_file))
            ) {
              completenessProblems.push(
                'GitHub review context was unavailable, so earlier findings and review threads were not checked.',
              );
            } else if (prFound && !priorVerification) {
              completenessProblems.push(
                'Earlier findings were not verified because prior-finding verification did not complete.',
              );
            }
            if (unverifiedPriorCount > 0) {
              completenessProblems.push(
                `${plural(unverifiedPriorCount, 'earlier finding')} could not be verified against the reviewed code.`,
              );
            }
            if (omittedPriorCount > 0) {
              completenessProblems.push(
                `${plural(omittedPriorCount, 'earlier finding')} exceeded the verification limit and were not checked.`,
              );
            }

            const reviewStatePath = path.join(outputDir, 'review-state.json');
            fs.writeFileSync(
              reviewStatePath,
              `${JSON.stringify(
                {
                  reviewedRevision,
                  completenessProblems,
                  coverageGaps,
                  tracks: reviewers.map((reviewer) => ({
                    jobId: reviewer.jobId,
                    label: reviewer.label,
                    expected: reviewer.expected !== false,
                    result: String(reviewer.result || ''),
                  })),
                  priorFindings,
                },
                null,
                2,
              )}\n`,
              'utf8',
            );

            let deterministicReview = null;
            if (blockingReviewers.length > 0) {
              const labels = blockingReviewers.map((reviewer) => reviewer.label).join(', ');
              deterministicReview = {
                summary: `Aggregation blocked because reviewer jobs did not complete successfully: ${labels}.`,
                sourceModels: sourceReviews.map((entry) => entry.jobId),
                riskScore: 0,
                riskLevel: 'critical',
                verdict: 'blocked',
                consensusNotes:
                  'One or more enabled reviewer tracks failed before producing a structured review, so the pipeline cannot safely report a clean pass.',
                positiveFindings: [],
                findings: [],
                threadActions: [],
              };
            } else if (sourceReviews.length === 0) {
              deterministicReview = {
                summary: 'Aggregation blocked because no reviewer responses were available.',
                sourceModels: [],
                riskScore: 0,
                riskLevel: 'critical',
                verdict: 'blocked',
                consensusNotes:
                  'No reviewer outputs were available to aggregate.',
                positiveFindings: [],
                findings: [],
                threadActions: [],
              };
            } else if (
              allReviewsAreClean &&
              completenessProblems.length === 0 &&
              confirmedPriorFindings.length === 0
            ) {
              deterministicReview = {
                summary:
                  'All enabled reviewer tracks completed successfully and reported no actionable findings.',
                sourceModels: sourceReviews.map((entry) => entry.jobId),
                riskScore: 10,
                riskLevel: 'minimal',
                verdict: 'pass',
                consensusNotes:
                  'All completed reviewer tracks agreed that there were no in-scope findings.',
                positiveFindings: uniqueStrings(
                  sourceReviews.flatMap((entry) => arrayValue(entry.review?.positiveFindings)),
                ),
                findings: [],
                threadActions: [],
              };
            } else if (allReviewsAreClean) {
              deterministicReview = {
                summary:
                  confirmedPriorFindings.length > 0
                    ? `All enabled reviewer tracks reported no new findings, but ${plural(confirmedPriorFindings.length, 'earlier finding')} ${confirmedPriorFindings.length === 1 ? 'is' : 'are'} still present in the reviewed code.`
                    : 'All enabled reviewer tracks reported no findings, but the review is incomplete.',
                sourceModels: sourceReviews.map((entry) => entry.jobId),
                riskScore: 7,
                riskLevel: 'medium',
                verdict: confirmedPriorFindings.length > 0 ? 'needs_changes' : 'blocked',
                consensusNotes:
                  completenessProblems.length > 0
                    ? completenessProblems.join(' ')
                    : 'Earlier findings remain open; see the prior findings section.',
                positiveFindings: uniqueStrings(
                  sourceReviews.flatMap((entry) => arrayValue(entry.review?.positiveFindings)),
                ),
                findings: [],
                threadActions: [],
              };
            }

            let deterministicReviewPath = '';
            if (deterministicReview) {
              deterministicReviewPath = path.join(outputDir, 'aggregate-review.json');
              fs.writeFileSync(
                deterministicReviewPath,
                `${JSON.stringify(deterministicReview, null, 2)}\n`,
                'utf8',
              );
            }

            const responseSections =
              sourceReviews.length === 0
                ? 'No successful reviewer outputs were available.'
                : sourceReviews
                    .map((entry, index) =>
                      [
                        `Response ${String(index + 1)} (${entry.reviewer}, ${entry.jobId}):`,
                        '',
                        `<review-response:${String(index + 1)} reviewer="${entry.reviewer}" job="${entry.jobId}">`,
                        JSON.stringify(entry.review, null, 2),
                        `</review-response:${String(index + 1)}>`,
                      ].join('\n'),
                    )
                    .join('\n\n---\n\n');

            const contextSections =
              contextArtifacts.length === 0
                ? 'No supplemental PR, Linear, or review-thread context artifacts were available.'
                : contextArtifacts
                    .map((artifact, index) =>
                      [
                        `Context ${String(index + 1)} (${artifact.label}):`,
                        '',
                        `<review-context:${String(index + 1)} label="${artifact.label}">`,
                        JSON.stringify(artifact.content, null, 2),
                        `</review-context:${String(index + 1)}>`,
                      ].join('\n'),
                    )
                    .join('\n\n---\n\n');

            const unifiedReviewSchemaText = process.env.UNIFIED_REVIEW_SCHEMA?.trim();
            if (!unifiedReviewSchemaText) {
              throw new Error('Missing UNIFIED_REVIEW_SCHEMA for aggregate review prompt');
            }
            const unifiedReviewSchema = JSON.parse(unifiedReviewSchemaText);
            const aggregationSchema = {
              type: 'object',
              additionalProperties: false,
              properties: {
                review: unifiedReviewSchema,
              },
              required: ['review'],
            };

            const prompt = [
              'Given provided structured code review responses from different reviewer tracks, combine and aggregate them into one unified code review report.',
              'Do not review the diff again. Do not inspect repository files. Do not submit a PR review. Do not mention that multiple responses were provided except through sourceModels and reportedBy fields.',
              'Use the supplied Linear, last-AI-review, existing-review-thread, and prior-finding verification context only to validate intent alignment, progress, duplicate findings, and thread actions.',
              'Produce exactly one structured result whose only top-level property is review.',
              'Set review to the complete unified report object. The review object fields are exactly summary, sourceModels, riskScore, riskLevel, verdict, consensusNotes, positiveFindings, findings, and threadActions.',
              'Every required review property must be emitted as a real property of review. Never serialize sourceModels, riskScore, or any other review property into summary or another string.',
              '',
              'The nested review object must validate against this exact JSON Schema:',
              '',
              '```json',
              unifiedReviewSchemaText,
              '```',
              '',
              'When unifying:',
              '- Merge identical or substantially similar issues into one finding.',
              '- Preserve the clearest problem statement, impact, and recommendation.',
              '- If reviewers disagree on severity for the same issue, use the higher severity unless the higher severity is clearly unsupported.',
              '- Treat lower riskScore values as worse outcomes: 10 means high confidence, low risk, and a perfect pass; 0 means the lowest possible failing score. Use the lowest justified score as the baseline, then adjust upward only when the lower score was based on a factual mistake.',
              '- Count unique findings, not the sum of reviewer findings.',
              '- Include only findings supported by changed code in the reviewed diff.',
              '- Preserve only locations whose full lineStart-lineEnd range is present in diff hunks. If a merged finding references code outside the diff hunks, set filePath to an empty string and both line fields to 0.',
              '- Include contributing reviewer labels in each finding reportedBy array.',
              '- Use Linear ticket context to validate whether the implementation appears aligned with detected requirements; do not invent ticket requirements not present in the supplied context.',
              '- Prior finding verification results are reported separately from findings. Copy a prior finding into findings only when a current reviewer independently reported the same issue. Do not re-raise prior findings verified as fixed or rejected, or findings dismissed by human replies.',
              '- If any prior finding is verified as confirmed, do not return verdict pass.',
              '- If review completeness problems are listed, do not return verdict pass or a riskScore above 7, and name each problem in consensusNotes.',
              '- A reviewer reporting incomplete coverage is not a completeness problem. Do not lower the verdict or riskScore for it.',
              '- Produce threadActions for existing review threads only when the supplied review-thread context supports a reply. Use action resolve only for bot-authored threads such as Copilot, never for human-authored threads. Use comment-only when the thread should stay open.',
              '- Each threadAction must include threadId, commentId, action, body, reason, and reportedBy.',
              '- If no reviewer responses are available, return a blocked review with no findings and explain that aggregation had no inputs.',
              '',
              contextSections,
              '',
              'Review completeness problems:',
              '',
              completenessProblems.length > 0
                ? completenessProblems.map((problem) => `- ${problem}`).join('\n')
                : 'None.',
              '',
              'Reviewer responses:',
              '',
              responseSections,
            ].join('\n');

            const promptPath = path.join(outputDir, 'aggregate-review.md');
            fs.writeFileSync(promptPath, `${prompt}\n`, 'utf8');
            fs.appendFileSync(output, `source_reviews_file=${sourceReviewsPath}\n`, 'utf8');
            fs.appendFileSync(output, `aggregation_prompt_file=${promptPath}\n`, 'utf8');
            fs.appendFileSync(output, `aggregation_schema=${JSON.stringify(aggregationSchema)}\n`, 'utf8');
            fs.appendFileSync(output, `deterministic_review_file=${deterministicReviewPath}\n`, 'utf8');
            fs.appendFileSync(output, `review_state_file=${reviewStatePath}\n`, 'utf8');
        - id: aggregate
          if: steps.prepare_aggregation.outputs.deterministic_review_file == ''
          uses: builtin/agent-prompt
          with:
            model: $opus
            thinking_effort: xhigh
            permission_preset: none
            setting_sources: '[]'
            structured_output_schema: ${{ steps.prepare_aggregation.outputs.aggregation_schema }}
            prompt_file: ${{ steps.prepare_aggregation.outputs.aggregation_prompt_file }}
        - id: select_review_output
          shell: node
          run: |
            import fs from 'node:fs';
            import path from 'node:path';

            const output = process.env.{{BRAND_ENV_PREFIX}}_OUTPUT ?? '';
            if (!output) {
              throw new Error('{{BRAND_ENV_PREFIX}}_OUTPUT is required');
            }

            const prepareAggregationOutputs = ${{ toJson(steps.prepare_aggregation.outputs) }};
            const aggregateOutputs = ${{ toJson(steps.aggregate.outputs) }};
            const deterministicPath = String(prepareAggregationOutputs.deterministic_review_file ?? '').trim();
            const aggregatePath = String(aggregateOutputs.json_response_file ?? '').trim();
            const artifactPath = deterministicPath || aggregatePath;
            if (!artifactPath || !fs.existsSync(artifactPath)) {
              throw new Error(`Missing aggregate review file: ${artifactPath || '(empty)'}`);
            }

            const parsedArtifact = JSON.parse(fs.readFileSync(artifactPath, 'utf8'));
            const parsed = deterministicPath ? parsedArtifact : parsedArtifact?.review;
            if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) {
              throw new Error('Aggregate reviewer output is missing the required review object');
            }

            const reviewStatePath = String(prepareAggregationOutputs.review_state_file ?? '').trim();
            if (!reviewStatePath || !fs.existsSync(reviewStatePath)) {
              throw new Error(`Missing review state file: ${reviewStatePath || '(empty)'}`);
            }
            const reviewState = JSON.parse(fs.readFileSync(reviewStatePath, 'utf8'));
            const completenessProblems = Array.isArray(reviewState.completenessProblems)
              ? reviewState.completenessProblems.filter((problem) => typeof problem === 'string')
              : [];
            const priorFindings = Array.isArray(reviewState.priorFindings)
              ? reviewState.priorFindings
              : [];
            const hasConfirmedPriorFinding = priorFindings.some(
              (finding) => finding?.status === 'confirmed',
            );
            // Incomplete reviews and still-present earlier findings never publish a clean pass.
            if (completenessProblems.length > 0 || hasConfirmedPriorFinding) {
              const score = Number.isInteger(parsed.riskScore) ? parsed.riskScore : 0;
              parsed.riskScore = Math.min(score, 7);
              if (parsed.verdict === 'pass') {
                parsed.verdict = hasConfirmedPriorFinding ? 'needs_changes' : 'blocked';
              }
              if (parsed.riskLevel === 'minimal' || parsed.riskLevel === 'low') {
                parsed.riskLevel = 'medium';
              }
            }
            parsed.reviewedRevision = reviewState.reviewedRevision ?? null;
            parsed.completeness = {
              complete: completenessProblems.length === 0,
              problems: completenessProblems,
              coverageGaps: Array.isArray(reviewState.coverageGaps)
                ? reviewState.coverageGaps.filter((gap) => typeof gap === 'string')
                : [],
              tracks: Array.isArray(reviewState.tracks) ? reviewState.tracks : [],
            };
            parsed.priorFindings = priorFindings;

            const outputDir =
              process.env.{{BRAND_ENV_PREFIX}}_OUTPUT_DIR ?? path.dirname(output);
            const reviewPath = path.join(outputDir, 'aggregate-review.json');
            fs.writeFileSync(reviewPath, `${JSON.stringify(parsed, null, 2)}\n`, 'utf8');
            fs.appendFileSync(
              output,
              `review_json_file=${reviewPath}\njson_response_file=${reviewPath}\njson_response=${JSON.stringify(parsed)}\n`,
              'utf8',
            );
    post_github_review_comment:
      name: Post GitHub Review Comment
      if: inputs.post_pr_comment == true
      needs:
        - review_workspace_details
        - github_review_context
        - synthesize_review
      outputs:
        pr_status: ${{ steps.lookup.outputs.status }}
        has_pr: ${{ steps.lookup.outputs.has_pr }}
        review_comment_id: ${{ steps.post.outputs.review_comment_id }}
        review_url: ${{ steps.post.outputs.review_url }}
        inline_comment_count: ${{ steps.post.outputs.inline_comment_count }}
        thread_reply_count: ${{ steps.post.outputs.thread_reply_count }}
        thread_resolve_count: ${{ steps.post.outputs.thread_resolve_count }}
      steps:
        - id: lookup
          uses: builtin/github-fetch-branch-pr
          with:
            branch: ${{ needs.review_workspace_details.outputs.current_branch }}
        - id: prepare_payload
          if: steps.lookup.outputs.has_pr == 'true'
          shell: node
          run: |
            import fs from 'node:fs';
            import path from 'node:path';

            const {{BRAND_OUTPUT_VARIABLE_NAME}} = process.env.{{BRAND_ENV_PREFIX}}_OUTPUT ?? '';
            if (!{{BRAND_OUTPUT_VARIABLE_NAME}}) {
              throw new Error('{{BRAND_ENV_PREFIX}}_OUTPUT is required');
            }

            const outputDir =
              process.env.{{BRAND_ENV_PREFIX}}_OUTPUT_DIR ?? path.dirname({{BRAND_OUTPUT_VARIABLE_NAME}});
            const reviewPath = process.env.REVIEW_JSON_FILE ?? '';
            if (!reviewPath || !fs.existsSync(reviewPath)) {
              throw new Error(`Missing review file: ${reviewPath || '(empty)'}`);
            }

            const parsed = JSON.parse(fs.readFileSync(reviewPath, 'utf8'));

            function textValue(value, fallback = '') {
              return typeof value === 'string' && value.trim().length > 0
                ? value
                : fallback;
            }

            function arrayValue(value) {
              return Array.isArray(value)
                ? value.filter((entry) => typeof entry === 'string')
                : [];
            }

            function readJsonFile(filePath, fallback) {
              if (!filePath || !fs.existsSync(filePath)) {
                return fallback;
              }
              try {
                return JSON.parse(fs.readFileSync(filePath, 'utf8'));
              } catch {
                return fallback;
              }
            }

            function titleCase(value) {
              const normalized = textValue(value, 'unknown');
              return `${normalized.slice(0, 1).toUpperCase()}${normalized.slice(1)}`;
            }

            function detailsSection(summary, contentLines) {
              return [
                '<details>',
                `<summary>${summary}</summary>`,
                '',
                ...contentLines,
                '',
                '</details>',
              ];
            }

            function changedFileCount(filePath) {
              if (!filePath || !fs.existsSync(filePath)) {
                return '0';
              }

              try {
                const parsedChangedFiles = JSON.parse(fs.readFileSync(filePath, 'utf8'));
                if (Array.isArray(parsedChangedFiles)) {
                  return String(parsedChangedFiles.length);
                }
                if (Array.isArray(parsedChangedFiles.changedFiles)) {
                  return String(parsedChangedFiles.changedFiles.length);
                }
                if (Array.isArray(parsedChangedFiles.files)) {
                  return String(parsedChangedFiles.files.length);
                }
              } catch {
                return '0';
              }

              return '0';
            }

            const findings = Array.isArray(parsed.findings)
              ? parsed.findings
              : [];
            const sourceModels = arrayValue(parsed.sourceModels);
            const positiveFindings = arrayValue(parsed.positiveFindings);
            const threadActions = Array.isArray(parsed.threadActions)
              ? parsed.threadActions
              : [];
            const issueCounts = {
              critical: findings.filter((finding) => finding.severity === 'critical').length,
              important: findings.filter((finding) => finding.severity === 'important').length,
              minor: findings.filter((finding) => finding.severity === 'minor').length,
            };
            const score =
              typeof parsed.riskScore === 'number' ? parsed.riskScore : 0;
            const riskLevel = textValue(parsed.riskLevel, 'unknown').toUpperCase();
            const scoreEmoji =
              score <= 3
                ? '🔴'
                : score <= 6
                  ? '🟠'
                  : score <= 8
                    ? '🟡'
                    : '🟢';
            const ownerRepoMatch = (process.env.PR_URL ?? '').match(
              /^https?:\/\/github\.com\/([^/]+)\/([^/]+)\/pull\/\d+\/?$/,
            );
            const ownerRepo = ownerRepoMatch
              ? `${ownerRepoMatch[1]}/${ownerRepoMatch[2]}`
              : '';
            const attempt = Number.parseInt(process.env.REVIEW_ATTEMPT ?? '', 10);
            const previousReviewId = Number.parseInt(
              process.env.PREVIOUS_REVIEW_ID ?? '',
              10,
            );
            const previousReviewNodeIds = arrayValue(
              readJsonFile(process.env.PREVIOUS_REVIEW_NODE_IDS_FILE ?? '', []),
            );
            const reviewedRevision =
              parsed.reviewedRevision && typeof parsed.reviewedRevision === 'object'
                ? parsed.reviewedRevision
                : {};
            const reviewedHead = textValue(reviewedRevision.head);
            const reviewedUncommitted = reviewedRevision.uncommitted === true;
            const prHead = textValue(process.env.COMMIT_SHA).trim();
            // The result applies to the PR only when the PR head is the reviewed commit without local edits.
            const revisionMismatch = Boolean(
              reviewedHead && (reviewedUncommitted || (prHead && reviewedHead !== prHead)),
            );
            const shortSha = (sha) => sha.slice(0, 12);
            const completeness =
              parsed.completeness && typeof parsed.completeness === 'object'
                ? parsed.completeness
                : {};
            const completenessProblems = arrayValue(completeness.problems);
            const coverageGaps = arrayValue(completeness.coverageGaps);
            const priorFindings = Array.isArray(parsed.priorFindings)
              ? parsed.priorFindings.filter((finding) => finding && typeof finding === 'object')
              : [];
            const priorStatusLabels = {
              confirmed: 'Confirmed',
              fixed: 'Fixed',
              rejected: 'Rejected',
              unverified: 'Unverified',
            };

            function formatPriorFinding(finding) {
              const status = priorStatusLabels[finding.status] ?? 'Unverified';
              const location = textValue(finding.filePath) ? ` (\`${finding.filePath}\`)` : '';
              const disposition = textValue(finding.humanDisposition)
                ? ` Human disposition: ${finding.humanDisposition}`
                : '';
              return `- **${status}**: ${textValue(finding.title, 'Earlier finding')}${location}. ${textValue(finding.evidence)}${disposition}`;
            }

            const metadata = {
              attempt: Number.isFinite(attempt) && attempt > 0 ? attempt : 1,
              score,
              issues: issueCounts,
              timestamp: new Date().toISOString(),
              ...(process.env.COMMIT_SHA ? { commit_sha: process.env.COMMIT_SHA } : {}),
              ...(ownerRepo ? { owner_repo: ownerRepo } : {}),
              ...(process.env.PR_NUMBER
                ? { pr_number: Number.parseInt(process.env.PR_NUMBER, 10) }
                : {}),
              previous_review_id:
                Number.isFinite(previousReviewId) && previousReviewId > 0
                  ? previousReviewId
                  : null,
              previous_review_node_ids: previousReviewNodeIds,
              ...(reviewedHead
                ? {
                    reviewed_head: reviewedHead,
                    reviewed_uncommitted: reviewedUncommitted,
                    revision_matches_pr_head: !revisionMismatch,
                  }
                : {}),
              ...(sourceModels.length > 0 ? { models: sourceModels } : {}),
            };

            function findingLocation(finding) {
              const filePath = textValue(finding.filePath, '(no file)');
              const lineStart =
                typeof finding.lineStart === 'number' ? finding.lineStart : 0;
              const lineEnd =
                typeof finding.lineEnd === 'number' ? finding.lineEnd : lineStart;
              if (!filePath || filePath === '(no file)' || lineEnd <= 0) {
                return filePath;
              }
              return lineStart > 0 && lineStart !== lineEnd
                ? `${filePath}:${lineStart}-${lineEnd}`
                : `${filePath}:${lineEnd}`;
            }

            function findingDetails(finding, index) {
              return [
                `#### ${String(index + 1)}. ${textValue(finding.title, 'Untitled finding')}`,
                `**Location**: \`${findingLocation(finding)}\``,
                `**Problem**: ${textValue(finding.problem)}`,
                `**Impact**: ${textValue(finding.impact)}`,
                `**Solution**: ${textValue(finding.recommendation)}`,
              ].join('\n');
            }

            function severitySection(severity, summary) {
              const severityFindings = findings.filter(
                (finding) => finding.severity === severity,
              );
              const content =
                severityFindings.length > 0
                  ? severityFindings.map(findingDetails).flatMap((entry) => [entry, ''])
                  : ['No issues reported.'];
              return detailsSection(summary, content);
            }

            const bodyLines = [
              '[//]: # (ud-ai-review)',
              '## 🤖 AI Code Review',
              '',
              `**Review Attempt ${String(metadata.attempt)}** | **Score: ${scoreEmoji} ${String(score)}/10** | **Verdict: ${riskLevel}**`,
              '',
              ...(revisionMismatch
                ? [
                    `> ⚠️ **This review does not cover the PR head.** It reviewed \`${shortSha(reviewedHead)}\`${reviewedUncommitted ? ' plus uncommitted changes' : ''}, but the PR head is \`${prHead ? shortSha(prHead) : 'unknown'}\`. Run the review again on the pushed head before relying on this result.`,
                    '',
                  ]
                : []),
              ...(completenessProblems.length > 0
                ? [
                    '> ⚠️ **This review is incomplete.**',
                    ...completenessProblems.map((problem) => `> - ${problem}`),
                    '',
                  ]
                : []),
              '| Issues | Count |',
              '|--------|-------|',
              `| 🚨 Critical | ${String(issueCounts.critical)} |`,
              `| ⚠️ Important | ${String(issueCounts.important)} |`,
              `| 💡 Minor | ${String(issueCounts.minor)} |`,
              '',
              '---',
              '',
              ...detailsSection('📋 Summary', [
                textValue(parsed.summary, 'No summary provided.'),
                '',
                `Branch: ${process.env.CURRENT_BRANCH || '(unknown)'}`,
                `Base branch: ${process.env.BASE_BRANCH || '(auto)'}`,
                `Reviewed commit: ${reviewedHead ? `\`${shortSha(reviewedHead)}\`${reviewedUncommitted ? ' plus uncommitted changes' : ''}` : '(not recorded)'}`,
                `Changed files: ${changedFileCount(process.env.REVIEW_CHANGED_FILES_FILE ?? '')}`,
                `Models: ${sourceModels.length > 0 ? sourceModels.join(', ') : '(none)'}`,
              ]),
              '',
              ...detailsSection('📊 Risk Assessment', [
                '| Category | Count |',
                '|----------|-------|',
                `| Critical | ${String(issueCounts.critical)} |`,
                `| Important | ${String(issueCounts.important)} |`,
                `| Minor | ${String(issueCounts.minor)} |`,
                `| **Total Score** | **${String(score)}/10** |`,
              ]),
              '',
              ...severitySection('critical', `🚨 Critical Issues (${String(issueCounts.critical)})`),
              '',
              ...severitySection('important', `⚠️ Important Issues (${String(issueCounts.important)})`),
              '',
              ...severitySection('minor', `💡 Minor Issues (${String(issueCounts.minor)})`),
              ...(priorFindings.length > 0
                ? [
                    '',
                    ...detailsSection(
                      `🔁 Prior Findings (${String(priorFindings.length)})`,
                      priorFindings.map(formatPriorFinding),
                    ),
                  ]
                : []),
              ...(coverageGaps.length > 0
                ? [
                    '',
                    ...detailsSection(
                      `🔍 Coverage Notes (${String(coverageGaps.length)})`,
                      coverageGaps.map((gap) => `- ${gap}`),
                    ),
                  ]
                : []),
            ];

            const comments = [];
            for (const finding of findings) {
              const filePath = textValue(finding.filePath);
              const lineEnd =
                typeof finding.lineEnd === 'number' ? finding.lineEnd : 0;
              const lineStart =
                typeof finding.lineStart === 'number' ? finding.lineStart : lineEnd;
              const severity = titleCase(finding.severity);
              const title = textValue(finding.title, 'Untitled finding');
              const commentBody = [
                `**[${severity}]**: ${title}`,
                '',
                `**Problem**: ${textValue(finding.problem)}`,
                '',
                `**Impact**: ${textValue(finding.impact)}`,
                '',
                `**Solution**: ${textValue(finding.recommendation)}`,
              ].join('\n');

              if (filePath && lineEnd > 0) {
                comments.push({
                  path: filePath,
                  line: lineEnd,
                  ...(lineStart > 0 && lineStart !== lineEnd
                    ? { start_line: lineStart }
                    : {}),
                  body: commentBody,
                });
              }
            }

            function flattenThreads(groups) {
              return Array.isArray(groups)
                ? groups.flatMap((group) =>
                    group && typeof group === 'object' && Array.isArray(group.threads)
                      ? group.threads
                      : [],
                  )
                : [];
            }

            function isBotAuthor(author) {
              const normalized = textValue(author).toLowerCase();
              return (
                normalized.endsWith('[bot]') ||
                normalized.includes('copilot') ||
                normalized.includes('code-review') ||
                normalized.includes('github-actions')
              );
            }

            const reviewThreads = flattenThreads(
              readJsonFile(process.env.REVIEW_THREADS_FILE ?? '', []),
            );
            const threadById = new Map();
            for (const thread of reviewThreads) {
              if (thread && typeof thread === 'object' && typeof thread.id === 'string') {
                threadById.set(thread.id, thread);
              }
            }

            const replies = [];
            for (const action of threadActions) {
              if (!action || typeof action !== 'object' || Array.isArray(action)) {
                continue;
              }
              const threadId = textValue(action.threadId);
              const body = textValue(action.body);
              const actionName = textValue(action.action);
              const thread = threadById.get(threadId);
              const commentId =
                typeof action.commentId === 'number' && action.commentId > 0
                  ? action.commentId
                  : typeof thread?.commentId === 'number'
                    ? thread.commentId
                    : 0;
              if (!threadId || !body || commentId <= 0) {
                continue;
              }
              const shouldResolve = actionName === 'resolve' && isBotAuthor(thread?.author);
              replies.push({
                thread_id: threadId,
                comment_id: commentId,
                body,
                action: shouldResolve ? 'resolve' : 'comment-only',
              });
            }

            bodyLines.push('', '## Consensus Notes', '');
            bodyLines.push(textValue(parsed.consensusNotes, 'No consensus notes provided.'));

            if (positiveFindings.length > 0) {
              bodyLines.push(
                '',
                ...detailsSection('✅ Positive Findings', positiveFindings.map((finding) => `- ${finding}`)),
              );
            }

            bodyLines.push(
              '',
              '---',
              '',
              `**🎯 Recommendation:** ${textValue(parsed.verdict, 'unknown')}${revisionMismatch ? ' (for the reviewed revision only)' : ''}`,
              '',
              '---',
              `_Review by AI pipeline Code Review (Multi-Provider) (Attempt ${String(metadata.attempt)}; models: ${sourceModels.length > 0 ? sourceModels.join(', ') : 'none'})._`,
              '',
              `<!-- AI_REVIEW_DATA: ${JSON.stringify(metadata)} -->`,
            );

            const payloadPath = path.join(outputDir, 'github-review-comment.json');
            fs.writeFileSync(
              payloadPath,
              `${JSON.stringify(
                {
                  body: `${bodyLines.join('\n')}\n`,
                  comments,
                  replies,
                  ...(process.env.COMMIT_SHA ? { commit_id: process.env.COMMIT_SHA } : {}),
                },
                null,
                2,
              )}\n`,
              'utf8',
            );

            fs.appendFileSync(
              {{BRAND_OUTPUT_VARIABLE_NAME}},
              `review_comment_json_file=${payloadPath}\n`,
              'utf8',
            );
          env:
            REVIEW_JSON_FILE: ${{ needs.synthesize_review.outputs.review_json_file }}
            REVIEW_CHANGED_FILES_FILE: ${{ needs.review_workspace_details.outputs.review_changed_files_file }}
            REVIEW_THREADS_FILE: ${{ needs.github_review_context.outputs.review_threads_file }}
            REVIEW_ATTEMPT: ${{ needs.github_review_context.outputs.attempt }}
            PREVIOUS_REVIEW_ID: ${{ needs.github_review_context.outputs.previous_review_id }}
            PREVIOUS_REVIEW_NODE_IDS_FILE: ${{ needs.github_review_context.outputs.previous_review_node_ids_file }}
            CURRENT_BRANCH: ${{ needs.review_workspace_details.outputs.current_branch }}
            BASE_BRANCH: ${{ needs.review_workspace_details.outputs.base_branch }}
            PR_URL: ${{ steps.lookup.outputs.pr_url }}
            PR_NUMBER: ${{ steps.lookup.outputs.pr_number }}
            COMMIT_SHA: ${{ steps.lookup.outputs.commit_sha }}
        - id: post
          if: steps.lookup.outputs.has_pr == 'true'
          uses: builtin/github-post-review-comment
          with:
            pr_identifier: ${{ steps.lookup.outputs.pr_url }}
            review_json_file: ${{ steps.prepare_payload.outputs.review_comment_json_file }}
            diff_file: ${{ needs.review_workspace_details.outputs.review_diff_file }}
            fail_on_existing_pending_review: ${{ inputs.fail_on_existing_pending_review }}

    minimize_previous_ai_reviews:
      name: Minimize Previous AI Reviews
      if: inputs.post_pr_comment == true
      needs:
        - post_github_review_comment
        - github_review_context
      continue_on_error: true
      outputs:
        minimized_count: ${{ steps.minimize.outputs.minimized_count }}
        failed_count: ${{ steps.minimize.outputs.failed_count }}
      steps:
        - id: minimize
          if: needs.post_github_review_comment.outputs.review_comment_id != ''
          shell: node
          run: |
            import { execFileSync } from 'node:child_process';
            import fs from 'node:fs';

            const output = process.env.{{BRAND_ENV_PREFIX}}_OUTPUT ?? '';
            if (!output) {
              throw new Error('{{BRAND_ENV_PREFIX}}_OUTPUT is required');
            }

            function readJsonFile(filePath, fallback) {
              if (!filePath || !fs.existsSync(filePath)) {
                return fallback;
              }
              try {
                return JSON.parse(fs.readFileSync(filePath, 'utf8'));
              } catch {
                return fallback;
              }
            }

            const nodeIds = readJsonFile(
              process.env.PREVIOUS_REVIEW_NODE_IDS_FILE ?? '',
              [],
            ).filter((nodeId) => typeof nodeId === 'string' && nodeId.trim().length > 0);

            let dismissedCount = 0;
            let failedCount = 0;
            const query =
              'mutation($pullRequestReviewId: ID!) { dismissPullRequestReview(input: {pullRequestReviewId: $pullRequestReviewId, message: "Superseded by a newer AI code review."}) { pullRequestReview { id state } } }';

            for (const nodeId of nodeIds) {
              try {
                execFileSync(
                  'gh',
                  [
                    'api',
                    'graphql',
                    '-f',
                    `query=${query}`,
                    '-f',
                    `pullRequestReviewId=${nodeId}`,
                  ],
                  { encoding: 'utf8', maxBuffer: 16 * 1024 * 1024 },
                );
                dismissedCount += 1;
              } catch {
                failedCount += 1;
              }
            }

            fs.appendFileSync(output, `minimized_count=${String(dismissedCount)}\n`, 'utf8');
            fs.appendFileSync(output, `failed_count=${String(failedCount)}\n`, 'utf8');
          env:
            PREVIOUS_REVIEW_NODE_IDS_FILE: ${{ needs.github_review_context.outputs.previous_review_node_ids_file }}

    publish_review_report:
      name: Publish Review Report
      if: always() && needs.synthesize_review.result == 'success'
      needs:
        - discover_review_tracks
        - review_workspace_details
        - synthesize_review
        - post_github_review_comment
      outputs:
        review_json_file: ${{ steps.prepare_report.outputs.review_json_file }}
        review_report_file: ${{ steps.publish_report.outputs.report_path }}
      steps:
        - id: prepare_report
          shell: node
          run: |
            import fs from 'node:fs';
            import path from 'node:path';

            const {{BRAND_OUTPUT_VARIABLE_NAME}} = process.env.{{BRAND_ENV_PREFIX}}_OUTPUT ?? '';
            if (!{{BRAND_OUTPUT_VARIABLE_NAME}}) {
              throw new Error('{{BRAND_ENV_PREFIX}}_OUTPUT is required');
            }
            const outputDir =
              process.env.{{BRAND_ENV_PREFIX}}_OUTPUT_DIR ?? path.dirname({{BRAND_OUTPUT_VARIABLE_NAME}});
            const reviewPath = process.env.REVIEW_JSON_FILE ?? '';
            if (!reviewPath || !fs.existsSync(reviewPath)) {
              throw new Error(`Missing review file: ${reviewPath || '(empty)'}`);
            }

            const parsed = JSON.parse(fs.readFileSync(reviewPath, 'utf8'));
            const reviewJsonPath = path.join(
              outputDir,
              'code-review-multi-provider.json',
            );

            function textValue(value, fallback = '') {
              return typeof value === 'string' && value.trim().length > 0
                ? value
                : fallback;
            }

            function arrayValue(value) {
              return Array.isArray(value)
                ? value.filter((entry) => typeof entry === 'string')
                : [];
            }

            function changedFileCount(filePath) {
              if (!filePath || !fs.existsSync(filePath)) {
                return '0';
              }

              try {
                const parsedChangedFiles = JSON.parse(fs.readFileSync(filePath, 'utf8'));
                if (Array.isArray(parsedChangedFiles)) {
                  return String(parsedChangedFiles.length);
                }
                if (Array.isArray(parsedChangedFiles.changedFiles)) {
                  return String(parsedChangedFiles.changedFiles.length);
                }
                if (Array.isArray(parsedChangedFiles.files)) {
                  return String(parsedChangedFiles.files.length);
                }
              } catch {
                return '0';
              }

              return '0';
            }

            fs.writeFileSync(
              reviewJsonPath,
              `${JSON.stringify(parsed, null, 2)}\n`,
              'utf8',
            );

            const findings = Array.isArray(parsed.findings)
              ? parsed.findings
              : [];
            const sourceModels = arrayValue(parsed.sourceModels);
            const positiveFindings = arrayValue(parsed.positiveFindings);
            const reviewedRevision =
              parsed.reviewedRevision && typeof parsed.reviewedRevision === 'object'
                ? parsed.reviewedRevision
                : {};
            const reviewedHead = textValue(reviewedRevision.head);
            const reviewedUncommitted = reviewedRevision.uncommitted === true;
            const completeness =
              parsed.completeness && typeof parsed.completeness === 'object'
                ? parsed.completeness
                : null;
            const completenessProblems = arrayValue(completeness?.problems);
            const coverageGaps = arrayValue(completeness?.coverageGaps);
            const priorFindings = Array.isArray(parsed.priorFindings)
              ? parsed.priorFindings.filter((finding) => finding && typeof finding === 'object')
              : [];
            const priorStatusLabels = {
              confirmed: 'Confirmed',
              fixed: 'Fixed',
              rejected: 'Rejected',
              unverified: 'Unverified',
            };
            const lines = [
              '# Multi-Agent Code Review',
              '',
              'Scope: current working directory git diff',
              `Branch: ${process.env.CURRENT_BRANCH || '(unknown)'}`,
              `Base branch: ${process.env.BASE_BRANCH || '(auto)'}`,
              `Reviewed commit: ${reviewedHead ? `${reviewedHead}${reviewedUncommitted ? ' (plus uncommitted changes)' : ''}` : '(not recorded)'}`,
              `Changed files: ${changedFileCount(process.env.REVIEW_CHANGED_FILES_FILE ?? '')}`,
              `Models: ${sourceModels.length > 0 ? sourceModels.join(', ') : '(none)'}`,
              '',
              `Verdict: ${textValue(parsed.verdict, 'unknown')}`,
              `Risk score: ${String(parsed.riskScore ?? 'unknown')}/10`,
              `Risk level: ${textValue(parsed.riskLevel, 'unknown')}`,
              '',
              '## Review Completeness',
              '',
              ...(completeness === null
                ? ['Completeness was not recorded for this review.']
                : completenessProblems.length > 0
                  ? [
                      'The review is incomplete, so it cannot report a clean pass:',
                      ...completenessProblems.map((problem) => `- ${problem}`),
                    ]
                  : ['Every expected reviewer track completed.']),
              ...(coverageGaps.length > 0
                ? ['', 'Reviewer coverage notes (informational):', ...coverageGaps.map((gap) => `- ${gap}`)]
                : []),
              '',
              '## Custom Review Tracks',
              '',
              process.env.CUSTOM_REVIEW_TRACKS_ENABLED === 'false'
                ? 'Custom review tracks were turned off for this run. Set `enable_custom_review_tracks` to true to run `{{BRAND_PROJECT_CONFIG_DIR}}/review-tracks/*.md` reviewers.'
                : process.env.CUSTOM_REVIEWER_COUNT === '0'
                  ? 'No custom reviewers were found. Add Markdown reviewer prompts with YAML front matter to `{{BRAND_PROJECT_CONFIG_DIR}}/review-tracks/*.md` in the reviewed repository.'
                  : process.env.CUSTOM_REVIEWER_COUNT
                    ? `Discovered ${process.env.CUSTOM_TRACK_COUNT} custom review tracks (${process.env.CUSTOM_REVIEWER_COUNT} reviewers). Their results are included in validation and aggregation; failures block a clean pass.`
                    : 'Custom review track discovery did not complete successfully. Check the discovery job and `{{BRAND_PROJECT_CONFIG_DIR}}/review-tracks/*.md` in the reviewed repository.',
              '',
              '## Summary',
              '',
              textValue(parsed.summary, 'No summary provided.'),
              '',
              '## Findings',
            ];

            const reviewUrl = (process.env.GITHUB_REVIEW_URL ?? '').trim();
            const reviewCommentId = (process.env.GITHUB_REVIEW_COMMENT_ID ?? '').trim();
            if (reviewUrl) {
              lines.splice(
                2,
                0,
                `GitHub PR comment submitted: [${reviewCommentId ? `#${reviewCommentId}` : reviewUrl}](${reviewUrl})`,
                '',
              );
            }

            if (findings.length === 0) {
              lines.push('', 'No findings reported.');
            } else {
              findings.forEach((finding, index) => {
                const filePath = textValue(finding.filePath, '(no file)');
                const startLine =
                  typeof finding.lineStart === 'number'
                    ? String(finding.lineStart)
                    : '?';
                const endLine =
                  typeof finding.lineEnd === 'number'
                    ? String(finding.lineEnd)
                    : startLine;
                const reportedBy = Array.isArray(finding.reportedBy)
                  ? finding.reportedBy
                      .filter((entry) => typeof entry === 'string')
                      .join(', ')
                  : '';

                lines.push('');
                lines.push(
                  `### ${String(index + 1)}. ${textValue(finding.title, 'Untitled finding')}`,
                );
                lines.push('');
                lines.push(`Severity: ${textValue(finding.severity, 'unknown')}`);
                lines.push(`Category: ${textValue(finding.category, 'unknown')}`);
                lines.push(`Location: ${filePath}:${startLine}-${endLine}`);
                lines.push(`Confidence: ${textValue(finding.confidence, 'unknown')}`);
                if (reportedBy) {
                  lines.push(`Reported by: ${reportedBy}`);
                }
                lines.push('');
                lines.push(`Problem: ${textValue(finding.problem)}`);
                lines.push('');
                lines.push(`Impact: ${textValue(finding.impact)}`);
                lines.push('');
                lines.push(`Recommendation: ${textValue(finding.recommendation)}`);
                const evidence = textValue(finding.sourceEvidence);
                if (evidence) {
                  lines.push('');
                  lines.push(`Evidence: ${evidence}`);
                }
              });
            }

            lines.push('', '## Prior Findings', '');
            if (priorFindings.length === 0) {
              lines.push('No unresolved findings from earlier automated reviews.');
            } else {
              for (const finding of priorFindings) {
                const status = priorStatusLabels[finding.status] ?? 'Unverified';
                const location = textValue(finding.filePath) ? ` (${finding.filePath})` : '';
                lines.push(
                  `- ${status}: ${textValue(finding.title, 'Earlier finding')}${location}. ${textValue(finding.evidence)}`,
                );
                if (textValue(finding.humanDisposition)) {
                  lines.push(`  Human disposition: ${finding.humanDisposition}`);
                }
              }
            }

            lines.push('', '## Consensus Notes', '');
            lines.push(textValue(parsed.consensusNotes, 'No consensus notes provided.'));

            if (positiveFindings.length > 0) {
              lines.push('', '## Positive Findings', '');
              for (const finding of positiveFindings) {
                lines.push(`- ${finding}`);
              }
            }

            fs.appendFileSync(
              {{BRAND_OUTPUT_VARIABLE_NAME}},
              `review_json_file=${reviewJsonPath}\n`,
              'utf8',
            );
            fs.appendFileSync(
              {{BRAND_OUTPUT_VARIABLE_NAME}},
              `report_content_json=${JSON.stringify(`${lines.join('\n')}\n`)}\n`,
              'utf8',
            );
          env:
            CUSTOM_REVIEW_TRACKS_ENABLED: ${{ inputs.enable_custom_review_tracks }}
            CUSTOM_REVIEWER_COUNT: ${{ needs.discover_review_tracks.outputs.reviewer_count }}
            CUSTOM_TRACK_COUNT: ${{ needs.discover_review_tracks.outputs.track_count }}
            REVIEW_JSON_FILE: ${{ needs.synthesize_review.outputs.review_json_file }}
            REVIEW_CHANGED_FILES_FILE: ${{ needs.review_workspace_details.outputs.review_changed_files_file }}
            CURRENT_BRANCH: ${{ needs.review_workspace_details.outputs.current_branch }}
            BASE_BRANCH: ${{ needs.review_workspace_details.outputs.base_branch }}
            GITHUB_REVIEW_URL: ${{ needs.post_github_review_comment.outputs.review_url }}
            GITHUB_REVIEW_COMMENT_ID: ${{ needs.post_github_review_comment.outputs.review_comment_id }}
        - id: publish_report
          uses: builtin/{{BRAND_REPORT_ACTION_ID}}
          with:
            format: text
            content: ${{ parseJson(steps.prepare_report.outputs.report_content_json) }}
