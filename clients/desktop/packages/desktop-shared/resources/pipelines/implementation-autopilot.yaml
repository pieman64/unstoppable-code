pipeline:
  name: 'Implementation (Autopilot)'
  version: '1.0'
  description: 'After planning a task, refine, implement, test, and keep going while recording unresolved issues that may need attention.'
  icon: '▶'
  readonly: true
  scope: worktree
  on:
    plan_ready:
      inputs:
        push_and_create_prs:
          description: Commit, push, and open pull requests when the run completes, even if unresolved issues are recorded.
          type: boolean
          default: false
        complexity:
          description: >-
            Auto is recommended. Lower complexities result in fewer repeated
            phase iterations and lower token usage, but may result in lower
            quality outcomes if the complexity setting is lower than the actual
            task complexity.
          type: choice
          options:
            - auto
            - trivial
            - low
            - medium
            - high
            - xhigh
          default: auto
    task_ready:
      inputs:
        push_and_create_prs:
          description: Commit, push, and open pull requests when the run completes, even if unresolved issues are recorded.
          type: boolean
          default: false
        complexity:
          description: >-
            Auto is recommended. Lower complexities result in fewer repeated
            phase iterations and lower token usage, but may result in lower
            quality outcomes if the complexity setting is lower than the actual
            task complexity.
          type: choice
          options:
            - auto
            - trivial
            - low
            - medium
            - high
            - xhigh
          default: auto
  env:
    BASELINE_SCOPE_RULES: |
      Pipeline-start checkpoint boundary:
      - Treat `pre_existing_unchanged` paths as protected branch/worktree context, not as changes introduced by this pipeline run.
      - Do not remove, revert, or report protected pre-existing paths as out-of-scope solely because they appear in a merge-base diff.
      - Base scope judgments on the pipeline-owned changed files and baseline-aware classification, not on the merge-base diff alone.
      - If a protected pre-existing path is unrelated to the approved plan and unchanged by this pipeline, leave it alone and continue.
      - Treat `pipeline_modified_pre_existing`, `pipeline_deleted_pre_existing`, and `pipeline_reverted_pre_existing` as pipeline-caused protected-path changes unless the approved plan explicitly required that path change.
      - If protected pre-existing work conflicts with the approved plan, report a plan or scope conflict instead of deleting the protected work.
    QA_AGENT_REVIEW_SCHEMA: >-
      {"type":"object","additionalProperties":false,"properties":{"summary":{"type":"string"},"issues":{"type":"array","items":{"type":"object","additionalProperties":false,"properties":{"title":{"type":"string"},"description":{"type":"string"},"reason":{"type":"string"},"category":{"type":"string","enum":["project_compliance","bug","plan_conflict"]},"comment":{"type":"object","additionalProperties":false,"properties":{"filePath":{"type":"string"},"startLine":{"type":"integer"},"endLine":{"type":"integer"},"body":{"type":"string"}},"required":["filePath","startLine","endLine","body"]}},"required":["title","description","reason","category","comment"]}}},"required":["summary","issues"]}
    COMPLETION_AUDIT_SCHEMA: >-
      {"type":"object","additionalProperties":false,"properties":{"summary":{"type":"string"},"issues":{"type":"array","items":{"type":"object","additionalProperties":false,"properties":{"requirementId":{"type":"string"},"acceptanceCheck":{"type":"string"},"title":{"type":"string"},"description":{"type":"string"},"reason":{"type":"string"},"evidence":{"type":"string"},"suggestedFix":{"type":"string"}},"required":["requirementId","acceptanceCheck","title","description","reason","evidence","suggestedFix"]}}},"required":["summary","issues"]}

  jobs:
    prepare_plan:
      name: Prepare Plan
      outputs:
        plan_path: ${{ steps.resolve_plan_path.outputs.plan_path }}
      steps:
        - id: create_task_ready_plan
          name: Draft Task-Ready Plan
          if: "{{BRAND_EXPRESSION_ROOT}}.event_name == 'task_ready'"
          uses: builtin/agent-prompt
          with:
            model: $default-codex
            thinking_effort: high
            permission_preset: plan
            prompt_file: ${{ {{BRAND_EXPRESSION_ROOT}}.event.task_ready.task_path }}

        - id: publish_task_ready_plan
          name: Publish Task-Ready Plan
          if: "{{BRAND_EXPRESSION_ROOT}}.event_name == 'task_ready'"
          shell: node
          run: |
            import fs from 'node:fs';
            import path from 'node:path';

            const sourcePlan = (process.env.SOURCE_PLAN ?? '').trim();
            const targetPlan = (process.env.TARGET_PLAN ?? '').trim();
            const {{BRAND_OUTPUT_VARIABLE_NAME}} = process.env.{{BRAND_ENV_PREFIX}}_OUTPUT ?? '';

            if (!{{BRAND_OUTPUT_VARIABLE_NAME}}) {
              throw new Error('{{BRAND_ENV_PREFIX}}_OUTPUT is required');
            }
            if (!sourcePlan || !fs.existsSync(sourcePlan)) {
              throw new Error('Expected a proposed plan file but none was produced');
            }
            if (!targetPlan) {
              throw new Error('Task-ready plan path is required');
            }

            fs.mkdirSync(path.dirname(targetPlan), { recursive: true });
            fs.copyFileSync(sourcePlan, targetPlan);
            fs.appendFileSync({{BRAND_OUTPUT_VARIABLE_NAME}}, `plan_path=${targetPlan}\n`, 'utf8');
          env:
            SOURCE_PLAN: ${{ steps.create_task_ready_plan.outputs.proposed_plan_file }}
            TARGET_PLAN: ${{ {{BRAND_EXPRESSION_ROOT}}.event.task_ready.plan_path }}

        - id: resolve_plan_path
          name: Resolve Active Plan Path
          shell: node
          run: |
            import fs from 'node:fs';

            const {{BRAND_OUTPUT_VARIABLE_NAME}} = process.env.{{BRAND_ENV_PREFIX}}_OUTPUT ?? '';
            if (!{{BRAND_OUTPUT_VARIABLE_NAME}}) {
              throw new Error('{{BRAND_ENV_PREFIX}}_OUTPUT is required');
            }

            const eventName = (process.env.EVENT_NAME ?? '').trim();
            const planReadyPath = (process.env.PLAN_READY_PATH ?? '').trim();
            const taskReadyPath = (process.env.TASK_READY_PATH ?? '').trim();
            const publishedTaskReadyPath =
              (process.env.PUBLISHED_TASK_READY_PATH ?? '').trim();

            const planPath =
              eventName === 'task_ready'
                ? publishedTaskReadyPath || taskReadyPath
                : planReadyPath;

            if (!planPath) {
              throw new Error(
                `No plan path available for event: ${eventName || '(unknown)'}`,
              );
            }
            if (!fs.existsSync(planPath)) {
              throw new Error(`Missing plan file: ${planPath}`);
            }

            fs.appendFileSync({{BRAND_OUTPUT_VARIABLE_NAME}}, `plan_path=${planPath}\n`, 'utf8');
          env:
            EVENT_NAME: ${{ {{BRAND_EXPRESSION_ROOT}}.event_name }}
            PLAN_READY_PATH: ${{ {{BRAND_EXPRESSION_ROOT}}.event.plan_ready.plan_path }}
            TASK_READY_PATH: ${{ {{BRAND_EXPRESSION_ROOT}}.event.task_ready.plan_path }}
            PUBLISHED_TASK_READY_PATH: ${{ steps.publish_task_ready_plan.outputs.plan_path }}

    complexity_analysis:
      name: Complexity Analysis
      needs: prepare_plan
      outputs:
        complexity: ${{ parseJson(steps.resolve_complexity.outputs.json_response).complexity }}
        remarks: ${{ parseJson(steps.resolve_complexity.outputs.json_response).remarks }}
        planning_max_iterations: ${{ steps.map_iterations.outputs.planning_max_iterations }}
        qa_max_iterations: ${{ steps.map_iterations.outputs.qa_max_iterations }}
        completion_max_iterations: ${{ steps.map_iterations.outputs.completion_max_iterations }}
        completion_validation_max_iterations: ${{ steps.map_iterations.outputs.completion_validation_max_iterations }}
        implementation_max_turns: ${{ steps.map_iterations.outputs.implementation_max_turns }}
        code_review_inputs_json: ${{ steps.map_code_review_profile.outputs.code_review_inputs_json }}
      steps:
        - id: assess_complexity
          name: Assess Plan Complexity
          if: inputs.complexity == 'auto'
          uses: builtin/agent-prompt
          with:
            model: $fast
            thinking_effort: xhigh
            permission_preset: read_only
            prompt: |
              Analyze the implementation plan at `${{ needs.prepare_plan.outputs.plan_path }}`.

              Classify the overall plan complexity as exactly one of:
              - trivial
              - low
              - medium
              - high
              - xhigh

              Reserve `trivial` for only the smallest changes:
              - minimal single-file updates
              - simple naming refactors
              - documentation-only changes

              In your assessment, consider the entire plan and weigh:
              - implementation scope, coordination cost, and uncertainty
              - testing complexity, validation burden, and regression risk
              - overall delivery risk across the work
              - whether the work is narrow but behaviorally sensitive versus broad/shared/high-blast-radius

              Return JSON with:
              - `complexity`: the selected complexity level
              - `remarks`: short reasoning for the assessment
              - `dimensions`: implementationBreadth, behavioralRisk, sharedCodeRisk, existingDiffRisk, and verificationBurden, each classified using the same complexity levels
              - `reviewMode`: `targeted`, `standard`, or `full`

              Review mode guidance:
              - Use `targeted` for narrow changes even when behavioral validation should be careful.
              - Use `standard` for normal multi-file work.
              - Use `full` for broad, shared, cross-layer, or high-blast-radius work.
            structured_output_schema: >-
              {"type":"object","additionalProperties":false,"properties":{"complexity":{"type":"string","enum":["trivial","low","medium","high","xhigh"]},"remarks":{"type":"string"},"dimensions":{"type":"object","additionalProperties":false,"properties":{"implementationBreadth":{"type":"string","enum":["trivial","low","medium","high","xhigh"]},"behavioralRisk":{"type":"string","enum":["trivial","low","medium","high","xhigh"]},"sharedCodeRisk":{"type":"string","enum":["trivial","low","medium","high","xhigh"]},"existingDiffRisk":{"type":"string","enum":["trivial","low","medium","high","xhigh"]},"verificationBurden":{"type":"string","enum":["trivial","low","medium","high","xhigh"]}},"required":["implementationBreadth","behavioralRisk","sharedCodeRisk","existingDiffRisk","verificationBurden"]},"reviewMode":{"type":"string","enum":["targeted","standard","full"]}},"required":["complexity","remarks","dimensions","reviewMode"]}

        - id: resolve_complexity
          name: Resolve Complexity Selection
          shell: node
          run: |
            import fs from 'node:fs';

            const {{BRAND_OUTPUT_VARIABLE_NAME}} = process.env.{{BRAND_ENV_PREFIX}}_OUTPUT ?? '';
            if (!{{BRAND_OUTPUT_VARIABLE_NAME}}) {
              throw new Error('{{BRAND_ENV_PREFIX}}_OUTPUT is required for resolve_complexity');
            }

            const requestedComplexity =
              (process.env.REQUESTED_COMPLEXITY ?? '').trim().toLowerCase() ||
              'auto';
            const allowedComplexities = new Set([
              'trivial',
              'low',
              'medium',
              'high',
              'xhigh',
            ]);
            const allowedReviewModes = new Set(['targeted', 'standard', 'full']);
            const fallbackReviewMode = (complexity) => {
              if (complexity === 'trivial' || complexity === 'low') {
                return 'targeted';
              }
              if (complexity === 'high' || complexity === 'xhigh') {
                return 'full';
              }
              return 'standard';
            };
            const normalizeDimensions = (value, fallbackComplexity) => {
              const source =
                value && typeof value === 'object' && !Array.isArray(value)
                  ? value
                  : {};
              const readDimension = (key) => {
                const raw =
                  typeof source[key] === 'string'
                    ? source[key].toLowerCase()
                    : '';
                return allowedComplexities.has(raw) ? raw : fallbackComplexity;
              };
              return {
                implementationBreadth: readDimension('implementationBreadth'),
                behavioralRisk: readDimension('behavioralRisk'),
                sharedCodeRisk: readDimension('sharedCodeRisk'),
                existingDiffRisk: readDimension('existingDiffRisk'),
                verificationBurden: readDimension('verificationBurden'),
              };
            };

            let response;
            if (requestedComplexity === 'auto') {
              const assessmentResponse = (
                process.env.ASSESSED_COMPLEXITY_RESPONSE ?? ''
              ).trim();

              if (!assessmentResponse) {
                throw new Error('Complexity assessment did not produce a response');
              }

              const parsed = JSON.parse(assessmentResponse);
              const assessedComplexity =
                typeof parsed.complexity === 'string'
                  ? parsed.complexity.toLowerCase()
                  : '';

              if (!allowedComplexities.has(assessedComplexity)) {
                throw new Error(
                  `Complexity assessment returned unsupported complexity: ${assessedComplexity || '(missing)'}`,
                );
              }

              response = {
                complexity: assessedComplexity,
                remarks:
                  typeof parsed.remarks === 'string'
                    ? parsed.remarks
                    : 'Complexity was automatically assessed.',
                dimensions: normalizeDimensions(parsed.dimensions, assessedComplexity),
                reviewMode:
                  typeof parsed.reviewMode === 'string' &&
                  allowedReviewModes.has(parsed.reviewMode.toLowerCase())
                    ? parsed.reviewMode.toLowerCase()
                    : fallbackReviewMode(assessedComplexity),
              };
            } else if (!allowedComplexities.has(requestedComplexity)) {
              throw new Error(
                `Unsupported complexity input: ${requestedComplexity || '(missing)'}`,
              );
            } else {
              response = {
                complexity: requestedComplexity,
                remarks:
                  'Complexity was provided as a pipeline input; automatic assessment skipped.',
                dimensions: normalizeDimensions({}, requestedComplexity),
                reviewMode: fallbackReviewMode(requestedComplexity),
              };
            }

            fs.appendFileSync(
              {{BRAND_OUTPUT_VARIABLE_NAME}},
              `json_response=${JSON.stringify(response)}\n`,
              'utf8',
            );
          env:
            REQUESTED_COMPLEXITY: ${{ inputs.complexity }}
            ASSESSED_COMPLEXITY_RESPONSE: ${{ steps.assess_complexity.outputs.json_response }}

        - id: map_iterations
          name: Map Complexity To Iteration Limits
          shell: node
          run: |
            import fs from 'node:fs';

            const parsed =
              typeof process.env.COMPLEXITY_RESPONSE === 'string'
                ? JSON.parse(process.env.COMPLEXITY_RESPONSE)
                : {};
            const complexity =
              typeof parsed.complexity === 'string'
                ? parsed.complexity.toLowerCase()
                : 'medium';

            const iterationMatrix = {
              trivial: { planning: 0, qa: 1, implementationMaxTurns: 100 },
              low: { planning: 1, qa: 2, implementationMaxTurns: 100 },
              medium: { planning: 3, qa: 4, implementationMaxTurns: 500 },
              high: { planning: 4, qa: 6, implementationMaxTurns: 1000 },
              xhigh: { planning: 5, qa: 8, implementationMaxTurns: 1000 },
            };
            const selected =
              iterationMatrix[complexity] ?? iterationMatrix.medium;
            const qaMaxIterations = selected.qa + 1;
            const completionIterationMatrix = {
              trivial: 2,
              low: 2,
              medium: 3,
              high: 4,
              xhigh: 5,
            };
            const completionMaxIterations =
              completionIterationMatrix[complexity] ?? completionIterationMatrix.medium;
            const completionValidationMaxIterations = completionMaxIterations + 1;
            const {{BRAND_OUTPUT_VARIABLE_NAME}} = process.env.{{BRAND_ENV_PREFIX}}_OUTPUT ?? '';

            if (!{{BRAND_OUTPUT_VARIABLE_NAME}}) {
              throw new Error('{{BRAND_ENV_PREFIX}}_OUTPUT is required for map_iterations');
            }

            fs.appendFileSync(
              {{BRAND_OUTPUT_VARIABLE_NAME}},
              `planning_max_iterations=${String(selected.planning)}\n`,
              'utf8',
            );
            fs.appendFileSync(
              {{BRAND_OUTPUT_VARIABLE_NAME}},
              `qa_max_iterations=${String(qaMaxIterations)}\n`,
              'utf8',
            );
            fs.appendFileSync(
              {{BRAND_OUTPUT_VARIABLE_NAME}},
              `completion_max_iterations=${String(completionMaxIterations)}\n`,
              'utf8',
            );
            fs.appendFileSync(
              {{BRAND_OUTPUT_VARIABLE_NAME}},
              `completion_validation_max_iterations=${String(completionValidationMaxIterations)}\n`,
              'utf8',
            );
            fs.appendFileSync(
              {{BRAND_OUTPUT_VARIABLE_NAME}},
              `implementation_max_turns=${String(selected.implementationMaxTurns)}\n`,
              'utf8',
            );
          env:
            COMPLEXITY_RESPONSE: ${{ steps.resolve_complexity.outputs.json_response }}

        - id: map_code_review_profile
          name: Map Complexity To Code Review Coverage
          shell: node
          run: |
            import fs from 'node:fs';

            const parsed =
              typeof process.env.COMPLEXITY_RESPONSE === 'string'
                ? JSON.parse(process.env.COMPLEXITY_RESPONSE)
                : {};
            const complexity =
              typeof parsed.complexity === 'string'
                ? parsed.complexity.toLowerCase()
                : 'medium';
            const dimensions =
              parsed.dimensions &&
              typeof parsed.dimensions === 'object' &&
              !Array.isArray(parsed.dimensions)
                ? parsed.dimensions
                : {};
            const readDimension = (key) =>
              typeof dimensions[key] === 'string'
                ? dimensions[key].toLowerCase()
                : complexity;
            const reviewModeFromComplexity =
              complexity === 'trivial' || complexity === 'low'
                ? 'targeted'
                : complexity === 'high' || complexity === 'xhigh'
                  ? 'full'
                  : 'standard';
            const requestedReviewMode =
              typeof parsed.reviewMode === 'string'
                ? parsed.reviewMode.toLowerCase()
                : reviewModeFromComplexity;
            const forceFullReview = [
              readDimension('implementationBreadth'),
              readDimension('sharedCodeRisk'),
              readDimension('existingDiffRisk'),
            ].some((value) => value === 'high' || value === 'xhigh');
            const reviewMode = forceFullReview ? 'full' : requestedReviewMode;

            const reviewProfileMatrix = {
              targeted: {
                include_uncommitted: true,
                enable_repo_compliance_review_claude: true,
                enable_repo_compliance_review_codex: false,
                enable_opus_methodical_reviewer: false,
                enable_gpt_methodical_reviewer: true,
                enable_codex_security_review: false,
                enable_claude_security_review: false,
              },
              standard: {
                include_uncommitted: true,
                enable_repo_compliance_review_claude: true,
                enable_repo_compliance_review_codex: false,
                enable_opus_methodical_reviewer: true,
                enable_gpt_methodical_reviewer: true,
                enable_codex_security_review: true,
                enable_claude_security_review: false,
              },
              full: {
                include_uncommitted: true,
                enable_repo_compliance_review_claude: true,
                enable_repo_compliance_review_codex: true,
                enable_opus_methodical_reviewer: true,
                enable_gpt_methodical_reviewer: true,
                enable_codex_security_review: true,
                enable_claude_security_review: true,
              },
            };
            const selectedProfile =
              reviewProfileMatrix[reviewMode] ?? reviewProfileMatrix.standard;

            fs.appendFileSync(
              process.env.{{BRAND_ENV_PREFIX}}_OUTPUT ?? '',
              `code_review_inputs_json=${JSON.stringify(selectedProfile)}\n`,
              'utf8',
            );
          env:
            COMPLEXITY_RESPONSE: ${{ steps.resolve_complexity.outputs.json_response }}

    refine:
      name: Refine
      needs:
        - prepare_plan
        - complexity_analysis
      if: needs.complexity_analysis.result == 'success' && needs.complexity_analysis.outputs.planning_max_iterations > 0
      max_iterations: '${{ needs.complexity_analysis.outputs.planning_max_iterations }}'
      outputs:
        opus_made_updates: ${{ steps.finalize_refine_state.outputs.opus_made_updates }}
        gpt_critic_decision: ${{ steps.finalize_refine_state.outputs.critic_decision }}
        gpt_critic_summary: ${{ steps.finalize_refine_state.outputs.critic_summary }}
        gpt_critic_remaining_gaps: ${{ steps.finalize_refine_state.outputs.critic_remaining_gaps }}
        restart_requested: ${{ steps.detect_updates.outputs.restart_requested }}
        convergence_reason: ${{ steps.detect_updates.outputs.convergence_reason }}
      steps:
        - id: load_refine_state
          name: Load Refine Session State
          shell: node
          run: |
            import fs from 'node:fs';
            import path from 'node:path';

            const {{BRAND_OUTPUT_VARIABLE_NAME}} = process.env.{{BRAND_ENV_PREFIX}}_OUTPUT ?? '';
            const outputDir = process.env.{{BRAND_ENV_PREFIX}}_OUTPUT_DIR ?? path.dirname({{BRAND_OUTPUT_VARIABLE_NAME}});
            const stateFile = path.join(outputDir, 'refine-session-state.json');

            let state = {};
            if (fs.existsSync(stateFile)) {
              state = JSON.parse(fs.readFileSync(stateFile, 'utf8'));
            }

            const writerSessionId =
              state &&
              typeof state === 'object' &&
              !Array.isArray(state) &&
              typeof state.writerSessionId === 'string'
                ? state.writerSessionId.trim()
                : '';
            const criticSessionId =
              state &&
              typeof state === 'object' &&
              !Array.isArray(state) &&
              typeof state.criticSessionId === 'string'
                ? state.criticSessionId.trim()
                : '';
            const previousPlanHash =
              state &&
              typeof state === 'object' &&
              !Array.isArray(state) &&
              typeof state.previousPlanHash === 'string'
                ? state.previousPlanHash.trim()
                : '';
            const previousCriticFile =
              state &&
              typeof state === 'object' &&
              !Array.isArray(state) &&
              typeof state.previousCriticFile === 'string'
                ? state.previousCriticFile.trim()
                : '';

            fs.appendFileSync({{BRAND_OUTPUT_VARIABLE_NAME}}, `state_file=${stateFile}\n`, 'utf8');
            fs.appendFileSync({{BRAND_OUTPUT_VARIABLE_NAME}}, `writer_session_id=${writerSessionId}\n`, 'utf8');
            fs.appendFileSync({{BRAND_OUTPUT_VARIABLE_NAME}}, `critic_session_id=${criticSessionId}\n`, 'utf8');
            fs.appendFileSync({{BRAND_OUTPUT_VARIABLE_NAME}}, `previous_plan_hash=${previousPlanHash}\n`, 'utf8');
            fs.appendFileSync({{BRAND_OUTPUT_VARIABLE_NAME}}, `previous_critic_file=${previousCriticFile}\n`, 'utf8');

        - id: review_with_opus_resume
          name: Resume Plan Writer With Opus
          if: steps.load_refine_state.outputs.writer_session_id != ''
          continue_on_error: true
          uses: builtin/agent-resume
          with:
            session_id: ${{ steps.load_refine_state.outputs.writer_session_id }}
            model: opus
            thinking_effort: max
            permission_preset: dangerous_all
            setting_sources: '[]'
            prompt: |
              Continue refining the implementation plan at `${{ needs.prepare_plan.outputs.plan_path }}`.

              You are the sole writer for this plan. You may edit the plan directly, but no other refine step may do so.

              If `${{ steps.load_refine_state.outputs.previous_critic_file }}` is non-empty, read that prior GPT-5.6 Sol critic report first and address the remaining concrete gaps before making any other changes.

              Guidance:
              - make only material clarity, accuracy, and completeness improvements
              - avoid stylistic churn and unnecessary rewrites
              - preserve good sections that already satisfy the critic

              Return structured output with:
              - `madeUpdates`: `true` if you edited the plan document, otherwise `false`
              - `summary`: a concise summary of what you changed or why no edits were needed
            structured_output_schema: >-
              {"type":"object","additionalProperties":false,"properties":{"madeUpdates":{"type":"boolean"},"summary":{"type":"string"}},"required":["madeUpdates","summary"]}
        - id: review_with_opus_start
          name: Start Plan Writer With Opus
          if: steps.load_refine_state.outputs.writer_session_id == '' || steps.review_with_opus_resume.conclusion != 'success'
          uses: builtin/agent-prompt
          with:
            model: opus
            thinking_effort: max
            permission_preset: dangerous_all
            persist_session: true
            setting_sources: '[]'
            prompt: |
              Refine the implementation plan at `${{ needs.prepare_plan.outputs.plan_path }}`.

              You are the primary writer for this plan. You may edit the plan directly, but no other refine step may do so.

              If `${{ steps.load_refine_state.outputs.previous_critic_file }}` is non-empty, read that prior GPT-5.6 Sol critic report first and address the remaining concrete gaps before making any other changes.

              Guidance:
              - make only material clarity, accuracy, and completeness improvements
              - avoid stylistic churn and unnecessary rewrites
              - preserve good sections that already satisfy the critic

              Return structured output with:
              - `madeUpdates`: `true` if you edited the plan document, otherwise `false`
              - `summary`: a concise summary of what you changed or why no edits were needed
            structured_output_schema: >-
              {"type":"object","additionalProperties":false,"properties":{"madeUpdates":{"type":"boolean"},"summary":{"type":"string"}},"required":["madeUpdates","summary"]}
        - id: review_with_gpt_resume
          name: Resume GPT-5.6 Sol Plan Critic
          if: steps.load_refine_state.outputs.critic_session_id != ''
          continue_on_error: true
          uses: builtin/agent-resume
          with:
            session_id: ${{ steps.load_refine_state.outputs.critic_session_id }}
            model: $default-codex
            thinking_effort: medium
            permission_preset: read_only
            prompt: |
              Review the implementation plan at `${{ needs.prepare_plan.outputs.plan_path }}` as the refine critic.

              You must NOT edit any files. You are a read-only critic only.

              If `${{ steps.load_refine_state.outputs.previous_critic_file }}` is non-empty, you may read it to understand what you asked for previously, but your decision must be based on the current plan.

              Return structured output with:
              - `decision`: `"accept"` if the plan is ready, otherwise `"revise"`
              - `summary`: concise reasoning for the decision
              - `remainingGaps`: a short list of only the material remaining issues that justify another writer pass

              Rules:
              - request another pass only for concrete, material plan gaps
              - do not ask for another pass for minor wording nits
              - do not edit the plan yourself
            structured_output_schema: >-
              {"type":"object","additionalProperties":false,"properties":{"decision":{"type":"string","enum":["accept","revise"]},"summary":{"type":"string"},"remainingGaps":{"type":"array","items":{"type":"string"}}},"required":["decision","summary","remainingGaps"]}
        - id: review_with_gpt_start
          name: Start GPT-5.6 Sol Plan Critic
          if: steps.load_refine_state.outputs.critic_session_id == '' || steps.review_with_gpt_resume.conclusion != 'success'
          uses: builtin/agent-prompt
          with:
            model: $default-codex
            thinking_effort: medium
            permission_preset: read_only
            prompt: |
              Review the implementation plan at `${{ needs.prepare_plan.outputs.plan_path }}` as the refine critic.

              You must NOT edit any files. You are a read-only critic only.

              If `${{ steps.load_refine_state.outputs.previous_critic_file }}` is non-empty, you may read it to understand what you asked for previously, but your decision must be based on the current plan.

              Return structured output with:
              - `decision`: `"accept"` if the plan is ready, otherwise `"revise"`
              - `summary`: concise reasoning for the decision
              - `remainingGaps`: a short list of only the material remaining issues that justify another writer pass

              Rules:
              - request another pass only for concrete, material plan gaps
              - do not ask for another pass for minor wording nits
              - do not edit the plan yourself
            structured_output_schema: >-
              {"type":"object","additionalProperties":false,"properties":{"decision":{"type":"string","enum":["accept","revise"]},"summary":{"type":"string"},"remainingGaps":{"type":"array","items":{"type":"string"}}},"required":["decision","summary","remainingGaps"]}
        - id: finalize_refine_state
          name: Save Refine Session State
          shell: node
          run: |
            import crypto from 'node:crypto';
            import fs from 'node:fs';
            import path from 'node:path';

            const {{BRAND_OUTPUT_VARIABLE_NAME}} = process.env.{{BRAND_ENV_PREFIX}}_OUTPUT ?? '';
            const stateFile = process.env.STATE_FILE ?? '';
            const planPath = process.env.PLAN_PATH ?? '';
            if (!{{BRAND_OUTPUT_VARIABLE_NAME}}) {
              throw new Error('{{BRAND_ENV_PREFIX}}_OUTPUT is required');
            }
            if (!stateFile) {
              throw new Error('STATE_FILE is required');
            }
            if (!planPath || !fs.existsSync(planPath)) {
              throw new Error(`Missing plan file: ${planPath || '(empty)'}`);
            }

            const writerSessionId =
              (process.env.WRITER_RESUME_SESSION_ID ?? '').trim() ||
              (process.env.WRITER_START_SESSION_ID ?? '').trim();
            const criticSessionId =
              (process.env.CRITIC_RESUME_SESSION_ID ?? '').trim() ||
              (process.env.CRITIC_START_SESSION_ID ?? '').trim();
            const writerJsonPath =
              (process.env.WRITER_RESUME_JSON_FILE ?? '').trim() ||
              (process.env.WRITER_START_JSON_FILE ?? '').trim();
            const criticJsonPath =
              (process.env.CRITIC_RESUME_JSON_FILE ?? '').trim() ||
              (process.env.CRITIC_START_JSON_FILE ?? '').trim();
            const outputDir =
              process.env.{{BRAND_ENV_PREFIX}}_OUTPUT_DIR ?? path.dirname(stateFile);
            const persistedCriticJsonPath = path.join(
              outputDir,
              'refine-critic-report.json',
            );

            if (!writerSessionId) {
              throw new Error('Refine writer did not produce a session id');
            }
            if (!criticSessionId) {
              throw new Error('Refine critic did not produce a session id');
            }
            if (!writerJsonPath || !fs.existsSync(writerJsonPath)) {
              throw new Error(`Missing writer response file: ${writerJsonPath || '(empty)'}`);
            }
            if (!criticJsonPath || !fs.existsSync(criticJsonPath)) {
              throw new Error(`Missing critic response file: ${criticJsonPath || '(empty)'}`);
            }

            const writerParsed = JSON.parse(fs.readFileSync(writerJsonPath, 'utf8'));
            const criticParsed = JSON.parse(fs.readFileSync(criticJsonPath, 'utf8'));
            const planHash = crypto
              .createHash('sha256')
              .update(fs.readFileSync(planPath))
              .digest('hex');
            const madeUpdates =
              writerParsed &&
              typeof writerParsed === 'object' &&
              !Array.isArray(writerParsed) &&
              writerParsed.madeUpdates === true;
            const criticDecision =
              criticParsed &&
              typeof criticParsed === 'object' &&
              !Array.isArray(criticParsed) &&
              typeof criticParsed.decision === 'string'
                ? criticParsed.decision
                : 'revise';
            const criticSummary =
              criticParsed &&
              typeof criticParsed === 'object' &&
              !Array.isArray(criticParsed) &&
              typeof criticParsed.summary === 'string'
                ? criticParsed.summary.replace(/\r?\n/g, ' ').trim()
                : '';
            const criticRemainingGaps =
              criticParsed &&
              typeof criticParsed === 'object' &&
              !Array.isArray(criticParsed) &&
              Array.isArray(criticParsed.remainingGaps)
                ? criticParsed.remainingGaps
                    .filter(
                      (gap) => typeof gap === 'string' && gap.trim().length > 0,
                    )
                    .map((gap) => gap.replace(/\r?\n/g, ' ').trim())
                : [];
            const criticRemainingGapsText = criticRemainingGaps
              .map((gap, index) => `${String(index + 1)}. ${gap}`)
              .join(' ');

            const criticSerialized = fs.readFileSync(criticJsonPath, 'utf8');
            fs.writeFileSync(
              persistedCriticJsonPath,
              criticSerialized.endsWith('\n')
                ? criticSerialized
                : `${criticSerialized}\n`,
              'utf8',
            );

            fs.writeFileSync(
              stateFile,
              `${JSON.stringify(
                {
                  writerSessionId,
                  criticSessionId,
                  previousPlanHash: planHash,
                  previousCriticFile: persistedCriticJsonPath,
                },
                null,
                2,
              )}\n`,
              'utf8',
            );

            fs.appendFileSync({{BRAND_OUTPUT_VARIABLE_NAME}}, `opus_made_updates=${madeUpdates ? 'true' : 'false'}\n`, 'utf8');
            fs.appendFileSync({{BRAND_OUTPUT_VARIABLE_NAME}}, `critic_decision=${criticDecision}\n`, 'utf8');
            fs.appendFileSync(
              {{BRAND_OUTPUT_VARIABLE_NAME}},
              `critic_summary=${criticSummary}\n`,
              'utf8',
            );
            fs.appendFileSync(
              {{BRAND_OUTPUT_VARIABLE_NAME}},
              `critic_remaining_gaps=${criticRemainingGapsText}\n`,
              'utf8',
            );
            fs.appendFileSync({{BRAND_OUTPUT_VARIABLE_NAME}}, `current_plan_hash=${planHash}\n`, 'utf8');
            fs.appendFileSync(
              {{BRAND_OUTPUT_VARIABLE_NAME}},
              `critic_report_file=${persistedCriticJsonPath}\n`,
              'utf8',
            );
          env:
            STATE_FILE: ${{ steps.load_refine_state.outputs.state_file }}
            PLAN_PATH: ${{ needs.prepare_plan.outputs.plan_path }}
            WRITER_RESUME_SESSION_ID: ${{ steps.review_with_opus_resume.outputs.session_id }}
            WRITER_START_SESSION_ID: ${{ steps.review_with_opus_start.outputs.session_id }}
            CRITIC_RESUME_SESSION_ID: ${{ steps.review_with_gpt_resume.outputs.session_id }}
            CRITIC_START_SESSION_ID: ${{ steps.review_with_gpt_start.outputs.session_id }}
            WRITER_RESUME_JSON_FILE: ${{ steps.review_with_opus_resume.outputs.json_response_file }}
            WRITER_START_JSON_FILE: ${{ steps.review_with_opus_start.outputs.json_response_file }}
            CRITIC_RESUME_JSON_FILE: ${{ steps.review_with_gpt_resume.outputs.json_response_file }}
            CRITIC_START_JSON_FILE: ${{ steps.review_with_gpt_start.outputs.json_response_file }}
        - id: detect_updates
          name: Restart If GPT Requests Another Writer Pass
          shell: node
          run: |
            import fs from 'node:fs';

            const {{BRAND_OUTPUT_VARIABLE_NAME}} = process.env.{{BRAND_ENV_PREFIX}}_OUTPUT ?? '';
            if (!{{BRAND_OUTPUT_VARIABLE_NAME}}) {
              throw new Error('{{BRAND_ENV_PREFIX}}_OUTPUT is required');
            }

            const decision = (process.env.CRITIC_DECISION ?? '').trim().toLowerCase();
            const previousPlanHash = (process.env.PREVIOUS_PLAN_HASH ?? '').trim();
            const currentPlanHash = (process.env.CURRENT_PLAN_HASH ?? '').trim();

            let restartRequested = false;
            let convergenceReason = 'accepted';

            if (decision === 'revise') {
              if (
                previousPlanHash &&
                currentPlanHash &&
                previousPlanHash === currentPlanHash
              ) {
                convergenceReason = 'stalled_same_plan_hash';
              } else {
                restartRequested = true;
                convergenceReason = 'critic_requested_revision';
              }
            }

            fs.appendFileSync(
              {{BRAND_OUTPUT_VARIABLE_NAME}},
              `restart_requested=${restartRequested ? 'true' : 'false'}\n`,
              'utf8',
            );
            fs.appendFileSync(
              {{BRAND_OUTPUT_VARIABLE_NAME}},
              `convergence_reason=${convergenceReason}\n`,
              'utf8',
            );

            if (restartRequested) {
              fs.appendFileSync({{BRAND_OUTPUT_VARIABLE_NAME}}, '{{BRAND_ENV_PREFIX}}_JOB_RESTART=true\n', 'utf8');
            }
          env:
            CRITIC_DECISION: ${{ steps.finalize_refine_state.outputs.critic_decision }}
            PREVIOUS_PLAN_HASH: ${{ steps.load_refine_state.outputs.previous_plan_hash }}
            CURRENT_PLAN_HASH: ${{ steps.finalize_refine_state.outputs.current_plan_hash }}

    refine_gate:
      name: Refine Acceptance Review
      needs:
        - complexity_analysis
        - refine
      if: always()
      outputs:
        accepted: ${{ steps.evaluate_refine_gate.outputs.accepted }}
        failure_reason: ${{ steps.evaluate_refine_gate.outputs.failure_reason }}
        critic_decision: ${{ steps.evaluate_refine_gate.outputs.critic_decision }}
        critic_summary: ${{ steps.evaluate_refine_gate.outputs.critic_summary }}
        critic_remaining_gaps: ${{ steps.evaluate_refine_gate.outputs.critic_remaining_gaps }}
        convergence_reason: ${{ steps.evaluate_refine_gate.outputs.convergence_reason }}
        failure_skipped: ${{ steps.evaluate_refine_gate.outputs.failure_skipped }}
      steps:
        - id: evaluate_refine_gate
          name: Evaluate Refine Acceptance
          shell: node
          run: |
            import fs from 'node:fs';

            const {{BRAND_OUTPUT_VARIABLE_NAME}} = process.env.{{BRAND_ENV_PREFIX}}_OUTPUT ?? '';
            if (!{{BRAND_OUTPUT_VARIABLE_NAME}}) {
              throw new Error('{{BRAND_ENV_PREFIX}}_OUTPUT is required');
            }

            const planningMaxIterations = Number.parseInt(
              (process.env.PLANNING_MAX_ITERATIONS ?? '0').trim(),
              10,
            );
            const refineResult = (process.env.REFINE_RESULT ?? '').trim();
            const criticDecision =
              (process.env.CRITIC_DECISION ?? '').trim().toLowerCase();
            const criticSummary =
              (process.env.CRITIC_SUMMARY ?? '').replace(/\r?\n/g, ' ').trim();
            const criticRemainingGaps =
              (process.env.CRITIC_REMAINING_GAPS ?? '').replace(/\r?\n/g, ' ').trim();
            const convergenceReason =
              (process.env.CONVERGENCE_REASON ?? '').trim() || 'unknown';

            let accepted = false;
            let failureReason = '';
            let failureSkipped = false;
            const continueOnFail =
              (process.env.CONTINUE_ON_REFINE_GATE_FAIL ?? '').trim() === 'true';

            if (planningMaxIterations === 0 && refineResult === 'skipped') {
              accepted = true;
              failureReason = 'planning_disabled';
            } else if (refineResult !== 'success') {
              failureReason = `Refine job did not succeed: ${refineResult || 'unknown'}`;
            } else if (criticDecision === 'accept') {
              accepted = true;
              failureReason = '';
            } else if (convergenceReason === 'stalled_same_plan_hash') {
              failureReason =
                'Refine stalled with the same plan hash while the critic still requested revision.';
            } else {
              const remainingGapDetail = criticRemainingGaps
                ? ` Remaining gaps: ${criticRemainingGaps}`
                : '';
              failureReason =
                `Refine critic did not accept the plan: ${criticDecision || 'unknown'}${criticSummary ? ` - ${criticSummary}` : ''}${remainingGapDetail}`;
            }

            fs.appendFileSync(
              {{BRAND_OUTPUT_VARIABLE_NAME}},
              `accepted=${accepted ? 'true' : 'false'}\n`,
              'utf8',
            );
            fs.appendFileSync(
              {{BRAND_OUTPUT_VARIABLE_NAME}},
              `failure_reason=${failureReason}\n`,
              'utf8',
            );
            fs.appendFileSync(
              {{BRAND_OUTPUT_VARIABLE_NAME}},
              `critic_decision=${criticDecision}\n`,
              'utf8',
            );
            fs.appendFileSync(
              {{BRAND_OUTPUT_VARIABLE_NAME}},
              `critic_summary=${criticSummary}\n`,
              'utf8',
            );
            fs.appendFileSync(
              {{BRAND_OUTPUT_VARIABLE_NAME}},
              `critic_remaining_gaps=${criticRemainingGaps}\n`,
              'utf8',
            );
            fs.appendFileSync(
              {{BRAND_OUTPUT_VARIABLE_NAME}},
              `convergence_reason=${convergenceReason}\n`,
              'utf8',
            );
            if (!accepted && continueOnFail) {
              failureSkipped = true;
            }
            fs.appendFileSync(
              {{BRAND_OUTPUT_VARIABLE_NAME}},
              `failure_skipped=${failureSkipped ? 'true' : 'false'}\n`,
              'utf8',
            );

            if (!accepted && !continueOnFail) {
              throw new Error(failureReason || 'Refine gate failed');
            }
          env:
            PLANNING_MAX_ITERATIONS: ${{ needs.complexity_analysis.outputs.planning_max_iterations }}
            REFINE_RESULT: ${{ needs.refine.result }}
            CRITIC_DECISION: ${{ needs.refine.outputs.gpt_critic_decision }}
            CRITIC_SUMMARY: ${{ needs.refine.outputs.gpt_critic_summary }}
            CRITIC_REMAINING_GAPS: ${{ needs.refine.outputs.gpt_critic_remaining_gaps }}
            CONVERGENCE_REASON: ${{ needs.refine.outputs.convergence_reason }}
            CONTINUE_ON_REFINE_GATE_FAIL: 'true'

    plan_contract:
      name: Plan Contract
      needs:
        - prepare_plan
        - complexity_analysis
        - refine_gate
      if: needs.complexity_analysis.result == 'success' && needs.refine_gate.result == 'success'
      outputs:
        contract_file: ${{ steps.validate_plan_contract.outputs.contract_file }}
        requirement_count: ${{ steps.validate_plan_contract.outputs.requirement_count }}
        non_goal_count: ${{ steps.validate_plan_contract.outputs.non_goal_count }}
        verification_check_count: ${{ steps.validate_plan_contract.outputs.verification_check_count }}
        verification_command_count: ${{ steps.validate_plan_contract.outputs.verification_command_count }}
        verification_scenario_count: ${{ steps.validate_plan_contract.outputs.verification_scenario_count }}
        verification_manual_count: ${{ steps.validate_plan_contract.outputs.verification_manual_count }}
        manual_check_count: ${{ steps.validate_plan_contract.outputs.manual_check_count }}
        validation_error_count: ${{ steps.validate_plan_contract.outputs.validation_error_count }}
        validation_error_summary: ${{ steps.validate_plan_contract.outputs.validation_error_summary }}
        failure_skipped: ${{ steps.validate_plan_contract.outputs.failure_skipped }}
      steps:
        - id: extract_plan_contract
          name: Extract Plan Completion Contract
          uses: builtin/agent-prompt
          with:
            model: $fast
            thinking_effort: xhigh
            permission_preset: read_only
            prompt: |
              Read the final implementation plan at `${{ needs.prepare_plan.outputs.plan_path }}`.

              Extract a machine-readable completion contract. The contract must faithfully reflect the plan; do not add new requirements and do not weaken acceptance checks.
              Current commit/PR mode: `${{ inputs.push_and_create_prs }}`.

              For every material requirement, include:
              - a stable id such as `REQ-001`
              - a concise description
              - `source`: `user` when the requirement comes directly from the user/task, otherwise `plan`
              - implementation areas where the requirement should be satisfied
              - concrete acceptance checks that prove the requirement is complete
              - concrete cannot-ship-if checks that would make final success invalid

              If a material requirement lacks concrete acceptance checks or cannot-ship checks, return the requirement with empty arrays so validation can fail the pipeline as not implementation-ready.

              Commit/push/PR boundary:
              - The implementation completion contract is about workspace content and verification evidence, not repository history.
              - If the plan says files must be "committed", "pushed", or included in a PR, express the acceptance check as the required files being present together in the workspace diff unless the actual requested task is specifically about commit, push, or PR automation.
              - Do not make implementation or QA fixers responsible for `git commit`, `git push`, branch creation, or PR creation; the dedicated commit/PR jobs handle that only when enabled.

              Return JSON with:
              - `requirements`
              - `nonGoals`
              - `verificationChecks`: preferred structured verification checks
              - `verificationCommands`
              - `manualChecks`

              Verification check rules:
              - Use `verificationChecks` for every material automated, scenario, or manual verification item.
              - Every verification check must include `id`, `type`, `description`, `command`, `expectedExitCode`, `expectedStdoutIncludes`, `expectedStderrIncludes`, and `expectedOutputIncludes`.
              - Use `type: "command"` only for a single, direct, repo-standard verification command that can be safely run from the repo root, such as `npm test ...`, `npm run lint`, `npx vitest ...`, `node ...`, `python ...`, `pytest ...`, `make ...`, or similar project tooling.
              - If a targeted verification check is automatable, especially checks named like `VC-001`, encode it as `type: "command"` with the exact `command` to run. Do not put runnable checks only in `description`.
              - Do not chain commands or use shell control operators in `command` checks. Commands containing `&&`, `||`, pipes, semicolons, background operators, redirection, command substitution, or status-variable capture must be `type: "scenario"` with an empty `command`.
              - For positive shell commands, use `type: "command"` and `expectedExitCode: 0`.
              - For negative-path shell commands that should fail, use `type: "command"`, set the expected non-zero `expectedExitCode`, and include at least one expected stdout/stderr/output fragment when practical.
              - Do not mark setup/cleanup/assertion recipes as `command` checks. If a check uses shell builtins or filesystem choreography such as `test`, `echo`, `rm`, `mkdir`, `ln`, `grep`, shell redirection, temp files, symlink setup, command chaining, status-variable capture, or cleanup steps, use `type: "scenario"`.
              - For prose scenario checks or multi-step shell recipes, use `type: "scenario"`, set `command` to an empty string, set expected include arrays to empty arrays, put the runnable intent in `description`, and do not put the prose or recipe in `verificationCommands`.
              - For human checks, use `type: "manual"` with an empty `command` and empty expected include arrays, or add prose to `manualChecks`.
              - Keep `verificationCommands` only for the exact simple runnable command strings from `verificationChecks` where `type` is `command`; do not include scenario prose or shell recipes there.
            structured_output_schema: >-
              {"type":"object","additionalProperties":false,"properties":{"requirements":{"type":"array","items":{"type":"object","additionalProperties":false,"properties":{"id":{"type":"string"},"description":{"type":"string"},"source":{"type":"string","enum":["user","plan"]},"implementationAreas":{"type":"array","items":{"type":"string"}},"acceptanceChecks":{"type":"array","items":{"type":"string"}},"cannotShipIf":{"type":"array","items":{"type":"string"}}},"required":["id","description","source","implementationAreas","acceptanceChecks","cannotShipIf"]}},"nonGoals":{"type":"array","items":{"type":"string"}},"verificationChecks":{"type":"array","items":{"type":"object","additionalProperties":false,"properties":{"id":{"type":"string"},"type":{"type":"string","enum":["command","scenario","manual"]},"description":{"type":"string"},"command":{"type":"string"},"expectedExitCode":{"type":"integer"},"expectedStdoutIncludes":{"type":"array","items":{"type":"string"}},"expectedStderrIncludes":{"type":"array","items":{"type":"string"}},"expectedOutputIncludes":{"type":"array","items":{"type":"string"}}},"required":["id","type","description","command","expectedExitCode","expectedStdoutIncludes","expectedStderrIncludes","expectedOutputIncludes"]}},"verificationCommands":{"type":"array","items":{"type":"string"}},"manualChecks":{"type":"array","items":{"type":"string"}}},"required":["requirements","nonGoals","verificationChecks","verificationCommands","manualChecks"]}

        - id: validate_plan_contract
          name: Validate Plan Contract
          shell: node
          run: |
            import fs from 'node:fs';
            import path from 'node:path';

            const {{BRAND_OUTPUT_VARIABLE_NAME}} = process.env.{{BRAND_ENV_PREFIX}}_OUTPUT ?? '';
            if (!{{BRAND_OUTPUT_VARIABLE_NAME}}) {
              throw new Error('{{BRAND_ENV_PREFIX}}_OUTPUT is required');
            }

            const sourceFile = (process.env.CONTRACT_SOURCE_FILE ?? '').trim();
            const outputDir =
              process.env.{{BRAND_ENV_PREFIX}}_OUTPUT_DIR ?? path.dirname({{BRAND_OUTPUT_VARIABLE_NAME}});
            const contractFile = path.join(outputDir, 'plan-completion-contract.json');
            const complexity =
              (process.env.COMPLEXITY ?? '').trim().toLowerCase() || 'medium';
            const nonTrivial = complexity !== 'trivial';
            const continueOnFail =
              (process.env.CONTINUE_ON_PLAN_CONTRACT_FAIL ?? '').trim() === 'true';

            let contract = {
              requirements: [],
              nonGoals: [],
              verificationChecks: [],
              verificationCommands: [],
              manualChecks: [],
            };
            const validationErrors = [];

            if (!sourceFile || !fs.existsSync(sourceFile)) {
              validationErrors.push(
                `Missing plan contract source file: ${sourceFile || '(empty)'}`,
              );
            } else {
              contract = JSON.parse(fs.readFileSync(sourceFile, 'utf8'));
            }

            const requirements = Array.isArray(contract.requirements)
              ? contract.requirements
              : [];
            const nonGoals = Array.isArray(contract.nonGoals)
              ? contract.nonGoals.filter(
                  (value) => typeof value === 'string' && value.trim().length > 0,
                )
              : [];
            const verificationCommands = Array.isArray(contract.verificationCommands)
              ? contract.verificationCommands.filter(
                  (value) => typeof value === 'string' && value.trim().length > 0,
                )
              : [];
            const manualChecks = Array.isArray(contract.manualChecks)
              ? contract.manualChecks.filter(
                  (value) => typeof value === 'string' && value.trim().length > 0,
                )
              : [];
            const commandPrefixPattern =
              /^(?:\.\/|npm\b|pnpm\b|yarn\b|bun\b|npx\b|pnpx\b|pytest\b|python(?:3)?\b|uv\b|poetry\b|cargo\b|go\b|just\b|make\b|node\b|bash\b|vitest\b|jest\b|tsx\b|tsc\b|eslint\b|turbo\b|nx\b|mvn\b|gradle\b|\.\/gradlew\b|phpunit\b|ruff\b|dotnet\b|mix\b)/i;
            const disallowedCommandPattern =
              /(?:^|\s)(?:--watch(?:=\S*)?|watch|dev(?:elopment)?(?::\S*)?|serve(?::\S*)?|start(?::\S*)?|storybook(?::\S*)?|publish(?::\S*)?|deploy(?::\S*)?|release(?::\S*)?)(?=\s|$)/i;
            const packageManagerCommandPattern =
              /^(?:npm|pnpm|yarn|bun)\b/i;
            const commandSegmentSeparatorPattern = /[^A-Za-z0-9]+/;
            const conditionallyDisallowedPackageScriptSegmentPattern =
              /^(?:dev|development)$/i;
            const unconditionallyDisallowedPackageScriptSegmentPattern =
              /^(?:watch|serve|start|storybook|publish|deploy|release)$/i;
            const verificationPackageScriptSegmentPattern =
              /^(?:test|tests|check|checks|verify|verification|lint|typecheck|type-check)$/i;
            const maxSafeCommandLength = 4096;
            const maxGuardedDevWrapperDepth = 4;
            const guardSafetyBypassPattern =
              /(?:^|\s)--danger-skip-(?:concurrency-safety-lock|memory-pressure-safety-check)(?=\s|$)/;
            const shellRewriteSyntaxPattern = /[\\$`{}[\]*?^%!]/;
            const guardedDevWrapperQuotePattern = /['"]/;
            const guardedDevWrapperPrefixPattern =
              /^node\s+scripts\/run-guarded-dev-script\.mjs(?:\s|$)/;
            const guardedDevWrapperPattern =
              /^node\s+scripts\/run-guarded-dev-script\.mjs\s+--suite\s+(?:performance|e2e|unit|lint)\s+--\s+(.+)$/;
            const bashSyntaxCheckPattern =
              /^bash\s+-n\s+(?:\.\/)?(?:[A-Za-z0-9_-]+\/)*[A-Za-z0-9_.-]+\.sh$/;
            const shellRecipePattern =
              /^(?:test\b|\[)|(?:^|\s)(?:echo|rm|mkdir|ln|grep)\b|[\r\n<>;&|]|&&|\|\||(?:^|\s)&(?:\s|$)|\$\(|\$\?|`/;
            const commandToolPattern =
              /\b(?:npm|pnpm|yarn|bun|npx|pnpx|pytest|python3?|uv|poetry|cargo|node|bash|vitest|jest|tsx|tsc|eslint|turbo|nx|mvn|gradle|phpunit|ruff|dotnet)\b/i;
            const toStringList = (value) =>
              Array.isArray(value)
                ? value.filter(
                    (item) => typeof item === 'string' && item.trim().length > 0,
                  )
                : [];
            const isDisallowedCommand = (value, guardedWrapperDepth = 0) => {
              if (
                typeof value !== 'string' ||
                value.length === 0 ||
                value.length > maxSafeCommandLength ||
                guardedWrapperDepth > maxGuardedDevWrapperDepth
              ) {
                return true;
              }
              if (shellRewriteSyntaxPattern.test(value)) {
                return true;
              }
              const normalized = value.replace(/['"]/g, '');
              if (
                guardedDevWrapperPrefixPattern.test(normalized) &&
                guardedDevWrapperQuotePattern.test(value)
              ) {
                return true;
              }
              if (guardSafetyBypassPattern.test(normalized)) {
                return true;
              }
              const guardedDevWrapperMatch = normalized.match(
                guardedDevWrapperPattern,
              );
              if (guardedDevWrapperPrefixPattern.test(normalized)) {
                return (
                  !guardedDevWrapperMatch ||
                  !isSafeCommand(
                    guardedDevWrapperMatch[1],
                    guardedWrapperDepth + 1,
                  )
                );
              }
              const commandSegments = normalized
                .trim()
                .split(/\s+/)
                .flatMap((token) =>
                  token.split(commandSegmentSeparatorPattern).filter(Boolean),
                );
              const commandTokens = normalized.trim().split(/\s+/);
              const packageScriptToken = packageManagerCommandPattern.test(
                normalized,
              )
                ? commandTokens[commandTokens[1] === 'run' ? 2 : 1] ?? ''
                : '';
              const packageScriptSegments = packageScriptToken
                .split(commandSegmentSeparatorPattern)
                .filter(Boolean);
              const allowsPackageDevScript =
                packageScriptSegments.some((segment) =>
                  conditionallyDisallowedPackageScriptSegmentPattern.test(
                    segment,
                  ),
                ) &&
                packageScriptSegments.some((segment) =>
                  verificationPackageScriptSegmentPattern.test(segment),
                );
              if (
                commandSegments.some((segment) =>
                  unconditionallyDisallowedPackageScriptSegmentPattern.test(
                    segment,
                  ),
                ) ||
                (commandSegments.some((segment) =>
                  conditionallyDisallowedPackageScriptSegmentPattern.test(
                    segment,
                  ),
                ) &&
                  !allowsPackageDevScript)
              ) {
                return true;
              }
              return disallowedCommandPattern.test(normalized);
            };
            const hasAllowedCommandShape = (value) =>
              !/^bash(?:\s|$)/i.test(value) || bashSyntaxCheckPattern.test(value);
            const isSafeCommand = (value, guardedWrapperDepth = 0) =>
              typeof value === 'string' &&
              value.length > 0 &&
              value.length <= maxSafeCommandLength &&
              guardedWrapperDepth <= maxGuardedDevWrapperDepth &&
              commandPrefixPattern.test(value) &&
              !isDisallowedCommand(value, guardedWrapperDepth) &&
              hasAllowedCommandShape(value) &&
              !shellRecipePattern.test(value);
            const looksRunnable = (value) =>
              isSafeCommand(value);
            const collectExplicitRunnableCommands = (value) => {
              const text = typeof value === 'string' ? value.trim() : '';
              if (!text) {
                return [];
              }
              const candidates = [];
              for (const match of text.matchAll(/`([^`]+)`/g)) {
                candidates.push(match[1].trim());
              }
              const scenarioDetailsMatch = text.match(
                /Scenario details from the plan:\s*(.+)$/i,
              );
              if (scenarioDetailsMatch) {
                candidates.push(
                  scenarioDetailsMatch[1].replace(/[.,;:]$/, '').trim(),
                );
              }
              candidates.push(
                text
                  .replace(/^[-*]\s+/, '')
                  .replace(/^\d+\.\s+/, '')
                  .replace(/^`|`$/g, '')
                  .replace(/[.,;:]$/, '')
                  .trim(),
              );
              return Array.from(
                new Set(candidates.filter((candidate) => looksRunnable(candidate))),
              );
            };
            const scenarioNeedsExplicitCommand = (id, description) => {
              const text = typeof description === 'string' ? description : '';
              return (
                commandToolPattern.test(text) &&
                /\b(?:run|execute|rerun|command|test|lint|typecheck|check|verify)\b/i.test(text)
              );
            };
            const describeScenario = (description, command) => {
              const trimmedDescription =
                typeof description === 'string' ? description.trim() : '';
              const trimmedCommand =
                typeof command === 'string' ? command.trim() : '';
              if (
                trimmedDescription &&
                trimmedCommand &&
                trimmedDescription !== trimmedCommand
              ) {
                return `${trimmedDescription} Scenario details from the plan: ${trimmedCommand}`;
              }
              return trimmedDescription || trimmedCommand;
            };
            const downgradeCommandCheckToScenario = (normalized, command) => ({
              ...normalized,
              type: 'scenario',
              description: describeScenario(normalized.description, command),
              command: '',
              expectedExitCode: 0,
              expectedStdoutIncludes: [],
              expectedStderrIncludes: [],
              expectedOutputIncludes: [],
            });
            const normalizeExpectedExitCode = (value) =>
              Number.isInteger(value) ? value : 0;

            if (nonTrivial && requirements.length === 0) {
              validationErrors.push(
                'Plan contract extraction produced zero material requirements for a non-trivial task.',
              );
            }

            const normalizedRequirements = requirements.map((requirement, index) => {
              const id =
                requirement &&
                typeof requirement === 'object' &&
                !Array.isArray(requirement) &&
                typeof requirement.id === 'string' &&
                requirement.id.trim().length > 0
                  ? requirement.id.trim()
                  : `REQ-${String(index + 1).padStart(3, '0')}`;
              const description =
                requirement &&
                typeof requirement === 'object' &&
                !Array.isArray(requirement) &&
                typeof requirement.description === 'string'
                  ? requirement.description.trim()
                  : '';
              const source =
                requirement &&
                typeof requirement === 'object' &&
                !Array.isArray(requirement) &&
                typeof requirement.source === 'string'
                  ? requirement.source.trim()
                  : '';
              const implementationAreas =
                requirement &&
                typeof requirement === 'object' &&
                !Array.isArray(requirement) &&
                Array.isArray(requirement.implementationAreas)
                  ? requirement.implementationAreas.filter(
                      (value) => typeof value === 'string' && value.trim().length > 0,
                    )
                  : [];
              const acceptanceChecks =
                requirement &&
                typeof requirement === 'object' &&
                !Array.isArray(requirement) &&
                Array.isArray(requirement.acceptanceChecks)
                  ? requirement.acceptanceChecks.filter(
                      (value) => typeof value === 'string' && value.trim().length > 0,
                    )
                  : [];
              const cannotShipIf =
                requirement &&
                typeof requirement === 'object' &&
                !Array.isArray(requirement) &&
                Array.isArray(requirement.cannotShipIf)
                  ? requirement.cannotShipIf.filter(
                      (value) => typeof value === 'string' && value.trim().length > 0,
                    )
                  : [];

              if (!description) {
                validationErrors.push(`${id} is missing a requirement description.`);
              }
              if (source !== 'user' && source !== 'plan') {
                validationErrors.push(`${id} has unsupported source: ${source || '(missing)'}.`);
              }
              if (implementationAreas.length === 0) {
                validationErrors.push(`${id} is missing implementation areas.`);
              }
              if (acceptanceChecks.length === 0) {
                validationErrors.push(`${id} is missing concrete acceptance checks.`);
              }
              if (cannotShipIf.length === 0) {
                validationErrors.push(`${id} is missing cannot-ship-if checks.`);
              }

              return {
                id,
                description,
                source: source === 'user' ? 'user' : 'plan',
                implementationAreas,
                acceptanceChecks,
                cannotShipIf,
              };
            });

            const normalizeVerificationCheck = (value, index, fallbackSource) => {
              if (typeof value === 'string') {
                const commandOrDescription = value.trim();
                const id = `VERIFY-${String(index + 1).padStart(3, '0')}`;
                if (looksRunnable(commandOrDescription)) {
                  return {
                    id,
                    type: 'command',
                    description: commandOrDescription,
                    command: commandOrDescription,
                    expectedExitCode: 0,
                    expectedStdoutIncludes: [],
                    expectedStderrIncludes: [],
                    expectedOutputIncludes: [],
                    source: fallbackSource,
                  };
                }
                return {
                  id,
                  type: 'scenario',
                  description: commandOrDescription,
                  command: '',
                  expectedExitCode: 0,
                  expectedStdoutIncludes: [],
                  expectedStderrIncludes: [],
                  expectedOutputIncludes: [],
                  source: fallbackSource,
                };
              }

              const candidate =
                value && typeof value === 'object' && !Array.isArray(value)
                  ? value
                  : {};
              const id =
                typeof candidate.id === 'string' && candidate.id.trim().length > 0
                  ? candidate.id.trim()
                  : `VERIFY-${String(index + 1).padStart(3, '0')}`;
              const type =
                candidate.type === 'scenario' || candidate.type === 'manual'
                  ? candidate.type
                  : 'command';
              const description =
                typeof candidate.description === 'string'
                  ? candidate.description.trim()
                  : '';
              const command =
                typeof candidate.command === 'string'
                  ? candidate.command.trim()
                  : '';
              const normalized = {
                id,
                type,
                description: description || command,
                command: '',
                expectedExitCode: normalizeExpectedExitCode(candidate.expectedExitCode),
                expectedStdoutIncludes: toStringList(candidate.expectedStdoutIncludes),
                expectedStderrIncludes: toStringList(candidate.expectedStderrIncludes),
                expectedOutputIncludes: toStringList(candidate.expectedOutputIncludes),
                source: fallbackSource,
              };

              if (type === 'command') {
                if (!command) {
                  const explicitRunnableCommands = collectExplicitRunnableCommands(
                    normalized.description,
                  );
                  if (explicitRunnableCommands.length === 1) {
                    normalized.command = explicitRunnableCommands[0];
                  } else if (normalized.description) {
                    return downgradeCommandCheckToScenario(normalized, command);
                  } else {
                    validationErrors.push(
                      `${id} is a command verification check without a command or scenario description.`,
                    );
                  }
                } else if (!looksRunnable(command)) {
                  return downgradeCommandCheckToScenario(normalized, command);
                } else {
                  normalized.command = command;
                }
              } else {
                const explicitRunnableCommands = collectExplicitRunnableCommands(
                  command || normalized.description,
                );
                if (type === 'scenario' && explicitRunnableCommands.length === 1) {
                  return {
                    ...normalized,
                    type: 'command',
                    command: explicitRunnableCommands[0],
                  };
                }
                if (!normalized.description) {
                  validationErrors.push(`${id} ${type} verification check is missing a description.`);
                } else if (
                  type === 'scenario' &&
                  !command &&
                  scenarioNeedsExplicitCommand(id, normalized.description)
                ) {
                  validationErrors.push(
                    `${id} is a scenario verification check that appears automatable but has no explicit command.`,
                  );
                }
              }

              return normalized;
            };

            const rawVerificationChecks =
              contract &&
              typeof contract === 'object' &&
              !Array.isArray(contract) &&
              Array.isArray(contract.verificationChecks)
                ? contract.verificationChecks
                : [];
            const normalizedVerificationChecks =
              rawVerificationChecks.length > 0
                ? rawVerificationChecks.map((check, index) =>
                    normalizeVerificationCheck(check, index, 'plan_contract'),
                  )
                : verificationCommands.map((command, index) =>
                    normalizeVerificationCheck(command, index, 'verificationCommands'),
                  );
            const normalizedVerificationCommands = normalizedVerificationChecks
              .filter((check) => check.type === 'command' && typeof check.command === 'string')
              .map((check) => check.command.trim())
              .filter(Boolean);
            const verificationScenarioCount = normalizedVerificationChecks.filter(
              (check) => check.type === 'scenario',
            ).length;
            const verificationManualCount = normalizedVerificationChecks.filter(
              (check) => check.type === 'manual',
            ).length;

            const normalizedContract = {
              requirements: normalizedRequirements,
              nonGoals,
              verificationChecks: normalizedVerificationChecks,
              verificationCommands: normalizedVerificationCommands,
              manualChecks,
            };

            fs.writeFileSync(
              contractFile,
              `${JSON.stringify(normalizedContract, null, 2)}\n`,
              'utf8',
            );
            fs.appendFileSync({{BRAND_OUTPUT_VARIABLE_NAME}}, `contract_file=${contractFile}\n`, 'utf8');
            fs.appendFileSync(
              {{BRAND_OUTPUT_VARIABLE_NAME}},
              `requirement_count=${String(normalizedRequirements.length)}\n`,
              'utf8',
            );
            fs.appendFileSync(
              {{BRAND_OUTPUT_VARIABLE_NAME}},
              `non_goal_count=${String(nonGoals.length)}\n`,
              'utf8',
            );
            fs.appendFileSync(
              {{BRAND_OUTPUT_VARIABLE_NAME}},
              `verification_check_count=${String(normalizedVerificationChecks.length)}\n`,
              'utf8',
            );
            fs.appendFileSync(
              {{BRAND_OUTPUT_VARIABLE_NAME}},
              `verification_command_count=${String(normalizedVerificationCommands.length)}\n`,
              'utf8',
            );
            fs.appendFileSync(
              {{BRAND_OUTPUT_VARIABLE_NAME}},
              `verification_scenario_count=${String(verificationScenarioCount)}\n`,
              'utf8',
            );
            fs.appendFileSync(
              {{BRAND_OUTPUT_VARIABLE_NAME}},
              `verification_manual_count=${String(verificationManualCount)}\n`,
              'utf8',
            );
            fs.appendFileSync(
              {{BRAND_OUTPUT_VARIABLE_NAME}},
              `manual_check_count=${String(manualChecks.length)}\n`,
              'utf8',
            );
            fs.appendFileSync(
              {{BRAND_OUTPUT_VARIABLE_NAME}},
              `validation_error_count=${String(validationErrors.length)}\n`,
              'utf8',
            );
            const validationErrorSummary = validationErrors
              .join(' ')
              .replace(/\s+/g, ' ')
              .trim();
            fs.appendFileSync(
              {{BRAND_OUTPUT_VARIABLE_NAME}},
              `validation_error_summary=${validationErrorSummary}\n`,
              'utf8',
            );
            fs.appendFileSync(
              {{BRAND_OUTPUT_VARIABLE_NAME}},
              `failure_skipped=${validationErrors.length > 0 && continueOnFail ? 'true' : 'false'}\n`,
              'utf8',
            );

            if (validationErrors.length > 0 && !continueOnFail) {
              throw new Error(
                `Formal plan is not implementation-ready: ${validationErrorSummary}`,
              );
            }
          env:
            CONTRACT_SOURCE_FILE: ${{ steps.extract_plan_contract.outputs.json_response_file }}
            COMPLEXITY: ${{ needs.complexity_analysis.outputs.complexity }}
            CONTINUE_ON_PLAN_CONTRACT_FAIL: 'true'

    plan_scope:
      name: Derive Plan Scope
      needs:
        - plan_contract
      if: needs.plan_contract.result == 'success'
      outputs:
        plan_scope_file: ${{ steps.derive_plan_scope.outputs.plan_scope_file }}
        plan_scope_summary_file: ${{ steps.derive_plan_scope.outputs.plan_scope_summary_file }}
      steps:
        - id: derive_plan_scope
          name: Derive Plan-Authorized Paths
          shell: node
          run: |
            import fs from 'node:fs';
            import path from 'node:path';

            const {{BRAND_OUTPUT_VARIABLE_NAME}} = process.env.{{BRAND_ENV_PREFIX}}_OUTPUT ?? '';
            if (!{{BRAND_OUTPUT_VARIABLE_NAME}}) {
              throw new Error('{{BRAND_ENV_PREFIX}}_OUTPUT is required');
            }

            const contractFile = (process.env.CONTRACT_FILE ?? '').trim();
            if (!contractFile || !fs.existsSync(contractFile)) {
              throw new Error(`Missing plan contract file: ${contractFile || '(empty)'}`);
            }

            const outputDir =
              process.env.{{BRAND_ENV_PREFIX}}_OUTPUT_DIR ?? path.dirname({{BRAND_OUTPUT_VARIABLE_NAME}});
            const planScopeFile = path.join(outputDir, 'plan-scope.json');
            const planScopeSummaryFile = path.join(outputDir, 'plan-scope.md');
            const contract = JSON.parse(fs.readFileSync(contractFile, 'utf8'));
            const requirements = Array.isArray(contract.requirements)
              ? contract.requirements
              : [];
            const exactPathMap = new Map();
            const prefixMap = new Map();
            const protectedExactPathMap = new Map();
            const protectedPrefixMap = new Map();
            const broadAreas = [];
            const protectedBroadAreas = [];
            const extractionWarnings = [];
            const rootFileNames = new Set([
              'package.json',
              'package-lock.json',
              'pnpm-lock.yaml',
              'yarn.lock',
              'README.md',
              'tsconfig.json',
              '.env.example',
            ]);
            const fileExtensionPattern = /(?:^|\/)[^/]+\.[A-Za-z0-9][A-Za-z0-9_-]*$/;
            const pathLikePattern = /(?:`([^`]+)`|"([^"]+)"|'([^']+)'|((?:[A-Za-z0-9_.-]+\/)+[A-Za-z0-9_.-]+\/?|(?:package-lock\.json|package\.json|README\.md|tsconfig\.json|\.env\.example|pnpm-lock\.yaml|yarn\.lock)))/g;
            const unsafePathTokenPattern = /[\s{}\[\]<>"'`$;|&]/;
            const commandWordPattern = /^(?:bash|bun|cargo|cat|cd|chmod|cp|curl|deno|git|gh|go|make|mkdir|mv|node|npm|npx|pnpm|python|python3|rm|sh|swift|yarn)\b/;
            const envAssignmentPattern = /^[A-Za-z_][A-Za-z0-9_]*=/;
            const preservationRequirementPattern = /\b(?:preserve|pre-existing|existing dirty|unrelated existing|unrelated changes|do not revert|not revert|not reverted|not overwrite|avoid unrelated|protected|do not remove|leave (?:it|them) alone|non-goal)\b/i;
            const normalizePath = (value) =>
              String(value ?? '')
                .replace(/\\/g, '/')
                .replace(/^\.\//, '')
                .trim();
            const isValidRelativePath = (value) =>
              value.length > 0 &&
              !path.isAbsolute(value) &&
              !value.split('/').includes('..') &&
              !value.includes('${') &&
              !value.includes(':') &&
              !value.includes('*') &&
              !value.includes('?') &&
              !value.includes('...') &&
              !unsafePathTokenPattern.test(value) &&
              !commandWordPattern.test(value) &&
              !envAssignmentPattern.test(value) &&
              !value.startsWith('-') &&
              !value.split('/').some((part) => part.startsWith('-')) &&
              !value.startsWith('http://') &&
              !value.startsWith('https://');
            const addPathRecord = (targetMap, key, requirementId, reason) => {
              const current = targetMap.get(key) ?? {
                requirementIds: new Set(),
                reasons: new Set(),
              };
              current.requirementIds.add(requirementId);
              current.reasons.add(reason);
              targetMap.set(key, current);
            };
            const addCandidate = (rawCandidate, requirementId, reason, target) => {
              const targetExactMap =
                target === 'protected' ? protectedExactPathMap : exactPathMap;
              const targetPrefixMap =
                target === 'protected' ? protectedPrefixMap : prefixMap;
              const targetBroadAreas =
                target === 'protected' ? protectedBroadAreas : broadAreas;
              const candidate = normalizePath(rawCandidate);
              if (!isValidRelativePath(candidate)) {
                if (candidate) {
                  extractionWarnings.push(`Ignored unsafe or non-relative path candidate: ${candidate}`);
                }
                return;
              }

              const trimmed = candidate.replace(/\/+$/, candidate.endsWith('/') ? '/' : '');
              if (trimmed.endsWith('/')) {
                addPathRecord(targetPrefixMap, trimmed, requirementId, reason);
                return;
              }

              const baseName = trimmed.split('/').pop() ?? '';
              const hasSlash = trimmed.includes('/');
              const looksLikeExactFile =
                rootFileNames.has(trimmed) ||
                rootFileNames.has(baseName) ||
                fileExtensionPattern.test(trimmed);
              if (looksLikeExactFile) {
                addPathRecord(targetExactMap, trimmed, requirementId, reason);
              } else if (hasSlash) {
                addPathRecord(targetPrefixMap, `${trimmed}/`, requirementId, reason);
              } else {
                targetBroadAreas.push({
                  description: trimmed,
                  requirementIds: [requirementId],
                });
              }
            };
            const collectCandidates = (text, requirementId, reason, target) => {
              for (const match of String(text ?? '').matchAll(pathLikePattern)) {
                const candidate = match[1] ?? match[2] ?? match[3] ?? match[4] ?? '';
                addCandidate(candidate, requirementId, reason, target);
              }
            };
            const recordIgnoredNonImplementationCandidates = (text, requirementId, reason) => {
              for (const match of String(text ?? '').matchAll(pathLikePattern)) {
                const candidate = normalizePath(match[1] ?? match[2] ?? match[3] ?? match[4] ?? '');
                if (candidate) {
                  extractionWarnings.push(
                    `Ignored non-implementation path candidate for ${requirementId}: ${candidate} (${reason})`,
                  );
                }
              }
            };
            const requirementListText = (value) =>
              Array.isArray(value)
                ? value.filter((entry) => typeof entry === 'string').join('\n')
                : '';
            const isPreservationRequirement = (requirement) =>
              preservationRequirementPattern.test(
                [
                  typeof requirement.description === 'string'
                    ? requirement.description
                    : '',
                  requirementListText(requirement.acceptanceChecks),
                  requirementListText(requirement.cannotShipIf),
                  requirementListText(requirement.implementationAreas),
                ].join('\n'),
              );

            for (const requirement of requirements) {
              if (!requirement || typeof requirement !== 'object' || Array.isArray(requirement)) {
                continue;
              }
              const requirementId =
                typeof requirement.id === 'string' && requirement.id.trim()
                  ? requirement.id.trim()
                  : 'REQ-UNKNOWN';
              const target = isPreservationRequirement(requirement)
                ? 'protected'
                : 'allowed';
              const collectList = (value, reason, allowBroadAreas) => {
                if (!Array.isArray(value)) {
                  return;
                }
                for (const entry of value) {
                  if (typeof entry !== 'string' || entry.trim().length === 0) {
                    continue;
                  }
                  collectCandidates(entry, requirementId, reason, target);
                  if (allowBroadAreas && !entry.match(pathLikePattern)) {
                    const targetBroadAreas =
                      target === 'protected' ? protectedBroadAreas : broadAreas;
                    targetBroadAreas.push({
                      description: entry.trim(),
                      requirementIds: [requirementId],
                    });
                  }
                }
              };

              collectList(
                requirement.implementationAreas,
                'Found path-like token in requirement implementation area',
                true,
              );
              recordIgnoredNonImplementationCandidates(
                requirement.description,
                requirementId,
                'requirement description',
              );
              for (const entry of Array.isArray(requirement.acceptanceChecks)
                ? requirement.acceptanceChecks
                : []) {
                recordIgnoredNonImplementationCandidates(
                  entry,
                  requirementId,
                  'acceptance check',
                );
              }
              for (const entry of Array.isArray(requirement.cannotShipIf)
                ? requirement.cannotShipIf
                : []) {
                recordIgnoredNonImplementationCandidates(
                  entry,
                  requirementId,
                  'cannot-ship check',
                );
              }
            }

            const serializeMap = (targetMap, keyName) =>
              Array.from(targetMap.entries())
                .sort((left, right) => left[0].localeCompare(right[0]))
                .map(([key, value]) => ({
                  [keyName]: key,
                  requirementIds: Array.from(value.requirementIds).sort(),
                  reason: Array.from(value.reasons).sort().join('; '),
                }));
            const dedupeBroadAreas = (entries) =>
              Array.from(
                entries
                  .reduce((targetMap, entry) => {
                    const description =
                      typeof entry.description === 'string'
                        ? entry.description.trim()
                        : '';
                    if (!description) {
                      return targetMap;
                    }
                    const current = targetMap.get(description) ?? new Set();
                    for (const requirementId of entry.requirementIds ?? []) {
                      current.add(requirementId);
                    }
                    targetMap.set(description, current);
                    return targetMap;
                  }, new Map())
                  .entries(),
              )
                .sort((left, right) => left[0].localeCompare(right[0]))
                .map(([description, requirementIds]) => ({
                  description,
                  requirementIds: Array.from(requirementIds).sort(),
                }));
            const dedupedBroadAreas = dedupeBroadAreas(broadAreas);
            const dedupedProtectedBroadAreas = dedupeBroadAreas(protectedBroadAreas);
            const planScope = {
              version: 1,
              generatedAt: new Date().toISOString(),
              sourceContractFile: contractFile,
              allowedExactPaths: serializeMap(exactPathMap, 'path'),
              allowedPathPrefixes: serializeMap(prefixMap, 'prefix'),
              broadAreas: dedupedBroadAreas,
              protectedExactPaths: serializeMap(protectedExactPathMap, 'path'),
              protectedPathPrefixes: serializeMap(protectedPrefixMap, 'prefix'),
              protectedBroadAreas: dedupedProtectedBroadAreas,
              extractionWarnings,
            };
            const summaryLines = [
              '# Plan Scope',
              '',
              `- Exact paths: ${String(planScope.allowedExactPaths.length)}`,
              `- Path prefixes: ${String(planScope.allowedPathPrefixes.length)}`,
              `- Broad areas: ${String(planScope.broadAreas.length)}`,
              `- Protected exact paths: ${String(planScope.protectedExactPaths.length)}`,
              `- Protected path prefixes: ${String(planScope.protectedPathPrefixes.length)}`,
              `- Protected broad areas: ${String(planScope.protectedBroadAreas.length)}`,
              `- Extraction warnings: ${String(extractionWarnings.length)}`,
              '',
              '## Exact Paths',
              ...(planScope.allowedExactPaths.length
                ? planScope.allowedExactPaths.map(
                    (entry) => `- ${entry.path} (${entry.requirementIds.join(', ')})`,
                  )
                : ['- None']),
              '',
              '## Path Prefixes',
              ...(planScope.allowedPathPrefixes.length
                ? planScope.allowedPathPrefixes.map(
                    (entry) => `- ${entry.prefix} (${entry.requirementIds.join(', ')})`,
                  )
                : ['- None']),
              '',
              '## Broad Areas',
              ...(planScope.broadAreas.length
                ? planScope.broadAreas.map(
                    (entry) => `- ${entry.description} (${entry.requirementIds.join(', ')})`,
                  )
                : ['- None']),
              '',
              '## Protected Exact Paths',
              ...(planScope.protectedExactPaths.length
                ? planScope.protectedExactPaths.map(
                    (entry) => `- ${entry.path} (${entry.requirementIds.join(', ')})`,
                  )
                : ['- None']),
              '',
              '## Protected Path Prefixes',
              ...(planScope.protectedPathPrefixes.length
                ? planScope.protectedPathPrefixes.map(
                    (entry) => `- ${entry.prefix} (${entry.requirementIds.join(', ')})`,
                  )
                : ['- None']),
              '',
              '## Protected Broad Areas',
              ...(planScope.protectedBroadAreas.length
                ? planScope.protectedBroadAreas.map(
                    (entry) => `- ${entry.description} (${entry.requirementIds.join(', ')})`,
                  )
                : ['- None']),
              '',
            ];

            fs.writeFileSync(
              planScopeFile,
              `${JSON.stringify(planScope, null, 2)}\n`,
              'utf8',
            );
            fs.writeFileSync(planScopeSummaryFile, `${summaryLines.join('\n')}\n`, 'utf8');
            fs.appendFileSync({{BRAND_OUTPUT_VARIABLE_NAME}}, `plan_scope_file=${planScopeFile}\n`, 'utf8');
            fs.appendFileSync(
              {{BRAND_OUTPUT_VARIABLE_NAME}},
              `plan_scope_summary_file=${planScopeSummaryFile}\n`,
              'utf8',
            );
          env:
            CONTRACT_FILE: ${{ needs.plan_contract.outputs.contract_file }}

    workspace_checkpoint:
      name: Capture Workspace Checkpoint
      needs:
        - prepare_plan
        - complexity_analysis
        - refine_gate
        - plan_contract
        - plan_scope
      if: needs.complexity_analysis.result == 'success' && needs.refine_gate.result == 'success' && needs.plan_contract.result == 'success' && needs.plan_scope.result == 'success'
      outputs:
        checkpoint_file: ${{ steps.capture_workspace_checkpoint.outputs.workspace_checkpoint_file }}
        workspace_summary_file: ${{ steps.capture_workspace_checkpoint.outputs.workspace_summary_file }}
        changed_files_file: ${{ steps.capture_workspace_checkpoint.outputs.changed_files_file }}
        baseline_classification_file: ${{ steps.capture_workspace_checkpoint.outputs.baseline_classification_file }}
        pipeline_changed_files_file: ${{ steps.capture_workspace_checkpoint.outputs.pipeline_changed_files_file }}
        review_changed_files_file: ${{ steps.capture_workspace_checkpoint.outputs.review_changed_files_file }}
        review_diff_file: ${{ steps.capture_workspace_checkpoint.outputs.review_diff_file }}
        protected_drift_file: ${{ steps.capture_workspace_checkpoint.outputs.protected_drift_file }}
        protected_drift_summary_file: ${{ steps.capture_workspace_checkpoint.outputs.protected_drift_summary_file }}
      steps:
        - id: capture_workspace_checkpoint
          name: Capture Pipeline-Start Workspace Checkpoint
          uses: builtin/git-workspace-details
          with:
            include_uncommitted: true
            plan_scope_file: ${{ needs.plan_scope.outputs.plan_scope_file }}

    plan_partition:
      name: Plan Partition
      needs:
        - prepare_plan
        - complexity_analysis
        - refine_gate
        - plan_contract
        - plan_scope
        - workspace_checkpoint
      if: needs.complexity_analysis.result == 'success' && needs.refine_gate.result == 'success' && needs.plan_contract.result == 'success' && needs.plan_scope.result == 'success' && needs.workspace_checkpoint.result == 'success'
      outputs:
        has_frontend_plan: ${{ parseJson(steps.partition_plan.outputs.json_response).has_frontend_plan }}
        frontend_plan_path: ${{ parseJson(steps.partition_plan.outputs.json_response).frontend_plan_path }}
        has_backend_plan: ${{ parseJson(steps.partition_plan.outputs.json_response).has_backend_plan }}
        backend_plan_path: ${{ parseJson(steps.partition_plan.outputs.json_response).backend_plan_path }}
        has_transport_plan: ${{ parseJson(steps.partition_plan.outputs.json_response).has_transport_plan }}
        transport_plan_path: ${{ parseJson(steps.partition_plan.outputs.json_response).transport_plan_path }}
      steps:
        - id: partition_plan
          name: Partition Plan Into Frontend, Backend, and Transport
          uses: builtin/agent-prompt
          with:
            model: opus
            thinking_effort: max
            permission_preset: dangerous_all
            setting_sources: '[]'
            prompt: |
              Read the plan document at `${{ needs.prepare_plan.outputs.plan_path }}`.

              Your task is to split this plan into up to three standalone plan documents:
              1. **Frontend plan** — UI components, styling, user interactions, renderer-side logic
              2. **Backend plan** — server/main-process logic, data processing, business rules, database operations
              3. **Transport plan** — the communication layer between frontend and backend: API contracts, IPC channels, shared types, data shapes, request/response interfaces

              Splitting rules:
              - Each split plan must be fully self-contained with clear boundaries so it can be implemented independently.
              - The transport plan locks down how the two layers communicate. It should be implemented first so frontend and backend work against agreed contracts.
              - If the plan has only minor touches to the frontend with significant backend changes, or vice versa, do NOT split. Instead, passthrough the entire plan to the dominant side's plan file and set the other booleans to false.
              - When classifying individual items from the plan, if any item's split direction is ambiguous (e.g., documentation updates, tooling changes, config work, or items that don't clearly map to frontend vs backend), classify that item as "backend."

              For each plan you produce, write it as a new file in the same directory as the original plan:
              - Frontend plan: same filename with `-frontend` suffix before the extension
              - Backend plan: same filename with `-backend` suffix before the extension
              - Transport plan: same filename with `-transport` suffix before the extension

              For plans you are NOT producing (because the split is not warranted), set the corresponding `has_*` field to `false` and the path to an empty string.

              Return structured JSON with:
              - `has_frontend_plan`: true if a frontend plan was created
              - `frontend_plan_path`: absolute path to the frontend plan file, or empty string
              - `has_backend_plan`: true if a backend plan was created
              - `backend_plan_path`: absolute path to the backend plan file, or empty string
              - `has_transport_plan`: true if a transport plan was created
              - `transport_plan_path`: absolute path to the transport plan file, or empty string
            structured_output_schema: >-
              {"type":"object","additionalProperties":false,"properties":{"has_frontend_plan":{"type":"boolean"},"frontend_plan_path":{"type":"string"},"has_backend_plan":{"type":"boolean"},"backend_plan_path":{"type":"string"},"has_transport_plan":{"type":"boolean"},"transport_plan_path":{"type":"string"}},"required":["has_frontend_plan","frontend_plan_path","has_backend_plan","backend_plan_path","has_transport_plan","transport_plan_path"]}

        - id: implement_transport_layer
          name: Implement Transport Layer
          if: parseJson(steps.partition_plan.outputs.json_response).has_transport_plan == true
          uses: builtin/agent-prompt
          with:
            model: opus
            thinking_effort: xhigh
            permission_preset: dangerous_all
            setting_sources: '[]'
            max_turns: '${{ needs.complexity_analysis.outputs.implementation_max_turns }}'
            prompt: |
              Implement the transport layer plan in this repository.

              Read the transport plan document at `${{ parseJson(steps.partition_plan.outputs.json_response).transport_plan_path }}` and carry the work through to a complete implementation.
              Read the pipeline-start workspace checkpoint at `${{ needs.workspace_checkpoint.outputs.checkpoint_file }}` before editing.

              Strict boundaries — you must ONLY make changes that facilitate the communication layer between frontend and backend:
              - shared types, interfaces, and data shapes
              - IPC channel definitions and contracts
              - API route signatures and request/response types
              - preload bridge declarations
              - communication plumbing and serialization logic

              Do NOT implement frontend UI components, styling, or user interactions.
              Do NOT implement backend business logic, data processing, or storage operations.
              Do NOT remove, revert, or clean up pre-existing branch/worktree changes captured in the checkpoint unless this transport plan explicitly requires touching those paths. If protected pre-existing changes conflict with the plan, report the conflict instead of deleting them.

              Expectations:
              - make the required transport layer changes directly in the workspace
              - do not stop until the plan has been fully implemented
              - do not run `git commit`, `git push`, create branches, or otherwise change repository history; the dedicated commit job handles commits when enabled
              - run or update tests and verification as needed
              - resolve obvious issues only when they are in plan-owned changes or required for this transport plan to compile and verify
              - if unrelated pre-existing work blocks verification, report the conflict in the summary instead of editing or deleting that work
              - summarize the work completed and verification performed

    qa_intent_summary:
      name: Prepare QA Intent Summary
      needs:
        - prepare_plan
        - complexity_analysis
        - refine_gate
        - plan_contract
      if: needs.complexity_analysis.result == 'success' && needs.refine_gate.result == 'success' && needs.plan_contract.result == 'success'
      outputs:
        qa_intent_summary_file: ${{ steps.prepare_qa_intent_summary.outputs.text_response_file }}
      steps:
        - id: prepare_qa_intent_summary
          name: Prepare QA Intent Summary
          uses: builtin/agent-prompt
          with:
            model: $fast
            thinking_effort: xhigh
            permission_preset: read_only
            prompt: |
              Prepare a concise QA intent summary for the approved implementation plan.

              Read the final plan at `${{ needs.prepare_plan.outputs.plan_path }}`.
              Read the machine-readable plan completion contract at `${{ needs.plan_contract.outputs.contract_file }}`.

              If `${{ needs.refine_gate.outputs.critic_summary }}` is non-empty, use it only as supplemental context about what the refine critic accepted in the final plan.

              Write a short QA reference document that captures the approved implementation intent without re-planning the work.

              Include only what downstream QA agents need to judge the implementation fairly:
              - the overall goal and expected user-visible outcome
              - the main backend, frontend, and transport changes that are intentionally expected
              - any explicit boundaries, exclusions, or non-goals that QA should not mistake for omissions
              - the material requirements and cannot-ship checks from the plan completion contract
              - the most relevant targeted verification focus or commands explicitly called for by the plan, if present

              Requirements:
              - stay faithful to the approved plan
              - do not weaken, summarize away, or reinterpret the acceptance checks in the plan completion contract
              - do not add new requirements, advice, or design changes
              - keep it concise and easy to scan
              - prefer short sections or bullets over long prose

    implement:
      name: Implement
      needs:
        - complexity_analysis
        - plan_partition
        - workspace_checkpoint
      if: needs.complexity_analysis.result == 'success' && needs.plan_partition.result == 'success' && needs.workspace_checkpoint.result == 'success' && needs.plan_partition.outputs.has_backend_plan == 'true'
      outputs:
        implementation_summary_file: ${{ steps.implement_task.outputs.text_response_file }}
      steps:
        - id: implement_task
          name: Implement Backend With GPT-5.6 Sol
          uses: builtin/agent-prompt
          with:
            model: $default-codex
            thinking_effort: xhigh
            permission_preset: dangerous_all
            prompt: |
              Implement the approved backend plan in this repository.

              Read the plan document at `${{ needs.plan_partition.outputs.backend_plan_path }}` and carry the work through to a complete implementation.
              Read the pipeline-start workspace checkpoint at `${{ needs.workspace_checkpoint.outputs.checkpoint_file }}` before editing.

              Expectations:
              - make the required changes directly in the workspace
              - do not stop until the plan has been fully implemented
              - do not run `git commit`, `git push`, create branches, or otherwise change repository history; the dedicated commit job handles commits when enabled
              - preserve pre-existing branch/worktree changes captured in the checkpoint unless the approved plan explicitly requires touching those paths
              - do not remove, revert, or clean up protected pre-existing changes just because they are outside this plan; report a conflict instead
              - run or update tests and verification as needed
              - resolve obvious issues only when they are in plan-owned changes or required for this backend plan to compile and verify
              - if unrelated pre-existing work blocks verification, report the conflict in the summary instead of editing or deleting that work
              - summarize the work completed and verification performed

    implement_frontend:
      name: Implement Frontend
      needs:
        - complexity_analysis
        - plan_partition
        - workspace_checkpoint
      if: needs.complexity_analysis.result == 'success' && needs.plan_partition.result == 'success' && needs.workspace_checkpoint.result == 'success' && needs.plan_partition.outputs.has_frontend_plan == 'true'
      outputs:
        implementation_summary_file: ${{ steps.implement_frontend_task.outputs.text_response_file }}
      steps:
        - id: implement_frontend_task
          name: Implement Frontend With Opus
          uses: builtin/agent-prompt
          with:
            model: opus
            thinking_effort: xhigh
            permission_preset: dangerous_all
            setting_sources: '[]'
            max_turns: '${{ needs.complexity_analysis.outputs.implementation_max_turns }}'
            prompt: |
              Implement the approved frontend plan in this repository.

              Read the plan document at `${{ needs.plan_partition.outputs.frontend_plan_path }}` and carry the work through to a complete implementation.
              Read the pipeline-start workspace checkpoint at `${{ needs.workspace_checkpoint.outputs.checkpoint_file }}` before editing.

              Expectations:
              - make the required changes directly in the workspace
              - do not stop until the plan has been fully implemented
              - do not run `git commit`, `git push`, create branches, or otherwise change repository history; the dedicated commit job handles commits when enabled
              - preserve pre-existing branch/worktree changes captured in the checkpoint unless the approved plan explicitly requires touching those paths
              - do not remove, revert, or clean up protected pre-existing changes just because they are outside this plan; report a conflict instead
              - run or update tests and verification as needed
              - resolve obvious issues only when they are in plan-owned changes or required for this frontend plan to compile and verify
              - if unrelated pre-existing work blocks verification, report the conflict in the summary instead of editing or deleting that work
              - summarize the work completed and verification performed

    implementation_completion_loop:
      name: Implementation Completion Loop
      needs:
        - prepare_plan
        - complexity_analysis
        - plan_contract
        - plan_scope
        - plan_partition
        - workspace_checkpoint
        - implement
        - implement_frontend
      if: needs.complexity_analysis.result == 'success' && needs.plan_contract.result == 'success' && needs.plan_scope.result == 'success' && needs.plan_partition.result == 'success' && needs.workspace_checkpoint.result == 'success' && (needs.implement.result == 'success' || needs.implement.result == 'skipped') && (needs.implement_frontend.result == 'success' || needs.implement_frontend.result == 'skipped') && (needs.plan_partition.outputs.has_backend_plan == 'true' || needs.plan_partition.outputs.has_frontend_plan == 'true' || needs.plan_partition.outputs.has_transport_plan == 'true')
      max_iterations: '${{ needs.complexity_analysis.outputs.completion_validation_max_iterations }}'
      outputs:
        complete: ${{ steps.inspect_completion_result.outputs.complete }}
        completion_json_file: ${{ steps.inspect_completion_result.outputs.completion_json_file }}
        missing_requirement_count: ${{ steps.inspect_completion_result.outputs.missing_requirement_count }}
        incorrect_implementation_count: ${{ steps.inspect_completion_result.outputs.incorrect_implementation_count }}
        verification_gap_count: ${{ steps.inspect_completion_result.outputs.verification_gap_count }}
        restart_requested: ${{ steps.restart_completion_if_needed.outputs.restart_requested }}
        iteration_limit_reached: ${{ steps.capture_completion_iteration_limit_state.outputs.iteration_limit_reached }}
        iteration_limit_summary: ${{ steps.capture_completion_iteration_limit_state.outputs.iteration_limit_summary }}
        failure_skipped: ${{ steps.capture_completion_iteration_limit_state.outputs.failure_skipped }}
      steps:
        - id: load_completion_loop_state
          name: Load Completion Loop State
          shell: node
          run: |
            import fs from 'node:fs';
            import path from 'node:path';

            const {{BRAND_OUTPUT_VARIABLE_NAME}} = process.env.{{BRAND_ENV_PREFIX}}_OUTPUT ?? '';
            if (!{{BRAND_OUTPUT_VARIABLE_NAME}}) {
              throw new Error('{{BRAND_ENV_PREFIX}}_OUTPUT is required');
            }
            const outputDir = process.env.{{BRAND_ENV_PREFIX}}_OUTPUT_DIR ?? path.dirname({{BRAND_OUTPUT_VARIABLE_NAME}});
            const stateFile = path.join(outputDir, 'implementation-completion-loop-state.json');

            let state = {};
            if (fs.existsSync(stateFile)) {
              state = JSON.parse(fs.readFileSync(stateFile, 'utf8'));
            }

            const fixerSessionId =
              state &&
              typeof state === 'object' &&
              !Array.isArray(state) &&
              typeof state.fixerSessionId === 'string'
                ? state.fixerSessionId.trim()
                : '';
            const latestFixSummaryFile =
              state &&
              typeof state === 'object' &&
              !Array.isArray(state) &&
              typeof state.latestFixSummaryFile === 'string'
                ? state.latestFixSummaryFile.trim()
                : '';
            const latestFixResultFile =
              state &&
              typeof state === 'object' &&
              !Array.isArray(state) &&
              typeof state.latestFixResultFile === 'string'
                ? state.latestFixResultFile.trim()
                : '';

            fs.appendFileSync({{BRAND_OUTPUT_VARIABLE_NAME}}, `state_file=${stateFile}\n`, 'utf8');
            fs.appendFileSync({{BRAND_OUTPUT_VARIABLE_NAME}}, `fixer_session_id=${fixerSessionId}\n`, 'utf8');
            fs.appendFileSync({{BRAND_OUTPUT_VARIABLE_NAME}}, `latest_fix_summary_file=${latestFixSummaryFile}\n`, 'utf8');
            fs.appendFileSync({{BRAND_OUTPUT_VARIABLE_NAME}}, `latest_fix_result_file=${latestFixResultFile}\n`, 'utf8');

        - id: completion_workspace_details
          name: Gather Completion Workspace Details
          uses: builtin/git-workspace-details
          with:
            include_uncommitted: true
            checkpoint_file: ${{ needs.workspace_checkpoint.outputs.checkpoint_file }}
            plan_scope_file: ${{ needs.plan_scope.outputs.plan_scope_file }}

        - id: prepare_completion_context
          name: Prepare Completion Validation Context
          shell: node
          run: |
            import fs from 'node:fs';
            import path from 'node:path';

            const {{BRAND_OUTPUT_VARIABLE_NAME}} = process.env.{{BRAND_ENV_PREFIX}}_OUTPUT ?? '';
            if (!{{BRAND_OUTPUT_VARIABLE_NAME}}) {
              throw new Error('{{BRAND_ENV_PREFIX}}_OUTPUT is required');
            }

            const outputDir =
              process.env.{{BRAND_ENV_PREFIX}}_OUTPUT_DIR ?? path.dirname({{BRAND_OUTPUT_VARIABLE_NAME}});
            const iteration = Number.parseInt(process.env.{{BRAND_ENV_PREFIX}}_JOB_ITERATION ?? '1', 10) || 1;
            const contextFile = path.join(outputDir, 'completion-context.json');
            const contextSummaryFile = path.join(outputDir, 'completion-context.md');
            const previousCompletionFile = path.join(
              outputDir,
              'implementation-completion-latest.json',
            );
            const latestFixSummaryFile =
              (process.env.LATEST_FIX_SUMMARY_FILE ?? '').trim();
            const latestFixResultFile =
              (process.env.LATEST_FIX_RESULT_FILE ?? '').trim();
            const protectedDriftFile =
              (process.env.PROTECTED_DRIFT_FILE ?? '').trim();
            const reviewChangedFilesFile =
              (process.env.REVIEW_CHANGED_FILES_FILE ?? '').trim();
            const readJsonFile = (filePath, fallback) => {
              if (!filePath || !fs.existsSync(filePath)) {
                return fallback;
              }
              try {
                return JSON.parse(fs.readFileSync(filePath, 'utf8'));
              } catch {
                return fallback;
              }
            };
            const previousCompletion = readJsonFile(previousCompletionFile, null);
            const latestFixResult = readJsonFile(latestFixResultFile, null);
            const protectedDrift = readJsonFile(protectedDriftFile, []);
            const reviewChangedFiles = readJsonFile(reviewChangedFilesFile, []);
            const priorGapCounts =
              previousCompletion &&
              typeof previousCompletion === 'object' &&
              !Array.isArray(previousCompletion)
                ? {
                    missingRequirements: Array.isArray(previousCompletion.missingRequirements)
                      ? previousCompletion.missingRequirements.length
                      : 0,
                    incorrectImplementations: Array.isArray(previousCompletion.incorrectImplementations)
                      ? previousCompletion.incorrectImplementations.length
                      : 0,
                    verificationGaps: Array.isArray(previousCompletion.verificationGaps)
                      ? previousCompletion.verificationGaps.length
                      : 0,
                  }
                : {
                    missingRequirements: 0,
                    incorrectImplementations: 0,
                    verificationGaps: 0,
                  };
            const protectedDriftCount = Array.isArray(protectedDrift)
              ? protectedDrift.length
              : 0;
            const reviewChangedFileCount = Array.isArray(reviewChangedFiles)
              ? reviewChangedFiles.length
              : 0;
            const fixResultValid =
              latestFixResult &&
              typeof latestFixResult === 'object' &&
              !Array.isArray(latestFixResult) &&
              Array.isArray(latestFixResult.changedFiles);
            const fullRevalidationRequired =
              iteration <= 1 ||
              !fs.existsSync(previousCompletionFile) ||
              (latestFixSummaryFile && !fixResultValid) ||
              protectedDriftCount > 0;
            const reason =
              iteration <= 1
                ? 'first completion validation pass'
                : !fs.existsSync(previousCompletionFile)
                  ? 'previous completion report is unavailable'
                  : latestFixSummaryFile && !fixResultValid
                    ? 'latest fixer result is missing or malformed'
                    : protectedDriftCount > 0
                      ? 'protected drift is present and requires full validation'
                      : 'latest fixer produced structured results and no protected drift was detected';
            const context = {
              version: 1,
              iteration,
              mode: fullRevalidationRequired ? 'full' : 'gap_focused',
              fullRevalidationRequired,
              reason,
              previousCompletionFile: fs.existsSync(previousCompletionFile)
                ? previousCompletionFile
                : '',
              latestFixSummaryFile,
              latestFixResultFile,
              artifactPaths: {
                plan: (process.env.PLAN_PATH ?? '').trim(),
                contract: (process.env.CONTRACT_FILE ?? '').trim(),
                backendPlan: (process.env.BACKEND_PLAN_PATH ?? '').trim(),
                frontendPlan: (process.env.FRONTEND_PLAN_PATH ?? '').trim(),
                transportPlan: (process.env.TRANSPORT_PLAN_PATH ?? '').trim(),
                workspaceSummary: (process.env.WORKSPACE_SUMMARY_FILE ?? '').trim(),
                reviewDiff: (process.env.REVIEW_DIFF_FILE ?? '').trim(),
                fullDiff: (process.env.FULL_DIFF_FILE ?? '').trim(),
                reviewChangedFiles: reviewChangedFilesFile,
                protectedDrift: protectedDriftFile,
                baselineClassification: (process.env.BASELINE_CLASSIFICATION_FILE ?? '').trim(),
              },
              priorGapCounts,
              protectedDriftCount,
              reviewChangedFileCount,
            };
            const summaryLines = [
              '# Completion Validation Context',
              '',
              `- Mode: ${context.mode}`,
              `- Full revalidation required: ${String(fullRevalidationRequired)}`,
              `- Reason: ${reason}`,
              `- Prior missing requirements: ${String(priorGapCounts.missingRequirements)}`,
              `- Prior incorrect implementations: ${String(priorGapCounts.incorrectImplementations)}`,
              `- Prior verification gaps: ${String(priorGapCounts.verificationGaps)}`,
              `- Reviewable changed files: ${String(reviewChangedFileCount)}`,
              `- Protected drift files: ${String(protectedDriftCount)}`,
              '',
              '## Artifact Paths',
              ...Object.entries(context.artifactPaths).map(
                ([key, value]) => `- ${key}: ${value || '(none)'}`,
              ),
              '',
            ];

            fs.writeFileSync(contextFile, `${JSON.stringify(context, null, 2)}\n`, 'utf8');
            fs.writeFileSync(contextSummaryFile, `${summaryLines.join('\n')}\n`, 'utf8');
            fs.appendFileSync({{BRAND_OUTPUT_VARIABLE_NAME}}, `completion_context_file=${contextFile}\n`, 'utf8');
            fs.appendFileSync(
              {{BRAND_OUTPUT_VARIABLE_NAME}},
              `completion_context_summary_file=${contextSummaryFile}\n`,
              'utf8',
            );
            fs.appendFileSync({{BRAND_OUTPUT_VARIABLE_NAME}}, `validation_mode=${context.mode}\n`, 'utf8');
          env:
            PLAN_PATH: ${{ needs.prepare_plan.outputs.plan_path }}
            CONTRACT_FILE: ${{ needs.plan_contract.outputs.contract_file }}
            BACKEND_PLAN_PATH: ${{ needs.plan_partition.outputs.backend_plan_path }}
            FRONTEND_PLAN_PATH: ${{ needs.plan_partition.outputs.frontend_plan_path }}
            TRANSPORT_PLAN_PATH: ${{ needs.plan_partition.outputs.transport_plan_path }}
            WORKSPACE_SUMMARY_FILE: ${{ steps.completion_workspace_details.outputs.workspace_summary_file }}
            REVIEW_DIFF_FILE: ${{ steps.completion_workspace_details.outputs.review_diff_file }}
            FULL_DIFF_FILE: ${{ steps.completion_workspace_details.outputs.diff_file }}
            REVIEW_CHANGED_FILES_FILE: ${{ steps.completion_workspace_details.outputs.review_changed_files_file }}
            PROTECTED_DRIFT_FILE: ${{ steps.completion_workspace_details.outputs.protected_drift_file }}
            BASELINE_CLASSIFICATION_FILE: ${{ steps.completion_workspace_details.outputs.baseline_classification_file }}
            LATEST_FIX_SUMMARY_FILE: ${{ steps.load_completion_loop_state.outputs.latest_fix_summary_file }}
            LATEST_FIX_RESULT_FILE: ${{ steps.load_completion_loop_state.outputs.latest_fix_result_file }}

        - id: validate_completion
          name: Validate Plan Completion
          uses: builtin/agent-prompt
          with:
            model: $default-codex
            thinking_effort: medium
            permission_preset: read_only
            prompt: |
              Validate whether the current workspace fully satisfies the approved implementation plan.

              First read the completion validation context:
              - context summary: `${{ steps.prepare_completion_context.outputs.completion_context_summary_file }}`
              - context JSON: `${{ steps.prepare_completion_context.outputs.completion_context_file }}`

              The context `mode` controls the validation strategy:
              - `full`: validate against the approved plan and plan completion contract as a complete pass.
              - `gap_focused`: first revalidate the previous structured gaps, the latest fixer result, reviewable changed files, and protected drift. Reuse the prior completion validation's evidence for requirements that had no gaps and whose related files were not touched by the fixer. Read the full plan/contract only if needed to resolve ambiguity, if the fix touched broad/shared files, or if the context says `fullRevalidationRequired=true`.

              Available artifacts:
              - original approved plan: `${{ needs.prepare_plan.outputs.plan_path }}`
              - plan completion contract: `${{ needs.plan_contract.outputs.contract_file }}`
              - backend plan, if present: `${{ needs.plan_partition.outputs.backend_plan_path }}`
              - frontend plan, if present: `${{ needs.plan_partition.outputs.frontend_plan_path }}`
              - transport plan, if present: `${{ needs.plan_partition.outputs.transport_plan_path }}`
              - workspace summary: `${{ steps.completion_workspace_details.outputs.workspace_summary_file }}`
              - changed files: `${{ steps.completion_workspace_details.outputs.changed_files_file }}`
              - baseline-aware change classification: `${{ steps.completion_workspace_details.outputs.baseline_classification_file }}`
              - reviewable changed files: `${{ steps.completion_workspace_details.outputs.review_changed_files_file }}`
              - protected drift: `${{ steps.completion_workspace_details.outputs.protected_drift_file }}`
              - review diff: `${{ steps.completion_workspace_details.outputs.review_diff_file }}`
              - full current diff fallback: `${{ steps.completion_workspace_details.outputs.diff_file }}`

              If `${{ steps.load_completion_loop_state.outputs.latest_fix_summary_file }}` is non-empty, read that fix summary too.
              If `${{ steps.load_completion_loop_state.outputs.latest_fix_result_file }}` is non-empty, read that structured fix result too.

              Scope:
              - do not edit files
              - judge completeness against the plan completion contract and approved plan
              - identify missing requirements, incorrect implementations, and verification gaps
              - require concrete evidence for each gap
              - do not re-plan or add requirements
              - use the review diff before the full diff; read the full diff only when the review diff is insufficient to understand a directly changed behavior
              - distinguish product incompleteness from missing verification evidence
              - a skipped `scenario` or `manual` verification check is not itself a product gap when workspace artifacts or implementation summaries credibly show the acceptance check is satisfied
              - do not mark planned QA verification commands as `verificationGaps` solely because this pre-QA completion loop has not run them yet; deterministic verification runs later in QA
              - use `verificationGaps` only for material plan-required test coverage or evidence that cannot be satisfied from workspace artifacts, implementation summaries, or later QA verification; do not use it to demand multi-step shell recipes
              - when the only remaining concern is a bad, unsafe, or non-runnable verification specification, describe it as a verification/spec problem in `verificationGaps` without proposing product-code changes
              - treat `pre_existing_unchanged` entries in the baseline classification as protected branch/worktree context, not as pipeline-introduced changes
              - do not report protected pre-existing files as out-of-scope solely because they appear in the merge-base diff
              - report `pipeline_modified_pre_existing`, `pipeline_deleted_pre_existing`, or `pipeline_reverted_pre_existing` entries as incorrect implementation only when the approved plan did not explicitly require altering those protected paths

              ${{ env.BASELINE_SCOPE_RULES }}

              Return JSON with:
              - `complete`: true only when every acceptance check is satisfied and no gap arrays have entries
              - `summary`: concise validation summary
              - `missingRequirements`: requirements or acceptance checks that are not implemented
              - `incorrectImplementations`: implemented behavior that conflicts with the plan or contract
              - `verificationGaps`: required checks that have not been run or cannot be evidenced
              - `evidence`: concrete evidence supporting the complete/incomplete decision
            structured_output_schema: >-
              {"type":"object","additionalProperties":false,"properties":{"complete":{"type":"boolean"},"summary":{"type":"string"},"missingRequirements":{"type":"array","items":{"type":"object","additionalProperties":false,"properties":{"requirementId":{"type":"string"},"description":{"type":"string"},"acceptanceCheck":{"type":"string"},"evidence":{"type":"string"}},"required":["requirementId","description","acceptanceCheck","evidence"]}},"incorrectImplementations":{"type":"array","items":{"type":"object","additionalProperties":false,"properties":{"requirementId":{"type":"string"},"description":{"type":"string"},"expected":{"type":"string"},"actual":{"type":"string"},"evidence":{"type":"string"}},"required":["requirementId","description","expected","actual","evidence"]}},"verificationGaps":{"type":"array","items":{"type":"object","additionalProperties":false,"properties":{"requirementId":{"type":"string"},"description":{"type":"string"},"commandOrCheck":{"type":"string"},"evidence":{"type":"string"}},"required":["requirementId","description","commandOrCheck","evidence"]}},"evidence":{"type":"array","items":{"type":"string"}}},"required":["complete","summary","missingRequirements","incorrectImplementations","verificationGaps","evidence"]}

        - id: inspect_completion_result
          name: Inspect Completion Result
          shell: node
          run: |
            import fs from 'node:fs';
            import path from 'node:path';

            const {{BRAND_OUTPUT_VARIABLE_NAME}} = process.env.{{BRAND_ENV_PREFIX}}_OUTPUT ?? '';
            if (!{{BRAND_OUTPUT_VARIABLE_NAME}}) {
              throw new Error('{{BRAND_ENV_PREFIX}}_OUTPUT is required');
            }

            const validationFile = (process.env.VALIDATION_JSON_FILE ?? '').trim();
            if (!validationFile || !fs.existsSync(validationFile)) {
              throw new Error(
                `Missing completion validation JSON file: ${validationFile || '(empty)'}`,
              );
            }

            const parsed = JSON.parse(fs.readFileSync(validationFile, 'utf8'));
            const missingRequirements = Array.isArray(parsed.missingRequirements)
              ? parsed.missingRequirements
              : [];
            const incorrectImplementations = Array.isArray(
              parsed.incorrectImplementations,
            )
              ? parsed.incorrectImplementations
              : [];
            const verificationGaps = Array.isArray(parsed.verificationGaps)
              ? parsed.verificationGaps
              : [];
            const complete =
              parsed.complete === true &&
              missingRequirements.length === 0 &&
              incorrectImplementations.length === 0 &&
              verificationGaps.length === 0;
            const outputDir =
              process.env.{{BRAND_ENV_PREFIX}}_OUTPUT_DIR ?? path.dirname({{BRAND_OUTPUT_VARIABLE_NAME}});
            const completionJsonFile = path.join(
              outputDir,
              'implementation-completion-latest.json',
            );
            const normalized = {
              complete,
              summary: typeof parsed.summary === 'string' ? parsed.summary : '',
              missingRequirements,
              incorrectImplementations,
              verificationGaps,
              evidence: Array.isArray(parsed.evidence) ? parsed.evidence : [],
            };

            fs.writeFileSync(
              completionJsonFile,
              `${JSON.stringify(normalized, null, 2)}\n`,
              'utf8',
            );
            fs.appendFileSync(
              {{BRAND_OUTPUT_VARIABLE_NAME}},
              `complete=${complete ? 'true' : 'false'}\n`,
              'utf8',
            );
            fs.appendFileSync(
              {{BRAND_OUTPUT_VARIABLE_NAME}},
              `completion_json_file=${completionJsonFile}\n`,
              'utf8',
            );
            fs.appendFileSync(
              {{BRAND_OUTPUT_VARIABLE_NAME}},
              `missing_requirement_count=${String(missingRequirements.length)}\n`,
              'utf8',
            );
            fs.appendFileSync(
              {{BRAND_OUTPUT_VARIABLE_NAME}},
              `incorrect_implementation_count=${String(incorrectImplementations.length)}\n`,
              'utf8',
            );
            fs.appendFileSync(
              {{BRAND_OUTPUT_VARIABLE_NAME}},
              `verification_gap_count=${String(verificationGaps.length)}\n`,
              'utf8',
            );
          env:
            VALIDATION_JSON_FILE: ${{ steps.validate_completion.outputs.json_response_file }}

        - id: resolve_completion_iteration_mode
          name: Resolve Completion Iteration Mode
          shell: node
          run: |
            import fs from 'node:fs';

            const {{BRAND_OUTPUT_VARIABLE_NAME}} = process.env.{{BRAND_ENV_PREFIX}}_OUTPUT ?? '';
            if (!{{BRAND_OUTPUT_VARIABLE_NAME}}) {
              throw new Error('{{BRAND_ENV_PREFIX}}_OUTPUT is required');
            }
            const currentIteration = Number.parseInt(
              process.env.{{BRAND_ENV_PREFIX}}_JOB_ITERATION ?? '1',
              10,
            );
            const maxIterations = Number.parseInt(
              process.env.{{BRAND_ENV_PREFIX}}_JOB_MAX_ITERATIONS ?? '1',
              10,
            );
            const canFix =
              Number.isFinite(currentIteration) &&
              Number.isFinite(maxIterations) &&
              currentIteration < maxIterations;
            fs.appendFileSync(
              {{BRAND_OUTPUT_VARIABLE_NAME}},
              `can_fix=${canFix ? 'true' : 'false'}\n`,
              'utf8',
            );

        - id: fix_completion_gaps_resume
          name: Resume Fix Completion Gaps
          if: steps.inspect_completion_result.outputs.complete != 'true' && steps.resolve_completion_iteration_mode.outputs.can_fix == 'true' && steps.load_completion_loop_state.outputs.fixer_session_id != ''
          continue_on_error: true
          uses: builtin/agent-resume
          with:
            session_id: ${{ steps.load_completion_loop_state.outputs.fixer_session_id }}
            model: $default-codex
            thinking_effort: medium
            permission_preset: dangerous_all
            structured_output_schema: >-
              {"type":"object","additionalProperties":false,"properties":{"madeUpdates":{"type":"boolean"},"changedFiles":{"type":"array","items":{"type":"string"}},"verificationCommands":{"type":"array","items":{"type":"string"}},"summary":{"type":"string"},"unresolvedGaps":{"type":"array","items":{"type":"object","additionalProperties":false,"properties":{"requirementId":{"type":"string"},"reason":{"type":"string"}},"required":["requirementId","reason"]}}},"required":["madeUpdates","changedFiles","verificationCommands","summary","unresolvedGaps"]}
            prompt: |
              Fix every valid implementation completion gap in `${{ steps.inspect_completion_result.outputs.completion_json_file }}`.

              Read:
              - baseline-aware change classification: `${{ steps.completion_workspace_details.outputs.baseline_classification_file }}`
              - reviewable changed files: `${{ steps.completion_workspace_details.outputs.review_changed_files_file }}`
              - protected drift: `${{ steps.completion_workspace_details.outputs.protected_drift_file }}`
              - current workspace summary: `${{ steps.completion_workspace_details.outputs.workspace_summary_file }}`

              Expectations:
              - make only changes required to satisfy the structured gaps
              - preserve the approved plan and contract
              - do not run `git commit`, `git push`, create branches, or otherwise change repository history; the dedicated commit job handles commits when enabled
              - preserve protected pre-existing changes in the baseline classification unless the approved plan explicitly requires touching those paths
              - if a structured gap asks you to remove or revert protected pre-existing work, treat that gap as invalid and explain the conflict instead of deleting it
              - restore protected paths classified as `pipeline_modified_pre_existing`, `pipeline_deleted_pre_existing`, or `pipeline_reverted_pre_existing` unless the approved plan explicitly authorized the change
              - for verification-only gaps, run or document targeted evidence where practical; do not change product code unless the gap exposes a concrete implementation defect
              - if a gap only says later QA verification commands have not run yet, leave product code unchanged and note that deterministic QA verification handles it
              - if a gap is caused by an invalid or unsafe verification specification, report that it cannot be fixed by product changes instead of editing unrelated code
              - run targeted verification for affected code where practical
              - summarize the fixes and verification performed

        - id: fix_completion_gaps_start
          name: Start Fix Completion Gaps
          if: steps.inspect_completion_result.outputs.complete != 'true' && steps.resolve_completion_iteration_mode.outputs.can_fix == 'true' && (steps.load_completion_loop_state.outputs.fixer_session_id == '' || steps.fix_completion_gaps_resume.conclusion != 'success')
          uses: builtin/agent-prompt
          with:
            model: $default-codex
            thinking_effort: medium
            permission_preset: dangerous_all
            structured_output_schema: >-
              {"type":"object","additionalProperties":false,"properties":{"madeUpdates":{"type":"boolean"},"changedFiles":{"type":"array","items":{"type":"string"}},"verificationCommands":{"type":"array","items":{"type":"string"}},"summary":{"type":"string"},"unresolvedGaps":{"type":"array","items":{"type":"object","additionalProperties":false,"properties":{"requirementId":{"type":"string"},"reason":{"type":"string"}},"required":["requirementId","reason"]}}},"required":["madeUpdates","changedFiles","verificationCommands","summary","unresolvedGaps"]}
            prompt: |
              Fix every valid implementation completion gap in `${{ steps.inspect_completion_result.outputs.completion_json_file }}`.

              Read:
              - original approved plan: `${{ needs.prepare_plan.outputs.plan_path }}`
              - plan completion contract: `${{ needs.plan_contract.outputs.contract_file }}`
              - current workspace summary: `${{ steps.completion_workspace_details.outputs.workspace_summary_file }}`
              - baseline-aware change classification: `${{ steps.completion_workspace_details.outputs.baseline_classification_file }}`
              - reviewable changed files: `${{ steps.completion_workspace_details.outputs.review_changed_files_file }}`
              - protected drift: `${{ steps.completion_workspace_details.outputs.protected_drift_file }}`
              - review diff: `${{ steps.completion_workspace_details.outputs.review_diff_file }}`
              - full current diff fallback: `${{ steps.completion_workspace_details.outputs.diff_file }}`

              Expectations:
              - make only changes required to satisfy the structured gaps
              - preserve the approved plan and contract
              - do not run `git commit`, `git push`, create branches, or otherwise change repository history; the dedicated commit job handles commits when enabled
              - preserve protected pre-existing changes in the baseline classification unless the approved plan explicitly requires touching those paths
              - if a structured gap asks you to remove or revert protected pre-existing work, treat that gap as invalid and explain the conflict instead of deleting it
              - restore protected paths classified as `pipeline_modified_pre_existing`, `pipeline_deleted_pre_existing`, or `pipeline_reverted_pre_existing` unless the approved plan explicitly authorized the change
              - do not re-plan, broaden scope, or add unrelated improvements
              - for verification-only gaps, run or document targeted evidence where practical; do not change product code unless the gap exposes a concrete implementation defect
              - if a gap only says later QA verification commands have not run yet, leave product code unchanged and note that deterministic QA verification handles it
              - if a gap is caused by an invalid or unsafe verification specification, report that it cannot be fixed by product changes instead of editing unrelated code
              - run targeted verification for affected code where practical
              - summarize the fixes and verification performed

        - id: save_completion_loop_state
          name: Save Completion Loop State
          shell: node
          run: |
            import fs from 'node:fs';
            import path from 'node:path';

            const stateFile = process.env.STATE_FILE ?? '';
            if (!stateFile) {
              throw new Error('STATE_FILE is required');
            }

            const fixerSessionId =
              (process.env.FIXER_RESUME_SESSION_ID ?? '').trim() ||
              (process.env.FIXER_START_SESSION_ID ?? '').trim() ||
              (process.env.EXISTING_FIXER_SESSION_ID ?? '').trim();
            const latestFixSummaryFile =
              (process.env.FIXER_RESUME_SUMMARY_FILE ?? '').trim() ||
              (process.env.FIXER_START_SUMMARY_FILE ?? '').trim() ||
              '';
            const latestFixResultFile =
              (process.env.FIXER_RESUME_JSON_FILE ?? '').trim() ||
              (process.env.FIXER_START_JSON_FILE ?? '').trim() ||
              '';
            const outputDir =
              process.env.{{BRAND_ENV_PREFIX}}_OUTPUT_DIR ?? path.dirname(stateFile);
            const persistedFixSummaryFile = path.join(
              outputDir,
              'implementation-completion-latest-fix-summary.txt',
            );
            const persistedFixResultFile = path.join(
              outputDir,
              'implementation-completion-latest-fix-result.json',
            );

            if (latestFixSummaryFile) {
              if (!fs.existsSync(latestFixSummaryFile)) {
                throw new Error(
                  `Missing completion fix summary file: ${latestFixSummaryFile}`,
                );
              }
              const serialized = fs.readFileSync(latestFixSummaryFile, 'utf8');
              fs.writeFileSync(
                persistedFixSummaryFile,
                serialized.endsWith('\n') ? serialized : `${serialized}\n`,
                'utf8',
              );
            }
            if (latestFixResultFile) {
              if (!fs.existsSync(latestFixResultFile)) {
                throw new Error(
                  `Missing completion fix result file: ${latestFixResultFile}`,
                );
              }
              const parsed = JSON.parse(fs.readFileSync(latestFixResultFile, 'utf8'));
              fs.writeFileSync(
                persistedFixResultFile,
                `${JSON.stringify(parsed, null, 2)}\n`,
                'utf8',
              );
            }

            fs.writeFileSync(
              stateFile,
              `${JSON.stringify(
                {
                  fixerSessionId,
                  latestFixSummaryFile: latestFixSummaryFile
                    ? persistedFixSummaryFile
                    : '',
                  latestFixResultFile: latestFixResultFile
                    ? persistedFixResultFile
                    : '',
                },
                null,
                2,
              )}\n`,
              'utf8',
            );
          env:
            STATE_FILE: ${{ steps.load_completion_loop_state.outputs.state_file }}
            EXISTING_FIXER_SESSION_ID: ${{ steps.load_completion_loop_state.outputs.fixer_session_id }}
            FIXER_RESUME_SESSION_ID: ${{ steps.fix_completion_gaps_resume.outputs.session_id }}
            FIXER_START_SESSION_ID: ${{ steps.fix_completion_gaps_start.outputs.session_id }}
            FIXER_RESUME_SUMMARY_FILE: ${{ steps.fix_completion_gaps_resume.outputs.text_response_file }}
            FIXER_START_SUMMARY_FILE: ${{ steps.fix_completion_gaps_start.outputs.text_response_file }}
            FIXER_RESUME_JSON_FILE: ${{ steps.fix_completion_gaps_resume.outputs.json_response_file }}
            FIXER_START_JSON_FILE: ${{ steps.fix_completion_gaps_start.outputs.json_response_file }}

        - id: restart_completion_if_needed
          name: Restart If Completion Gaps Remain
          shell: node
          run: |
            import fs from 'node:fs';

            const {{BRAND_OUTPUT_VARIABLE_NAME}} = process.env.{{BRAND_ENV_PREFIX}}_OUTPUT ?? '';
            if (!{{BRAND_OUTPUT_VARIABLE_NAME}}) {
              throw new Error('{{BRAND_ENV_PREFIX}}_OUTPUT is required');
            }
            const complete = (process.env.COMPLETE ?? '').trim() === 'true';
            const currentIteration = Number.parseInt(
              process.env.{{BRAND_ENV_PREFIX}}_JOB_ITERATION ?? '1',
              10,
            );
            const maxIterations = Number.parseInt(
              process.env.{{BRAND_ENV_PREFIX}}_JOB_MAX_ITERATIONS ?? '1',
              10,
            );
            const canRestart =
              !complete &&
              Number.isFinite(currentIteration) &&
              Number.isFinite(maxIterations) &&
              currentIteration < maxIterations;

            fs.appendFileSync(
              {{BRAND_OUTPUT_VARIABLE_NAME}},
              canRestart
                ? 'restart_requested=true\n{{BRAND_ENV_PREFIX}}_JOB_RESTART=true\n'
                : 'restart_requested=false\n',
              'utf8',
            );
          env:
            COMPLETE: ${{ steps.inspect_completion_result.outputs.complete }}

        - id: capture_completion_iteration_limit_state
          name: Capture Completion Gaps Remaining At Iteration Limit
          if: steps.inspect_completion_result.outputs.complete != 'true'
          shell: node
          run: |
            import fs from 'node:fs';

            const {{BRAND_OUTPUT_VARIABLE_NAME}} = process.env.{{BRAND_ENV_PREFIX}}_OUTPUT ?? '';
            if (!{{BRAND_OUTPUT_VARIABLE_NAME}}) {
              throw new Error('{{BRAND_ENV_PREFIX}}_OUTPUT is required');
            }
            const currentIteration = Number.parseInt(
              process.env.{{BRAND_ENV_PREFIX}}_JOB_ITERATION ?? '1',
              10,
            );
            const maxIterations = Number.parseInt(
              process.env.{{BRAND_ENV_PREFIX}}_JOB_MAX_ITERATIONS ?? '1',
              10,
            );
            const limitReached =
              Number.isFinite(currentIteration) &&
              Number.isFinite(maxIterations) &&
              currentIteration >= maxIterations;

            if (!limitReached) {
              fs.appendFileSync(
                {{BRAND_OUTPUT_VARIABLE_NAME}},
                'iteration_limit_reached=false\nfailure_skipped=false\n',
                'utf8',
              );
              process.exit(0);
            }

            const continueOnFail =
              (process.env.CONTINUE_ON_COMPLETION_LOOP_FAIL ?? '').trim() === 'true';
            const summary =
              `Implementation completion loop exhausted ${String(currentIteration)}/${String(maxIterations)} iterations ` +
              `with ${process.env.MISSING_COUNT || '0'} missing requirement(s), ` +
              `${process.env.INCORRECT_COUNT || '0'} incorrect implementation(s), and ` +
              `${process.env.VERIFICATION_GAP_COUNT || '0'} verification gap(s). Latest completion report: ` +
              `${process.env.COMPLETION_JSON_FILE || ''}`;
            fs.appendFileSync(
              {{BRAND_OUTPUT_VARIABLE_NAME}},
              `iteration_limit_reached=true\niteration_limit_summary=${summary}\nfailure_skipped=${
                continueOnFail ? 'true' : 'false'
              }\n`,
              'utf8',
            );
            if (!continueOnFail) {
              process.exit(1);
            }
          env:
            MISSING_COUNT: ${{ steps.inspect_completion_result.outputs.missing_requirement_count }}
            INCORRECT_COUNT: ${{ steps.inspect_completion_result.outputs.incorrect_implementation_count }}
            VERIFICATION_GAP_COUNT: ${{ steps.inspect_completion_result.outputs.verification_gap_count }}
            COMPLETION_JSON_FILE: ${{ steps.inspect_completion_result.outputs.completion_json_file }}
            CONTINUE_ON_COMPLETION_LOOP_FAIL: 'true'

    qa_fix_loop:
      name: QA + Fix Loop
      needs:
        - prepare_plan
        - plan_contract
        - plan_scope
        - plan_partition
        - workspace_checkpoint
        - implement
        - implement_frontend
        - implementation_completion_loop
        - qa_intent_summary
        - complexity_analysis
      if: needs.plan_contract.result == 'success' && needs.plan_scope.result == 'success' && needs.workspace_checkpoint.result == 'success' && needs.implementation_completion_loop.result == 'success' && (needs.implement.result == 'success' || needs.implement.result == 'skipped') && (needs.implement_frontend.result == 'success' || needs.implement_frontend.result == 'skipped') && (needs.implement.result == 'success' || needs.implement_frontend.result == 'success' || (needs.plan_partition.result == 'success' && needs.plan_partition.outputs.has_transport_plan == 'true'))
      max_iterations: '${{ needs.complexity_analysis.outputs.qa_max_iterations }}'
      outputs:
        final_issue_count: ${{ steps.inspect_qa_results.outputs.issue_count }}
        final_actionable_issue_count: ${{ steps.inspect_qa_results.outputs.actionable_issue_count }}
        completion_audit_issue_count: ${{ steps.inspect_qa_results.outputs.completion_audit_issue_count }}
        code_review_issue_count: ${{ steps.inspect_qa_results.outputs.code_review_issue_count }}
        verification_failure_count: ${{ steps.inspect_qa_results.outputs.verification_failure_count }}
        verification_has_failures: ${{ steps.inspect_qa_results.outputs.verification_has_failures }}
        verification_spec_error_count: ${{ steps.inspect_qa_results.outputs.verification_spec_error_count }}
        verification_has_spec_errors: ${{ steps.inspect_qa_results.outputs.verification_has_spec_errors }}
        verification_skipped_count: ${{ steps.inspect_qa_results.outputs.verification_skipped_count }}
        verification_passed_expected_failure_count: ${{ steps.inspect_qa_results.outputs.verification_passed_expected_failure_count }}
        verification_side_effect_restored_count: ${{ steps.inspect_qa_results.outputs.verification_side_effect_restored_count }}
        verification_side_effect_unsupported_count: ${{ steps.inspect_qa_results.outputs.verification_side_effect_unsupported_count }}
        verification_side_effect_failed_count: ${{ steps.inspect_qa_results.outputs.verification_side_effect_failed_count }}
        protected_drift_count: ${{ steps.inspect_qa_results.outputs.protected_drift_count }}
        plan_conflict_count: ${{ steps.inspect_qa_results.outputs.plan_conflict_count }}
        has_issues: ${{ steps.inspect_qa_results.outputs.has_issues }}
        has_actionable_issues: ${{ steps.inspect_qa_results.outputs.has_actionable_issues }}
        review_summary: ${{ steps.inspect_qa_results.outputs.review_summary }}
        review_json_file: ${{ steps.inspect_qa_results.outputs.review_json_file }}
        review_report_file: ${{ steps.inspect_qa_results.outputs.review_report_file }}
        actionable_review_json_file: ${{ steps.inspect_qa_results.outputs.actionable_review_json_file }}
        actionable_review_report_file: ${{ steps.inspect_qa_results.outputs.actionable_review_report_file }}
        restart_requested: ${{ steps.restart_if_needed.outputs.restart_requested }}
        iteration_limit_reached: ${{ steps.capture_iteration_limit_state.outputs.iteration_limit_reached }}
        iteration_limit_summary: ${{ steps.capture_iteration_limit_state.outputs.iteration_limit_summary }}
        failure_skipped: ${{ steps.capture_iteration_limit_state.outputs.failure_skipped }}
      steps:
        - id: load_qa_loop_state
          name: Load QA Loop Session State
          shell: node
          run: |
            import fs from 'node:fs';
            import path from 'node:path';

            const {{BRAND_OUTPUT_VARIABLE_NAME}} = process.env.{{BRAND_ENV_PREFIX}}_OUTPUT ?? '';
            const outputDir = process.env.{{BRAND_ENV_PREFIX}}_OUTPUT_DIR ?? path.dirname({{BRAND_OUTPUT_VARIABLE_NAME}});
            const stateFile = path.join(outputDir, 'qa-loop-state.json');

            let state = {};
            if (fs.existsSync(stateFile)) {
              state = JSON.parse(fs.readFileSync(stateFile, 'utf8'));
            }

            const recheckSessionId =
              state &&
              typeof state === 'object' &&
              !Array.isArray(state) &&
              typeof state.recheckSessionId === 'string'
                ? state.recheckSessionId.trim()
                : '';
            const fixerSessionId =
              state &&
              typeof state === 'object' &&
              !Array.isArray(state) &&
              typeof state.fixerSessionId === 'string'
                ? state.fixerSessionId.trim()
                : '';
            const previousFindingsFile =
              state &&
              typeof state === 'object' &&
              !Array.isArray(state) &&
              typeof state.previousFindingsFile === 'string'
                ? state.previousFindingsFile.trim()
                : '';
            const previousFindingsReportFile =
              state &&
              typeof state === 'object' &&
              !Array.isArray(state) &&
              typeof state.previousFindingsReportFile === 'string'
                ? state.previousFindingsReportFile.trim()
                : '';
            const latestFixSummaryFile =
              state &&
              typeof state === 'object' &&
              !Array.isArray(state) &&
              typeof state.latestFixSummaryFile === 'string'
                ? state.latestFixSummaryFile.trim()
                : '';
            const codeReviewCompleted =
              state &&
              typeof state === 'object' &&
              !Array.isArray(state) &&
              state.codeReviewCompleted === true;
            const previousReviewScopeKey =
              state &&
              typeof state === 'object' &&
              !Array.isArray(state) &&
              typeof state.previousReviewScopeKey === 'string'
                ? state.previousReviewScopeKey.trim()
                : '';
            const previousCodeReviewIssueCountRaw =
              state &&
              typeof state === 'object' &&
              !Array.isArray(state) &&
              typeof state.previousCodeReviewIssueCount === 'number'
                ? state.previousCodeReviewIssueCount
                : state &&
                    typeof state === 'object' &&
                    !Array.isArray(state) &&
                    typeof state.previousCodeReviewIssueCount === 'string'
                  ? Number.parseInt(state.previousCodeReviewIssueCount, 10)
                  : 0;
            const previousCodeReviewIssueCount = Number.isFinite(previousCodeReviewIssueCountRaw)
              ? Math.max(0, previousCodeReviewIssueCountRaw)
              : 0;

            fs.appendFileSync({{BRAND_OUTPUT_VARIABLE_NAME}}, `state_file=${stateFile}\n`, 'utf8');
            fs.appendFileSync({{BRAND_OUTPUT_VARIABLE_NAME}}, `recheck_session_id=${recheckSessionId}\n`, 'utf8');
            fs.appendFileSync({{BRAND_OUTPUT_VARIABLE_NAME}}, `fixer_session_id=${fixerSessionId}\n`, 'utf8');
            fs.appendFileSync({{BRAND_OUTPUT_VARIABLE_NAME}}, `previous_findings_file=${previousFindingsFile}\n`, 'utf8');
            fs.appendFileSync({{BRAND_OUTPUT_VARIABLE_NAME}}, `previous_findings_report_file=${previousFindingsReportFile}\n`, 'utf8');
            fs.appendFileSync({{BRAND_OUTPUT_VARIABLE_NAME}}, `latest_fix_summary_file=${latestFixSummaryFile}\n`, 'utf8');
            fs.appendFileSync(
              {{BRAND_OUTPUT_VARIABLE_NAME}},
              `code_review_completed=${codeReviewCompleted ? 'true' : 'false'}\n`,
              'utf8',
            );
            fs.appendFileSync(
              {{BRAND_OUTPUT_VARIABLE_NAME}},
              `previous_review_scope_key=${previousReviewScopeKey}\n`,
              'utf8',
            );
            fs.appendFileSync(
              {{BRAND_OUTPUT_VARIABLE_NAME}},
              `previous_code_review_issue_count=${String(previousCodeReviewIssueCount)}\n`,
              'utf8',
            );

        - id: qa_workspace_details
          name: Gather QA Workspace Details
          uses: builtin/git-workspace-details
          with:
            include_uncommitted: true
            checkpoint_file: ${{ needs.workspace_checkpoint.outputs.checkpoint_file }}
            plan_scope_file: ${{ needs.plan_scope.outputs.plan_scope_file }}

        - id: compute_qa_review_scope
          name: Compute QA Review Scope
          shell: node
          run: |
            import crypto from 'node:crypto';
            import fs from 'node:fs';

            const {{BRAND_OUTPUT_VARIABLE_NAME}} = process.env.{{BRAND_ENV_PREFIX}}_OUTPUT ?? '';
            if (!{{BRAND_OUTPUT_VARIABLE_NAME}}) {
              throw new Error('{{BRAND_ENV_PREFIX}}_OUTPUT is required');
            }

            const changedFilesFile = (process.env.CHANGED_FILES_FILE ?? '').trim();
            if (!changedFilesFile || !fs.existsSync(changedFilesFile)) {
              throw new Error(
                `Missing changed files file: ${changedFilesFile || '(empty)'}`,
              );
            }

            const parsed = JSON.parse(fs.readFileSync(changedFilesFile, 'utf8'));
            const rawFiles =
              parsed &&
              typeof parsed === 'object' &&
              !Array.isArray(parsed) &&
              Array.isArray(parsed.files)
                ? parsed.files
                : Array.isArray(parsed)
                  ? parsed
                  : [];
            const normalizedFiles = Array.from(
              new Set(
                rawFiles
                  .map((entry) => {
                    if (typeof entry === 'string') {
                      return entry;
                    }
                    if (
                      entry &&
                      typeof entry === 'object' &&
                      !Array.isArray(entry)
                    ) {
                      if (typeof entry.path === 'string') {
                        return entry.path;
                      }
                      if (typeof entry.filePath === 'string') {
                        return entry.filePath;
                      }
                    }
                    return '';
                  })
                  .map((value) => value.replace(/\\/g, '/').replace(/^\.\//, '').trim())
                  .filter((value) => value.length > 0),
              ),
            ).sort();

            const touchedScopes = Array.from(
              new Set(
                normalizedFiles.map((filePath) => {
                  const parts = filePath.split('/');
                  if (parts[0] === 'packages' && parts[1]) {
                    return `packages/${parts[1]}`;
                  }
                  return '.';
                }),
              ),
            ).sort();
            const scopeKey = crypto
              .createHash('sha256')
              .update(
                JSON.stringify({
                  version: 1,
                  files: normalizedFiles,
                }),
              )
              .digest('hex');
            const previousScopeKey = (process.env.PREVIOUS_SCOPE_KEY ?? '').trim();
            const scopeChanged =
              previousScopeKey.length === 0 || previousScopeKey !== scopeKey;
            const scopeSummary =
              touchedScopes.length > 0 ? touchedScopes.join(', ') : '(none)';

            fs.appendFileSync({{BRAND_OUTPUT_VARIABLE_NAME}}, `scope_key=${scopeKey}\n`, 'utf8');
            fs.appendFileSync(
              {{BRAND_OUTPUT_VARIABLE_NAME}},
              `scope_changed=${scopeChanged ? 'true' : 'false'}\n`,
              'utf8',
            );
            fs.appendFileSync(
              {{BRAND_OUTPUT_VARIABLE_NAME}},
              `scope_summary=${scopeSummary}\n`,
              'utf8',
            );
            fs.appendFileSync(
              {{BRAND_OUTPUT_VARIABLE_NAME}},
              `has_changed_files=${normalizedFiles.length > 0 ? 'true' : 'false'}\n`,
              'utf8',
            );
          env:
            CHANGED_FILES_FILE: ${{ steps.qa_workspace_details.outputs.review_changed_files_file }}
            PREVIOUS_SCOPE_KEY: ${{ steps.load_qa_loop_state.outputs.previous_review_scope_key }}

        - id: prepare_code_review_inputs
          name: Prepare Full Review Inputs
          shell: node
          run: |
            import fs from 'node:fs';

            const {{BRAND_OUTPUT_VARIABLE_NAME}} = process.env.{{BRAND_ENV_PREFIX}}_OUTPUT ?? '';
            if (!{{BRAND_OUTPUT_VARIABLE_NAME}}) {
              throw new Error('{{BRAND_ENV_PREFIX}}_OUTPUT is required');
            }

            const baseInputsRaw = (process.env.BASE_INPUTS_JSON ?? '').trim();
            let baseInputs = {};
            if (baseInputsRaw) {
              try {
                const parsed = JSON.parse(baseInputsRaw);
                if (parsed && typeof parsed === 'object' && !Array.isArray(parsed)) {
                  baseInputs = parsed;
                }
              } catch {
                baseInputs = {};
              }
            }

            const merged = {
              ...baseInputs,
              post_pr_comment: false,
              plan_contract_file: (process.env.PLAN_CONTRACT_FILE ?? '').trim(),
              qa_intent_summary_file: (process.env.QA_INTENT_SUMMARY_FILE ?? '').trim(),
              checkpoint_file: (process.env.WORKSPACE_CHECKPOINT_FILE ?? '').trim(),
              plan_scope_file: (process.env.PLAN_SCOPE_FILE ?? '').trim(),
            };

            fs.appendFileSync(
              {{BRAND_OUTPUT_VARIABLE_NAME}},
              `code_review_inputs_json=${JSON.stringify(merged)}\n`,
              'utf8',
            );
          env:
            BASE_INPUTS_JSON: ${{ needs.complexity_analysis.outputs.code_review_inputs_json }}
            PLAN_CONTRACT_FILE: ${{ needs.plan_contract.outputs.contract_file }}
            QA_INTENT_SUMMARY_FILE: ${{ needs.qa_intent_summary.outputs.qa_intent_summary_file }}
            WORKSPACE_CHECKPOINT_FILE: ${{ needs.workspace_checkpoint.outputs.checkpoint_file }}
            PLAN_SCOPE_FILE: ${{ needs.plan_scope.outputs.plan_scope_file }}

        - id: check_verification_command_cache
          name: Check Verification Command Cache
          shell: node
          run: |
            import fs from 'node:fs';
            import path from 'node:path';

            const {{BRAND_OUTPUT_VARIABLE_NAME}} = process.env.{{BRAND_ENV_PREFIX}}_OUTPUT ?? '';
            const outputDir = process.env.{{BRAND_ENV_PREFIX}}_OUTPUT_DIR ?? path.dirname({{BRAND_OUTPUT_VARIABLE_NAME}});
            const cacheFile = path.join(outputDir, 'qa-verification-commands.json');
            const currentCacheKey = (process.env.CURRENT_CACHE_KEY ?? '').trim();
            let cacheHit = false;

            if (currentCacheKey && fs.existsSync(cacheFile)) {
              try {
                const parsed = JSON.parse(fs.readFileSync(cacheFile, 'utf8'));
                cacheHit =
                  parsed &&
                  typeof parsed === 'object' &&
                  !Array.isArray(parsed) &&
                  typeof parsed.cacheKey === 'string' &&
                  parsed.cacheKey === currentCacheKey &&
                  Array.isArray(parsed.checks);
              } catch {
                cacheHit = false;
              }
            }

            fs.appendFileSync({{BRAND_OUTPUT_VARIABLE_NAME}}, `cache_file=${cacheFile}\n`, 'utf8');
            fs.appendFileSync(
              {{BRAND_OUTPUT_VARIABLE_NAME}},
              `cache_key=${currentCacheKey}\n`,
              'utf8',
            );
            fs.appendFileSync(
              {{BRAND_OUTPUT_VARIABLE_NAME}},
              `cache_hit=${cacheHit ? 'true' : 'false'}\n`,
              'utf8',
            );
            if (cacheHit) {
              fs.appendFileSync(
                {{BRAND_OUTPUT_VARIABLE_NAME}},
                `verification_commands_file=${cacheFile}\n`,
                'utf8',
              );
            }
          env:
            CURRENT_CACHE_KEY: ${{ steps.compute_qa_review_scope.outputs.scope_key }}

        - id: derive_verification_commands
          name: Derive Verification Commands
          if: steps.check_verification_command_cache.outputs.cache_hit != 'true'
          shell: node
          run: |
            import fs from 'node:fs';
            import path from 'node:path';

            const {{BRAND_OUTPUT_VARIABLE_NAME}} = process.env.{{BRAND_ENV_PREFIX}}_OUTPUT ?? '';
            if (!{{BRAND_OUTPUT_VARIABLE_NAME}}) {
              throw new Error('{{BRAND_ENV_PREFIX}}_OUTPUT is required');
            }

            const changedFilesPath = (process.env.CHANGED_FILES_FILE ?? '').trim();
            if (!changedFilesPath || !fs.existsSync(changedFilesPath)) {
              throw new Error(
                `Missing changed files file: ${changedFilesPath || '(empty)'}`,
              );
            }

            const outputDir =
              process.env.{{BRAND_ENV_PREFIX}}_OUTPUT_DIR ?? path.dirname({{BRAND_OUTPUT_VARIABLE_NAME}});
            const outputPath = path.join(
              outputDir,
              'qa-derived-verification-commands.json',
            );

            const parsed = JSON.parse(fs.readFileSync(changedFilesPath, 'utf8'));
            const rawFiles =
              parsed &&
              typeof parsed === 'object' &&
              !Array.isArray(parsed) &&
              Array.isArray(parsed.files)
                ? parsed.files
                : Array.isArray(parsed)
                  ? parsed
                  : [];

            const normalizedFiles = Array.from(
              new Set(
                rawFiles
                  .map((entry) => {
                    if (typeof entry === 'string') {
                      return entry;
                    }
                    if (
                      entry &&
                      typeof entry === 'object' &&
                      !Array.isArray(entry)
                    ) {
                      if (typeof entry.path === 'string') {
                        return entry.path;
                      }
                      if (typeof entry.filePath === 'string') {
                        return entry.filePath;
                      }
                    }
                    return '';
                  })
                  .map((value) => value.replace(/\\/g, '/').replace(/^\.\//, '').trim())
                  .filter((value) => value.length > 0),
              ),
            ).sort();

            const packageScopes = Array.from(
              new Set(
                normalizedFiles.flatMap((filePath) => {
                  const parts = filePath.split('/');
                  if (parts[0] === 'packages' && parts[1]) {
                    return [`packages/${parts[1]}`];
                  }
                  return [];
                }),
              ),
            ).sort();

            const readPackageJson = (filePath) => {
              if (!fs.existsSync(filePath)) {
                return null;
              }
              try {
                const parsedFile = JSON.parse(fs.readFileSync(filePath, 'utf8'));
                return parsedFile && typeof parsedFile === 'object' && !Array.isArray(parsedFile)
                  ? parsedFile
                  : null;
              } catch {
                return null;
              }
            };

            const createCollector = () => {
              const commands = [];
              const seenCommands = new Set();

              return {
                commands,
                add(command) {
                  const normalized = typeof command === 'string' ? command.trim() : '';
                  if (!normalized || seenCommands.has(normalized)) {
                    return;
                  }
                  seenCommands.add(normalized);
                  commands.push(normalized);
                },
              };
            };

            const mergeCommandLists = (commandLists) => {
              const collector = createCollector();
              for (const list of commandLists) {
                for (const command of list) {
                  collector.add(command);
                }
              }
              return collector.commands;
            };

            const toStringList = (value) =>
              Array.isArray(value)
                ? value.filter(
                    (item) => typeof item === 'string' && item.trim().length > 0,
                  )
                : [];
            const createCheckCollector = () => {
              const checks = [];
              const seenChecks = new Set();

              return {
                checks,
                add(check) {
                  if (!check || typeof check !== 'object' || Array.isArray(check)) {
                    return;
                  }
                  const key = [
                    typeof check.type === 'string' ? check.type : '',
                    typeof check.command === 'string' ? check.command : '',
                    typeof check.description === 'string' ? check.description : '',
                    Number.isInteger(check.expectedExitCode)
                      ? String(check.expectedExitCode)
                      : '',
                  ].join('::');
                  if (seenChecks.has(key)) {
                    return;
                  }
                  seenChecks.add(key);
                  checks.push(check);
                },
              };
            };

            const readTextFileIfExists = (filePath) => {
              if (!filePath || !fs.existsSync(filePath)) {
                return '';
              }
              try {
                return fs.readFileSync(filePath, 'utf8');
              } catch {
                return '';
              }
            };

            const commandPrefixPattern =
              /^(?:\.\/|npm\b|pnpm\b|yarn\b|bun\b|npx\b|pnpx\b|pytest\b|python(?:3)?\b|uv\b|poetry\b|cargo\b|go\b|just\b|make\b|node\b|bash\b|vitest\b|jest\b|tsx\b|tsc\b|eslint\b|turbo\b|nx\b|mvn\b|gradle\b|\.\/gradlew\b|phpunit\b|ruff\b|dotnet\b|mix\b)/i;
            const verificationContextPattern =
              /\b(?:verify|verification|validated?|validation|test|tests|testing|spec|specs|check|checks|checking|lint|typecheck|type-check|build)\b/i;
            const verificationCommandPattern =
              /\b(?:test|tests|spec|specs|check|checks|lint|typecheck|type-check|tsc\b|verify|verification|pytest|vitest|jest|mocha|ava|playwright|cypress|ruff|phpunit|eslint|build)\b/i;
            const disallowedCommandPattern =
              /(?:^|\s)(?:--watch(?:=\S*)?|watch|dev(?:elopment)?(?::\S*)?|serve(?::\S*)?|start(?::\S*)?|storybook(?::\S*)?|publish(?::\S*)?|deploy(?::\S*)?|release(?::\S*)?)(?=\s|$)/i;
            const packageManagerCommandPattern =
              /^(?:npm|pnpm|yarn|bun)\b/i;
            const commandSegmentSeparatorPattern = /[^A-Za-z0-9]+/;
            const conditionallyDisallowedPackageScriptSegmentPattern =
              /^(?:dev|development)$/i;
            const unconditionallyDisallowedPackageScriptSegmentPattern =
              /^(?:watch|serve|start|storybook|publish|deploy|release)$/i;
            const verificationPackageScriptSegmentPattern =
              /^(?:test|tests|check|checks|verify|verification|lint|typecheck|type-check)$/i;
            const maxSafeCommandLength = 4096;
            const maxGuardedDevWrapperDepth = 4;
            const guardSafetyBypassPattern =
              /(?:^|\s)--danger-skip-(?:concurrency-safety-lock|memory-pressure-safety-check)(?=\s|$)/;
            const shellRewriteSyntaxPattern = /[\\$`{}[\]*?^%!]/;
            const guardedDevWrapperQuotePattern = /['"]/;
            const guardedDevWrapperPrefixPattern =
              /^node\s+scripts\/run-guarded-dev-script\.mjs(?:\s|$)/;
            const guardedDevWrapperPattern =
              /^node\s+scripts\/run-guarded-dev-script\.mjs\s+--suite\s+(?:performance|e2e|unit|lint)\s+--\s+(.+)$/;
            const bashSyntaxCheckPattern =
              /^bash\s+-n\s+(?:\.\/)?(?:[A-Za-z0-9_-]+\/)*[A-Za-z0-9_.-]+\.sh$/;
            const shellRecipePattern =
              /^(?:test\b|\[)|(?:^|\s)(?:echo|rm|mkdir|ln|grep)\b|[\r\n<>;&|]|&&|\|\||(?:^|\s)&(?:\s|$)|\$\(|\$\?|`/;
            const barePackageScriptPattern =
              /^[A-Za-z][A-Za-z0-9_-]*:[A-Za-z0-9_:-]+$/;

            const isDisallowedCommand = (value, guardedWrapperDepth = 0) => {
              if (
                typeof value !== 'string' ||
                value.length === 0 ||
                value.length > maxSafeCommandLength ||
                guardedWrapperDepth > maxGuardedDevWrapperDepth
              ) {
                return true;
              }
              if (shellRewriteSyntaxPattern.test(value)) {
                return true;
              }
              const normalized = value.replace(/['"]/g, '');
              if (
                guardedDevWrapperPrefixPattern.test(normalized) &&
                guardedDevWrapperQuotePattern.test(value)
              ) {
                return true;
              }
              if (guardSafetyBypassPattern.test(normalized)) {
                return true;
              }
              const guardedDevWrapperMatch = normalized.match(
                guardedDevWrapperPattern,
              );
              if (guardedDevWrapperPrefixPattern.test(normalized)) {
                return (
                  !guardedDevWrapperMatch ||
                  !isSafeCommand(
                    guardedDevWrapperMatch[1],
                    guardedWrapperDepth + 1,
                  )
                );
              }
              const commandSegments = normalized
                .trim()
                .split(/\s+/)
                .flatMap((token) =>
                  token.split(commandSegmentSeparatorPattern).filter(Boolean),
                );
              const commandTokens = normalized.trim().split(/\s+/);
              const packageScriptToken = packageManagerCommandPattern.test(
                normalized,
              )
                ? commandTokens[commandTokens[1] === 'run' ? 2 : 1] ?? ''
                : '';
              const packageScriptSegments = packageScriptToken
                .split(commandSegmentSeparatorPattern)
                .filter(Boolean);
              const allowsPackageDevScript =
                packageScriptSegments.some((segment) =>
                  conditionallyDisallowedPackageScriptSegmentPattern.test(
                    segment,
                  ),
                ) &&
                packageScriptSegments.some((segment) =>
                  verificationPackageScriptSegmentPattern.test(segment),
                );
              if (
                commandSegments.some((segment) =>
                  unconditionallyDisallowedPackageScriptSegmentPattern.test(
                    segment,
                  ),
                ) ||
                (commandSegments.some((segment) =>
                  conditionallyDisallowedPackageScriptSegmentPattern.test(
                    segment,
                  ),
                ) &&
                  !allowsPackageDevScript)
              ) {
                return true;
              }
              return disallowedCommandPattern.test(normalized);
            };
            const hasAllowedCommandShape = (value) =>
              !/^bash(?:\s|$)/i.test(value) || bashSyntaxCheckPattern.test(value);
            const isSafeCommand = (value, guardedWrapperDepth = 0) =>
              typeof value === 'string' &&
              value.length > 0 &&
              value.length <= maxSafeCommandLength &&
              guardedWrapperDepth <= maxGuardedDevWrapperDepth &&
              commandPrefixPattern.test(value) &&
              !isDisallowedCommand(value, guardedWrapperDepth) &&
              hasAllowedCommandShape(value) &&
              !shellRecipePattern.test(value);

            const normalizeCommand = (value) => {
              const trimmedValue = typeof value === 'string' ? value.trim() : '';
              if (!trimmedValue) {
                return '';
              }

              const wholeInlineCommandMatch = trimmedValue.match(
                /^`([^`]+)`(?:\s+[—–-]\s+.*)?$/u,
              );
              if (wholeInlineCommandMatch) {
                return wholeInlineCommandMatch[1].trim();
              }

              const normalized = trimmedValue
                .replace(/^[-*]\s+/, '')
                .replace(/^\d+\.\s+/, '')
                .replace(/^`|`$/g, '')
                .replace(/\s+[—–-]\s+.*$/u, '')
                .replace(/[.,;:]$/, '')
                .trim();

              return normalized.includes('`') ? '' : normalized;
            };
            const looksLikeCommand = (value) => {
              const firstToken = value.split(/\s+/, 1)[0] ?? '';
              if (barePackageScriptPattern.test(firstToken)) {
                return false;
              }
              return isSafeCommand(value);
            };
            const collectExplicitRunnableCommands = (value) => {
              const text = typeof value === 'string' ? value.trim() : '';
              if (!text) {
                return [];
              }
              const candidates = [];
              for (const match of text.matchAll(/`([^`]+)`/g)) {
                candidates.push(match[1].trim());
              }
              const scenarioDetailsMatch = text.match(
                /Scenario details from the plan:\s*(.+)$/i,
              );
              if (scenarioDetailsMatch) {
                candidates.push(normalizeCommand(scenarioDetailsMatch[1]));
              }
              candidates.push(normalizeCommand(text));
              return Array.from(
                new Set(candidates.filter((candidate) => looksLikeCommand(candidate))),
              );
            };
            const describeScenario = (description, command) => {
              const trimmedDescription =
                typeof description === 'string' ? description.trim() : '';
              const trimmedCommand =
                typeof command === 'string' ? command.trim() : '';
              if (
                trimmedDescription &&
                trimmedCommand &&
                trimmedDescription !== trimmedCommand
              ) {
                return `${trimmedDescription} Scenario details from the plan: ${trimmedCommand}`;
              }
              return trimmedDescription || trimmedCommand;
            };
            const downgradeCommandCheckToScenario = (check, command) => ({
              ...check,
              type: 'scenario',
              description: describeScenario(check.description, command),
              command: '',
              expectedExitCode: 0,
              expectedStdoutIncludes: [],
              expectedStderrIncludes: [],
              expectedOutputIncludes: [],
            });
            const isVerificationCommand = (value) =>
              verificationCommandPattern.test(value) &&
              isSafeCommand(value);
            const targetedVerificationIdPattern = /^VC-\d{3,}$/i;
            const commandToolPattern =
              /\b(?:npm|pnpm|yarn|bun|npx|pnpx|pytest|python3?|uv|poetry|cargo|node|bash|vitest|jest|tsx|tsc|eslint|turbo|nx|mvn|gradle|phpunit|ruff|dotnet)\b/i;
            const scenarioNeedsExplicitCommand = (id, description) => {
              const text = typeof description === 'string' ? description : '';
              return (
                commandPrefixPattern.test(text) ||
                (commandToolPattern.test(text) &&
                  /\b(?:run|execute|rerun|command|test|lint|typecheck|check|verify)\b/i.test(text)) ||
                (targetedVerificationIdPattern.test(id) &&
                  collectExplicitRunnableCommands(text).length > 0)
              );
            };
            const normalizeExpectedExitCode = (value) =>
              Number.isInteger(value) ? value : 0;
            const normalizeVerificationCheck = (value, index, source) => {
              if (typeof value === 'string') {
                const commandOrDescription = value.trim();
                const id = `VERIFY-${String(index + 1).padStart(3, '0')}`;
                if (looksLikeCommand(commandOrDescription)) {
                  return {
                    id,
                    type: 'command',
                    description: commandOrDescription,
                    command: commandOrDescription,
                    expectedExitCode: 0,
                    expectedStdoutIncludes: [],
                    expectedStderrIncludes: [],
                    expectedOutputIncludes: [],
                    source,
                  };
                }
                return {
                  id,
                  type: 'scenario',
                  description: commandOrDescription,
                  command: '',
                  expectedExitCode: 0,
                  expectedStdoutIncludes: [],
                  expectedStderrIncludes: [],
                  expectedOutputIncludes: [],
                  source,
                };
              }

              const candidate =
                value && typeof value === 'object' && !Array.isArray(value)
                  ? value
                  : {};
              const command =
                typeof candidate.command === 'string'
                  ? candidate.command.trim()
                  : '';
              const description =
                typeof candidate.description === 'string'
                  ? candidate.description.trim()
                  : command;
              const id =
                typeof candidate.id === 'string' && candidate.id.trim().length > 0
                  ? candidate.id.trim()
                  : `VERIFY-${String(index + 1).padStart(3, '0')}`;
              const type =
                candidate.type === 'scenario' || candidate.type === 'manual'
                  ? candidate.type
                  : 'command';
              const check = {
                id,
                type,
                description,
                command: '',
                expectedExitCode: normalizeExpectedExitCode(candidate.expectedExitCode),
                expectedStdoutIncludes: toStringList(candidate.expectedStdoutIncludes),
                expectedStderrIncludes: toStringList(candidate.expectedStderrIncludes),
                expectedOutputIncludes: toStringList(candidate.expectedOutputIncludes),
                source,
              };
              if (type === 'command') {
                const explicitRunnableCommands = command
                  ? []
                  : collectExplicitRunnableCommands(description);
                if (explicitRunnableCommands.length === 1) {
                  check.command = explicitRunnableCommands[0];
                } else if (!looksLikeCommand(command)) {
                  return downgradeCommandCheckToScenario(check, command);
                } else {
                  check.command = command;
                }
              } else if (type === 'scenario') {
                const explicitRunnableCommands = collectExplicitRunnableCommands(
                  command || description,
                );
                if (explicitRunnableCommands.length === 1) {
                  return {
                    ...check,
                    type: 'command',
                    command: explicitRunnableCommands[0],
                  };
                }
              }
              return check;
            };
            const checksFromCommands = (commands, source) =>
              commands.map((command, index) =>
                normalizeVerificationCheck(command, index, source),
              );
            const finalizeChecks = (checks, source) => {
              const collector = createCheckCollector();
              checks.forEach((check, index) => {
                collector.add(
                  normalizeVerificationCheck(
                    {
                      ...check,
                      source:
                        check && typeof check === 'object' && !Array.isArray(check) && typeof check.source === 'string'
                          ? check.source
                          : source,
                    },
                    index,
                    source,
                  ),
                );
              });
              return collector.checks;
            };

            const extractCommandsFromText = (text) => {
              if (!text.trim()) {
                return [];
              }

              const collector = createCollector();
              const maybeAddCommand = (value, hasVerificationContext = false) => {
                const normalized = normalizeCommand(value);
                if (!normalized || !looksLikeCommand(normalized)) {
                  return;
                }
                if (isDisallowedCommand(normalized)) {
                  return;
                }
                if (!hasVerificationContext && !isVerificationCommand(normalized)) {
                  return;
                }
                collector.add(normalized);
              };
              let continuedCommand = '';
              let continuedCommandHasVerificationContext = false;
              const flushContinuedCommand = () => {
                if (!continuedCommand) {
                  return;
                }
                maybeAddCommand(
                  continuedCommand,
                  continuedCommandHasVerificationContext,
                );
                continuedCommand = '';
                continuedCommandHasVerificationContext = false;
              };
              const addCommandCandidate = (
                value,
                hasVerificationContext = false,
              ) => {
                const trimmedValue = value.trim();
                if (!trimmedValue) {
                  flushContinuedCommand();
                  return;
                }

                const hasContinuation = /\\\s*$/.test(trimmedValue);
                const fragment = hasContinuation
                  ? trimmedValue.replace(/\\\s*$/, '').trimEnd()
                  : trimmedValue;

                if (continuedCommand) {
                  continuedCommand = `${continuedCommand} ${fragment}`.trim();
                  continuedCommandHasVerificationContext =
                    continuedCommandHasVerificationContext ||
                    hasVerificationContext;
                } else if (hasContinuation) {
                  continuedCommand = fragment;
                  continuedCommandHasVerificationContext =
                    hasVerificationContext;
                } else {
                  maybeAddCommand(fragment, hasVerificationContext);
                  return;
                }

                if (!hasContinuation) {
                  flushContinuedCommand();
                }
              };

              const lines = text.split(/\r?\n/);
              let inFence = false;
              let fenceContext = '';
              let lastMeaningfulLine = '';

              for (const line of lines) {
                const trimmed = line.trim();
                if (trimmed.startsWith('```')) {
                  flushContinuedCommand();
                  inFence = !inFence;
                  if (inFence) {
                    fenceContext = lastMeaningfulLine;
                  }
                  continue;
                }

                const lineHasVerificationContext = verificationContextPattern.test(line);

                if (inFence) {
                  addCommandCandidate(
                    trimmed,
                    lineHasVerificationContext ||
                      verificationContextPattern.test(fenceContext),
                  );
                  if (trimmed) {
                    lastMeaningfulLine = trimmed;
                  }
                  continue;
                }

                for (const match of line.matchAll(/`([^`]+)`/g)) {
                  maybeAddCommand(match[1], lineHasVerificationContext);
                }

                const listCandidate = trimmed
                  .replace(/^[-*]\s+/, '')
                  .replace(/^\d+\.\s+/, '');
                addCommandCandidate(listCandidate, lineHasVerificationContext);

                if (trimmed) {
                  lastMeaningfulLine = trimmed;
                }
              }

              flushContinuedCommand();

              return collector.commands;
            };

            const appendHeuristicPackageCommands = (collector, scope) => {
              const addCommand = collector.add.bind(collector);
              const packageJsonPath = path.join(process.cwd(), scope, 'package.json');
              const packageJson = readPackageJson(packageJsonPath);
              if (!packageJson) {
                return;
              }

              const packageName =
                typeof packageJson.name === 'string' && packageJson.name.trim().length > 0
                  ? packageJson.name.trim()
                  : scope.split('/').at(-1) ?? scope;
              const scripts =
                packageJson.scripts &&
                typeof packageJson.scripts === 'object' &&
                !Array.isArray(packageJson.scripts)
                  ? packageJson.scripts
                  : {};

              if (typeof scripts.check === 'string') {
                addCommand(`npm run check --workspace ${packageName}`);
                return;
              }

              let addedScopedCommand = false;
              for (const scriptName of ['lint', 'test', 'typecheck', 'tsc:check']) {
                if (typeof scripts[scriptName] === 'string') {
                  addCommand(`npm run ${scriptName} --workspace ${packageName}`);
                  addedScopedCommand = true;
                }
              }

              if (!addedScopedCommand && typeof scripts.build === 'string') {
                addCommand(`npm run build --workspace ${packageName}`);
              }
            };

            const readContractVerificationChecks = () => {
              const contractFile = (process.env.PLAN_CONTRACT_FILE ?? '').trim();
              if (!contractFile || !fs.existsSync(contractFile)) {
                return [];
              }

              try {
                const parsed = JSON.parse(fs.readFileSync(contractFile, 'utf8'));
                if (
                  parsed &&
                  typeof parsed === 'object' &&
                  !Array.isArray(parsed) &&
                  Array.isArray(parsed.verificationChecks) &&
                  parsed.verificationChecks.length > 0
                ) {
                  return parsed.verificationChecks.map((check, index) =>
                    normalizeVerificationCheck(check, index, 'plan_contract'),
                  );
                }

                return parsed &&
                  typeof parsed === 'object' &&
                  !Array.isArray(parsed) &&
                  Array.isArray(parsed.verificationCommands)
                  ? checksFromCommands(
                      parsed.verificationCommands.filter(
                        (value) =>
                          typeof value === 'string' && value.trim().length > 0,
                      ),
                      'plan_contract',
                    )
                  : [];
              } catch {
                return [];
              }
            };

            const contractChecks = readContractVerificationChecks();
            const planCommands = extractCommandsFromText(
              readTextFileIfExists((process.env.PLAN_PATH ?? '').trim()),
            );
            const implementationSummaryCommands = mergeCommandLists([
              extractCommandsFromText(
                readTextFileIfExists((process.env.IMPLEMENT_SUMMARY_FILE ?? '').trim()),
              ),
              extractCommandsFromText(
                readTextFileIfExists(
                  (process.env.IMPLEMENT_FRONTEND_SUMMARY_FILE ?? '').trim(),
                ),
              ),
              extractCommandsFromText(
                readTextFileIfExists((process.env.LATEST_FIX_SUMMARY_FILE ?? '').trim()),
              ),
            ]);

            let checks = [];
            let commandSource = '';

            const needsSupplementalCommands = contractChecks.some(
              (check) =>
                check &&
                typeof check === 'object' &&
                !Array.isArray(check) &&
                check.type === 'scenario' &&
                typeof check.command === 'string' &&
                check.command.trim().length === 0 &&
                scenarioNeedsExplicitCommand(check.id, check.description),
            );

            if (contractChecks.length > 0) {
              const supplementalCommands = needsSupplementalCommands
                ? mergeCommandLists([planCommands, implementationSummaryCommands])
                : [];
              checks = needsSupplementalCommands
                ? [
                    ...contractChecks,
                    ...checksFromCommands(
                      supplementalCommands,
                      'supplemental_verification',
                    ),
                  ]
                : contractChecks;
              commandSource = needsSupplementalCommands
                ? 'plan_contract+supplemental_verification'
                : 'plan_contract';
            } else if (planCommands.length > 0) {
              checks = checksFromCommands(planCommands, 'plan');
              commandSource = 'plan';
            } else if (implementationSummaryCommands.length > 0) {
              checks = checksFromCommands(
                implementationSummaryCommands,
                'implementation_summary',
              );
              commandSource = 'implementation_summary';
            } else {
              const heuristicCollector = createCollector();
              for (const scope of packageScopes) {
                appendHeuristicPackageCommands(heuristicCollector, scope);
              }

              const rootPackageJson = readPackageJson(
                path.join(process.cwd(), 'package.json'),
              );
              const rootScripts =
                rootPackageJson &&
                rootPackageJson.scripts &&
                typeof rootPackageJson.scripts === 'object' &&
                !Array.isArray(rootPackageJson.scripts)
                  ? rootPackageJson.scripts
                  : {};

              if (typeof rootScripts.check === 'string') {
                heuristicCollector.add('npm run check');
              } else {
                let addedRootCommand = false;
                for (const scriptName of ['lint', 'test', 'typecheck', 'tsc:check']) {
                  if (typeof rootScripts[scriptName] === 'string') {
                    heuristicCollector.add(`npm run ${scriptName}`);
                    addedRootCommand = true;
                  }
                }

                if (
                  !addedRootCommand &&
                  packageScopes.length > 0 &&
                  typeof rootScripts.build === 'string'
                ) {
                  heuristicCollector.add('npm run build');
                }
              }

              checks = checksFromCommands(heuristicCollector.commands, 'heuristic');
              commandSource = checks.length > 0 ? 'heuristic' : '';
            }

            const normalizedChecks = finalizeChecks(checks, commandSource);
            const commands = normalizedChecks
              .filter((check) => check.type === 'command' && typeof check.command === 'string')
              .map((check) => check.command.trim())
              .filter(Boolean);

            fs.writeFileSync(
              outputPath,
              `${JSON.stringify(
                { checks: normalizedChecks, commands, source: commandSource },
                null,
                2,
              )}\n`,
              'utf8',
            );
            fs.appendFileSync({{BRAND_OUTPUT_VARIABLE_NAME}}, `commands_file=${outputPath}\n`, 'utf8');
            fs.appendFileSync({{BRAND_OUTPUT_VARIABLE_NAME}}, `command_source=${commandSource}\n`, 'utf8');
            fs.appendFileSync(
              {{BRAND_OUTPUT_VARIABLE_NAME}},
              `derived=${normalizedChecks.length > 0 ? 'true' : 'false'}\n`,
              'utf8',
            );
          env:
            CHANGED_FILES_FILE: ${{ steps.qa_workspace_details.outputs.pipeline_changed_files_file }}
            PLAN_CONTRACT_FILE: ${{ needs.plan_contract.outputs.contract_file }}
            PLAN_PATH: ${{ needs.prepare_plan.outputs.plan_path }}
            IMPLEMENT_SUMMARY_FILE: ${{ needs.implement.outputs.implementation_summary_file }}
            IMPLEMENT_FRONTEND_SUMMARY_FILE: ${{ needs.implement_frontend.outputs.implementation_summary_file }}
            LATEST_FIX_SUMMARY_FILE: ${{ steps.load_qa_loop_state.outputs.latest_fix_summary_file }}

        - id: discover_verification_commands
          name: Discover Verification Commands
          if: steps.check_verification_command_cache.outputs.cache_hit != 'true' && steps.derive_verification_commands.outputs.derived != 'true'
          uses: builtin/agent-prompt
          with:
            model: $fast
            thinking_effort: xhigh
            permission_preset: read_only
            structured_output_schema: >-
              {"type":"object","additionalProperties":false,"properties":{"commands":{"type":"array","items":{"type":"string"}}},"required":["commands"]}
            prompt: |
              Before exploring anything else:
              1. Read `CLAUDE.md` at the repo root.
              2. Read `AGENTS.md` at the repo root if it exists.

              After that, inspect the repository to find the primary local verification commands for this repo.

              Prioritize commands that verify the currently touched scope: `${{ steps.compute_qa_review_scope.outputs.scope_summary }}`.
              Use the pipeline-owned changed files list at `${{ steps.qa_workspace_details.outputs.pipeline_changed_files_file }}` to stay focused on changes introduced or altered after the pipeline-start checkpoint.

              Focus on:
              - linting commands
              - test commands
              - typecheck or check commands
              - build commands only when they are the repo's primary safe verification path for the changed scope
              - any adjacent required verification command explicitly mandated by the instruction files

              Selection rules:
              - prefer the smallest set of repo-standard commands that meaningfully verify the changed scope before widening to broader repo commands
              - include commands exactly as they should be run from the repo root
              - include only single, direct, safe verification commands that invoke repo tooling such as package scripts, test runners, linters, typecheckers, or build/check commands
              - do not chain commands or use shell control operators; exclude commands containing `&&`, `||`, pipes, semicolons, background operators, redirection, command substitution, or status-variable capture
              - do not include watchers, dev servers, publish commands, or destructive commands
              - do not include setup/cleanup/assertion recipes that rely on shell builtins or filesystem choreography such as `test`, `echo`, `rm`, `mkdir`, `ln`, `grep`, redirection, temp files, symlink setup, command chaining, status-variable capture, or cleanup steps
              - avoid duplicate or redundant wrapper commands
              - if no suitable commands exist, return an empty array

              Return JSON with:
              - `commands`: ordered array of shell commands to run

        - id: resolve_new_verification_commands_file
          name: Resolve New Verification Commands File
          if: steps.check_verification_command_cache.outputs.cache_hit != 'true'
          shell: node
          run: |
            import fs from 'node:fs';
            import path from 'node:path';

            const {{BRAND_OUTPUT_VARIABLE_NAME}} = process.env.{{BRAND_ENV_PREFIX}}_OUTPUT ?? '';
            if (!{{BRAND_OUTPUT_VARIABLE_NAME}}) {
              throw new Error('{{BRAND_ENV_PREFIX}}_OUTPUT is required');
            }

            const derived = process.env.DERIVED === 'true';
            const derivedFile = (process.env.DERIVED_FILE ?? '').trim();
            const discoveredFile = (process.env.DISCOVERED_FILE ?? '').trim();
            const selectedFile = derived ? derivedFile : discoveredFile;
            const outputDir =
              process.env.{{BRAND_ENV_PREFIX}}_OUTPUT_DIR ?? path.dirname({{BRAND_OUTPUT_VARIABLE_NAME}});
            const outputPath = path.join(
              outputDir,
              'qa-selected-verification-commands.json',
            );

            if (!selectedFile || !fs.existsSync(selectedFile)) {
              throw new Error(
                `Missing verification commands source file: ${selectedFile || '(empty)'}`,
              );
            }

            const serialized = fs.readFileSync(selectedFile, 'utf8');
            fs.writeFileSync(
              outputPath,
              serialized.endsWith('\n') ? serialized : `${serialized}\n`,
              'utf8',
            );
            fs.appendFileSync({{BRAND_OUTPUT_VARIABLE_NAME}}, `commands_file=${outputPath}\n`, 'utf8');
          env:
            DERIVED: ${{ steps.derive_verification_commands.outputs.derived }}
            DERIVED_FILE: ${{ steps.derive_verification_commands.outputs.commands_file }}
            DISCOVERED_FILE: ${{ steps.discover_verification_commands.outputs.json_response_file }}

        - id: persist_verification_command_cache
          name: Persist Verification Command Cache
          if: steps.check_verification_command_cache.outputs.cache_hit != 'true'
          shell: node
          run: |
            import fs from 'node:fs';

            const {{BRAND_OUTPUT_VARIABLE_NAME}} = process.env.{{BRAND_ENV_PREFIX}}_OUTPUT ?? '';
            const cacheFile = process.env.CACHE_FILE ?? '';
            const discoveredFile = process.env.DISCOVERED_FILE ?? '';
            if (!cacheFile) {
              throw new Error('CACHE_FILE is required');
            }
            if (!discoveredFile || !fs.existsSync(discoveredFile)) {
              throw new Error(`Missing discovered command file: ${discoveredFile || '(empty)'}`);
            }

            const parsed = JSON.parse(fs.readFileSync(discoveredFile, 'utf8'));
            const checks =
              parsed &&
              typeof parsed === 'object' &&
              !Array.isArray(parsed) &&
              Array.isArray(parsed.checks)
                ? parsed.checks.filter(
                    (value) => value && typeof value === 'object' && !Array.isArray(value),
                  )
                : [];
            const commands =
              parsed &&
              typeof parsed === 'object' &&
              !Array.isArray(parsed) &&
              Array.isArray(parsed.commands)
                ? parsed.commands.filter(
                    (value) => typeof value === 'string' && value.trim().length > 0,
                  )
                : [];
            const source =
              parsed &&
              typeof parsed === 'object' &&
              !Array.isArray(parsed) &&
              typeof parsed.source === 'string'
                ? parsed.source
                : '';
            fs.writeFileSync(
              cacheFile,
              `${JSON.stringify(
                {
                  cacheKey: process.env.CURRENT_CACHE_KEY ?? '',
                  checks,
                  commands,
                  source,
                },
                null,
                2,
              )}\n`,
              'utf8',
            );
            fs.appendFileSync(
              {{BRAND_OUTPUT_VARIABLE_NAME}},
              `verification_commands_file=${cacheFile}\n`,
              'utf8',
            );
          env:
            CACHE_FILE: ${{ steps.check_verification_command_cache.outputs.cache_file }}
            DISCOVERED_FILE: ${{ steps.resolve_new_verification_commands_file.outputs.commands_file }}
            CURRENT_CACHE_KEY: ${{ steps.compute_qa_review_scope.outputs.scope_key }}

        - id: resolve_verification_commands_file
          name: Resolve Verification Commands File
          shell: node
          run: |
            import fs from 'node:fs';

            const {{BRAND_OUTPUT_VARIABLE_NAME}} = process.env.{{BRAND_ENV_PREFIX}}_OUTPUT ?? '';
            const cacheFile = (process.env.CACHE_FILE ?? '').trim();
            const persistedFile = (process.env.PERSISTED_FILE ?? '').trim();
            const effectiveFile =
              cacheFile && fs.existsSync(cacheFile) ? cacheFile : persistedFile;

            if (!effectiveFile || !fs.existsSync(effectiveFile)) {
              throw new Error(`Missing verification commands file: ${effectiveFile || '(empty)'}`);
            }

            fs.appendFileSync(
              {{BRAND_OUTPUT_VARIABLE_NAME}},
              `verification_commands_file=${effectiveFile}\n`,
              'utf8',
            );
          env:
            CACHE_FILE: ${{ steps.check_verification_command_cache.outputs.verification_commands_file }}
            PERSISTED_FILE: ${{ steps.persist_verification_command_cache.outputs.verification_commands_file }}

        - id: snapshot_verification_protected_paths
          name: Snapshot Protected Paths Before Verification
          shell: node
          run: |
            import crypto from 'node:crypto';
            import fs from 'node:fs';
            import path from 'node:path';

            const {{BRAND_OUTPUT_VARIABLE_NAME}} = process.env.{{BRAND_ENV_PREFIX}}_OUTPUT ?? '';
            if (!{{BRAND_OUTPUT_VARIABLE_NAME}}) {
              throw new Error('{{BRAND_ENV_PREFIX}}_OUTPUT is required');
            }

            const outputDir =
              process.env.{{BRAND_ENV_PREFIX}}_OUTPUT_DIR ?? path.dirname({{BRAND_OUTPUT_VARIABLE_NAME}});
            const snapshotDir = path.join(outputDir, 'verification-protected-snapshot');
            const snapshotFile = path.join(outputDir, 'verification-protected-snapshot.json');
            const classificationFile =
              (process.env.BASELINE_CLASSIFICATION_FILE ?? '').trim();
            const classification = classificationFile && fs.existsSync(classificationFile)
              ? JSON.parse(fs.readFileSync(classificationFile, 'utf8'))
              : [];
            const records = Array.isArray(classification) ? classification : [];
            const paths = [];
            const skipped = [];
            fs.mkdirSync(snapshotDir, { recursive: true });

            const hashFile = (filePath) =>
              crypto.createHash('sha256').update(fs.readFileSync(filePath)).digest('hex');
            const copyTargetPath = (relativePath) =>
              path.join(snapshotDir, relativePath.replace(/[/\\]/g, '__'));

            for (const record of records) {
              if (
                !record ||
                typeof record !== 'object' ||
                Array.isArray(record) ||
                record.protectedBaseline !== true ||
                record.planAuthorized === true ||
                typeof record.path !== 'string'
              ) {
                continue;
              }

              const relativePath = record.path.replace(/\\/g, '/').replace(/^\.\//, '');
              const absolutePath = path.resolve(process.cwd(), relativePath);
              let stats;
              try {
                stats = fs.lstatSync(absolutePath);
              } catch {
                paths.push({
                  path: relativePath,
                  existed: false,
                  type: 'missing',
                  sha256: '',
                  snapshotPath: '',
                });
                continue;
              }

              if (!stats.isFile()) {
                skipped.push({
                  path: relativePath,
                  reason: stats.isSymbolicLink()
                    ? 'unsupported symlink'
                    : stats.isDirectory()
                      ? 'unsupported directory'
                      : 'unsupported file type',
                });
                continue;
              }

              const snapshotPath = copyTargetPath(relativePath);
              fs.copyFileSync(absolutePath, snapshotPath);
              paths.push({
                path: relativePath,
                existed: true,
                type: 'file',
                sha256: hashFile(absolutePath),
                snapshotPath,
              });
            }

            fs.writeFileSync(
              snapshotFile,
              `${JSON.stringify(
                {
                  version: 1,
                  generatedAt: new Date().toISOString(),
                  snapshotRoot: snapshotDir,
                  paths,
                  skipped,
                },
                null,
                2,
              )}\n`,
              'utf8',
            );
            fs.appendFileSync({{BRAND_OUTPUT_VARIABLE_NAME}}, `snapshot_file=${snapshotFile}\n`, 'utf8');
          env:
            BASELINE_CLASSIFICATION_FILE: ${{ steps.qa_workspace_details.outputs.baseline_classification_file }}

        - id: run_verification_commands
          name: Run Verification Commands
          shell: node
          run: |
            import { spawnSync } from 'node:child_process';
            import fs from 'node:fs';
            import path from 'node:path';

            const {{BRAND_OUTPUT_VARIABLE_NAME}} = process.env.{{BRAND_ENV_PREFIX}}_OUTPUT ?? '';
            if (!{{BRAND_OUTPUT_VARIABLE_NAME}}) {
              throw new Error('{{BRAND_ENV_PREFIX}}_OUTPUT is required');
            }

            const discoveredCommandsFile = process.env.DISCOVERED_COMMANDS_FILE;
            if (!discoveredCommandsFile || !fs.existsSync(discoveredCommandsFile)) {
              throw new Error(
                `Missing discovered commands file: ${discoveredCommandsFile ?? '(empty)'}`,
              );
            }

            const parsed = JSON.parse(
              fs.readFileSync(discoveredCommandsFile, 'utf8'),
            );
            const rawChecks =
              parsed &&
              typeof parsed === 'object' &&
              !Array.isArray(parsed) &&
              Array.isArray(parsed.checks)
                ? parsed.checks
                : [];
            const rawCommands =
              parsed &&
              typeof parsed === 'object' &&
              !Array.isArray(parsed) &&
              Array.isArray(parsed.commands)
                ? parsed.commands
                : [];
            const barePackageScriptPattern =
              /^[A-Za-z][A-Za-z0-9_-]*:[A-Za-z0-9_:-]+$/;
            const commandPrefixPattern =
              /^(?:\.\/|npm\b|pnpm\b|yarn\b|bun\b|npx\b|pnpx\b|pytest\b|python(?:3)?\b|uv\b|poetry\b|cargo\b|go\b|just\b|make\b|node\b|bash\b|vitest\b|jest\b|tsx\b|tsc\b|eslint\b|turbo\b|nx\b|mvn\b|gradle\b|\.\/gradlew\b|phpunit\b|ruff\b|dotnet\b|mix\b)/i;
            const disallowedCommandPattern =
              /(?:^|\s)(?:--watch(?:=\S*)?|watch|dev(?:elopment)?(?::\S*)?|serve(?::\S*)?|start(?::\S*)?|storybook(?::\S*)?|publish(?::\S*)?|deploy(?::\S*)?|release(?::\S*)?)(?=\s|$)/i;
            const packageManagerCommandPattern =
              /^(?:npm|pnpm|yarn|bun)\b/i;
            const commandSegmentSeparatorPattern = /[^A-Za-z0-9]+/;
            const conditionallyDisallowedPackageScriptSegmentPattern =
              /^(?:dev|development)$/i;
            const unconditionallyDisallowedPackageScriptSegmentPattern =
              /^(?:watch|serve|start|storybook|publish|deploy|release)$/i;
            const verificationPackageScriptSegmentPattern =
              /^(?:test|tests|check|checks|verify|verification|lint|typecheck|type-check)$/i;
            const maxSafeCommandLength = 4096;
            const maxGuardedDevWrapperDepth = 4;
            const guardSafetyBypassPattern =
              /(?:^|\s)--danger-skip-(?:concurrency-safety-lock|memory-pressure-safety-check)(?=\s|$)/;
            const shellRewriteSyntaxPattern = /[\\$`{}[\]*?^%!]/;
            const guardedDevWrapperQuotePattern = /['"]/;
            const guardedDevWrapperPrefixPattern =
              /^node\s+scripts\/run-guarded-dev-script\.mjs(?:\s|$)/;
            const guardedDevWrapperPattern =
              /^node\s+scripts\/run-guarded-dev-script\.mjs\s+--suite\s+(?:performance|e2e|unit|lint)\s+--\s+(.+)$/;
            const bashSyntaxCheckPattern =
              /^bash\s+-n\s+(?:\.\/)?(?:[A-Za-z0-9_-]+\/)*[A-Za-z0-9_.-]+\.sh$/;
            const shellRecipePattern =
              /^(?:test\b|\[)|(?:^|\s)(?:echo|rm|mkdir|ln|grep)\b|[\r\n<>;&|]|&&|\|\||(?:^|\s)&(?:\s|$)|\$\(|\$\?|`/;
            const commandToolPattern =
              /\b(?:npm|pnpm|yarn|bun|npx|pnpx|pytest|python3?|uv|poetry|cargo|node|bash|vitest|jest|tsx|tsc|eslint|turbo|nx|mvn|gradle|phpunit|ruff|dotnet)\b/i;
            const toStringList = (value) =>
              Array.isArray(value)
                ? value.filter(
                    (item) => typeof item === 'string' && item.trim().length > 0,
                  )
                : [];
            const isDisallowedCommand = (value, guardedWrapperDepth = 0) => {
              if (
                typeof value !== 'string' ||
                value.length === 0 ||
                value.length > maxSafeCommandLength ||
                guardedWrapperDepth > maxGuardedDevWrapperDepth
              ) {
                return true;
              }
              if (shellRewriteSyntaxPattern.test(value)) {
                return true;
              }
              const normalized = value.replace(/['"]/g, '');
              if (
                guardedDevWrapperPrefixPattern.test(normalized) &&
                guardedDevWrapperQuotePattern.test(value)
              ) {
                return true;
              }
              if (guardSafetyBypassPattern.test(normalized)) {
                return true;
              }
              const guardedDevWrapperMatch = normalized.match(
                guardedDevWrapperPattern,
              );
              if (guardedDevWrapperPrefixPattern.test(normalized)) {
                return (
                  !guardedDevWrapperMatch ||
                  !isSafeCommand(
                    guardedDevWrapperMatch[1],
                    guardedWrapperDepth + 1,
                  )
                );
              }
              const commandSegments = normalized
                .trim()
                .split(/\s+/)
                .flatMap((token) =>
                  token.split(commandSegmentSeparatorPattern).filter(Boolean),
                );
              const commandTokens = normalized.trim().split(/\s+/);
              const packageScriptToken = packageManagerCommandPattern.test(
                normalized,
              )
                ? commandTokens[commandTokens[1] === 'run' ? 2 : 1] ?? ''
                : '';
              const packageScriptSegments = packageScriptToken
                .split(commandSegmentSeparatorPattern)
                .filter(Boolean);
              const allowsPackageDevScript =
                packageScriptSegments.some((segment) =>
                  conditionallyDisallowedPackageScriptSegmentPattern.test(
                    segment,
                  ),
                ) &&
                packageScriptSegments.some((segment) =>
                  verificationPackageScriptSegmentPattern.test(segment),
                );
              if (
                commandSegments.some((segment) =>
                  unconditionallyDisallowedPackageScriptSegmentPattern.test(
                    segment,
                  ),
                ) ||
                (commandSegments.some((segment) =>
                  conditionallyDisallowedPackageScriptSegmentPattern.test(
                    segment,
                  ),
                ) &&
                  !allowsPackageDevScript)
              ) {
                return true;
              }
              return disallowedCommandPattern.test(normalized);
            };
            const hasAllowedCommandShape = (value) =>
              !/^bash(?:\s|$)/i.test(value) || bashSyntaxCheckPattern.test(value);
            const isSafeCommand = (value, guardedWrapperDepth = 0) =>
              typeof value === 'string' &&
              value.length > 0 &&
              value.length <= maxSafeCommandLength &&
              guardedWrapperDepth <= maxGuardedDevWrapperDepth &&
              commandPrefixPattern.test(value) &&
              !isDisallowedCommand(value, guardedWrapperDepth) &&
              hasAllowedCommandShape(value) &&
              !shellRecipePattern.test(value);
            let packageScripts;
            const getPackageScripts = () => {
              if (packageScripts) {
                return packageScripts;
              }
              const packageJsonPath = path.join(process.cwd(), 'package.json');
              if (!fs.existsSync(packageJsonPath)) {
                packageScripts = {};
                return packageScripts;
              }
              try {
                const packageJson = JSON.parse(
                  fs.readFileSync(packageJsonPath, 'utf8'),
                );
                packageScripts =
                  packageJson &&
                  typeof packageJson === 'object' &&
                  !Array.isArray(packageJson) &&
                  packageJson.scripts &&
                  typeof packageJson.scripts === 'object' &&
                  !Array.isArray(packageJson.scripts)
                    ? packageJson.scripts
                    : {};
              } catch {
                packageScripts = {};
              }
              return packageScripts;
            };
            const normalizeRunnableCommand = (value) => {
              const command = typeof value === 'string' ? value.trim() : '';
              if (!command) {
                return '';
              }
              const firstToken = command.split(/\s+/, 1)[0] ?? '';
              if (!barePackageScriptPattern.test(firstToken)) {
                return command;
              }
              const scripts = getPackageScripts();
              if (typeof scripts[firstToken] !== 'string') {
                return '';
              }
              const remainingArgs = command.slice(firstToken.length).trim();
              return remainingArgs
                ? `npm run ${firstToken} -- ${remainingArgs}`
                : `npm run ${firstToken}`;
            };
            const canRunVerificationCommand = (value) => {
              const command = normalizeRunnableCommand(value);
              return command.length > 0 && isSafeCommand(command);
            };
            const collectExplicitRunnableCommands = (value) => {
              const text = typeof value === 'string' ? value.trim() : '';
              if (!text) {
                return [];
              }
              const candidates = [];
              for (const match of text.matchAll(/`([^`]+)`/g)) {
                candidates.push(match[1].trim());
              }
              const scenarioDetailsMatch = text.match(
                /Scenario details from the plan:\s*(.+)$/i,
              );
              if (scenarioDetailsMatch) {
                candidates.push(
                  scenarioDetailsMatch[1].replace(/[.,;:]$/, '').trim(),
                );
              }
              candidates.push(
                text
                  .replace(/^[-*]\s+/, '')
                  .replace(/^\d+\.\s+/, '')
                  .replace(/^`|`$/g, '')
                  .replace(/[.,;:]$/, '')
                  .trim(),
              );
              return Array.from(
                new Set(
                  candidates.filter((candidate) =>
                    canRunVerificationCommand(candidate),
                  ),
                ),
              );
            };
            const scenarioNeedsExplicitCommand = (id, description) => {
              const text = typeof description === 'string' ? description : '';
              return (
                commandToolPattern.test(text) &&
                /\b(?:run|execute|rerun|command|test|lint|typecheck|check|verify)\b/i.test(text)
              );
            };
            const normalizeInputCheck = (value, index) => {
              if (typeof value === 'string') {
                const command = value.trim();
                const type = shellRecipePattern.test(command) ? 'scenario' : 'command';
                return {
                  id: `VERIFY-${String(index + 1).padStart(3, '0')}`,
                  type,
                  description: value,
                  command: type === 'command' ? value : '',
                  expectedExitCode: 0,
                  expectedStdoutIncludes: [],
                  expectedStderrIncludes: [],
                  expectedOutputIncludes: [],
                };
              }

              const candidate =
                value && typeof value === 'object' && !Array.isArray(value)
                  ? value
                  : {};
              const command =
                typeof candidate.command === 'string'
                  ? candidate.command.trim()
                  : '';
              const type =
                candidate.type === 'scenario' || candidate.type === 'manual'
                  ? candidate.type
                  : 'command';
              const id =
                typeof candidate.id === 'string' && candidate.id.trim().length > 0
                  ? candidate.id.trim()
                  : `VERIFY-${String(index + 1).padStart(3, '0')}`;
              const description =
                typeof candidate.description === 'string' && candidate.description.trim().length > 0
                  ? candidate.description.trim()
                  : command;
              const explicitRunnableCommands =
                type === 'scenario'
                  ? collectExplicitRunnableCommands(command || description)
                  : [];
              const promotedScenarioCommand =
                explicitRunnableCommands.length === 1
                  ? explicitRunnableCommands[0]
                  : '';
              const missingScenarioCommand =
                type === 'scenario' &&
                !command &&
                !promotedScenarioCommand &&
                scenarioNeedsExplicitCommand(id, description);
              const normalizedType =
                promotedScenarioCommand
                  ? 'command'
                  : type === 'command' && shellRecipePattern.test(command)
                  ? 'scenario'
                  : type;
              return {
                id,
                type: normalizedType,
                description,
                command:
                  normalizedType === 'command'
                    ? promotedScenarioCommand || command
                    : '',
                expectedExitCode: Number.isInteger(candidate.expectedExitCode)
                  ? candidate.expectedExitCode
                  : 0,
                expectedStdoutIncludes: toStringList(candidate.expectedStdoutIncludes),
                expectedStderrIncludes: toStringList(candidate.expectedStderrIncludes),
                expectedOutputIncludes: toStringList(candidate.expectedOutputIncludes),
                invalidReason: missingScenarioCommand
                  ? `${id} appears to be an automatable scenario check but has no explicit command. Encode it as type "command" with a runnable command.`
                  : '',
              };
            };
            const checks =
              rawChecks.length > 0
                ? rawChecks.map(normalizeInputCheck)
                : rawCommands.map(normalizeInputCheck);
            const commands = checks
              .filter((check) => check.type === 'command')
              .map((check) => check.command)
              .filter((command) => typeof command === 'string' && command.trim().length > 0);

            const shellCommand = process.platform === 'win32'
              ? process.env.ComSpec || 'cmd.exe'
              : process.env.SHELL || '/bin/sh';
            const shellArgsFor = (command) =>
              process.platform === 'win32'
                ? ['/d', '/s', '/c', command]
                : ['-lc', command];
            const results = [];
            const outputBufferBytes = 1024 * 1024 * 32;
            const seenExecutionKeys = new Set();

            for (const check of checks) {
              if (check.invalidReason) {
                results.push({
                  id: check.id,
                  type: check.type,
                  description: check.description,
                  command: check.command,
                  expectedExitCode: check.expectedExitCode,
                  status: 'invalid',
                  invalidReason: check.invalidReason,
                  exitCode: null,
                  signal: '',
                  error: '',
                  stdoutTail: '',
                  stderrTail: '',
                  missingExpectations: [],
                });
                continue;
              }

              if (check.type === 'scenario' || check.type === 'manual') {
                results.push({
                  id: check.id,
                  type: check.type,
                  description: check.description,
                  command: '',
                  expectedExitCode: check.expectedExitCode,
                  status: 'skipped',
                  skippedReason:
                    check.type === 'scenario' ? 'scenario_check' : 'manual_check',
                  exitCode: null,
                  signal: '',
                  error: '',
                  stdoutTail: '',
                  stderrTail: '',
                  missingExpectations: [],
                });
                continue;
              }

              const command = normalizeRunnableCommand(check.command);
              const executionKey = [
                command,
                String(check.expectedExitCode),
                check.expectedStdoutIncludes.join('\u0000'),
                check.expectedStderrIncludes.join('\u0000'),
                check.expectedOutputIncludes.join('\u0000'),
              ].join('\u0001');

              if (seenExecutionKeys.has(executionKey)) {
                continue;
              }
              seenExecutionKeys.add(executionKey);

              if (
                !command ||
                !isSafeCommand(command)
              ) {
                results.push({
                  id: check.id,
                  type: 'command',
                  description: check.description,
                  command: check.command,
                  expectedExitCode: check.expectedExitCode,
                  status: 'invalid',
                  invalidReason: command
                    ? `Unsafe or disallowed verification command: ${command}`
                    : `Invalid verification command: ${check.command || '(empty)'}`,
                  exitCode: null,
                  signal: '',
                  error: '',
                  stdoutTail: '',
                  stderrTail: '',
                  missingExpectations: [],
                });
                continue;
              }

              const completed = spawnSync(shellCommand, shellArgsFor(command), {
                cwd: process.cwd(),
                env: process.env,
                encoding: 'utf8',
                maxBuffer: outputBufferBytes,
                timeout: 1000 * 60 * 20,
              });
              const stdout =
                typeof completed.stdout === 'string' ? completed.stdout : '';
              const stderr =
                typeof completed.stderr === 'string' ? completed.stderr : '';
              const error =
                completed.error instanceof Error ? completed.error.message : '';
              const exitCode =
                typeof completed.status === 'number' ? completed.status : -1;
              const signal = completed.signal ?? '';
              const combinedOutput = `${stdout}\n${stderr}`;
              const missingExpectations = [];

              if (exitCode !== check.expectedExitCode) {
                missingExpectations.push(
                  `expected exit code ${String(check.expectedExitCode)}, got ${String(exitCode)}`,
                );
              }
              for (const expectedText of check.expectedStdoutIncludes) {
                if (!stdout.includes(expectedText)) {
                  missingExpectations.push(`stdout missing: ${expectedText}`);
                }
              }
              for (const expectedText of check.expectedStderrIncludes) {
                if (!stderr.includes(expectedText)) {
                  missingExpectations.push(`stderr missing: ${expectedText}`);
                }
              }
              for (const expectedText of check.expectedOutputIncludes) {
                if (!combinedOutput.includes(expectedText)) {
                  missingExpectations.push(`output missing: ${expectedText}`);
                }
              }

              const failed =
                signal.length > 0 ||
                error.length > 0 ||
                missingExpectations.length > 0;
              const status = failed
                ? 'failed'
                : check.expectedExitCode === 0
                  ? 'passed'
                  : 'passed_expected_failure';

              results.push({
                id: check.id,
                type: 'command',
                description: check.description,
                command,
                expectedExitCode: check.expectedExitCode,
                status,
                exitCode,
                signal,
                error,
                stdoutTail: stdout.slice(-4000),
                stderrTail: stderr.slice(-4000),
                missingExpectations,
              });
            }

            const failedResults = results.filter(
              (result) => result.status === 'failed',
            );
            const invalidResults = results.filter(
              (result) => result.status === 'invalid',
            );
            const skippedResults = results.filter(
              (result) => result.status === 'skipped',
            );
            const passedExpectedFailureResults = results.filter(
              (result) => result.status === 'passed_expected_failure',
            );
            const outputDir =
              process.env.{{BRAND_ENV_PREFIX}}_OUTPUT_DIR ?? path.dirname({{BRAND_OUTPUT_VARIABLE_NAME}});
            const resultsFile = path.join(outputDir, 'verification-results.json');
            const reportFile = path.join(outputDir, 'verification-report.md');
            const summary = {
              passed: results.filter((result) => result.status === 'passed').length,
              passedExpectedFailure: passedExpectedFailureResults.length,
              failed: failedResults.length,
              skipped: skippedResults.length,
              invalid: invalidResults.length,
            };

            fs.writeFileSync(
              resultsFile,
              `${JSON.stringify({ checks, commands, results, summary }, null, 2)}\n`,
              'utf8',
            );

            const reportLines = [
              '# Verification Commands',
              '',
              `- Checks discovered: ${String(checks.length)}`,
              `- Commands discovered: ${String(commands.length)}`,
              `- Command failures: ${String(failedResults.length)}`,
              `- Expected-failure checks passed: ${String(passedExpectedFailureResults.length)}`,
              `- Skipped scenario/manual checks: ${String(skippedResults.length)}`,
              `- Verification spec errors: ${String(invalidResults.length)}`,
              '',
            ];

            if (checks.length === 0) {
              reportLines.push(
                'No lint, test, or required adjacent verification commands were discovered.',
                '',
              );
            } else {
              reportLines.push('## Results', '');

              for (const result of results) {
                const headingTarget = result.command || result.description || result.id;
                reportLines.push(`### ${result.status.toUpperCase()}: \`${headingTarget}\``, '');
                reportLines.push(`- Type: ${result.type}`);
                reportLines.push(`- Expected exit code: ${String(result.expectedExitCode)}`);
                reportLines.push(`- Exit code: ${String(result.exitCode)}`);

                if (result.signal) {
                  reportLines.push(`- Signal: ${result.signal}`);
                }

                if (result.error) {
                  reportLines.push(`- Error: ${result.error}`);
                }

                if (result.invalidReason) {
                  reportLines.push(`- Invalid reason: ${result.invalidReason}`);
                }

                if (result.skippedReason) {
                  reportLines.push(`- Skipped reason: ${result.skippedReason}`);
                }

                if (Array.isArray(result.missingExpectations) && result.missingExpectations.length > 0) {
                  reportLines.push('', '#### Missing Expectations', '');
                  for (const missingExpectation of result.missingExpectations) {
                    reportLines.push(`- ${missingExpectation}`);
                  }
                }

                if (result.stdoutTail) {
                  reportLines.push('', '#### stdout', '', '```text', result.stdoutTail, '```');
                }

                if (result.stderrTail) {
                  reportLines.push('', '#### stderr', '', '```text', result.stderrTail, '```');
                }

                reportLines.push('');
              }
            }

            fs.writeFileSync(reportFile, `${reportLines.join('\n')}\n`, 'utf8');

            fs.appendFileSync(
              {{BRAND_OUTPUT_VARIABLE_NAME}},
              `verification_results_file=${resultsFile}\n`,
              'utf8',
            );
            fs.appendFileSync(
              {{BRAND_OUTPUT_VARIABLE_NAME}},
              `verification_report_file=${reportFile}\n`,
              'utf8',
            );
            fs.appendFileSync(
              {{BRAND_OUTPUT_VARIABLE_NAME}},
              `verification_failure_count=${String(failedResults.length)}\n`,
              'utf8',
            );
            fs.appendFileSync(
              {{BRAND_OUTPUT_VARIABLE_NAME}},
              `verification_spec_error_count=${String(invalidResults.length)}\n`,
              'utf8',
            );
            fs.appendFileSync(
              {{BRAND_OUTPUT_VARIABLE_NAME}},
              `verification_skipped_count=${String(skippedResults.length)}\n`,
              'utf8',
            );
            fs.appendFileSync(
              {{BRAND_OUTPUT_VARIABLE_NAME}},
              `verification_passed_expected_failure_count=${String(passedExpectedFailureResults.length)}\n`,
              'utf8',
            );
            fs.appendFileSync(
              {{BRAND_OUTPUT_VARIABLE_NAME}},
              `verification_has_failures=${failedResults.length > 0 ? 'true' : 'false'}\n`,
              'utf8',
            );
            fs.appendFileSync(
              {{BRAND_OUTPUT_VARIABLE_NAME}},
              `verification_has_spec_errors=${invalidResults.length > 0 ? 'true' : 'false'}\n`,
              'utf8',
            );
          env:
            DISCOVERED_COMMANDS_FILE: ${{ steps.resolve_verification_commands_file.outputs.verification_commands_file }}

        - id: restore_verification_protected_paths
          name: Restore Protected Verification Side Effects
          shell: node
          run: |
            import crypto from 'node:crypto';
            import fs from 'node:fs';
            import path from 'node:path';

            const {{BRAND_OUTPUT_VARIABLE_NAME}} = process.env.{{BRAND_ENV_PREFIX}}_OUTPUT ?? '';
            if (!{{BRAND_OUTPUT_VARIABLE_NAME}}) {
              throw new Error('{{BRAND_ENV_PREFIX}}_OUTPUT is required');
            }

            const outputDir =
              process.env.{{BRAND_ENV_PREFIX}}_OUTPUT_DIR ?? path.dirname({{BRAND_OUTPUT_VARIABLE_NAME}});
            const sideEffectsFile = path.join(outputDir, 'verification-side-effects.json');
            const snapshotFile = (process.env.SNAPSHOT_FILE ?? '').trim();
            const snapshot = snapshotFile && fs.existsSync(snapshotFile)
              ? JSON.parse(fs.readFileSync(snapshotFile, 'utf8'))
              : { paths: [], skipped: [] };
            const hashFile = (filePath) =>
              crypto.createHash('sha256').update(fs.readFileSync(filePath)).digest('hex');
            const restored = [];
            const unsupported = [];
            const failed = [];

            const snapshotPaths = Array.isArray(snapshot.paths) ? snapshot.paths : [];
            for (const entry of snapshotPaths) {
              if (!entry || typeof entry !== 'object' || Array.isArray(entry)) {
                continue;
              }
              const relativePath =
                typeof entry.path === 'string'
                  ? entry.path.replace(/\\/g, '/').replace(/^\.\//, '')
                  : '';
              if (!relativePath || entry.type !== 'file' || entry.existed !== true) {
                continue;
              }
              const absolutePath = path.resolve(process.cwd(), relativePath);
              const snapshotPath =
                typeof entry.snapshotPath === 'string' ? entry.snapshotPath : '';
              if (!snapshotPath || !fs.existsSync(snapshotPath)) {
                failed.push({
                  path: relativePath,
                  reason: 'snapshot file missing',
                });
                continue;
              }
              try {
                const changed =
                  !fs.existsSync(absolutePath) ||
                  hashFile(absolutePath) !== entry.sha256;
                if (!changed) {
                  continue;
                }
                fs.mkdirSync(path.dirname(absolutePath), { recursive: true });
                fs.copyFileSync(snapshotPath, absolutePath);
                restored.push({
                  path: relativePath,
                  reason: 'verification mutated protected pre-existing file',
                });
              } catch (error) {
                failed.push({
                  path: relativePath,
                  reason: error instanceof Error ? error.message : String(error),
                });
              }
            }

            const skipped = Array.isArray(snapshot.skipped) ? snapshot.skipped : [];
            for (const entry of skipped) {
              if (!entry || typeof entry !== 'object' || Array.isArray(entry)) {
                continue;
              }
              if (typeof entry.path === 'string') {
                unsupported.push({
                  path: entry.path,
                  reason:
                    typeof entry.reason === 'string'
                      ? entry.reason
                      : 'unsupported protected path type',
                });
              }
            }

            fs.writeFileSync(
              sideEffectsFile,
              `${JSON.stringify({ version: 1, restored, unsupported, failed }, null, 2)}\n`,
              'utf8',
            );
            fs.appendFileSync({{BRAND_OUTPUT_VARIABLE_NAME}}, `verification_side_effects_file=${sideEffectsFile}\n`, 'utf8');
            fs.appendFileSync({{BRAND_OUTPUT_VARIABLE_NAME}}, `verification_side_effect_restored_count=${String(restored.length)}\n`, 'utf8');
            fs.appendFileSync({{BRAND_OUTPUT_VARIABLE_NAME}}, `verification_side_effect_unsupported_count=${String(unsupported.length)}\n`, 'utf8');
            fs.appendFileSync({{BRAND_OUTPUT_VARIABLE_NAME}}, `verification_side_effect_failed_count=${String(failed.length)}\n`, 'utf8');
          env:
            SNAPSHOT_FILE: ${{ steps.snapshot_verification_protected_paths.outputs.snapshot_file }}

        - id: plan_completion_audit
          name: Run Plan Completion Audit
          uses: builtin/agent-prompt
          with:
            model: $default-codex
            thinking_effort: medium
            permission_preset: read_only
            structured_output_schema: ${{ env.COMPLETION_AUDIT_SCHEMA }}
            prompt: |
              Audit whether the current workspace satisfies the approved plan completion contract.

              Read:
              - plan completion contract: `${{ needs.plan_contract.outputs.contract_file }}`
              - QA intent summary: `${{ needs.qa_intent_summary.outputs.qa_intent_summary_file }}`
              - implementation summary: `${{ needs.implement.outputs.implementation_summary_file }}`
              - frontend implementation summary, if present: `${{ needs.implement_frontend.outputs.implementation_summary_file }}`
              - implementation completion report: `${{ needs.implementation_completion_loop.outputs.completion_json_file }}`
              - current workspace summary: `${{ steps.qa_workspace_details.outputs.workspace_summary_file }}`
              - reviewable changed files: `${{ steps.qa_workspace_details.outputs.review_changed_files_file }}`
              - baseline-aware change classification: `${{ steps.qa_workspace_details.outputs.baseline_classification_file }}`
              - review diff: `${{ steps.qa_workspace_details.outputs.review_diff_file }}`
              - full current diff fallback: `${{ steps.qa_workspace_details.outputs.diff_file }}`
              - selected verification checks: `${{ steps.resolve_verification_commands_file.outputs.verification_commands_file }}`
              - verification results: `${{ steps.run_verification_commands.outputs.verification_results_file }}`
              - verification report: `${{ steps.run_verification_commands.outputs.verification_report_file }}`
              - verification side effects: `${{ steps.restore_verification_protected_paths.outputs.verification_side_effects_file }}`

              Scope:
              - this audit is separate from code review
              - report only unmet acceptance checks from the plan completion contract
              - each issue must cite concrete evidence from the workspace, diff, verification results, or absence of required evidence
              - do not invent new requirements
              - do not report code-review bugs unless they directly prove an acceptance check is unmet
              - distinguish unmet product requirements from missing or invalid verification evidence
              - do not report missing evidence for command checks whose result is `passed` or `passed_expected_failure`
              - do not report expected-negative command exits as failures when the verification result matched the expected exit/output
              - do not report skipped `manual` checks as product bugs
              - skipped `scenario` checks are evidence prompts, not automatic blockers; report a completion audit issue only when the plan requires the scenario and no credible evidence exists in verification results, implementation summaries, implementation completion evidence, or workspace artifacts
              - do not report missing git commits, pushes, branches, or pull requests as completion audit issues; final repository-history operations are handled by dedicated commit/PR jobs when enabled
              - interpret plan wording like "committed with the change" as requiring the related files to be present together in the workspace diff unless the task itself is about commit/PR automation
              - if a check is missing because the verification specification is unsafe or non-runnable, make the suggested fix about correcting or replacing the verification evidence, not about changing unrelated product code

              ${{ env.BASELINE_SCOPE_RULES }}

              Return JSON with:
              - `summary`: concise completion-audit summary
              - `issues`: actionable unmet acceptance checks that must be fixed before final success

        - id: inspect_pre_review_gates
          name: Inspect Pre-Review QA Gates
          shell: node
          run: |
            import fs from 'node:fs';

            const {{BRAND_OUTPUT_VARIABLE_NAME}} = process.env.{{BRAND_ENV_PREFIX}}_OUTPUT ?? '';
            if (!{{BRAND_OUTPUT_VARIABLE_NAME}}) {
              throw new Error('{{BRAND_ENV_PREFIX}}_OUTPUT is required');
            }

            const readJsonFile = (filePath, fallback) => {
              const normalizedPath = typeof filePath === 'string' ? filePath.trim() : '';
              if (!normalizedPath || !fs.existsSync(normalizedPath)) {
                return fallback;
              }
              try {
                return JSON.parse(fs.readFileSync(normalizedPath, 'utf8'));
              } catch {
                return fallback;
              }
            };
            const verificationResults = readJsonFile(process.env.VERIFICATION_RESULTS_FILE, {
              results: [],
            });
            const completionAudit = readJsonFile(process.env.COMPLETION_AUDIT_JSON_FILE, {
              issues: [],
            });
            const sideEffects = readJsonFile(process.env.VERIFICATION_SIDE_EFFECTS_FILE, {
              unsupported: [],
              failed: [],
            });
            const protectedDrift = readJsonFile(process.env.PROTECTED_DRIFT_FILE, []);
            const results = Array.isArray(verificationResults.results)
              ? verificationResults.results
              : [];
            const verificationFailures = results.filter(
              (result) =>
                result &&
                typeof result === 'object' &&
                !Array.isArray(result) &&
                result.status === 'failed',
            );
            const verificationSpecErrors = results.filter(
              (result) =>
                result &&
                typeof result === 'object' &&
                !Array.isArray(result) &&
                result.status === 'invalid',
            );
            const completionAuditIssues = Array.isArray(completionAudit.issues)
              ? completionAudit.issues
              : [];
            const unsupportedSideEffects = Array.isArray(sideEffects.unsupported)
              ? sideEffects.unsupported
              : [];
            const failedSideEffects = Array.isArray(sideEffects.failed)
              ? sideEffects.failed
              : [];
            const protectedDriftEntries = Array.isArray(protectedDrift)
              ? protectedDrift
              : [];
            const actionableCount =
              verificationFailures.length +
              verificationSpecErrors.length +
              completionAuditIssues.length +
              unsupportedSideEffects.length +
              failedSideEffects.length +
              protectedDriftEntries.length;
            const summary = [
              'verification_failures=' + String(verificationFailures.length),
              'verification_spec_errors=' + String(verificationSpecErrors.length),
              'completion_audit_issues=' + String(completionAuditIssues.length),
              'verification_side_effect_blockers=' + String(unsupportedSideEffects.length + failedSideEffects.length),
              'protected_drift=' + String(protectedDriftEntries.length),
            ].join('; ');

            fs.appendFileSync(
              {{BRAND_OUTPUT_VARIABLE_NAME}},
              'has_pre_review_actionable=' + (actionableCount > 0 ? 'true' : 'false') + '\n',
              'utf8',
            );
            fs.appendFileSync(
              {{BRAND_OUTPUT_VARIABLE_NAME}},
              'pre_review_actionable_count=' + String(actionableCount) + '\n',
              'utf8',
            );
            fs.appendFileSync({{BRAND_OUTPUT_VARIABLE_NAME}}, 'pre_review_summary=' + summary + '\n', 'utf8');
          env:
            VERIFICATION_RESULTS_FILE: ${{ steps.run_verification_commands.outputs.verification_results_file }}
            COMPLETION_AUDIT_JSON_FILE: ${{ steps.plan_completion_audit.outputs.json_response_file }}
            VERIFICATION_SIDE_EFFECTS_FILE: ${{ steps.restore_verification_protected_paths.outputs.verification_side_effects_file }}
            PROTECTED_DRIFT_FILE: ${{ steps.qa_workspace_details.outputs.protected_drift_file }}

        - id: code_review_full
          name: Run Full Code Review
          if: steps.inspect_pre_review_gates.outputs.has_pre_review_actionable != 'true' && steps.load_qa_loop_state.outputs.code_review_completed != 'true' && steps.compute_qa_review_scope.outputs.has_changed_files == 'true'
          uses: builtin/run-pipeline
          with:
            pipeline: code-review-multi-provider.yaml
            inputs: ${{ steps.prepare_code_review_inputs.outputs.code_review_inputs_json }}

        - id: recheck_previous_findings_resume
          name: Resume Recheck Of Previous Findings
          if: steps.inspect_pre_review_gates.outputs.has_pre_review_actionable != 'true' && steps.load_qa_loop_state.outputs.recheck_session_id != '' && steps.load_qa_loop_state.outputs.previous_code_review_issue_count != '0'
          continue_on_error: true
          uses: builtin/agent-resume
          with:
            session_id: ${{ steps.load_qa_loop_state.outputs.recheck_session_id }}
            model: $default-codex
            thinking_effort: medium
            permission_preset: read_only
            structured_output_schema: ${{ env.QA_AGENT_REVIEW_SCHEMA }}
            prompt: |
              Re-check the prior QA findings in `${{ steps.load_qa_loop_state.outputs.previous_findings_file }}` against the current workspace.

              Read:
              - the plan completion contract at `${{ needs.plan_contract.outputs.contract_file }}`
              - the QA intent summary at `${{ needs.qa_intent_summary.outputs.qa_intent_summary_file }}`
              - the current workspace summary at `${{ steps.qa_workspace_details.outputs.workspace_summary_file }}`
              - the current diff at `${{ steps.qa_workspace_details.outputs.diff_file }}`
              - the current changed files list at `${{ steps.qa_workspace_details.outputs.changed_files_file }}`
              - the baseline-aware change classification at `${{ steps.qa_workspace_details.outputs.baseline_classification_file }}`

              If `${{ steps.load_qa_loop_state.outputs.latest_fix_summary_file }}` is non-empty, read that fix summary too.

              Scope:
              - treat the plan completion contract as the authoritative approved implementation baseline
              - use the QA intent summary only as secondary context; if it conflicts with the contract, the contract wins
              - ignore any prior entries whose `source` is `verification` or `completion_audit`; deterministic verification and completion audit rerun separately
              - re-check whether previously reported code-review issues are still real and unresolved
              - also look for new high-signal issues directly related to the follow-up fixes or the files now in scope
              - do not widen back out to a full multi-track repo review
              - do not call behavior that satisfies a contract acceptance check a `bug`

              ${{ env.BASELINE_SCOPE_RULES }}

              Return JSON with:
              - `summary`: concise recheck summary
              - `issues`: only unresolved or newly introduced issues that still need fixing

              Requirements for each issue:
              - keep it high-signal and evidence-based
              - use source-file line numbers from the changed file
              - set `category` to `bug`, `project_compliance`, or `plan_conflict`
              - use `comment.body` for the inline review comment text

        - id: recheck_previous_findings_start
          name: Start Recheck Of Previous Findings
          if: steps.inspect_pre_review_gates.outputs.has_pre_review_actionable != 'true' && steps.load_qa_loop_state.outputs.previous_findings_file != '' && steps.load_qa_loop_state.outputs.previous_code_review_issue_count != '0' && (steps.load_qa_loop_state.outputs.recheck_session_id == '' || steps.recheck_previous_findings_resume.conclusion != 'success')
          uses: builtin/agent-prompt
          with:
            model: $default-codex
            thinking_effort: medium
            permission_preset: read_only
            structured_output_schema: ${{ env.QA_AGENT_REVIEW_SCHEMA }}
            prompt: |
              Re-check the prior QA findings in `${{ steps.load_qa_loop_state.outputs.previous_findings_file }}` against the current workspace.

              Read:
              - the plan completion contract at `${{ needs.plan_contract.outputs.contract_file }}`
              - the QA intent summary at `${{ needs.qa_intent_summary.outputs.qa_intent_summary_file }}`
              - the current workspace summary at `${{ steps.qa_workspace_details.outputs.workspace_summary_file }}`
              - the current diff at `${{ steps.qa_workspace_details.outputs.diff_file }}`
              - the current changed files list at `${{ steps.qa_workspace_details.outputs.changed_files_file }}`
              - the baseline-aware change classification at `${{ steps.qa_workspace_details.outputs.baseline_classification_file }}`

              If `${{ steps.load_qa_loop_state.outputs.latest_fix_summary_file }}` is non-empty, read that fix summary too.

              Scope:
              - treat the plan completion contract as the authoritative approved implementation baseline
              - use the QA intent summary only as secondary context; if it conflicts with the contract, the contract wins
              - ignore any prior entries whose `source` is `verification` or `completion_audit`; deterministic verification and completion audit rerun separately
              - re-check whether previously reported code-review issues are still real and unresolved
              - also look for new high-signal issues directly related to the follow-up fixes or the files now in scope
              - do not widen back out to a full multi-track repo review
              - do not call behavior that satisfies a contract acceptance check a `bug`
              - do not call approved planned behavior a `bug` just because you disagree with the plan
              - if the approved plan itself appears unsafe or materially flawed, report that as `plan_conflict`

              ${{ env.BASELINE_SCOPE_RULES }}

              Return JSON with:
              - `summary`: concise recheck summary
              - `issues`: only unresolved or newly introduced issues that still need fixing

              Requirements for each issue:
              - keep it high-signal and evidence-based
              - use source-file line numbers from the changed file
              - set `category` to `bug`, `project_compliance`, or `plan_conflict`
              - use `comment.body` for the inline review comment text

        - id: fresh_bug_review
          name: Run Fresh Bug Review
          if: steps.inspect_pre_review_gates.outputs.has_pre_review_actionable != 'true' && steps.load_qa_loop_state.outputs.code_review_completed == 'true' && steps.load_qa_loop_state.outputs.previous_findings_file != '' && steps.compute_qa_review_scope.outputs.scope_changed == 'true'
          uses: builtin/agent-prompt
          with:
            model: $default-codex
            thinking_effort: medium
            permission_preset: read_only
            structured_output_schema: ${{ env.QA_AGENT_REVIEW_SCHEMA }}
            prompt: |
              Perform one fresh high-signal bug review of the current workspace changes.

              Read:
              - the plan completion contract at `${{ needs.plan_contract.outputs.contract_file }}`
              - the QA intent summary at `${{ needs.qa_intent_summary.outputs.qa_intent_summary_file }}`
              - the current workspace summary at `${{ steps.qa_workspace_details.outputs.workspace_summary_file }}`
              - the current diff at `${{ steps.qa_workspace_details.outputs.diff_file }}`
              - the current changed files list at `${{ steps.qa_workspace_details.outputs.changed_files_file }}`
              - the baseline-aware change classification at `${{ steps.qa_workspace_details.outputs.baseline_classification_file }}`

              If `${{ steps.load_qa_loop_state.outputs.previous_findings_file }}` is non-empty, read it for context so you do not repeat issues that have already been resolved.

              The review scope widened on this rerun. Current touched scope: `${{ steps.compute_qa_review_scope.outputs.scope_summary }}`.

              Scope:
              - this is the only fresh broad bug check on rerun passes when the touched file scope widens
              - treat the plan completion contract as the authoritative approved implementation baseline
              - use the QA intent summary only as secondary context; if it conflicts with the contract, the contract wins
              - focus on concrete bugs in the changed code or directly related changed behavior
              - ignore style, nits, or speculative concerns
              - do not call behavior that satisfies a contract acceptance check a `bug`
              - do not call approved planned behavior a `bug` just because you disagree with the plan
              - if the approved plan itself appears unsafe or materially flawed, report that as `plan_conflict`

              ${{ env.BASELINE_SCOPE_RULES }}

              Return JSON with:
              - `summary`: concise review summary
              - `issues`: only high-signal bug findings that still matter

              Requirements for each issue:
              - set `category` to `bug` or `plan_conflict`
              - use source-file line numbers from the changed file
              - use `comment.body` for the inline review comment text

        - id: synthesize_review_results
          name: Synthesize Review Results
          shell: node
          run: |
            import fs from 'node:fs';
            import path from 'node:path';

            const {{BRAND_OUTPUT_VARIABLE_NAME}} = process.env.{{BRAND_ENV_PREFIX}}_OUTPUT ?? '';
            if (!{{BRAND_OUTPUT_VARIABLE_NAME}}) {
              throw new Error('{{BRAND_ENV_PREFIX}}_OUTPUT is required');
            }

            const fullReviewJsonFile = (process.env.FULL_REVIEW_JSON_FILE ?? '').trim();
            const fullReviewReportFile = (process.env.FULL_REVIEW_REPORT_FILE ?? '').trim();
            const outputDir =
              process.env.{{BRAND_ENV_PREFIX}}_OUTPUT_DIR ?? path.dirname({{BRAND_OUTPUT_VARIABLE_NAME}});
            const reviewJsonFile = path.join(outputDir, 'qa-review.json');
            const reviewReportFile = path.join(outputDir, 'qa-review.md');

            const persistFile = (sourcePath, destinationPath) => {
              const serialized = fs.readFileSync(sourcePath, 'utf8');
              fs.writeFileSync(
                destinationPath,
                serialized.endsWith('\n') ? serialized : `${serialized}\n`,
                'utf8',
              );
            };

            const writeReviewReport = (summary, issues, destinationPath) => {
              const reportLines = ['# Code Review', '', summary];
              if (issues.length === 0) {
                reportLines.push('', 'No high-signal issues found.');
              }

              issues.forEach((issue, index) => {
                const comment = issue.comment ?? {};
                const filePath =
                  typeof comment.filePath === 'string' ? comment.filePath : '(unknown)';
                const startLine =
                  typeof comment.startLine === 'number' ? String(comment.startLine) : '?';
                const endLine =
                  typeof comment.endLine === 'number'
                    ? String(comment.endLine)
                    : startLine;
                const description =
                  typeof issue.description === 'string' ? issue.description : '';
                const reason = typeof issue.reason === 'string' ? issue.reason : '';

                reportLines.push('');
                reportLines.push(`### #${String(index + 1)} ${issue.title}`);
                reportLines.push('');
                reportLines.push(description);
                reportLines.push('');
                reportLines.push(
                  `Category: ${typeof issue.category === 'string' ? issue.category : '(unknown)'}`,
                );
                reportLines.push(`File: ${filePath}:${startLine}-${endLine}`);
                reportLines.push(`Reason: ${reason}`);
              });

              fs.writeFileSync(
                destinationPath,
                `${reportLines.join('\n')}\n`,
                'utf8',
              );
            };
            const isRecord = (value) =>
              Boolean(value) && typeof value === 'object' && !Array.isArray(value);
            const stringValue = (value) => (typeof value === 'string' ? value : '');
            const numberValue = (value) => (typeof value === 'number' ? value : null);
            const normalizeFindingCategory = (record) => {
              const category = stringValue(record.category).toLowerCase();
              const searchableText = [
                category,
                stringValue(record.title),
                stringValue(record.problem),
                stringValue(record.impact),
                stringValue(record.recommendation),
                stringValue(record.sourceEvidence),
              ]
                .join('\n')
                .toLowerCase();
              const describesApprovedIntentConflict =
                category === 'reliability' &&
                /\bapproved (?:intent|plan|planned behavior|behavior)\b|\bplan[-_ ]conflict\b/.test(
                  searchableText,
                );

              if (category === 'plan_conflict' || describesApprovedIntentConflict) {
                return 'plan_conflict';
              }

              if (category === 'instructions' || category === 'project_compliance') {
                return 'project_compliance';
              }

              return 'bug';
            };
            const normalizeFindingToIssue = (finding, index) => {
              const record = isRecord(finding) ? finding : {};
              const title = stringValue(record.title) || `Code review finding ${String(index + 1)}`;
              const problem = stringValue(record.problem);
              const impact = stringValue(record.impact);
              const recommendation = stringValue(record.recommendation);
              const sourceEvidence = stringValue(record.sourceEvidence);
              const description = [problem, impact, recommendation]
                .filter((value) => value.trim().length > 0)
                .join('\n\n');
              const reason = [sourceEvidence, stringValue(record.confidence)]
                .filter((value) => value.trim().length > 0)
                .join('\n');
              const filePath = stringValue(record.filePath);
              const startLine = numberValue(record.lineStart);
              const endLine = numberValue(record.lineEnd) ?? startLine;

              return {
                title,
                description,
                reason,
                category: normalizeFindingCategory(record),
                comment: {
                  filePath,
                  startLine,
                  endLine,
                  body: [
                    `**${title}**`,
                    problem,
                    impact ? `Impact: ${impact}` : '',
                    recommendation ? `Recommendation: ${recommendation}` : '',
                  ]
                    .filter((value) => value.trim().length > 0)
                    .join('\n\n'),
                },
              };
            };
            const normalizeReviewJson = (parsed) => {
              if (!isRecord(parsed)) {
                return { summary: '', issues: [] };
              }

              const summary = stringValue(parsed.summary);
              if (Array.isArray(parsed.issues)) {
                return { summary, issues: parsed.issues };
              }

              if (Array.isArray(parsed.findings)) {
                return {
                  summary,
                  issues: parsed.findings.map(normalizeFindingToIssue),
                };
              }

              return { summary, issues: [] };
            };

            const appendReviewOutputs = () => {
              fs.appendFileSync(
                {{BRAND_OUTPUT_VARIABLE_NAME}},
                `review_json_file=${reviewJsonFile}\n`,
                'utf8',
              );
              fs.appendFileSync(
                {{BRAND_OUTPUT_VARIABLE_NAME}},
                `review_report_file=${reviewReportFile}\n`,
                'utf8',
              );
            };

            const emitReviewArtifacts = (summary, issues) => {
              fs.writeFileSync(
                reviewJsonFile,
                `${JSON.stringify({ summary, issues }, null, 2)}\n`,
                'utf8',
              );
              writeReviewReport(summary, issues, reviewReportFile);
              appendReviewOutputs();
            };

            if (fullReviewJsonFile && fs.existsSync(fullReviewJsonFile)) {
              const parsed = JSON.parse(fs.readFileSync(fullReviewJsonFile, 'utf8'));
              const { summary, issues } = normalizeReviewJson(parsed);
              fs.writeFileSync(
                reviewJsonFile,
                `${JSON.stringify({ summary, issues }, null, 2)}\n`,
                'utf8',
              );

              if (fullReviewReportFile && fs.existsSync(fullReviewReportFile)) {
                persistFile(fullReviewReportFile, reviewReportFile);
              } else {
                writeReviewReport(summary, issues, reviewReportFile);
              }

              appendReviewOutputs();
              process.exit(0);
            }

            const candidateFiles = [
              {
                label: 'resumed_recheck',
                file: (process.env.RECHECK_RESUME_JSON_FILE ?? '').trim(),
              },
              {
                label: 'fresh_recheck',
                file: (process.env.RECHECK_START_JSON_FILE ?? '').trim(),
              },
              {
                label: 'fresh_bug_review',
                file: (process.env.FRESH_BUG_JSON_FILE ?? '').trim(),
              },
            ].filter((entry) => entry.file.length > 0 && fs.existsSync(entry.file));

            if (candidateFiles.length === 0) {
              const preReviewActionable =
                (process.env.PRE_REVIEW_ACTIONABLE ?? '').trim() === 'true';
              const preReviewSummary =
                (process.env.PRE_REVIEW_SUMMARY ?? '').trim();
              const summary = preReviewActionable
                ? `Code review skipped for this QA iteration because verification or completion audit already found actionable work. ${preReviewSummary}`
                : 'QA rerun produced no remaining code-review issues.';
              const issues = [];
              emitReviewArtifacts(summary, issues);
              process.exit(0);
            }

            const summaries = [];
            const dedupedByKey = new Map();
            for (const source of candidateFiles) {
              const parsed = JSON.parse(fs.readFileSync(source.file, 'utf8'));
              const summary =
                parsed &&
                typeof parsed === 'object' &&
                !Array.isArray(parsed) &&
                typeof parsed.summary === 'string'
                  ? parsed.summary.replace(/\r?\n/g, ' ').trim()
                  : '';
              if (summary.length > 0) {
                summaries.push(summary);
              }

              const issues =
                parsed &&
                typeof parsed === 'object' &&
                !Array.isArray(parsed) &&
                Array.isArray(parsed.issues)
                  ? parsed.issues
                  : [];
              for (const issue of issues) {
                const comment =
                  issue &&
                  typeof issue === 'object' &&
                  !Array.isArray(issue) &&
                  issue.comment &&
                  typeof issue.comment === 'object' &&
                  !Array.isArray(issue.comment)
                    ? issue.comment
                    : {};
                const key = [
                  issue &&
                  typeof issue === 'object' &&
                  !Array.isArray(issue) &&
                  typeof issue.title === 'string'
                    ? issue.title
                    : '',
                  issue &&
                  typeof issue === 'object' &&
                  !Array.isArray(issue) &&
                  typeof issue.category === 'string'
                    ? issue.category
                    : '',
                  issue &&
                  typeof issue === 'object' &&
                  !Array.isArray(issue) &&
                  typeof issue.reason === 'string'
                    ? issue.reason
                    : '',
                  typeof comment.filePath === 'string' ? comment.filePath : '',
                  typeof comment.startLine === 'number' ? String(comment.startLine) : '',
                  typeof comment.endLine === 'number' ? String(comment.endLine) : '',
                  typeof comment.body === 'string' ? comment.body : '',
                ].join('::');
                if (!dedupedByKey.has(key)) {
                  dedupedByKey.set(key, issue);
                }
              }
            }

            const issues = Array.from(dedupedByKey.values());
            const summary =
              summaries.length > 0
                ? summaries.join(' ')
                : issues.length > 0
                  ? `QA rerun produced ${String(issues.length)} remaining issue(s).`
                  : 'QA rerun produced no remaining code-review issues.';

            emitReviewArtifacts(summary, issues);
          env:
            FULL_REVIEW_JSON_FILE: ${{ steps.code_review_full.outputs['synthesize_review.review_json_file'] }}
            FULL_REVIEW_REPORT_FILE: ${{ steps.code_review_full.outputs['synthesize_review.review_report_file'] }}
            RECHECK_RESUME_JSON_FILE: ${{ steps.recheck_previous_findings_resume.outputs.json_response_file }}
            RECHECK_START_JSON_FILE: ${{ steps.recheck_previous_findings_start.outputs.json_response_file }}
            FRESH_BUG_JSON_FILE: ${{ steps.fresh_bug_review.outputs.json_response_file }}
            PRE_REVIEW_ACTIONABLE: ${{ steps.inspect_pre_review_gates.outputs.has_pre_review_actionable }}
            PRE_REVIEW_SUMMARY: ${{ steps.inspect_pre_review_gates.outputs.pre_review_summary }}

        - id: inspect_qa_results
          name: Inspect QA Results
          shell: node
          run: |
            import fs from 'node:fs';
            import path from 'node:path';

            const {{BRAND_OUTPUT_VARIABLE_NAME}} = process.env.{{BRAND_ENV_PREFIX}}_OUTPUT ?? '';
            if (!{{BRAND_OUTPUT_VARIABLE_NAME}}) {
              throw new Error('{{BRAND_ENV_PREFIX}}_OUTPUT is required');
            }

            const reviewJsonFile = process.env.REVIEW_JSON_FILE;
            if (!reviewJsonFile || !fs.existsSync(reviewJsonFile)) {
              throw new Error(
                `Missing review JSON file: ${reviewJsonFile ?? '(empty)'}`,
              );
            }

            const reviewReportFile = process.env.REVIEW_REPORT_FILE;
            const verificationResultsFile = process.env.VERIFICATION_RESULTS_FILE;
            if (
              !verificationResultsFile ||
              !fs.existsSync(verificationResultsFile)
            ) {
              throw new Error(
                `Missing verification results file: ${verificationResultsFile ?? '(empty)'}`,
              );
            }

            const verificationReportFile = process.env.VERIFICATION_REPORT_FILE;

            const parsed = JSON.parse(fs.readFileSync(reviewJsonFile, 'utf8'));
            const issues = Array.isArray(parsed.issues) ? parsed.issues : [];
            const rawSummary =
              typeof parsed.summary === 'string' ? parsed.summary : '';
            const reviewSummary = rawSummary.replace(/\r?\n/g, ' ').trim();
            const completionAuditJsonFile = process.env.COMPLETION_AUDIT_JSON_FILE;
            if (!completionAuditJsonFile || !fs.existsSync(completionAuditJsonFile)) {
              throw new Error(
                `Missing completion audit JSON file: ${completionAuditJsonFile ?? '(empty)'}`,
              );
            }
            const completionAuditParsed = JSON.parse(
              fs.readFileSync(completionAuditJsonFile, 'utf8'),
            );
            const completionAuditSummary =
              completionAuditParsed &&
              typeof completionAuditParsed === 'object' &&
              !Array.isArray(completionAuditParsed) &&
              typeof completionAuditParsed.summary === 'string'
                ? completionAuditParsed.summary.replace(/\r?\n/g, ' ').trim()
                : '';
            const completionAuditRawIssues =
              completionAuditParsed &&
              typeof completionAuditParsed === 'object' &&
              !Array.isArray(completionAuditParsed) &&
              Array.isArray(completionAuditParsed.issues)
                ? completionAuditParsed.issues
                : [];

            const verificationParsed = JSON.parse(
              fs.readFileSync(verificationResultsFile, 'utf8'),
            );
            const verificationResults =
              verificationParsed &&
              typeof verificationParsed === 'object' &&
              !Array.isArray(verificationParsed) &&
              Array.isArray(verificationParsed.results)
                ? verificationParsed.results
                : [];
            const verificationFailures = verificationResults.filter(
              (result) =>
                result &&
                typeof result === 'object' &&
                !Array.isArray(result) &&
                result.status === 'failed',
            );
            const verificationSpecErrors = verificationResults.filter(
              (result) =>
                result &&
                typeof result === 'object' &&
                !Array.isArray(result) &&
                result.status === 'invalid',
            );
            const verificationSkipped = verificationResults.filter(
              (result) =>
                result &&
                typeof result === 'object' &&
                !Array.isArray(result) &&
                result.status === 'skipped',
            );
            const verificationPassedExpectedFailures = verificationResults.filter(
              (result) =>
                result &&
                typeof result === 'object' &&
                !Array.isArray(result) &&
                result.status === 'passed_expected_failure',
            );
            const verificationSideEffectsFile =
              process.env.VERIFICATION_SIDE_EFFECTS_FILE;
            const verificationSideEffects =
              verificationSideEffectsFile && fs.existsSync(verificationSideEffectsFile)
                ? JSON.parse(fs.readFileSync(verificationSideEffectsFile, 'utf8'))
                : { restored: [], unsupported: [], failed: [] };
            const restoredVerificationSideEffects =
              verificationSideEffects &&
              typeof verificationSideEffects === 'object' &&
              !Array.isArray(verificationSideEffects) &&
              Array.isArray(verificationSideEffects.restored)
                ? verificationSideEffects.restored
                : [];
            const unsupportedVerificationSideEffects =
              verificationSideEffects &&
              typeof verificationSideEffects === 'object' &&
              !Array.isArray(verificationSideEffects) &&
              Array.isArray(verificationSideEffects.unsupported)
                ? verificationSideEffects.unsupported
                : [];
            const failedVerificationSideEffects =
              verificationSideEffects &&
              typeof verificationSideEffects === 'object' &&
              !Array.isArray(verificationSideEffects) &&
              Array.isArray(verificationSideEffects.failed)
                ? verificationSideEffects.failed
                : [];
            const protectedDriftFile = process.env.PROTECTED_DRIFT_FILE;
            const protectedDriftParsed =
              protectedDriftFile && fs.existsSync(protectedDriftFile)
                ? JSON.parse(fs.readFileSync(protectedDriftFile, 'utf8'))
                : [];
            const protectedDriftRecords = Array.isArray(protectedDriftParsed)
              ? protectedDriftParsed
              : [];

            const codeReviewIssues = issues.map((issue, index) => ({
              source: 'code_review',
              title:
                issue &&
                typeof issue === 'object' &&
                !Array.isArray(issue) &&
                typeof issue.title === 'string'
                  ? issue.title
                  : `Code review issue ${String(index + 1)}`,
              description:
                issue &&
                typeof issue === 'object' &&
                !Array.isArray(issue) &&
                typeof issue.description === 'string'
                  ? issue.description
                  : '',
              reason:
                issue &&
                typeof issue === 'object' &&
                !Array.isArray(issue) &&
                typeof issue.reason === 'string'
                  ? issue.reason
                  : '',
              category:
                issue &&
                typeof issue === 'object' &&
                !Array.isArray(issue) &&
                typeof issue.category === 'string'
                  ? issue.category
                  : '',
              filePath:
                issue &&
                typeof issue === 'object' &&
                !Array.isArray(issue) &&
                issue.comment &&
                typeof issue.comment === 'object' &&
                !Array.isArray(issue.comment) &&
                typeof issue.comment.filePath === 'string'
                  ? issue.comment.filePath
                  : '',
              startLine:
                issue &&
                typeof issue === 'object' &&
                !Array.isArray(issue) &&
                issue.comment &&
                typeof issue.comment === 'object' &&
                !Array.isArray(issue.comment) &&
                typeof issue.comment.startLine === 'number'
                  ? issue.comment.startLine
                  : null,
              endLine:
                issue &&
                typeof issue === 'object' &&
                !Array.isArray(issue) &&
                issue.comment &&
                typeof issue.comment === 'object' &&
                !Array.isArray(issue.comment) &&
                typeof issue.comment.endLine === 'number'
                  ? issue.comment.endLine
                  : null,
            }));
            const completionAuditIssues = completionAuditRawIssues.map(
              (issue, index) => ({
                source: 'completion_audit',
                title:
                  issue &&
                  typeof issue === 'object' &&
                  !Array.isArray(issue) &&
                  typeof issue.title === 'string'
                    ? issue.title
                    : `Completion audit issue ${String(index + 1)}`,
                description:
                  issue &&
                  typeof issue === 'object' &&
                  !Array.isArray(issue) &&
                  typeof issue.description === 'string'
                    ? issue.description
                    : '',
                reason:
                  issue &&
                  typeof issue === 'object' &&
                  !Array.isArray(issue) &&
                  typeof issue.reason === 'string'
                    ? issue.reason
                    : '',
                category: 'completion_audit',
                requirementId:
                  issue &&
                  typeof issue === 'object' &&
                  !Array.isArray(issue) &&
                  typeof issue.requirementId === 'string'
                    ? issue.requirementId
                    : '',
                acceptanceCheck:
                  issue &&
                  typeof issue === 'object' &&
                  !Array.isArray(issue) &&
                  typeof issue.acceptanceCheck === 'string'
                    ? issue.acceptanceCheck
                    : '',
                evidence:
                  issue &&
                  typeof issue === 'object' &&
                  !Array.isArray(issue) &&
                  typeof issue.evidence === 'string'
                    ? issue.evidence
                    : '',
                suggestedFix:
                  issue &&
                  typeof issue === 'object' &&
                  !Array.isArray(issue) &&
                  typeof issue.suggestedFix === 'string'
                    ? issue.suggestedFix
                    : '',
              }),
            );
            const verificationIssues = verificationFailures.map((result) => ({
                source: 'verification',
                title:
                  result &&
                  typeof result === 'object' &&
                  !Array.isArray(result) &&
                  typeof result.command === 'string'
                    ? `Verification command failed: ${result.command}`
                    : 'Verification command failed',
                description:
                  result &&
                  typeof result === 'object' &&
                  !Array.isArray(result) &&
                  typeof result.command === 'string'
                    ? `The verification command \`${result.command}\` reported errors during the QA loop.`
                    : 'A verification command reported errors during the QA loop.',
                reason:
                  result &&
                  typeof result === 'object' &&
                  !Array.isArray(result) &&
                  typeof result.stderrTail === 'string' &&
                  result.stderrTail.trim().length > 0
                    ? result.stderrTail.trim()
                    : result &&
                        typeof result === 'object' &&
                        !Array.isArray(result) &&
                        typeof result.stdoutTail === 'string'
                      ? result.stdoutTail.trim()
                      : '',
                category: 'verification',
                command:
                  result &&
                  typeof result === 'object' &&
                  !Array.isArray(result) &&
                  typeof result.command === 'string'
                    ? result.command
                    : '',
                exitCode:
                  result &&
                  typeof result === 'object' &&
                  !Array.isArray(result) &&
                  typeof result.exitCode === 'number'
                    ? result.exitCode
                    : null,
              }));
            const verificationSpecIssues = verificationSpecErrors.map((result) => ({
                source: 'verification_spec',
                title:
                  result &&
                  typeof result === 'object' &&
                  !Array.isArray(result) &&
                  typeof result.command === 'string' &&
                  result.command.length > 0
                    ? `Verification spec error: ${result.command}`
                    : 'Verification spec error',
                description:
                  result &&
                  typeof result === 'object' &&
                  !Array.isArray(result) &&
                  typeof result.description === 'string'
                    ? result.description
                    : 'A verification check could not be executed because its specification is invalid.',
                reason:
                  result &&
                  typeof result === 'object' &&
                  !Array.isArray(result) &&
                  typeof result.invalidReason === 'string'
                    ? result.invalidReason
                    : '',
                category: 'verification_spec',
                command:
                  result &&
                  typeof result === 'object' &&
                  !Array.isArray(result) &&
                  typeof result.command === 'string'
                    ? result.command
                    : '',
                exitCode: null,
              }));
            const verificationSideEffectIssues = [
              ...unsupportedVerificationSideEffects.map((entry) => ({
                source: 'verification_side_effect',
                title: 'Unsupported protected verification side effect',
                description:
                  'A protected pre-existing path could not be snapshotted or restored around verification.',
                reason:
                  entry &&
                  typeof entry === 'object' &&
                  !Array.isArray(entry) &&
                  typeof entry.reason === 'string'
                    ? entry.reason
                    : '',
                category: 'verification_side_effect',
                filePath:
                  entry &&
                  typeof entry === 'object' &&
                  !Array.isArray(entry) &&
                  typeof entry.path === 'string'
                    ? entry.path
                    : '',
                startLine: null,
                endLine: null,
              })),
              ...failedVerificationSideEffects.map((entry) => ({
                source: 'verification_side_effect',
                title: 'Failed protected verification side-effect restore',
                description:
                  'Verification changed a protected pre-existing path and the pipeline could not restore it automatically.',
                reason:
                  entry &&
                  typeof entry === 'object' &&
                  !Array.isArray(entry) &&
                  typeof entry.reason === 'string'
                    ? entry.reason
                    : '',
                category: 'verification_side_effect',
                filePath:
                  entry &&
                  typeof entry === 'object' &&
                  !Array.isArray(entry) &&
                  typeof entry.path === 'string'
                    ? entry.path
                    : '',
                startLine: null,
                endLine: null,
              })),
            ];
            const protectedDriftIssues = protectedDriftRecords.map((entry, index) => ({
              source: 'protected_drift',
              title: `Protected pre-existing change drifted: ${
                entry &&
                typeof entry === 'object' &&
                !Array.isArray(entry) &&
                typeof entry.path === 'string'
                  ? entry.path
                  : `entry ${String(index + 1)}`
              }`,
              description:
                'A path that was already changed at pipeline start was modified, deleted, or reverted without matching the approved plan scope.',
              reason:
                entry &&
                typeof entry === 'object' &&
                !Array.isArray(entry) &&
                typeof entry.reason === 'string'
                  ? entry.reason
                  : '',
              category: 'protected_drift',
              filePath:
                entry &&
                typeof entry === 'object' &&
                !Array.isArray(entry) &&
                typeof entry.path === 'string'
                  ? entry.path
                  : '',
              startLine: null,
              endLine: null,
            }));

            const actionableCodeReviewIssues = codeReviewIssues.filter(
              (issue) => issue.category !== 'plan_conflict',
            );
            const overallIssues = [
              ...completionAuditIssues,
              ...codeReviewIssues,
              ...verificationIssues,
              ...verificationSpecIssues,
              ...verificationSideEffectIssues,
              ...protectedDriftIssues,
            ];
            const actionableIssues = [
              ...completionAuditIssues,
              ...actionableCodeReviewIssues,
              ...verificationIssues,
              ...verificationSpecIssues,
              ...verificationSideEffectIssues,
              ...protectedDriftIssues,
            ];
            const completionAuditIssueCount = completionAuditIssues.length;
            const codeReviewIssueCount = codeReviewIssues.length;
            const actionableIssueCount = actionableIssues.length;
            const planConflictCount = codeReviewIssues.filter(
              (issue) => issue.category === 'plan_conflict',
            ).length;

            const verificationSummary =
              verificationFailures.length > 0
                ? `Verification product failures: ${verificationFailures.length}.`
                : verificationResults.length > 0
                  ? 'Verification commands passed.'
                  : 'No verification commands were discovered.';
            const verificationSpecSummary =
              verificationSpecErrors.length > 0
                ? `Verification spec errors: ${verificationSpecErrors.length}.`
                : '';
            const verificationSkippedSummary =
              verificationSkipped.length > 0
                ? `Skipped scenario/manual checks: ${verificationSkipped.length}.`
                : '';
            const expectedFailureSummary =
              verificationPassedExpectedFailures.length > 0
                ? `Expected-failure checks passed: ${verificationPassedExpectedFailures.length}.`
                : '';
            const verificationSideEffectSummary =
              unsupportedVerificationSideEffects.length > 0 ||
              failedVerificationSideEffects.length > 0
                ? `Verification side-effect blockers: ${unsupportedVerificationSideEffects.length + failedVerificationSideEffects.length}.`
                : restoredVerificationSideEffects.length > 0
                  ? `Verification side effects restored: ${restoredVerificationSideEffects.length}.`
                  : '';
            const protectedDriftSummary =
              protectedDriftIssues.length > 0
                ? `Protected drift blockers: ${protectedDriftIssues.length}.`
                : '';
            const planConflictSummary =
              planConflictCount > 0
                ? `Report-only plan conflicts: ${planConflictCount}.`
                : '';
            const actionableSummary = [
              completionAuditIssueCount > 0
                ? `Completion audit issues requiring fixes: ${completionAuditIssueCount}.`
                : 'No completion audit issues.',
              actionableCodeReviewIssues.length > 0
                ? `Code review issues requiring fixes: ${actionableCodeReviewIssues.length}.`
                : 'No code review issues requiring fixes.',
              verificationSummary,
              verificationSpecSummary,
              verificationSkippedSummary,
              expectedFailureSummary,
              verificationSideEffectSummary,
              protectedDriftSummary,
            ]
              .filter((value) => value.length > 0)
              .join(' ');
            const overallSummary = [
              completionAuditSummary,
              reviewSummary,
              planConflictSummary,
              verificationSummary,
              verificationSpecSummary,
              verificationSkippedSummary,
              expectedFailureSummary,
              verificationSideEffectSummary,
              protectedDriftSummary,
            ]
              .filter((value) => value.length > 0)
              .join(' ');
            const outputDir =
              process.env.{{BRAND_ENV_PREFIX}}_OUTPUT_DIR ?? path.dirname({{BRAND_OUTPUT_VARIABLE_NAME}});
            const combinedJsonFile = path.join(outputDir, 'qa-findings.json');
            const combinedReportFile = path.join(outputDir, 'qa-findings.md');
            const actionableJsonFile = path.join(
              outputDir,
              'qa-actionable-findings.json',
            );
            const actionableReportFile = path.join(
              outputDir,
              'qa-actionable-findings.md',
            );

            const renderIssueList = (entries) => {
              if (entries.length === 0) {
                return ['No issues in this section.', ''];
              }

              const lines = [];
              entries.forEach((issue, index) => {
                const location =
                  issue.filePath && issue.startLine !== null
                    ? `${issue.filePath}:${String(issue.startLine)}-${String(issue.endLine ?? issue.startLine)}`
                    : typeof issue.command === 'string' && issue.command.length > 0
                      ? issue.command
                      : '(no location)';

                lines.push(`### #${String(index + 1)} ${issue.title}`);
                lines.push('');
                lines.push(issue.description || 'No description provided.');
                lines.push('');
                lines.push(`Source: ${issue.source}`);
                lines.push(`Category: ${issue.category || '(unknown)'}`);
                lines.push(`Location: ${location}`);
                if (issue.reason) {
                  lines.push(`Reason: ${issue.reason}`);
                }
                lines.push('');
              });
              return lines;
            };

            const combinedJson = {
              summary: overallSummary,
              issues: overallIssues,
              sources: {
                completionAuditJsonFile,
                codeReviewJsonFile: reviewJsonFile,
                codeReviewReportFile: reviewReportFile ?? '',
                verificationResultsFile,
                verificationReportFile: verificationReportFile ?? '',
                verificationSideEffectsFile: verificationSideEffectsFile ?? '',
                protectedDriftFile: protectedDriftFile ?? '',
              },
            };
            const actionableJson = {
              summary: actionableSummary,
              issues: actionableIssues,
              sources: combinedJson.sources,
            };

            fs.writeFileSync(
              combinedJsonFile,
              `${JSON.stringify(combinedJson, null, 2)}\n`,
              'utf8',
            );
            fs.writeFileSync(
              actionableJsonFile,
              `${JSON.stringify(actionableJson, null, 2)}\n`,
              'utf8',
            );

            const reportSections = [
              '# QA Findings',
              '',
              `- Total issues: ${String(overallIssues.length)}`,
              `- Actionable issues: ${String(actionableIssueCount)}`,
              `- Completion audit issues: ${String(completionAuditIssueCount)}`,
              `- Code review issues: ${String(codeReviewIssueCount)}`,
              `- Plan conflicts (report only): ${String(planConflictCount)}`,
              `- Verification product failures: ${String(verificationFailures.length)}`,
              `- Verification spec errors: ${String(verificationSpecErrors.length)}`,
              `- Skipped scenario/manual checks: ${String(verificationSkipped.length)}`,
              `- Expected-failure checks passed: ${String(verificationPassedExpectedFailures.length)}`,
              `- Verification side effects restored: ${String(restoredVerificationSideEffects.length)}`,
              `- Verification side effects unsupported: ${String(unsupportedVerificationSideEffects.length)}`,
              `- Verification side effects failed: ${String(failedVerificationSideEffects.length)}`,
              `- Protected drift: ${String(protectedDriftIssues.length)}`,
              '',
              '## Summary',
              overallSummary || 'No issues were found.',
              '',
              '## All Findings',
              '',
              ...renderIssueList(overallIssues),
            ];

            if (reviewReportFile && fs.existsSync(reviewReportFile)) {
              reportSections.push(
                '## Code Review Report',
                '',
                fs.readFileSync(reviewReportFile, 'utf8').trim(),
                '',
              );
            }

            if (verificationReportFile && fs.existsSync(verificationReportFile)) {
              reportSections.push(
                '## Verification Report',
                '',
                fs.readFileSync(verificationReportFile, 'utf8').trim(),
                '',
              );
            }

            const actionableReportSections = [
              '# QA Actionable Findings',
              '',
              `- Actionable issues: ${String(actionableIssueCount)}`,
              `- Completion audit issues requiring fixes: ${String(completionAuditIssueCount)}`,
              `- Code review issues requiring fixes: ${String(actionableCodeReviewIssues.length)}`,
              `- Verification product failures: ${String(verificationFailures.length)}`,
              `- Verification spec errors: ${String(verificationSpecErrors.length)}`,
              `- Skipped scenario/manual checks: ${String(verificationSkipped.length)}`,
              `- Expected-failure checks passed: ${String(verificationPassedExpectedFailures.length)}`,
              `- Verification side effects restored: ${String(restoredVerificationSideEffects.length)}`,
              `- Verification side effects unsupported: ${String(unsupportedVerificationSideEffects.length)}`,
              `- Verification side effects failed: ${String(failedVerificationSideEffects.length)}`,
              `- Protected drift: ${String(protectedDriftIssues.length)}`,
              '',
              '## Summary',
              actionableSummary || 'No actionable issues were found.',
              '',
              '## Findings',
              '',
              ...renderIssueList(actionableIssues),
            ];

            fs.writeFileSync(
              combinedReportFile,
              `${reportSections.join('\n')}\n`,
              'utf8',
            );
            fs.writeFileSync(
              actionableReportFile,
              `${actionableReportSections.join('\n')}\n`,
              'utf8',
            );

            fs.appendFileSync(
              {{BRAND_OUTPUT_VARIABLE_NAME}},
              `issue_count=${String(overallIssues.length)}\n`,
              'utf8',
            );
            fs.appendFileSync(
              {{BRAND_OUTPUT_VARIABLE_NAME}},
              `actionable_issue_count=${String(actionableIssueCount)}\n`,
              'utf8',
            );
            fs.appendFileSync(
              {{BRAND_OUTPUT_VARIABLE_NAME}},
              `completion_audit_issue_count=${String(completionAuditIssueCount)}\n`,
              'utf8',
            );
            fs.appendFileSync(
              {{BRAND_OUTPUT_VARIABLE_NAME}},
              `code_review_issue_count=${String(codeReviewIssueCount)}\n`,
              'utf8',
            );
            fs.appendFileSync(
              {{BRAND_OUTPUT_VARIABLE_NAME}},
              `verification_failure_count=${String(verificationFailures.length)}\n`,
              'utf8',
            );
            fs.appendFileSync(
              {{BRAND_OUTPUT_VARIABLE_NAME}},
              `verification_spec_error_count=${String(verificationSpecErrors.length)}\n`,
              'utf8',
            );
            fs.appendFileSync(
              {{BRAND_OUTPUT_VARIABLE_NAME}},
              `verification_skipped_count=${String(verificationSkipped.length)}\n`,
              'utf8',
            );
            fs.appendFileSync(
              {{BRAND_OUTPUT_VARIABLE_NAME}},
              `verification_passed_expected_failure_count=${String(verificationPassedExpectedFailures.length)}\n`,
              'utf8',
            );
            fs.appendFileSync(
              {{BRAND_OUTPUT_VARIABLE_NAME}},
              `verification_side_effect_restored_count=${String(restoredVerificationSideEffects.length)}\n`,
              'utf8',
            );
            fs.appendFileSync(
              {{BRAND_OUTPUT_VARIABLE_NAME}},
              `verification_side_effect_unsupported_count=${String(unsupportedVerificationSideEffects.length)}\n`,
              'utf8',
            );
            fs.appendFileSync(
              {{BRAND_OUTPUT_VARIABLE_NAME}},
              `verification_side_effect_failed_count=${String(failedVerificationSideEffects.length)}\n`,
              'utf8',
            );
            fs.appendFileSync(
              {{BRAND_OUTPUT_VARIABLE_NAME}},
              `protected_drift_count=${String(protectedDriftIssues.length)}\n`,
              'utf8',
            );
            fs.appendFileSync(
              {{BRAND_OUTPUT_VARIABLE_NAME}},
              `verification_has_failures=${verificationFailures.length > 0 ? 'true' : 'false'}\n`,
              'utf8',
            );
            fs.appendFileSync(
              {{BRAND_OUTPUT_VARIABLE_NAME}},
              `verification_has_spec_errors=${verificationSpecErrors.length > 0 ? 'true' : 'false'}\n`,
              'utf8',
            );
            fs.appendFileSync(
              {{BRAND_OUTPUT_VARIABLE_NAME}},
              `plan_conflict_count=${String(planConflictCount)}\n`,
              'utf8',
            );
            fs.appendFileSync(
              {{BRAND_OUTPUT_VARIABLE_NAME}},
              `has_issues=${overallIssues.length > 0 ? 'true' : 'false'}\n`,
              'utf8',
            );
            fs.appendFileSync(
              {{BRAND_OUTPUT_VARIABLE_NAME}},
              `has_actionable_issues=${actionableIssueCount > 0 ? 'true' : 'false'}\n`,
              'utf8',
            );
            fs.appendFileSync(
              {{BRAND_OUTPUT_VARIABLE_NAME}},
              `review_summary=${overallSummary.replace(/\r?\n/g, ' ').trim()}\n`,
              'utf8',
            );
            fs.appendFileSync(
              {{BRAND_OUTPUT_VARIABLE_NAME}},
              `review_json_file=${combinedJsonFile}\n`,
              'utf8',
            );
            fs.appendFileSync(
              {{BRAND_OUTPUT_VARIABLE_NAME}},
              `review_report_file=${combinedReportFile}\n`,
              'utf8',
            );
            fs.appendFileSync(
              {{BRAND_OUTPUT_VARIABLE_NAME}},
              `actionable_review_json_file=${actionableJsonFile}\n`,
              'utf8',
            );
            fs.appendFileSync(
              {{BRAND_OUTPUT_VARIABLE_NAME}},
              `actionable_review_report_file=${actionableReportFile}\n`,
              'utf8',
            );
          env:
            REVIEW_JSON_FILE: ${{ steps.synthesize_review_results.outputs.review_json_file }}
            REVIEW_REPORT_FILE: ${{ steps.synthesize_review_results.outputs.review_report_file }}
            COMPLETION_AUDIT_JSON_FILE: ${{ steps.plan_completion_audit.outputs.json_response_file }}
            VERIFICATION_RESULTS_FILE: ${{ steps.run_verification_commands.outputs.verification_results_file }}
            VERIFICATION_REPORT_FILE: ${{ steps.run_verification_commands.outputs.verification_report_file }}
            VERIFICATION_SIDE_EFFECTS_FILE: ${{ steps.restore_verification_protected_paths.outputs.verification_side_effects_file }}
            PROTECTED_DRIFT_FILE: ${{ steps.qa_workspace_details.outputs.protected_drift_file }}

        - id: prime_issue_recheck_session
          name: Prime Issue Recheck Session
          if: steps.inspect_qa_results.outputs.code_review_issue_count != '0' && steps.load_qa_loop_state.outputs.previous_findings_file == ''
          uses: builtin/agent-prompt
          with:
            model: $default-codex
            thinking_effort: medium
            permission_preset: read_only
            prompt: |
              Read the latest QA findings at `${{ steps.inspect_qa_results.outputs.review_json_file }}`, the plan completion contract at `${{ needs.plan_contract.outputs.contract_file }}`, and the QA intent summary at `${{ needs.qa_intent_summary.outputs.qa_intent_summary_file }}` and prepare to re-check them on future QA passes.

              Future resumes should:
              - treat the plan completion contract as the authoritative approved implementation baseline
              - use the QA intent summary only as secondary context; if it conflicts with the contract, the contract wins
              - ignore entries whose `source` is `verification` or `completion_audit`
              - re-check only the remaining code-review issues
              - keep future checks narrow and focused on follow-up fixes
              - use `plan_conflict` when the approved intent itself appears materially unsafe or flawed

              Respond with one short sentence confirming that the findings are ready for future rechecks.

        - id: resolve_qa_iteration_mode
          name: Resolve QA Iteration Mode
          shell: node
          run: |
            import fs from 'node:fs';

            const {{BRAND_OUTPUT_VARIABLE_NAME}} = process.env.{{BRAND_ENV_PREFIX}}_OUTPUT ?? '';
            if (!{{BRAND_OUTPUT_VARIABLE_NAME}}) {
              throw new Error('{{BRAND_ENV_PREFIX}}_OUTPUT is required');
            }
            const currentIteration = Number.parseInt(
              process.env.{{BRAND_ENV_PREFIX}}_JOB_ITERATION ?? '1',
              10,
            );
            const maxIterations = Number.parseInt(
              process.env.{{BRAND_ENV_PREFIX}}_JOB_MAX_ITERATIONS ?? '1',
              10,
            );
            const canApplyFixes =
              Number.isFinite(currentIteration) &&
              Number.isFinite(maxIterations) &&
              currentIteration < maxIterations;

            fs.appendFileSync(
              {{BRAND_OUTPUT_VARIABLE_NAME}},
              canApplyFixes
                ? 'can_apply_fixes=true\nvalidation_only=false\n'
                : 'can_apply_fixes=false\nvalidation_only=true\n',
              'utf8',
            );

        - id: apply_fixes_resume
          name: Resume Fix Review Findings
          if: steps.inspect_qa_results.outputs.has_actionable_issues == 'true' && steps.resolve_qa_iteration_mode.outputs.can_apply_fixes == 'true' && steps.load_qa_loop_state.outputs.fixer_session_id != ''
          continue_on_error: true
          uses: builtin/agent-resume
          with:
            session_id: ${{ steps.load_qa_loop_state.outputs.fixer_session_id }}
            model: $default-codex
            thinking_effort: medium
            permission_preset: dangerous_all
            prompt: |
              Resolve the issues from the latest QA pass.

              Read:
              - the plan completion contract at `${{ needs.plan_contract.outputs.contract_file }}`
              - the QA intent summary at `${{ needs.qa_intent_summary.outputs.qa_intent_summary_file }}`
              - the structured findings at `${{ steps.inspect_qa_results.outputs.actionable_review_json_file }}`
              - the human-readable report at `${{ steps.inspect_qa_results.outputs.actionable_review_report_file }}`
              - the canonical verification source at `${{ steps.resolve_verification_commands_file.outputs.verification_commands_file }}`
              - the latest verification results at `${{ steps.run_verification_commands.outputs.verification_results_file }}`
              - the baseline-aware change classification at `${{ steps.qa_workspace_details.outputs.baseline_classification_file }}`

              Expectations:
              - fix every valid finding in the current workspace
              - treat the plan completion contract as the authoritative approved implementation baseline
              - use the QA intent summary only as secondary context; if it conflicts with the contract, the contract wins
              - keep the fixes tightly scoped to the reported problems
              - do not run `git commit`, `git push`, create branches, or otherwise change repository history; the dedicated commit job handles commits when enabled
              - for `verification` findings, fix product code or tests only when the command failure identifies a concrete defect in the plan-owned changes
              - for `verification_spec` findings, do not edit product code solely to satisfy a bad command; correct the verification source only if it is part of the approved work, otherwise report that the spec issue cannot be fixed by product changes
              - for evidence-only verification or completion-audit findings, update the canonical verification source first; do not only edit `verification-results.json` or `verification-report.md`, because those files are regenerated on the next QA pass
              - if a scenario/manual check is actually a safe deterministic command, convert the canonical check to a command check with the direct command and expected evidence before rerunning it
              - for `verification_side_effect` findings, do not edit product code merely because verification restored unrelated protected side effects; report unsupported/failed side effects as blockers unless the verification command itself is part of the approved work and can be safely narrowed
              - for `protected_drift` findings, restore the protected pre-existing file to its pipeline-start state unless the approved plan explicitly authorized that exact path change
              - for `completion_audit` findings, implement missing acceptance behavior when evidence shows behavior is missing; if the finding is only missing external evidence, run or document targeted verification instead
              - preserve protected pre-existing changes unless an actionable finding and the approved plan explicitly require touching those paths
              - if a finding would require deleting protected pre-existing work, report that scope conflict instead of deleting it
              - run targeted verification for the affected code
              - summarize the changes and verification you performed

        - id: apply_fixes_start
          name: Start Fix Review Findings
          if: steps.inspect_qa_results.outputs.has_actionable_issues == 'true' && steps.resolve_qa_iteration_mode.outputs.can_apply_fixes == 'true' && (steps.load_qa_loop_state.outputs.fixer_session_id == '' || steps.apply_fixes_resume.conclusion != 'success')
          uses: builtin/agent-prompt
          with:
            model: $default-codex
            thinking_effort: medium
            permission_preset: dangerous_all
            prompt: |
              Resolve the issues from the latest QA pass.

              Read:
              - the plan completion contract at `${{ needs.plan_contract.outputs.contract_file }}`
              - the QA intent summary at `${{ needs.qa_intent_summary.outputs.qa_intent_summary_file }}`
              - the structured findings at `${{ steps.inspect_qa_results.outputs.actionable_review_json_file }}`
              - the human-readable report at `${{ steps.inspect_qa_results.outputs.actionable_review_report_file }}`
              - the canonical verification source at `${{ steps.resolve_verification_commands_file.outputs.verification_commands_file }}`
              - the latest verification results at `${{ steps.run_verification_commands.outputs.verification_results_file }}`
              - the baseline-aware change classification at `${{ steps.qa_workspace_details.outputs.baseline_classification_file }}`

              Expectations:
              - fix every valid finding in the current workspace
              - treat the plan completion contract as the authoritative approved implementation baseline
              - use the QA intent summary only as secondary context; if it conflicts with the contract, the contract wins
              - do not undo approved planned behavior unless a finding shows a direct implementation defect
              - do not run `git commit`, `git push`, create branches, or otherwise change repository history; the dedicated commit job handles commits when enabled
              - for `verification` findings, fix product code or tests only when the command failure identifies a concrete defect in the plan-owned changes
              - for `verification_spec` findings, do not edit product code solely to satisfy a bad command; correct the verification source only if it is part of the approved work, otherwise report that the spec issue cannot be fixed by product changes
              - for evidence-only verification or completion-audit findings, update the canonical verification source first; do not only edit `verification-results.json` or `verification-report.md`, because those files are regenerated on the next QA pass
              - if a scenario/manual check is actually a safe deterministic command, convert the canonical check to a command check with the direct command and expected evidence before rerunning it
              - for `verification_side_effect` findings, do not edit product code merely because verification restored unrelated protected side effects; report unsupported/failed side effects as blockers unless the verification command itself is part of the approved work and can be safely narrowed
              - for `protected_drift` findings, restore the protected pre-existing file to its pipeline-start state unless the approved plan explicitly authorized that exact path change
              - for `completion_audit` findings, implement missing acceptance behavior when evidence shows behavior is missing; if the finding is only missing external evidence, run or document targeted verification instead
              - preserve protected pre-existing changes unless an actionable finding and the approved plan explicitly require touching those paths
              - if a finding would require deleting protected pre-existing work, report that scope conflict instead of deleting it
              - keep the fixes tightly scoped to the reported problems
              - run targeted verification for the affected code
              - summarize the changes and verification you performed

        - id: save_qa_loop_state
          name: Save QA Loop Session State
          shell: node
          run: |
            import fs from 'node:fs';
            import path from 'node:path';

            const {{BRAND_OUTPUT_VARIABLE_NAME}} = process.env.{{BRAND_ENV_PREFIX}}_OUTPUT ?? '';
            const stateFile = process.env.STATE_FILE ?? '';
            if (!{{BRAND_OUTPUT_VARIABLE_NAME}}) {
              throw new Error('{{BRAND_ENV_PREFIX}}_OUTPUT is required');
            }
            if (!stateFile) {
              throw new Error('STATE_FILE is required');
            }

            const recheckSessionId =
              (process.env.RECHECK_RESUME_SESSION_ID ?? '').trim() ||
              (process.env.RECHECK_START_SESSION_ID ?? '').trim() ||
              (process.env.PRIME_RECHECK_SESSION_ID ?? '').trim() ||
              (process.env.EXISTING_RECHECK_SESSION_ID ?? '').trim();
            const fixerSessionId =
              (process.env.FIXER_RESUME_SESSION_ID ?? '').trim() ||
              (process.env.FIXER_START_SESSION_ID ?? '').trim() ||
              (process.env.EXISTING_FIXER_SESSION_ID ?? '').trim();
            const latestFixSummaryFile =
              (process.env.FIXER_RESUME_SUMMARY_FILE ?? '').trim() ||
              (process.env.FIXER_START_SUMMARY_FILE ?? '').trim() ||
              '';
            const outputDir =
              process.env.{{BRAND_ENV_PREFIX}}_OUTPUT_DIR ?? path.dirname(stateFile);
            const persistedFixSummaryFile = path.join(
              outputDir,
              'qa-latest-fix-summary.txt',
            );
            const parseCount = (value) => {
              const parsed = Number.parseInt(value ?? '0', 10);
              return Number.isFinite(parsed) ? Math.max(0, parsed) : 0;
            };
            const latestFindingsFile = process.env.LATEST_FINDINGS_FILE ?? '';
            const latestFindingsReportFile =
              process.env.LATEST_FINDINGS_REPORT_FILE ?? '';
            const existingFindingsFile =
              process.env.EXISTING_FINDINGS_FILE ?? '';
            const existingFindingsReportFile =
              process.env.EXISTING_FINDINGS_REPORT_FILE ?? '';
            const existingCodeReviewCompleted =
              (process.env.EXISTING_CODE_REVIEW_COMPLETED ?? '').trim() === 'true';
            const currentCodeReviewCompleted =
              (process.env.FULL_CODE_REVIEW_CONCLUSION ?? '').trim() === 'success' ||
              (process.env.RECHECK_RESUME_CONCLUSION ?? '').trim() === 'success' ||
              (process.env.RECHECK_START_CONCLUSION ?? '').trim() === 'success' ||
              (process.env.FRESH_BUG_REVIEW_CONCLUSION ?? '').trim() === 'success';
            const codeReviewCompleted =
              existingCodeReviewCompleted || currentCodeReviewCompleted;
            const currentCodeReviewIssueCount = parseCount(
              process.env.CURRENT_CODE_REVIEW_ISSUE_COUNT,
            );
            const existingCodeReviewIssueCount = parseCount(
              process.env.EXISTING_CODE_REVIEW_ISSUE_COUNT,
            );
            const preReviewActionable =
              (process.env.PRE_REVIEW_ACTIONABLE ?? '').trim() === 'true';
            const shouldPreserveSkippedCodeReviewState =
              preReviewActionable &&
              currentCodeReviewIssueCount === 0 &&
              existingCodeReviewIssueCount > 0 &&
              existingFindingsFile.length > 0;
            const previousFindingsFile = shouldPreserveSkippedCodeReviewState
              ? existingFindingsFile
              : latestFindingsFile;
            const previousFindingsReportFile = shouldPreserveSkippedCodeReviewState
              ? existingFindingsReportFile
              : latestFindingsReportFile;
            const previousCodeReviewIssueCount = shouldPreserveSkippedCodeReviewState
              ? existingCodeReviewIssueCount
              : currentCodeReviewIssueCount;

            if (latestFixSummaryFile) {
              if (!fs.existsSync(latestFixSummaryFile)) {
                throw new Error(
                  `Missing latest fix summary file: ${latestFixSummaryFile}`,
                );
              }

              const serialized = fs.readFileSync(latestFixSummaryFile, 'utf8');
              fs.writeFileSync(
                persistedFixSummaryFile,
                serialized.endsWith('\n') ? serialized : `${serialized}\n`,
                'utf8',
              );
            }

            fs.writeFileSync(
              stateFile,
              `${JSON.stringify(
                {
                  recheckSessionId,
                  fixerSessionId,
                  previousFindingsFile,
                  previousFindingsReportFile,
                  latestFixSummaryFile: latestFixSummaryFile
                    ? persistedFixSummaryFile
                    : '',
                  codeReviewCompleted,
                  previousReviewScopeKey: process.env.CURRENT_REVIEW_SCOPE_KEY ?? '',
                  previousCodeReviewIssueCount,
                },
                null,
                2,
              )}\n`,
              'utf8',
            );
          env:
            STATE_FILE: ${{ steps.load_qa_loop_state.outputs.state_file }}
            EXISTING_RECHECK_SESSION_ID: ${{ steps.load_qa_loop_state.outputs.recheck_session_id }}
            EXISTING_FIXER_SESSION_ID: ${{ steps.load_qa_loop_state.outputs.fixer_session_id }}
            RECHECK_RESUME_SESSION_ID: ${{ steps.recheck_previous_findings_resume.outputs.session_id }}
            RECHECK_START_SESSION_ID: ${{ steps.recheck_previous_findings_start.outputs.session_id }}
            PRIME_RECHECK_SESSION_ID: ${{ steps.prime_issue_recheck_session.outputs.session_id }}
            FIXER_RESUME_SESSION_ID: ${{ steps.apply_fixes_resume.outputs.session_id }}
            FIXER_START_SESSION_ID: ${{ steps.apply_fixes_start.outputs.session_id }}
            FIXER_RESUME_SUMMARY_FILE: ${{ steps.apply_fixes_resume.outputs.text_response_file }}
            FIXER_START_SUMMARY_FILE: ${{ steps.apply_fixes_start.outputs.text_response_file }}
            LATEST_FINDINGS_FILE: ${{ steps.inspect_qa_results.outputs.review_json_file }}
            LATEST_FINDINGS_REPORT_FILE: ${{ steps.inspect_qa_results.outputs.review_report_file }}
            EXISTING_FINDINGS_FILE: ${{ steps.load_qa_loop_state.outputs.previous_findings_file }}
            EXISTING_FINDINGS_REPORT_FILE: ${{ steps.load_qa_loop_state.outputs.previous_findings_report_file }}
            EXISTING_CODE_REVIEW_COMPLETED: ${{ steps.load_qa_loop_state.outputs.code_review_completed }}
            FULL_CODE_REVIEW_CONCLUSION: ${{ steps.code_review_full.conclusion }}
            RECHECK_RESUME_CONCLUSION: ${{ steps.recheck_previous_findings_resume.conclusion }}
            RECHECK_START_CONCLUSION: ${{ steps.recheck_previous_findings_start.conclusion }}
            FRESH_BUG_REVIEW_CONCLUSION: ${{ steps.fresh_bug_review.conclusion }}
            CURRENT_REVIEW_SCOPE_KEY: ${{ steps.compute_qa_review_scope.outputs.scope_key }}
            CURRENT_CODE_REVIEW_ISSUE_COUNT: ${{ steps.inspect_qa_results.outputs.code_review_issue_count }}
            EXISTING_CODE_REVIEW_ISSUE_COUNT: ${{ steps.load_qa_loop_state.outputs.previous_code_review_issue_count }}
            PRE_REVIEW_ACTIONABLE: ${{ steps.inspect_pre_review_gates.outputs.has_pre_review_actionable }}

        - id: restart_if_needed
          name: Restart If Review Found Issues
          shell: node
          run: |
            import fs from 'node:fs';

            const {{BRAND_OUTPUT_VARIABLE_NAME}} = process.env.{{BRAND_ENV_PREFIX}}_OUTPUT ?? '';
            if (!{{BRAND_OUTPUT_VARIABLE_NAME}}) {
              throw new Error('{{BRAND_ENV_PREFIX}}_OUTPUT is required');
            }
            const hasIssues = (process.env.HAS_ISSUES ?? '').trim() === 'true';
            const currentIteration = Number.parseInt(
              process.env.{{BRAND_ENV_PREFIX}}_JOB_ITERATION ?? '1',
              10,
            );
            const maxIterations = Number.parseInt(
              process.env.{{BRAND_ENV_PREFIX}}_JOB_MAX_ITERATIONS ?? '1',
              10,
            );
            const canRestart =
              hasIssues &&
              Number.isFinite(currentIteration) &&
              Number.isFinite(maxIterations) &&
              currentIteration < maxIterations;

            fs.appendFileSync(
              {{BRAND_OUTPUT_VARIABLE_NAME}},
              canRestart
                ? 'restart_requested=true\n{{BRAND_ENV_PREFIX}}_JOB_RESTART=true\n'
                : 'restart_requested=false\n',
              'utf8',
            );
          env:
            HAS_ISSUES: ${{ steps.inspect_qa_results.outputs.has_actionable_issues }}

        - id: capture_iteration_limit_state
          name: Capture QA Issues Remaining At Iteration Limit
          if: steps.inspect_qa_results.outputs.has_actionable_issues == 'true'
          shell: node
          run: |
            import fs from 'node:fs';

            const {{BRAND_OUTPUT_VARIABLE_NAME}} = process.env.{{BRAND_ENV_PREFIX}}_OUTPUT ?? '';
            if (!{{BRAND_OUTPUT_VARIABLE_NAME}}) {
              throw new Error('{{BRAND_ENV_PREFIX}}_OUTPUT is required');
            }
            const currentIteration = Number.parseInt(
              process.env.{{BRAND_ENV_PREFIX}}_JOB_ITERATION ?? '1',
              10,
            );
            const maxIterations = Number.parseInt(
              process.env.{{BRAND_ENV_PREFIX}}_JOB_MAX_ITERATIONS ?? '1',
              10,
            );
            const limitReached =
              Number.isFinite(currentIteration) &&
              Number.isFinite(maxIterations) &&
              currentIteration >= maxIterations;

            if (!limitReached) {
              fs.appendFileSync(
                {{BRAND_OUTPUT_VARIABLE_NAME}},
                'iteration_limit_reached=false\nfailure_skipped=false\n',
                'utf8',
              );
              process.exit(0);
            }

            const continueOnFail =
              (process.env.CONTINUE_ON_QA_LOOP_FAIL ?? '').trim() === 'true';
            const summary =
              `QA + fix loop exhausted ${String(currentIteration)}/${String(maxIterations)} iterations ` +
              `with ${process.env.ISSUE_COUNT || 'unknown'} actionable issue(s) still unresolved. ` +
              `Final actionable QA report: ${process.env.REVIEW_REPORT_FILE || ''}`;
            fs.appendFileSync(
              {{BRAND_OUTPUT_VARIABLE_NAME}},
              `iteration_limit_reached=true\niteration_limit_summary=${summary}\nfailure_skipped=${
                continueOnFail ? 'true' : 'false'
              }\n`,
              'utf8',
            );
            if (!continueOnFail) {
              process.exit(1);
            }
          env:
            ISSUE_COUNT: ${{ steps.inspect_qa_results.outputs.actionable_issue_count }}
            REVIEW_REPORT_FILE: ${{ steps.inspect_qa_results.outputs.actionable_review_report_file }}
            CONTINUE_ON_QA_LOOP_FAIL: 'true'

    final_solution_gate:
      name: Autopilot Attention Review
      needs:
        - complexity_analysis
        - refine_gate
        - plan_contract
        - plan_scope
        - workspace_checkpoint
        - plan_partition
        - implement
        - implement_frontend
        - implementation_completion_loop
        - qa_fix_loop
      if: always()
      outputs:
        passed: ${{ steps.evaluate_final_solution.outputs.passed }}
        blocking_count: ${{ steps.evaluate_final_solution.outputs.blocking_count }}
        skipped_blocking_count: ${{ steps.evaluate_final_solution.outputs.skipped_blocking_count }}
        blocking_report_file: ${{ steps.evaluate_final_solution.outputs.blocking_report_file }}
        blocking_json_file: ${{ steps.evaluate_final_solution.outputs.blocking_json_file }}
      steps:
        - id: evaluate_final_solution
          name: Record Unresolved Attention Items
          shell: node
          run: |
            import fs from 'node:fs';
            import path from 'node:path';

            const {{BRAND_OUTPUT_VARIABLE_NAME}} = process.env.{{BRAND_ENV_PREFIX}}_OUTPUT ?? '';
            if (!{{BRAND_OUTPUT_VARIABLE_NAME}}) {
              throw new Error('{{BRAND_ENV_PREFIX}}_OUTPUT is required');
            }

            const outputDir =
              process.env.{{BRAND_ENV_PREFIX}}_OUTPUT_DIR ?? path.dirname({{BRAND_OUTPUT_VARIABLE_NAME}});
            const blockingJsonFile = path.join(outputDir, 'final-solution-gate.json');
            const blockingReportFile = path.join(outputDir, 'final-solution-gate.md');
            const blockers = [];
            const skippedBlockers = [];
            const dependentSkips = [];
            const continueOnRefineGateFail =
              (process.env.CONTINUE_ON_REFINE_GATE_FAIL ?? '').trim() === 'true';
            const continueOnPlanContractFail =
              (process.env.CONTINUE_ON_PLAN_CONTRACT_FAIL ?? '').trim() === 'true';
            const continueOnCompletionLoopFail =
              (process.env.CONTINUE_ON_COMPLETION_LOOP_FAIL ?? '').trim() === 'true';
            const continueOnQaLoopFail =
              (process.env.CONTINUE_ON_QA_LOOP_FAIL ?? '').trim() === 'true';
            const continueOnFinalSolutionGateFail =
              (process.env.CONTINUE_ON_FINAL_SOLUTION_GATE_FAIL ?? '').trim() === 'true';
            const addBlocker = (code, message, detail = '') => {
              blockers.push({ code, message, detail });
            };
            const addSkippedBlocker = (code, message, detail = '', skippedBy) => {
              skippedBlockers.push({ code, message, detail, skippedBy });
            };
            const addOptionalBlocker = (code, message, detail, continueOnFail, skippedBy) => {
              if (continueOnFail) {
                addSkippedBlocker(code, message, detail, skippedBy);
                return;
              }
              addBlocker(code, message, detail);
            };
            const addDependentSkip = (code, message, detail = '') => {
              dependentSkips.push({ code, message, detail });
            };
            const result = (name) => (process.env[`${name}_RESULT`] ?? '').trim();
            const output = (name) => (process.env[name] ?? '').trim();
            const describeUnsuccessfulDependencies = (names) =>
              names
                .map((name) => ({
                  name: name.toLowerCase(),
                  result: result(name) || 'unknown',
                }))
                .filter((entry) => entry.result !== 'success')
                .map((entry) => `${entry.name}=${entry.result}`)
                .join(', ');
            const wasSkippedBecause = (name, dependencies) =>
              result(name) === 'skipped' &&
              dependencies.some((dependency) => result(dependency) !== 'success');
            const addDependentSkipFor = (code, message, dependencies) => {
              addDependentSkip(
                code,
                message,
                `Skipped because upstream dependency did not succeed: ${describeUnsuccessfulDependencies(dependencies)}.`,
              );
            };
            const complexity = output('COMPLEXITY').toLowerCase() || 'medium';
            const nonTrivial = complexity !== 'trivial';
            const refineAccepted =
              result('REFINE_GATE') === 'success' && output('REFINE_ACCEPTED') === 'true';

            if (!refineAccepted) {
              addOptionalBlocker(
                'refine_gate',
                'Refine gate did not accept the plan.',
                output('REFINE_FAILURE_REASON'),
                continueOnRefineGateFail,
                'continue_on_refine_gate_fail',
              );
            }

            if (result('PLAN_CONTRACT') !== 'success') {
              if (wasSkippedBecause('PLAN_CONTRACT', ['REFINE_GATE'])) {
                addDependentSkip(
                  'plan_contract',
                  'Plan contract extraction was skipped because refine did not accept the plan.',
                  describeUnsuccessfulDependencies(['REFINE_GATE']),
                );
              } else {
                addOptionalBlocker(
                  'plan_contract',
                  'Plan contract extraction or validation failed.',
                  output('PLAN_CONTRACT_VALIDATION_ERROR_SUMMARY'),
                  continueOnPlanContractFail,
                  'continue_on_plan_contract_fail',
                );
              }
            } else if (
              nonTrivial &&
              Number.parseInt(output('PLAN_REQUIREMENT_COUNT') || '0', 10) === 0
            ) {
              addOptionalBlocker(
                'plan_contract_empty',
                'Plan contract has zero material requirements for a non-trivial task.',
                output('PLAN_CONTRACT_VALIDATION_ERROR_SUMMARY'),
                continueOnPlanContractFail,
                'continue_on_plan_contract_fail',
              );
            } else if (
              Number.parseInt(output('PLAN_CONTRACT_VALIDATION_ERROR_COUNT') || '0', 10) > 0
            ) {
              addOptionalBlocker(
                'plan_contract_validation',
                'Plan contract validation reported implementation-readiness errors.',
                output('PLAN_CONTRACT_VALIDATION_ERROR_SUMMARY'),
                continueOnPlanContractFail,
                'continue_on_plan_contract_fail',
              );
            }

            if (result('PLAN_SCOPE') !== 'success') {
              if (wasSkippedBecause('PLAN_SCOPE', ['PLAN_CONTRACT'])) {
                addDependentSkip(
                  'plan_scope',
                  'Plan scope extraction was skipped because the plan contract did not succeed.',
                  describeUnsuccessfulDependencies(['PLAN_CONTRACT']),
                );
              } else {
                addBlocker('plan_scope', 'Plan scope extraction failed.');
              }
            }

            if (result('WORKSPACE_CHECKPOINT') !== 'success') {
              if (wasSkippedBecause('WORKSPACE_CHECKPOINT', ['REFINE_GATE', 'PLAN_CONTRACT', 'PLAN_SCOPE'])) {
                addDependentSkipFor(
                  'workspace_checkpoint',
                  'Pipeline-start workspace checkpoint was skipped because an upstream planning gate did not succeed.',
                  ['REFINE_GATE', 'PLAN_CONTRACT', 'PLAN_SCOPE'],
                );
              } else {
                addBlocker(
                  'workspace_checkpoint',
                  'Pipeline-start workspace checkpoint was not captured.',
                );
              }
            }

            if (result('PLAN_PARTITION') !== 'success') {
              if (
                wasSkippedBecause('PLAN_PARTITION', [
                  'REFINE_GATE',
                  'PLAN_CONTRACT',
                  'PLAN_SCOPE',
                  'WORKSPACE_CHECKPOINT',
                ])
              ) {
                addDependentSkipFor(
                  'plan_partition',
                  'Plan partition was skipped because an upstream planning gate did not succeed.',
                  ['REFINE_GATE', 'PLAN_CONTRACT', 'PLAN_SCOPE', 'WORKSPACE_CHECKPOINT'],
                );
              } else {
                addBlocker('plan_partition', 'Plan partition did not succeed.');
              }
            }

            if (
              output('HAS_BACKEND_PLAN') === 'true' &&
              result('IMPLEMENT') !== 'success'
            ) {
              addBlocker('backend_implementation', 'Backend implementation did not succeed.');
            }

            if (
              output('HAS_FRONTEND_PLAN') === 'true' &&
              result('IMPLEMENT_FRONTEND') !== 'success'
            ) {
              addBlocker(
                'frontend_implementation',
                'Frontend implementation did not succeed.',
              );
            }

            if (result('COMPLETION_LOOP') !== 'success') {
              if (
                wasSkippedBecause('COMPLETION_LOOP', [
                  'PLAN_CONTRACT',
                  'PLAN_SCOPE',
                  'PLAN_PARTITION',
                  'WORKSPACE_CHECKPOINT',
                  'IMPLEMENT',
                  'IMPLEMENT_FRONTEND',
                ])
              ) {
                addDependentSkipFor(
                  'completion_loop',
                  'Implementation completion loop was skipped because prerequisite planning or implementation work did not succeed.',
                  [
                    'PLAN_CONTRACT',
                    'PLAN_SCOPE',
                    'PLAN_PARTITION',
                    'WORKSPACE_CHECKPOINT',
                    'IMPLEMENT',
                    'IMPLEMENT_FRONTEND',
                  ],
                );
              } else {
                addOptionalBlocker(
                  'completion_loop',
                  'Implementation completion loop did not succeed.',
                  output('COMPLETION_ITERATION_LIMIT_SUMMARY'),
                  continueOnCompletionLoopFail,
                  'continue_on_completion_loop_fail',
                );
              }
            }

            if (
              result('COMPLETION_LOOP') === 'success' &&
              output('COMPLETION_COMPLETE') !== 'true'
            ) {
              addOptionalBlocker(
                'completion_incomplete',
                'Implementation completion loop did not report complete=true.',
                output('COMPLETION_JSON_FILE'),
                continueOnCompletionLoopFail,
                'continue_on_completion_loop_fail',
              );
            }

            if (output('COMPLETION_ITERATION_LIMIT_REACHED') === 'true') {
              addOptionalBlocker(
                'completion_iteration_limit',
                'Implementation completion loop hit its iteration limit.',
                output('COMPLETION_ITERATION_LIMIT_SUMMARY'),
                continueOnCompletionLoopFail,
                'continue_on_completion_loop_fail',
              );
            }

            if (result('QA') !== 'success') {
              if (
                result('QA') === 'skipped' &&
                (wasSkippedBecause('QA', [
                  'PLAN_CONTRACT',
                  'PLAN_SCOPE',
                  'PLAN_PARTITION',
                  'WORKSPACE_CHECKPOINT',
                  'COMPLETION_LOOP',
                ]) ||
                  output('COMPLETION_COMPLETE') !== 'true')
              ) {
                addDependentSkipFor(
                  'qa_loop',
                  'QA + fix loop was skipped because prerequisite planning, implementation, or completion work did not succeed.',
                  [
                    'PLAN_CONTRACT',
                    'PLAN_SCOPE',
                    'PLAN_PARTITION',
                    'WORKSPACE_CHECKPOINT',
                    'COMPLETION_LOOP',
                  ],
                );
              } else {
                addOptionalBlocker(
                  'qa_loop',
                  'QA + fix loop did not succeed.',
                  output('QA_ITERATION_LIMIT_SUMMARY'),
                  continueOnQaLoopFail,
                  'continue_on_qa_loop_fail',
                );
              }
            }

            if (output('QA_HAS_ACTIONABLE_ISSUES') === 'true') {
              addOptionalBlocker(
                'qa_actionable_issues',
                'QA has unresolved actionable issues.',
                output('QA_ACTIONABLE_REVIEW_REPORT_FILE'),
                continueOnQaLoopFail,
                'continue_on_qa_loop_fail',
              );
            }

            if (output('QA_VERIFICATION_HAS_FAILURES') === 'true') {
              addOptionalBlocker(
                'verification_failures',
                'Verification commands failed.',
                output('QA_REVIEW_REPORT_FILE'),
                continueOnQaLoopFail,
                'continue_on_qa_loop_fail',
              );
            }

            if (output('QA_VERIFICATION_HAS_SPEC_ERRORS') === 'true') {
              addOptionalBlocker(
                'verification_spec_errors',
                'Verification specification errors occurred.',
                output('QA_REVIEW_REPORT_FILE'),
                continueOnQaLoopFail,
                'continue_on_qa_loop_fail',
              );
            }

            if (
              Number.parseInt(output('QA_VERIFICATION_SIDE_EFFECT_UNSUPPORTED_COUNT') || '0', 10) > 0 ||
              Number.parseInt(output('QA_VERIFICATION_SIDE_EFFECT_FAILED_COUNT') || '0', 10) > 0
            ) {
              addOptionalBlocker(
                'verification_side_effects',
                'Verification produced unsupported or unrestored protected-path side effects.',
                output('QA_REVIEW_REPORT_FILE'),
                continueOnQaLoopFail,
                'continue_on_qa_loop_fail',
              );
            }

            if (Number.parseInt(output('QA_PROTECTED_DRIFT_COUNT') || '0', 10) > 0) {
              addOptionalBlocker(
                'protected_drift',
                'Protected pre-existing files drifted outside the approved plan scope.',
                output('QA_REVIEW_REPORT_FILE'),
                continueOnQaLoopFail,
                'continue_on_qa_loop_fail',
              );
            }

            if (output('QA_ITERATION_LIMIT_REACHED') === 'true') {
              addOptionalBlocker(
                'qa_iteration_limit',
                'QA + fix loop hit its iteration limit.',
                output('QA_ITERATION_LIMIT_SUMMARY'),
                continueOnQaLoopFail,
                'continue_on_qa_loop_fail',
              );
            }

            if (continueOnFinalSolutionGateFail && blockers.length > 0) {
              skippedBlockers.push(
                ...blockers.map((blocker) => ({
                  ...blocker,
                  originalCode:
                    typeof blocker.originalCode === 'string'
                      ? blocker.originalCode
                      : blocker.code,
                  skippedBy:
                    typeof blocker.skippedBy === 'string' && blocker.skippedBy.trim().length > 0
                      ? blocker.skippedBy
                      : 'continue_on_final_solution_gate_fail',
                  finalGateSkippedBy: 'continue_on_final_solution_gate_fail',
                })),
              );
              blockers.length = 0;
            }

            const passed = blockers.length === 0;
            fs.writeFileSync(
              blockingJsonFile,
              `${JSON.stringify({ passed, blockers, skippedBlockers, dependentSkips }, null, 2)}\n`,
              'utf8',
            );

            const reportLines = [
              '# Autopilot Attention Review',
              '',
              `- Pipeline may continue: ${passed ? 'true' : 'false'}`,
              `- Unresolved blocking failures: ${String(blockers.length)}`,
              `- Unresolved issues that may need attention: ${String(skippedBlockers.length)}`,
              `- Dependent skips: ${String(dependentSkips.length)}`,
              '',
            ];

            if (blockers.length === 0 && skippedBlockers.length === 0) {
              reportLines.push('No unresolved issues were recorded.', '');
            } else {
              if (blockers.length > 0) {
                reportLines.push('## Unresolved Blocking Failures', '');
                blockers.forEach((blocker, index) => {
                  reportLines.push(`### #${String(index + 1)} ${blocker.code}`);
                  reportLines.push('');
                  reportLines.push(blocker.message);
                  if (blocker.detail) {
                    reportLines.push('');
                    reportLines.push(blocker.detail);
                  }
                  reportLines.push('');
                });
              }
              if (skippedBlockers.length > 0) {
                reportLines.push('## Unresolved Issues That May Need Attention', '');
                skippedBlockers.forEach((blocker, index) => {
                  reportLines.push(`### #${String(index + 1)} ${blocker.code}`);
                  reportLines.push('');
                  reportLines.push(blocker.message);
                  reportLines.push('');
                  reportLines.push(`Recorded from: ${blocker.skippedBy}`);
                  if (blocker.detail) {
                    reportLines.push('');
                    reportLines.push(blocker.detail);
                  }
                  reportLines.push('');
                });
              }
            }

            if (dependentSkips.length > 0) {
              reportLines.push('## Dependent Skips', '');
              dependentSkips.forEach((skip, index) => {
                reportLines.push(`### #${String(index + 1)} ${skip.code}`);
                reportLines.push('');
                reportLines.push(skip.message);
                if (skip.detail) {
                  reportLines.push('');
                  reportLines.push(skip.detail);
                }
                reportLines.push('');
              });
            }

            fs.writeFileSync(blockingReportFile, `${reportLines.join('\n')}\n`, 'utf8');
            fs.appendFileSync({{BRAND_OUTPUT_VARIABLE_NAME}}, `passed=${passed ? 'true' : 'false'}\n`, 'utf8');
            fs.appendFileSync(
              {{BRAND_OUTPUT_VARIABLE_NAME}},
              `blocking_count=${String(blockers.length)}\n`,
              'utf8',
            );
            fs.appendFileSync(
              {{BRAND_OUTPUT_VARIABLE_NAME}},
              `skipped_blocking_count=${String(skippedBlockers.length)}\n`,
              'utf8',
            );
            fs.appendFileSync(
              {{BRAND_OUTPUT_VARIABLE_NAME}},
              `blocking_report_file=${blockingReportFile}\n`,
              'utf8',
            );
            fs.appendFileSync(
              {{BRAND_OUTPUT_VARIABLE_NAME}},
              `blocking_json_file=${blockingJsonFile}\n`,
              'utf8',
            );

          env:
            COMPLEXITY: ${{ needs.complexity_analysis.outputs.complexity }}
            REFINE_GATE_RESULT: ${{ needs.refine_gate.result }}
            REFINE_ACCEPTED: ${{ needs.refine_gate.outputs.accepted }}
            REFINE_FAILURE_REASON: ${{ needs.refine_gate.outputs.failure_reason }}
            PLAN_CONTRACT_RESULT: ${{ needs.plan_contract.result }}
            PLAN_REQUIREMENT_COUNT: ${{ needs.plan_contract.outputs.requirement_count }}
            PLAN_CONTRACT_VALIDATION_ERROR_COUNT: ${{ needs.plan_contract.outputs.validation_error_count }}
            PLAN_CONTRACT_VALIDATION_ERROR_SUMMARY: ${{ needs.plan_contract.outputs.validation_error_summary }}
            PLAN_SCOPE_RESULT: ${{ needs.plan_scope.result }}
            WORKSPACE_CHECKPOINT_RESULT: ${{ needs.workspace_checkpoint.result }}
            PLAN_PARTITION_RESULT: ${{ needs.plan_partition.result }}
            HAS_BACKEND_PLAN: ${{ needs.plan_partition.outputs.has_backend_plan }}
            HAS_FRONTEND_PLAN: ${{ needs.plan_partition.outputs.has_frontend_plan }}
            IMPLEMENT_RESULT: ${{ needs.implement.result }}
            IMPLEMENT_FRONTEND_RESULT: ${{ needs.implement_frontend.result }}
            COMPLETION_LOOP_RESULT: ${{ needs.implementation_completion_loop.result }}
            COMPLETION_COMPLETE: ${{ needs.implementation_completion_loop.outputs.complete }}
            COMPLETION_JSON_FILE: ${{ needs.implementation_completion_loop.outputs.completion_json_file }}
            COMPLETION_ITERATION_LIMIT_REACHED: ${{ needs.implementation_completion_loop.outputs.iteration_limit_reached }}
            COMPLETION_ITERATION_LIMIT_SUMMARY: ${{ needs.implementation_completion_loop.outputs.iteration_limit_summary }}
            QA_RESULT: ${{ needs.qa_fix_loop.result }}
            QA_HAS_ACTIONABLE_ISSUES: ${{ needs.qa_fix_loop.outputs.has_actionable_issues }}
            QA_VERIFICATION_HAS_FAILURES: ${{ needs.qa_fix_loop.outputs.verification_has_failures }}
            QA_VERIFICATION_HAS_SPEC_ERRORS: ${{ needs.qa_fix_loop.outputs.verification_has_spec_errors }}
            QA_VERIFICATION_SPEC_ERROR_COUNT: ${{ needs.qa_fix_loop.outputs.verification_spec_error_count }}
            QA_VERIFICATION_SIDE_EFFECT_UNSUPPORTED_COUNT: ${{ needs.qa_fix_loop.outputs.verification_side_effect_unsupported_count }}
            QA_VERIFICATION_SIDE_EFFECT_FAILED_COUNT: ${{ needs.qa_fix_loop.outputs.verification_side_effect_failed_count }}
            QA_PROTECTED_DRIFT_COUNT: ${{ needs.qa_fix_loop.outputs.protected_drift_count }}
            QA_ITERATION_LIMIT_REACHED: ${{ needs.qa_fix_loop.outputs.iteration_limit_reached }}
            QA_ITERATION_LIMIT_SUMMARY: ${{ needs.qa_fix_loop.outputs.iteration_limit_summary }}
            QA_REVIEW_REPORT_FILE: ${{ needs.qa_fix_loop.outputs.review_report_file }}
            QA_ACTIONABLE_REVIEW_REPORT_FILE: ${{ needs.qa_fix_loop.outputs.actionable_review_report_file }}
            CONTINUE_ON_REFINE_GATE_FAIL: 'true'
            CONTINUE_ON_PLAN_CONTRACT_FAIL: 'true'
            CONTINUE_ON_COMPLETION_LOOP_FAIL: 'true'
            CONTINUE_ON_QA_LOOP_FAIL: 'true'
            CONTINUE_ON_FINAL_SOLUTION_GATE_FAIL: 'true'

    commit_and_push:
      name: Commit + Push
      needs:
        - final_solution_gate
      if: inputs.push_and_create_prs == true && needs.final_solution_gate.result == 'success' && needs.final_solution_gate.outputs.passed == 'true'
      outputs:
        results_json: ${{ steps.commit_and_push.outputs.results_json }}
        results_file: ${{ steps.commit_and_push.outputs.results_file }}
        summary_file: ${{ steps.commit_and_push.outputs.summary_file }}
        has_failures: ${{ steps.commit_and_push.outputs.has_failures }}
        failed_count: ${{ steps.commit_and_push.outputs.failed_count }}
      steps:
        - id: commit_and_push
          name: Commit And Push Workspace Repos
          uses: builtin/git-commit-push

    create_pull_requests:
      name: Create Pull Requests
      needs:
        - final_solution_gate
        - commit_and_push
      if: inputs.push_and_create_prs == true && needs.final_solution_gate.result == 'success' && needs.commit_and_push.result == 'success'
      outputs:
        results_json: ${{ steps.create_pull_requests.outputs.results_json }}
        results_file: ${{ steps.create_pull_requests.outputs.results_file }}
        summary_file: ${{ steps.create_pull_requests.outputs.summary_file }}
        has_failures: ${{ steps.create_pull_requests.outputs.has_failures }}
        failed_count: ${{ steps.create_pull_requests.outputs.failed_count }}
        created_count: ${{ steps.create_pull_requests.outputs.created_count }}
        existing_count: ${{ steps.create_pull_requests.outputs.existing_count }}
      steps:
        - id: create_pull_requests
          name: Create Missing Pull Requests
          uses: builtin/github-create-pr

    summary:
      name: Summary
      needs:
        - complexity_analysis
        - refine
        - refine_gate
        - plan_contract
        - plan_partition
        - implement
        - implement_frontend
        - implementation_completion_loop
        - qa_fix_loop
        - final_solution_gate
        - commit_and_push
        - create_pull_requests
      if: always()
      outputs:
        report_file: ${{ steps.publish_report.outputs.report_path }}
      steps:
        - id: summarize
          name: Summarize Execution
          shell: node
          run: |
            import fs from 'node:fs';
            import path from 'node:path';

            const {{BRAND_OUTPUT_VARIABLE_NAME}} = process.env.{{BRAND_ENV_PREFIX}}_OUTPUT ?? '';
            if (!{{BRAND_OUTPUT_VARIABLE_NAME}}) {
              throw new Error('{{BRAND_ENV_PREFIX}}_OUTPUT is required');
            }

            const outputDir =
              process.env.{{BRAND_ENV_PREFIX}}_OUTPUT_DIR ?? path.dirname({{BRAND_OUTPUT_VARIABLE_NAME}});
            const summaryFile = path.join(outputDir, 'summary.txt');
            const finalGatePassed =
              (process.env.FINAL_GATE_PASSED ?? '').trim() === 'true';
            const finalGateResult =
              (process.env.FINAL_GATE_RESULT ?? '').trim() || 'unknown';
            const finalGateBlockingCount =
              (process.env.FINAL_GATE_BLOCKING_COUNT ?? '').trim() || '0';
            const finalGateSkippedBlockingCount =
              (process.env.FINAL_GATE_SKIPPED_BLOCKING_COUNT ?? '').trim() || '0';
            const finalGateBlockingReportFile = (
              process.env.FINAL_GATE_BLOCKING_REPORT_FILE ?? ''
            ).trim();
            const finalGateBlockingJsonFile = (
              process.env.FINAL_GATE_BLOCKING_JSON_FILE ?? ''
            ).trim();
            const complexityLevel = (process.env.COMPLEXITY_LEVEL ?? '').trim() || 'unknown';
            const complexityRemarks =
              (process.env.COMPLEXITY_REMARKS ?? '').replace(/\r?\n/g, ' ').trim() ||
              'No remarks recorded.';
            const planningMaxIterations =
              (process.env.PLANNING_MAX_ITERATIONS ?? '').trim() || '0';
            const qaMaxIterations =
              (process.env.QA_MAX_ITERATIONS ?? '').trim() || '0';
            const refineDecision =
              (process.env.REFINE_GPT_DECISION ?? '').trim() || 'unknown';
            const refineGptSummary =
              (process.env.REFINE_GPT_SUMMARY ?? '').replace(/\r?\n/g, ' ').trim();
            const refineOpusUpdated =
              (process.env.REFINE_OPUS_UPDATED ?? '').trim() === 'true'
                ? 'Opus made updates in the final refine pass'
                : 'Opus did not make updates in the final refine pass';
            const partitionKinds = [
              (process.env.HAS_BACKEND_PLAN ?? '').trim() === 'true' ? 'backend' : '',
              (process.env.HAS_FRONTEND_PLAN ?? '').trim() === 'true' ? 'frontend' : '',
              (process.env.HAS_TRANSPORT_PLAN ?? '').trim() === 'true' ? 'transport' : '',
            ].filter((value) => value.length > 0);
            const partitionSummary =
              partitionKinds.length > 0 ? partitionKinds.join(', ') : 'none';
            const transportSummary =
              (process.env.HAS_TRANSPORT_PLAN ?? '').trim() === 'true'
                ? 'Transport-layer work was required and completed inside the plan partition job.'
                : 'No transport-layer partition was required.';
            const qaIssueCount =
              (process.env.QA_FINAL_ISSUE_COUNT ?? '').trim() || '0';
            const qaActionableIssueCount =
              (process.env.QA_FINAL_ACTIONABLE_ISSUE_COUNT ?? '').trim() || '0';
            const qaCompletionAuditIssueCount =
              (process.env.QA_COMPLETION_AUDIT_ISSUE_COUNT ?? '').trim() || '0';
            const qaCodeReviewIssueCount =
              (process.env.QA_CODE_REVIEW_ISSUE_COUNT ?? '').trim() || '0';
            const qaVerificationFailureCount =
              (process.env.QA_VERIFICATION_FAILURE_COUNT ?? '').trim() || '0';
            const qaVerificationSideEffectUnsupportedCount =
              (process.env.QA_VERIFICATION_SIDE_EFFECT_UNSUPPORTED_COUNT ?? '').trim() ||
              '0';
            const qaVerificationSideEffectFailedCount =
              (process.env.QA_VERIFICATION_SIDE_EFFECT_FAILED_COUNT ?? '').trim() ||
              '0';
            const qaProtectedDriftCount =
              (process.env.QA_PROTECTED_DRIFT_COUNT ?? '').trim() || '0';
            const qaPlanConflictCount =
              (process.env.QA_PLAN_CONFLICT_COUNT ?? '').trim() || '0';
            const completionLoopResult =
              (process.env.COMPLETION_LOOP_RESULT ?? '').trim() || 'skipped';
            const completionComplete =
              (process.env.COMPLETION_COMPLETE ?? '').trim() === 'true';
            const completionJsonFile =
              (process.env.COMPLETION_JSON_FILE ?? '').trim();
            const completionMissingRequirementCount =
              (process.env.COMPLETION_MISSING_REQUIREMENT_COUNT ?? '').trim() || '0';
            const completionIncorrectImplementationCount =
              (process.env.COMPLETION_INCORRECT_IMPLEMENTATION_COUNT ?? '').trim() || '0';
            const completionVerificationGapCount =
              (process.env.COMPLETION_VERIFICATION_GAP_COUNT ?? '').trim() || '0';
            const completionIterationLimitReached =
              (process.env.COMPLETION_ITERATION_LIMIT_REACHED ?? '').trim() === 'true';
            const completionIterationLimitSummary =
              (process.env.COMPLETION_ITERATION_LIMIT_SUMMARY ?? '')
                .replace(/\r?\n/g, ' ')
                .trim();
            const qaHasActionableIssues =
              (process.env.QA_HAS_ACTIONABLE_ISSUES ?? '').trim() === 'true';
            const qaReviewSummary =
              (process.env.QA_REVIEW_SUMMARY ?? '').replace(/\r?\n/g, ' ').trim();
            const qaReportFile = (process.env.QA_REVIEW_REPORT_FILE ?? '').trim();
            const qaActionableReviewJsonFile = (
              process.env.QA_ACTIONABLE_REVIEW_JSON_FILE ?? ''
            ).trim();
            const qaActionableReviewReportFile = (
              process.env.QA_ACTIONABLE_REVIEW_REPORT_FILE ?? ''
            ).trim();
            const qaIterationLimitReached =
              (process.env.QA_ITERATION_LIMIT_REACHED ?? '').trim() === 'true';
            const qaIterationLimitSummary =
              (process.env.QA_ITERATION_LIMIT_SUMMARY ?? '')
                .replace(/\r?\n/g, ' ')
                .trim();
            const commitSummaryFile = (process.env.COMMIT_SUMMARY_FILE ?? '').trim();
            const prSummaryFile = (process.env.PR_SUMMARY_FILE ?? '').trim();
            let remainingActionableIssues = [];
            let finalGateBlockers = [];
            let finalGateSkippedBlockers = [];

            if (
              qaHasActionableIssues &&
              qaActionableReviewJsonFile &&
              fs.existsSync(qaActionableReviewJsonFile)
            ) {
              try {
                const parsed = JSON.parse(
                  fs.readFileSync(qaActionableReviewJsonFile, 'utf8'),
                );
                remainingActionableIssues =
                  parsed &&
                  typeof parsed === 'object' &&
                  !Array.isArray(parsed) &&
                  Array.isArray(parsed.issues)
                    ? parsed.issues
                    : [];
              } catch (error) {
                remainingActionableIssues = [];
              }
            }

            if (finalGateBlockingJsonFile && fs.existsSync(finalGateBlockingJsonFile)) {
              try {
                const parsed = JSON.parse(
                  fs.readFileSync(finalGateBlockingJsonFile, 'utf8'),
                );
                finalGateBlockers =
                  parsed &&
                  typeof parsed === 'object' &&
                  !Array.isArray(parsed) &&
                  Array.isArray(parsed.blockers)
                    ? parsed.blockers
                    : [];
                finalGateSkippedBlockers =
                  parsed &&
                  typeof parsed === 'object' &&
                  !Array.isArray(parsed) &&
                  Array.isArray(parsed.skippedBlockers)
                    ? parsed.skippedBlockers
                    : [];
              } catch (error) {
                finalGateBlockers = [];
                finalGateSkippedBlockers = [];
              }
            }

            const paragraphOne =
              `Autopilot attention review finished with result \`${finalGateResult}\`, passed=${finalGatePassed ? 'true' : 'false'}, ${finalGateBlockingCount} unresolved blocking failure(s), and ${finalGateSkippedBlockingCount} unresolved issue(s) that may need attention. Attention report: ${finalGateBlockingReportFile || '(none)'}. ` +
              `Plan complexity was ${complexityLevel} (${complexityRemarks}) with planning/QA/completion limits ${planningMaxIterations}/${qaMaxIterations}/${(process.env.COMPLETION_MAX_ITERATIONS ?? '').trim() || '0'}. ${refineOpusUpdated}, and GPT-5.6 Sol ${refineDecision === 'accept' ? 'accepted the refined plan' : 'requested another writer pass'}${refineGptSummary ? `: ${refineGptSummary}` : '.'} ` +
              `Plan partition produced ${partitionSummary} partition${partitionKinds.length === 1 ? '' : 's'}; ${transportSummary} Backend implementation finished with result \`${(process.env.IMPLEMENT_RESULT ?? '').trim() || 'unknown'}\`, and frontend implementation finished with result \`${(process.env.IMPLEMENT_FRONTEND_RESULT ?? '').trim() || 'unknown'}\`.`;

            const paragraphTwo =
              `Implementation completion loop finished with result \`${completionLoopResult}\`, complete=${completionComplete ? 'true' : 'false'}, missing_requirements=${completionMissingRequirementCount}, incorrect_implementations=${completionIncorrectImplementationCount}, verification_gaps=${completionVerificationGapCount}${completionJsonFile ? ` (report: ${completionJsonFile})` : ''}. ` +
              `QA + fix loop finished with result \`${(process.env.QA_RESULT ?? '').trim() || 'unknown'}\`, ${qaIssueCount} total remaining issue(s), ${qaActionableIssueCount} actionable issue(s), ${qaCompletionAuditIssueCount} completion audit issue(s), ${qaCodeReviewIssueCount} code review issue(s), ${qaVerificationFailureCount} verification failure(s), ${qaVerificationSideEffectUnsupportedCount} unsupported verification side effect(s), ${qaVerificationSideEffectFailedCount} unrestored verification side effect(s), ${qaProtectedDriftCount} protected drift issue(s), ${qaPlanConflictCount} report-only plan conflict(s), and restart_requested=\`${(process.env.QA_RESTART_REQUESTED ?? '').trim() || 'false'}\`. Final QA report: ${qaReportFile || '(none)'}. ` +
              `Commit + push finished with result \`${(process.env.COMMIT_RESULT ?? '').trim() || 'unknown'}\` (failures=${(process.env.COMMIT_FAILED_COUNT ?? '').trim() || '0'}, has_failures=${(process.env.COMMIT_HAS_FAILURES ?? '').trim() || 'false'}; report: ${commitSummaryFile || '(none)'}). ` +
              `Create pull requests finished with result \`${(process.env.PR_RESULT ?? '').trim() || 'unknown'}\` (created=${(process.env.PR_CREATED_COUNT ?? '').trim() || '0'}, existing=${(process.env.PR_EXISTING_COUNT ?? '').trim() || '0'}, failures=${(process.env.PR_FAILED_COUNT ?? '').trim() || '0'}, has_failures=${(process.env.PR_HAS_FAILURES ?? '').trim() || 'false'}; report: ${prSummaryFile || '(none)'}).`;
            const paragraphThreeSentences = [];

            if (completionLoopResult === 'success') {
              paragraphThreeSentences.push(
                `Implementation completion summary. complete=${completionComplete ? 'true' : 'false'}, missing_requirements=${completionMissingRequirementCount}, incorrect_implementations=${completionIncorrectImplementationCount}, verification_gaps=${completionVerificationGapCount}.`,
              );
            }

            if (completionIterationLimitReached) {
              paragraphThreeSentences.push(
                completionIterationLimitSummary ||
                  'The implementation completion loop reached its iteration limit with unresolved gaps.',
              );
            }

            if (qaReviewSummary) {
              paragraphThreeSentences.push(`Latest QA summary: ${qaReviewSummary}`);
            }

            if (qaIterationLimitReached) {
              paragraphThreeSentences.push(
                qaIterationLimitSummary ||
                  'The QA + fix loop reached its iteration limit and continued with unresolved actionable issues recorded in the final QA report.',
              );
            }

            if (qaHasActionableIssues) {
              const remainingIssueLines =
                remainingActionableIssues.length > 0
                  ? remainingActionableIssues.slice(0, 10).map((issue, index) => {
                      const title =
                        issue &&
                        typeof issue === 'object' &&
                        !Array.isArray(issue) &&
                        typeof issue.title === 'string' &&
                        issue.title.trim()
                          ? issue.title.trim()
                          : 'Untitled issue';
                      const description =
                        issue &&
                        typeof issue === 'object' &&
                        !Array.isArray(issue) &&
                        typeof issue.description === 'string' &&
                        issue.description.trim()
                          ? issue.description.replace(/\s+/g, ' ').trim()
                          : 'No description provided.';
                      const filePath =
                        issue &&
                        typeof issue === 'object' &&
                        !Array.isArray(issue) &&
                        typeof issue.filePath === 'string'
                          ? issue.filePath.trim()
                          : '';
                      const startLine =
                        issue &&
                        typeof issue === 'object' &&
                        !Array.isArray(issue) &&
                        typeof issue.startLine === 'number'
                          ? issue.startLine
                          : null;
                      const command =
                        issue &&
                        typeof issue === 'object' &&
                        !Array.isArray(issue) &&
                        typeof issue.command === 'string'
                          ? issue.command.trim()
                          : '';
                      const location =
                        filePath && startLine !== null
                          ? `${filePath}:${String(startLine)}`
                          : command || '(no location)';

                      return `${String(index + 1)}. ${title} [${location}] ${description}`;
                    })
                  : [
                      `Remaining actionable issues are recorded in ${qaActionableReviewReportFile || qaReportFile || '(none)'}.`,
                    ];

              paragraphThreeSentences.push(
                `Remaining actionable QA issues:\n${remainingIssueLines.join('\n')}`,
              );
            }

            if (!finalGatePassed) {
              const blockerLines =
                finalGateBlockers.length > 0
                  ? finalGateBlockers.slice(0, 10).map((blocker, index) => {
                      const code =
                        blocker &&
                        typeof blocker === 'object' &&
                        !Array.isArray(blocker) &&
                        typeof blocker.code === 'string'
                          ? blocker.code
                          : 'unknown';
                      const message =
                        blocker &&
                        typeof blocker === 'object' &&
                        !Array.isArray(blocker) &&
                        typeof blocker.message === 'string'
                          ? blocker.message.replace(/\s+/g, ' ').trim()
                          : 'No blocker message provided.';

                      return `${String(index + 1)}. ${code}: ${message}`;
                    })
                  : [
                      `Blocking conditions are recorded in ${finalGateBlockingReportFile || '(none)'}.`,
                    ];

              paragraphThreeSentences.unshift(
                `Final solution gate blockers:\n${blockerLines.join('\n')}`,
              );
            }

            if (finalGateSkippedBlockers.length > 0) {
              const skippedBlockerLines = finalGateSkippedBlockers
                .slice(0, 10)
                .map((blocker, index) => {
                  const code =
                    blocker &&
                    typeof blocker === 'object' &&
                    !Array.isArray(blocker) &&
                    typeof blocker.code === 'string'
                      ? blocker.code
                      : 'unknown';
                  const message =
                    blocker &&
                    typeof blocker === 'object' &&
                    !Array.isArray(blocker) &&
                    typeof blocker.message === 'string'
                      ? blocker.message.replace(/\s+/g, ' ').trim()
                      : 'No unresolved issue message provided.';
                  const skippedBy =
                    blocker &&
                    typeof blocker === 'object' &&
                    !Array.isArray(blocker) &&
                    typeof blocker.skippedBy === 'string'
                      ? blocker.skippedBy
                      : 'unknown';

                  return `${String(index + 1)}. ${code}: ${message} (recorded from ${skippedBy})`;
                });
              const skippedGateFailuresParagraph = `Unresolved issues that may need attention:\n${skippedBlockerLines.join('\n')}`;
              if (!finalGatePassed) {
                paragraphThreeSentences.splice(1, 0, skippedGateFailuresParagraph);
              } else {
                paragraphThreeSentences.unshift(skippedGateFailuresParagraph);
              }
            }

            const paragraphThree =
              paragraphThreeSentences.length > 0
                ? paragraphThreeSentences.join('\n')
                : '';
            const summary = [paragraphOne, paragraphTwo, paragraphThree]
              .filter((value) => value.length > 0)
              .join('\n\n')
              .concat('\n');
            fs.writeFileSync(summaryFile, summary, 'utf8');
            fs.appendFileSync(
              {{BRAND_OUTPUT_VARIABLE_NAME}},
              `text_response_file=${summaryFile}\n`,
              'utf8',
            );
            fs.appendFileSync(
              {{BRAND_OUTPUT_VARIABLE_NAME}},
              `text_response=${paragraphOne} ${paragraphTwo}\n`,
              'utf8',
            );
          env:
            COMPLEXITY_LEVEL: ${{ needs.complexity_analysis.outputs.complexity }}
            COMPLEXITY_REMARKS: ${{ needs.complexity_analysis.outputs.remarks }}
            PLANNING_MAX_ITERATIONS: ${{ needs.complexity_analysis.outputs.planning_max_iterations }}
            QA_MAX_ITERATIONS: ${{ needs.complexity_analysis.outputs.qa_max_iterations }}
            COMPLETION_MAX_ITERATIONS: ${{ needs.complexity_analysis.outputs.completion_max_iterations }}
            REFINE_OPUS_UPDATED: ${{ needs.refine.outputs.opus_made_updates }}
            REFINE_GPT_DECISION: ${{ needs.refine.outputs.gpt_critic_decision }}
            REFINE_GPT_SUMMARY: ${{ needs.refine.outputs.gpt_critic_summary }}
            HAS_FRONTEND_PLAN: ${{ needs.plan_partition.outputs.has_frontend_plan }}
            HAS_BACKEND_PLAN: ${{ needs.plan_partition.outputs.has_backend_plan }}
            HAS_TRANSPORT_PLAN: ${{ needs.plan_partition.outputs.has_transport_plan }}
            IMPLEMENT_RESULT: ${{ needs.implement.result }}
            IMPLEMENT_FRONTEND_RESULT: ${{ needs.implement_frontend.result }}
            COMPLETION_LOOP_RESULT: ${{ needs.implementation_completion_loop.result }}
            COMPLETION_COMPLETE: ${{ needs.implementation_completion_loop.outputs.complete }}
            COMPLETION_JSON_FILE: ${{ needs.implementation_completion_loop.outputs.completion_json_file }}
            COMPLETION_MISSING_REQUIREMENT_COUNT: ${{ needs.implementation_completion_loop.outputs.missing_requirement_count }}
            COMPLETION_INCORRECT_IMPLEMENTATION_COUNT: ${{ needs.implementation_completion_loop.outputs.incorrect_implementation_count }}
            COMPLETION_VERIFICATION_GAP_COUNT: ${{ needs.implementation_completion_loop.outputs.verification_gap_count }}
            COMPLETION_ITERATION_LIMIT_REACHED: ${{ needs.implementation_completion_loop.outputs.iteration_limit_reached }}
            COMPLETION_ITERATION_LIMIT_SUMMARY: ${{ needs.implementation_completion_loop.outputs.iteration_limit_summary }}
            QA_RESULT: ${{ needs.qa_fix_loop.result }}
            QA_FINAL_ISSUE_COUNT: ${{ needs.qa_fix_loop.outputs.final_issue_count }}
            QA_FINAL_ACTIONABLE_ISSUE_COUNT: ${{ needs.qa_fix_loop.outputs.final_actionable_issue_count }}
            QA_COMPLETION_AUDIT_ISSUE_COUNT: ${{ needs.qa_fix_loop.outputs.completion_audit_issue_count }}
            QA_CODE_REVIEW_ISSUE_COUNT: ${{ needs.qa_fix_loop.outputs.code_review_issue_count }}
            QA_VERIFICATION_FAILURE_COUNT: ${{ needs.qa_fix_loop.outputs.verification_failure_count }}
            QA_VERIFICATION_SIDE_EFFECT_UNSUPPORTED_COUNT: ${{ needs.qa_fix_loop.outputs.verification_side_effect_unsupported_count }}
            QA_VERIFICATION_SIDE_EFFECT_FAILED_COUNT: ${{ needs.qa_fix_loop.outputs.verification_side_effect_failed_count }}
            QA_PROTECTED_DRIFT_COUNT: ${{ needs.qa_fix_loop.outputs.protected_drift_count }}
            QA_PLAN_CONFLICT_COUNT: ${{ needs.qa_fix_loop.outputs.plan_conflict_count }}
            QA_HAS_ACTIONABLE_ISSUES: ${{ needs.qa_fix_loop.outputs.has_actionable_issues }}
            QA_REVIEW_SUMMARY: ${{ needs.qa_fix_loop.outputs.review_summary }}
            QA_RESTART_REQUESTED: ${{ needs.qa_fix_loop.outputs.restart_requested }}
            QA_REVIEW_REPORT_FILE: ${{ needs.qa_fix_loop.outputs.review_report_file }}
            QA_ACTIONABLE_REVIEW_JSON_FILE: ${{ needs.qa_fix_loop.outputs.actionable_review_json_file }}
            QA_ACTIONABLE_REVIEW_REPORT_FILE: ${{ needs.qa_fix_loop.outputs.actionable_review_report_file }}
            QA_ITERATION_LIMIT_REACHED: ${{ needs.qa_fix_loop.outputs.iteration_limit_reached }}
            QA_ITERATION_LIMIT_SUMMARY: ${{ needs.qa_fix_loop.outputs.iteration_limit_summary }}
            FINAL_GATE_RESULT: ${{ needs.final_solution_gate.result }}
            FINAL_GATE_PASSED: ${{ needs.final_solution_gate.outputs.passed }}
            FINAL_GATE_BLOCKING_COUNT: ${{ needs.final_solution_gate.outputs.blocking_count }}
            FINAL_GATE_SKIPPED_BLOCKING_COUNT: ${{ needs.final_solution_gate.outputs.skipped_blocking_count }}
            FINAL_GATE_BLOCKING_REPORT_FILE: ${{ needs.final_solution_gate.outputs.blocking_report_file }}
            FINAL_GATE_BLOCKING_JSON_FILE: ${{ needs.final_solution_gate.outputs.blocking_json_file }}
            COMMIT_RESULT: ${{ needs.commit_and_push.result }}
            COMMIT_FAILED_COUNT: ${{ needs.commit_and_push.outputs.failed_count }}
            COMMIT_HAS_FAILURES: ${{ needs.commit_and_push.outputs.has_failures }}
            COMMIT_SUMMARY_FILE: ${{ needs.commit_and_push.outputs.summary_file }}
            PR_RESULT: ${{ needs.create_pull_requests.result }}
            PR_CREATED_COUNT: ${{ needs.create_pull_requests.outputs.created_count }}
            PR_EXISTING_COUNT: ${{ needs.create_pull_requests.outputs.existing_count }}
            PR_FAILED_COUNT: ${{ needs.create_pull_requests.outputs.failed_count }}
            PR_HAS_FAILURES: ${{ needs.create_pull_requests.outputs.has_failures }}
            PR_SUMMARY_FILE: ${{ needs.create_pull_requests.outputs.summary_file }}

        - id: prepare_report
          name: Prepare {{BRAND_DISPLAY_NAME}} Report Content
          shell: node
          run: |
            import fs from 'node:fs';

            const summarizeOutputs = ${{ toJson(steps.summarize.outputs) }};
            const summaryPath = String(summarizeOutputs.text_response_file ?? '').trim();
            const content = fs.readFileSync(summaryPath, 'utf8');

            fs.appendFileSync(
              process.env.{{BRAND_ENV_PREFIX}}_OUTPUT ?? '',
              `report_content_json=${JSON.stringify(content)}\n`,
              'utf8',
            );

        - id: publish_report
          name: Publish Summary Report
          uses: builtin/{{BRAND_REPORT_ACTION_ID}}
          with:
            format: text
            content: ${{ parseJson(steps.prepare_report.outputs.report_content_json) }}
