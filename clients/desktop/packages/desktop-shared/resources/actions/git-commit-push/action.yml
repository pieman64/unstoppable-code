name: Git Commit + Push
description: Detect uncommitted or unpushed repo changes across the workspace, generate commit messages, commit, and push.
scope: worktree
inputs:
  commit_model:
    description: Optional commit-message model override. Falls back to {{BRAND_ENV_PREFIX}}_PREF_COMMIT_GENERATION_MODEL and then Haiku.
    required: false
  commit_thinking_level:
    description: >
      Optional thinking level override. Valid values: off, low, medium, high,
      xhigh, max. Falls back to {{BRAND_ENV_PREFIX}}_PREF_COMMIT_GENERATION_THINKING_LEVEL.
    required: false
  commit_instructions:
    description: Optional extra commit-message instructions. Falls back to {{BRAND_ENV_PREFIX}}_PREF_COMMIT_INSTRUCTIONS.
    required: false
  commit_instruction_mode:
    description: Optional instruction merge mode. Use append or replace. Falls back to {{BRAND_ENV_PREFIX}}_PREF_COMMIT_INSTRUCTION_MODE.
    required: false
outputs:
  results_json:
    description: Minified JSON array of per-repo commit/push results.
  results_file:
    description: File path containing the formatted per-repo results JSON array.
  summary_file:
    description: File path containing a readable commit/push summary.
  repo_count:
    description: Total number of discovered repos processed.
  committed_count:
    description: Number of repos that were committed and pushed.
  pushed_count:
    description: Number of repos that only required a push.
  noop_count:
    description: Number of repos that required no action.
  failed_count:
    description: Number of repos that failed.
  has_failures:
    description: Whether any repo failed.
runs:
  using: node
  main: index.js
