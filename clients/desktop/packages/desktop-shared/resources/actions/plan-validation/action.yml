name: Plan Validation
description: Validate the implementation plan structure.
log_format_hint: agent
inputs:
  model:
    description: Optional Claude model override.
    required: false
outputs:
  passed:
    description: Whether the plan passed validation.
    value: ${{ steps.emit.outputs.passed }}
  feedback:
    description: Validation feedback.
    value: ${{ steps.emit.outputs.feedback }}
  transcript_file:
    description: Plan validation transcript file.
    value: ${{ steps.validate.outputs.transcript_file }}
runs:
  using: composite
  steps:
    - id: validate
      uses: builtin/agent-prompt
      with:
        model: ${{ inputs.model }}
        permission_preset: read_only
        structured_output_schema: '{"type":"object","properties":{"passed":{"type":"boolean"},"feedback":{"type":"string"}},"required":["passed","feedback"]}'
        prompt: |
          Validate the current implementation plan for ordering, completeness,
          repository fit, and verification quality. Return pass/fail and feedback.
    - id: emit
      shell: node
      run: |
        const fs = require('node:fs');
        const parsed = JSON.parse(process.env.RESPONSE_JSON ?? '{}');
        const passed = parsed.passed === true ? 'true' : 'false';
        const feedback = String(parsed.feedback ?? '').replace(/\r?\n/g, ' ');
        fs.appendFileSync(process.env.{{BRAND_ENV_PREFIX}}_OUTPUT, `passed=${passed}\n`);
        fs.appendFileSync(process.env.{{BRAND_ENV_PREFIX}}_OUTPUT, `feedback=${feedback}\n`);
      env:
        RESPONSE_JSON: ${{ steps.validate.outputs.json_response }}
