name: Coder
description: Execute the implementation plan.
log_format_hint: agent
inputs:
  model:
    description: Optional Claude model override.
    required: false
  permission_preset:
    description: Optional permission preset override.
    required: false
    default: dangerous_all
outputs:
  text_response:
    description: Implementation summary.
    value: ${{ steps.code.outputs.text_response }}
  transcript_file:
    description: Coder transcript file.
    value: ${{ steps.code.outputs.transcript_file }}
runs:
  using: composite
  steps:
    - id: code
      uses: builtin/agent-prompt
      with:
        model: ${{ inputs.model }}
        permission_preset: ${{ inputs.permission_preset }}
        prompt: |
          Implement the current task in the active repository.

          Expectations:
          1. make the necessary code changes directly
          2. keep changes scoped to the task
          3. run relevant checks when appropriate
          4. summarize what changed and any follow-up work
