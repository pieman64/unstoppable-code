name: Spec Critic
description: Review the specification for gaps and risks.
log_format_hint: agent
inputs:
  model:
    description: Optional Claude model override.
    required: false
outputs:
  text_response:
    description: Spec critique.
    value: ${{ steps.critic.outputs.text_response }}
  transcript_file:
    description: Spec critic transcript file.
    value: ${{ steps.critic.outputs.transcript_file }}
runs:
  using: composite
  steps:
    - id: critic
      uses: builtin/agent-prompt
      with:
        model: ${{ inputs.model }}
        permission_preset: read_only
        prompt: |
          Critique the current implementation specification.

          Focus on:
          1. missing requirements
          2. risky assumptions
          3. unclear implementation details
          4. missing verification coverage
