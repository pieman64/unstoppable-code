name: Deep alias fan-out
on: dispatch
alias_levels:
  level_0: &level_0
    value: leaf
  level_1: &level_1 [*level_0, *level_0]
  level_2: &level_2 [*level_1, *level_1]
  level_3: &level_3 [*level_2, *level_2]
  level_4: &level_4 [*level_3, *level_3]
  level_5: &level_5 [*level_4, *level_4]
  level_6: &level_6 [*level_5, *level_5]
  level_7: &level_7 [*level_6, *level_6]
  level_8: &level_8 [*level_7, *level_7]
  level_9: &level_9 [*level_8, *level_8]
  level_10: &level_10 [*level_9, *level_9]
  level_11: &level_11 [*level_10, *level_10]
  level_12: &level_12 [*level_11, *level_11]
  level_13: &level_13 [*level_12, *level_12]
  level_14: &level_14 [*level_13, *level_13]
  level_15: &level_15 [*level_14, *level_14]
  level_16: &level_16 [*level_15, *level_15]
  level_17: &level_17 [*level_16, *level_16]
  level_18: &level_18 [*level_17, *level_17]
jobs:
  validate:
    strategy:
      matrix:
        item: *level_18
    steps:
      - run: echo ok
